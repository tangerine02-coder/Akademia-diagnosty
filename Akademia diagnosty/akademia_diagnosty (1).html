  }

  async evaluateConceptualizationWithGemini() {
    const hInput = document.getElementById('conc-hypotheses')?.value.trim() || '';
    const mInput = document.getElementById('conc-mechanisms')?.value.trim() || '';
    const iInput = document.getElementById('conc-interventions')?.value.trim() || '';
    const loadingEl = document.getElementById('conc-ai-loading');
    const feedbackEl = document.getElementById('conc-eval-feedback');
    const submitBtn = document.getElementById('btn-eval-conc');

    if (hInput.length < 5 || mInput.length < 5) {
      this.showToast("Wypełnij poszczególne punkty konceptualizacji!");
      return;
    }

    if (loadingEl) loadingEl.style.display = 'flex';
    if (submitBtn) submitBtn.disabled = true;
    audio.playStep();

    const studentReport = `
1. Hipotezy: ${hInput}
2. Mechanizmy i kontekst: ${mInput}
3. Interwencje: ${iInput}
    `;

    const interviewHistory = this.activeSimPatient.history
      .map(h => `${h.role === 'user' ? 'Diagnosta' : 'Pacjent'}: ${h.content}`)
      .join("\n");

    const systemPrompt = `Działasz jako Przewodniczący Komisji Superwizyjnej EBA (ekspert od modeli procesu Maloneya i Warda, Paluchowskiego oraz GAP).
Oceń konceptualizację przypadku pacjenta Adama przygotowaną przez studenta na podstawie wywiadu klinicznego.
Oryginalny przypadek: Adam, 24 lata, samookaleczenie po alkoholu, ciężka depresja męska, anhedonia, wysokie ryzyko samobójcze, schematy męskości blokujące pomoc.

Zwróć odpowiedź w formacie JSON z polami:
- grade (string: "Doskonały", "Pozytywny", "Wymaga poprawy")
- awardedXp (liczba od 30 do 70)
- evaluationSummary (string: 2-3 zdania podsumowujące trafność diagnozy i planu leczenia)
- clinicalAdvice (string: 2 zdania na temat tego, co w praktyce szpitalnej/ambulatoryjnej byłoby kluczowe)`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Zapis wywiadu zebranego przez studenta:\n${interviewHistory}\n\nKonceptualizacja studenta:\n${studentReport}` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              "grade": { "type": "STRING" },
              "awardedXp": { "type": "NUMBER" },
              "evaluationSummary": { "type": "STRING" },
              "clinicalAdvice": { "type": "STRING" }
            },
            required: ["grade", "awardedXp", "evaluationSummary", "clinicalAdvice"]
          }
        },
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const result = await this.callGemini(payload);
      if (loadingEl) loadingEl.style.display = 'none';

      const data = JSON.parse(result?.candidates?.[0]?.content?.parts?.[0]?.text);
      this.addXP(data.awardedXp || 40, 'modele');
      audio.playLevelUp();

      feedbackEl.style.display = 'block';
      feedbackEl.className = 'feedback-panel feedback-correct';
      feedbackEl.innerHTML = `
        <div class="font-bold text-xs mb-1 flex justify-between items-center">
          <span>🎓 Ocena Superwizora: ${data.grade} (+${data.awardedXp} XP)</span>
          <span class="ai-badge">Standard EBA / GAP</span>
        </div>
        <p class="text-xs text-gray-200 mb-1">${data.evaluationSummary}</p>
        <p class="text-xs text-emerald-300 font-semibold">Zalecenie kliniczne: ${data.clinicalAdvice}</p>
      `;

      submitBtn.innerText = "Zakończ i wróć na Kampus";
      submitBtn.onclick = () => this.closeModal();
    } catch (err) {
      if (loadingEl) loadingEl.style.display = 'none';
      this.addXP(35, 'modele');
      feedbackEl.style.display = 'block';
      feedbackEl.className = 'feedback-panel feedback-correct';
      feedbackEl.innerHTML = `
        <div class="font-bold text-xs mb-1">✓ Konceptualizacja przyjęta do akt (+35 XP)</div>
        <p class="text-xs text-gray-300">Pomyślnie powiązano objawy z kontekstem kulturowym męskości i ryzykiem samobójczym.</p>
      `;
      submitBtn.innerText = "Powrót do Kampusu";
      submitBtn.onclick = () => this.closeModal();
    }
  }

  closeModal() {
    document.getElementById('modal-container').style.display = 'none';
    document.getElementById('modal-container').style.visibility = '';
    this.isModalOpen = false;
    this.currentActiveQuestion = null;
    // Zamknięcie okna wewnątrz budynku musi też wyprowadzić na kampus —
    // inaczej gracz zostaje w scenie wnętrza bez możliwości ruchu.
    if (this.scene === 'interior') {
      this.currentBlock = null;
      this.exitBuilding();
    }
  }

  triggerInteraction(interaction) {
    if (interaction.type === 'location') {
      this.enterBuilding(interaction.data);
    }
  }

  update() {
    if (this.transition) { this.updateTransition(); return; }
    if (this.scene === 'interior') return;
    if (this.isModalOpen) return;

    // Awaryjne uwolnienie postaci, jesli z jakiegos powodu stoi w polu kolizji
    if (this.checkCollision(this.player.x, this.player.y)) {
      const spot = this.findFreeSpot(this.player.x, this.player.y);
      if (spot) {
        this.player.x = spot.x;
        this.player.y = spot.y;
        this.player.targetX = spot.x;
        this.player.targetY = spot.y;
      }
    }

    let dx = 0;
    let dy = 0;

    if (this.keys['ArrowUp'] || this.keys['KeyW']) { dy -= 1; this.player.dir = 'up'; }
    if (this.keys['ArrowDown'] || this.keys['KeyS']) { dy += 1; this.player.dir = 'down'; }
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) { dx -= 1; this.player.dir = 'left'; }
    if (this.keys['ArrowRight'] || this.keys['KeyD']) { dx += 1; this.player.dir = 'right'; }

    const distToTarget = Math.hypot(this.player.targetX - this.player.x, this.player.targetY - this.player.y);
    if (distToTarget > 6 && dx === 0 && dy === 0) {
      const angle = Math.atan2(this.player.targetY - this.player.y, this.player.targetX - this.player.x);
      dx = Math.cos(angle);
      dy = Math.sin(angle);
      if (Math.abs(dx) > Math.abs(dy)) {
        this.player.dir = dx > 0 ? 'right' : 'left';
      } else {
        this.player.dir = dy > 0 ? 'down' : 'up';
      }
    } else if (distToTarget <= 6) {
      this.player.targetX = this.player.x;
      this.player.targetY = this.player.y;
    }

    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }

    if (dx !== 0 || dy !== 0) {
      const nextX = this.player.x + dx * this.player.speed;
      const nextY = this.player.y + dy * this.player.speed;
      this.player.isMoving = true;
      this.player.animTimer += 0.2;

      if (!this.checkCollision(nextX, this.player.y)) {
        this.player.x = nextX;
      } else {
        this.player.targetX = this.player.x;
      }

      if (!this.checkCollision(this.player.x, nextY)) {
        this.player.y = nextY;
      } else {
        this.player.targetY = this.player.y;
      }

      if (Math.floor(this.player.animTimer) % 6 === 0) {
        audio.playStep();
      }
    } else {
      this.player.isMoving = false;
    }

    this.checkInteractions();
  }

  checkCollision(x, y) {
    const pBox = { x: x + 8, y: y + 20, w: 16, h: 10 };
    const minC = Math.floor(pBox.x / this.tileSize);
    const maxC = Math.floor((pBox.x + pBox.w) / this.tileSize);
    const minR = Math.floor(pBox.y / this.tileSize);
    const maxR = Math.floor((pBox.y + pBox.h) / this.tileSize);

    for (let r = minR; r <= maxR; r++) {
      for (let c = minC; c <= maxC; c++) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return true;
        if (this.collisionGrid[r][c] > 0) return true;
      }
    }
    return false;
  }

  checkInteractions() {
    const pCenter = { x: this.player.x + 16, y: this.player.y + 16 };
    let found = null;
    let onDoor = false;

    for (const loc of this.locations) {
      const doorPos = { x: loc.doorCol * 32 + 16, y: loc.entryRow * 32 + 20 };
      const dist = Math.hypot(pCenter.x - doorPos.x, pCenter.y - doorPos.y);
      if (dist < 54) {
        found = { type: 'location', data: loc };
        onDoor = dist < 20;
        break;
      }
    }

    const promptEl = document.getElementById('interact-prompt');
    const locTextEl = document.getElementById('current-location-text');

    if (found) {
      const loc = found.data;
      this.activeInteraction = found;
      promptEl.style.display = 'block';
      if (loc.id === 'bufet') {
        promptEl.innerText = `[WEJDŹ] ${loc.icon} ${loc.name} — regeneracja`;
      } else {
        const lvl = this.unlockedLevel(loc.id);
        const left = this.remainingFor(loc.id);
        promptEl.innerText = `[WEJDŹ] ${loc.icon} ${loc.name} · Poziom ${lvl} · pytań: ${left}`;
      }
      locTextEl.innerText = `${loc.name}`;

      // Wejście na sam próg wciąga do środka bez naciskania klawisza.
      if (onDoor && !this.transition && this.scene === 'campus') {
        this.enterBuilding(loc);
      }
    } else {
      this.activeInteraction = null;
      promptEl.style.display = 'none';
      locTextEl.innerText = "Plac Główny Kampusu EBA";
    }
  }

  /* ============================================================
     WARSTWA WIZUALNA 2.0 — kampus EBA o zmierzchu
     ============================================================ */

  hexRgb(hex) {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  shade(hex, amt) {
    const [r, g, b] = this.hexRgb(hex);
    const f = v => amt >= 0 ? Math.round(v + (255 - v) * amt) : Math.round(v * (1 + amt));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  tint(hex, a) {
    const [r, g, b] = this.hexRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }

  roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  makeRng(seed) {
    let s = seed >>> 0;
    return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  }

  findFreeSpot(px, py) {
    const startC = Math.round(px / this.tileSize);
    const startR = Math.round(py / this.tileSize);
    for (let rad = 0; rad < 14; rad++) {
      for (let dr = -rad; dr <= rad; dr++) {
        for (let dc = -rad; dc <= rad; dc++) {
          if (Math.max(Math.abs(dr), Math.abs(dc)) !== rad) continue;
          const c = startC + dc, r = startR + dr;
          if (c < 1 || r < 1 || c >= this.cols - 1 || r >= this.rows - 1) continue;
          const x = c * this.tileSize, y = r * this.tileSize;
          if (!this.checkCollision(x, y)) return { x, y };
        }
      }
    }
    return null;
  }

  /* ---------- generowanie dekoracji i świateł ---------- */

  buildDecor() {
    const rnd = this.makeRng(20240917);
    this.decor = [];
    this.lights = [];

    const mainRows = new Set([5, 11, 12, 16, 21, 22]);
    const mainCols = new Set([17, 18]);
    const corridor = new Set();
    const nearNpc = new Set();

    this.locations.forEach(loc => {
      // Korytarz od progu budynku do najbliższej alei musi zostać wolny.
      const endRow = this.promenadeRowFor(loc);
      for (let r = loc.entryRow; r <= endRow; r++) corridor.add(loc.doorCol + ',' + r);
      for (let dr = -1; dr <= 1; dr++) for (let dcc = -1; dcc <= 1; dcc++) {
        nearNpc.add((loc.npcX + dcc) + ',' + (loc.npcY + dr));
      }
    });

    const spawnC = Math.round(this.player.x / 32), spawnR = Math.round(this.player.y / 32);
    const free = (c, r) => {
      if (c < 1 || r < 1 || c >= this.cols - 1 || r >= this.rows - 1) return false;
      if (this.collisionGrid[r][c] !== 0) return false;
      if (mainRows.has(r) || mainCols.has(c)) return false;
      if (corridor.has(c + ',' + r) || nearNpc.has(c + ',' + r)) return false;
      if (Math.abs(c - spawnC) <= 1 && Math.abs(r - spawnR) <= 1) return false;
      const fdx = c - 17.5, fdy = r - 11.5;
      if (Math.hypot(fdx, fdy) < 3.2) return false;
      return true;
    };

    const taken = new Set();
    const place = (c, r, obj) => {
      if (taken.has(c + ',' + r)) return false;
      taken.add(c + ',' + r);
      this.decor.push(Object.assign({ c, r, x: c * 32 + 16, y: r * 32 + 16 }, obj));
      return true;
    };

    // Latarnie wzdłuż głównych alei
    const lampSpots = [];
    for (let c = 3; c < this.cols - 2; c += 4) { lampSpots.push([c, 10]); lampSpots.push([c, 13]); }
    for (let r = 7; r < this.rows - 3; r += 4) { lampSpots.push([16, r]); lampSpots.push([19, r]); }
    lampSpots.forEach(([c, r]) => {
      if (!free(c, r)) return;
      if (place(c, r, { type: 'lamp' })) {
        this.collisionGrid[r][c] = 1;
        this.lights.push({ x: c * 32 + 16, y: r * 32 + 4, r: 118, s: 0.95, warm: true });
      }
    });

    // Ławki przy placu
    [[14, 10], [21, 10], [14, 13], [21, 13]].forEach(([c, r]) => {
      if (free(c, r) && place(c, r, { type: 'bench', flip: r > 11 })) this.collisionGrid[r][c] = 1;
    });

    // Drzewa
    let planted = 0;
    for (let i = 0; i < 420 && planted < 46; i++) {
      const c = 1 + Math.floor(rnd() * (this.cols - 2));
      const r = 1 + Math.floor(rnd() * (this.rows - 2));
      if (!free(c, r)) continue;
      if (place(c, r, { type: 'tree', v: rnd(), scale: 0.85 + rnd() * 0.4 })) {
        this.collisionGrid[r][c] = 1;
        planted++;
      }
    }

    // Krzewy i kwiaty (bez kolizji – element czysto dekoracyjny)
    for (let i = 0; i < 500 && this.decor.length < 130; i++) {
      const c = 1 + Math.floor(rnd() * (this.cols - 2));
      const r = 1 + Math.floor(rnd() * (this.rows - 2));
      if (!free(c, r)) continue;
      place(c, r, rnd() > 0.45 ? { type: 'bush', v: rnd() } : { type: 'flowers', v: rnd() });
    }

    // Światła budynków (drzwi + okna)
    this.locations.forEach(loc => {
      const bw = loc.w * 32, bh = loc.h * 32;
      const bx = loc.x * 32, by = loc.y * 32;
      const doorY = loc.y < 10 ? by + bh + 10 : by + bh + 10;
      this.lights.push({ x: bx + bw / 2, y: doorY, r: 150, s: 1, warm: true });
      this.lights.push({ x: bx + bw * 0.25, y: by + bh * 0.55, r: 95, s: 0.6, warm: true });
      this.lights.push({ x: bx + bw * 0.75, y: by + bh * 0.55, r: 95, s: 0.6, warm: true });
    });

    this.lights.push({ x: 17.5 * 32 + 16, y: 12 * 32, r: 300, s: 0.85, warm: false });
  }

  /* ---------- statyczne warstwy (teren, dekoracje, światło) ---------- */

  buildStaticLayers() {
    const W = this.cols * 32, H = this.rows * 32;

    const mk = () => {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      return c;
    };

    // --- teren (nadprobkowany, zeby byl ostry przy przyblizeniu) ---
    const SS = this.ss;
    this.bgLayer = document.createElement('canvas');
    this.bgLayer.width = W * SS;
    this.bgLayer.height = H * SS;
    const g = this.bgLayer.getContext('2d');
    g.scale(SS, SS);
    const rnd = this.makeRng(777);

    const lawn = g.createLinearGradient(0, 0, 0, H);
    lawn.addColorStop(0, '#16241d');
    lawn.addColorStop(0.5, '#1a2b22');
    lawn.addColorStop(1, '#13201a');
    g.fillStyle = lawn;
    g.fillRect(0, 0, W, H);

    // nieregularne łaty trawy
    for (let i = 0; i < 260; i++) {
      const x = rnd() * W, y = rnd() * H, rx = 18 + rnd() * 60, ry = 12 + rnd() * 34;
      g.fillStyle = rnd() > 0.5 ? 'rgba(34,64,48,0.30)' : 'rgba(12,24,20,0.30)';
      g.beginPath();
      g.ellipse(x, y, rx, ry, rnd() * 3, 0, Math.PI * 2);
      g.fill();
    }
    // źdźbła
    for (let i = 0; i < 1400; i++) {
      const x = rnd() * W, y = rnd() * H;
      g.strokeStyle = rnd() > 0.6 ? 'rgba(74,124,88,0.45)' : 'rgba(46,86,62,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + (rnd() - 0.5) * 3, y - 2 - rnd() * 3);
      g.stroke();
    }

    // --- alejki brukowane ---
    const paveRect = (x, y, w, h) => {
      g.save();
      g.beginPath(); g.rect(x, y, w, h); g.clip();
      const pg = g.createLinearGradient(0, y, 0, y + h);
      pg.addColorStop(0, '#3a4353');
      pg.addColorStop(0.5, '#333c4b');
      pg.addColorStop(1, '#2b3340');
      g.fillStyle = pg;
      g.fillRect(x, y, w, h);
      const bw = 26, bh = 15;
      for (let r = 0, row = 0; r < h + bh; r += bh, row++) {
        for (let c = (row % 2 ? -bw / 2 : 0); c < w + bw; c += bw) {
          const sx = x + c, sy = y + r;
          const t = rnd();
          g.fillStyle = t > 0.82 ? 'rgba(120,134,158,0.18)' : t > 0.6 ? 'rgba(20,26,36,0.20)' : 'rgba(80,92,112,0.07)';
          g.fillRect(sx + 1, sy + 1, bw - 2, bh - 2);
          g.strokeStyle = 'rgba(14,19,28,0.55)';
          g.lineWidth = 1;
          g.strokeRect(sx + 0.5, sy + 0.5, bw - 1, bh - 1);
        }
      }
      g.restore();
      // krawężnik
      g.fillStyle = 'rgba(150,166,190,0.22)';
      if (w > h) { g.fillRect(x, y, w, 2); g.fillRect(x, y + h - 2, w, 2); }
      else { g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h); }
      g.fillStyle = 'rgba(6,10,18,0.45)';
      if (w > h) { g.fillRect(x, y + h - 1, w, 1); } else { g.fillRect(x + w - 1, y, 1, h); }
    };

    paveRect(0, 11 * 32, W, 2 * 32);          // aleja główna wsch.-zach.
    paveRect(17 * 32, 0, 2 * 32, H);          // aleja północ-południe
    paveRect(0, 5 * 32, W, 32);               // deptak północny
    paveRect(0, 16 * 32, W, 32);              // deptak środkowy
    paveRect(0, 22 * 32, W, 32);              // deptak południowy

    // Dojście od progu każdego budynku do najbliższej alei.
    this.locations.forEach(loc => {
      const doorX = loc.doorCol * 32 + 16;
      const startY = loc.entryRow * 32 + 10;
      const endY = (this.promenadeRowFor(loc) + 1) * 32;
      paveRect(doorX - 20, startY, 40, Math.max(24, endY - startY));
    });

    // --- plac z fontanną (koncentryczny bruk) ---
    const fcx = 17 * 32 + 32, fcy = 11 * 32 + 32;
    g.save();
    g.beginPath(); g.arc(fcx, fcy, 132, 0, Math.PI * 2); g.clip();
    const pg = g.createRadialGradient(fcx, fcy, 20, fcx, fcy, 132);
    pg.addColorStop(0, '#48536a');
    pg.addColorStop(0.6, '#3a4457');
    pg.addColorStop(1, '#2c3442');
    g.fillStyle = pg;
    g.fillRect(fcx - 140, fcy - 140, 280, 280);
    for (let ring = 40; ring < 140; ring += 16) {
      g.strokeStyle = 'rgba(12,18,28,0.5)';
      g.lineWidth = 1.5;
      g.beginPath(); g.arc(fcx, fcy, ring, 0, Math.PI * 2); g.stroke();
      const seg = Math.max(10, Math.floor(ring / 5));
      for (let s = 0; s < seg; s++) {
        const a = (s / seg) * Math.PI * 2 + (ring % 32 ? 0.12 : 0);
        g.beginPath();
        g.moveTo(fcx + Math.cos(a) * ring, fcy + Math.sin(a) * ring);
        g.lineTo(fcx + Math.cos(a) * (ring + 16), fcy + Math.sin(a) * (ring + 16));
        g.stroke();
      }
    }
    g.restore();
    g.strokeStyle = 'rgba(160,176,200,0.28)';
    g.lineWidth = 3;
    g.beginPath(); g.arc(fcx, fcy, 131, 0, Math.PI * 2); g.stroke();

    // --- dekoracje ---
    this.decor.sort((a, b) => a.y - b.y).forEach(d => {
      if (d.type === 'tree') this.drawTree(g, d);
      else if (d.type === 'bush') this.drawBush(g, d);
      else if (d.type === 'flowers') this.drawFlowers(g, d);
      else if (d.type === 'bench') this.drawBench(g, d);
      else if (d.type === 'lamp') this.drawLamp(g, d);
    });

    // --- mapa światła (ciemność z wyciętymi kręgami) ---
    this.lightLayer = mk();
    const l = this.lightLayer.getContext('2d');
    l.fillStyle = 'rgba(7,11,22,0.52)';
    l.fillRect(0, 0, W, H);
    l.globalCompositeOperation = 'destination-out';
    this.lights.forEach(li => {
      const rg = l.createRadialGradient(li.x, li.y, 0, li.x, li.y, li.r);
      rg.addColorStop(0, `rgba(0,0,0,${li.s})`);
      rg.addColorStop(0.5, `rgba(0,0,0,${li.s * 0.5})`);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      l.fillStyle = rg;
      l.beginPath(); l.arc(li.x, li.y, li.r, 0, Math.PI * 2); l.fill();
    });

    // --- ciepła poświata (dodawana trybem 'lighter') ---
    this.glowLayer = mk();
    const gl = this.glowLayer.getContext('2d');
    this.lights.forEach(li => {
      const rg = gl.createRadialGradient(li.x, li.y, 0, li.x, li.y, li.r);
      const col = li.warm ? '253,224,150' : '150,205,255';
      rg.addColorStop(0, `rgba(${col},${0.20 * li.s})`);
      rg.addColorStop(0.45, `rgba(${col},${0.08 * li.s})`);
      rg.addColorStop(1, `rgba(${col},0)`);
      gl.fillStyle = rg;
      gl.beginPath(); gl.arc(li.x, li.y, li.r, 0, Math.PI * 2); gl.fill();
    });

    // --- pyłki / świetliki ---
    const prnd = this.makeRng(4242);
    this.motes = [];
    for (let i = 0; i < 34; i++) {
      this.motes.push({
        x: prnd() * W, y: prnd() * H,
        r: 0.8 + prnd() * 1.6,
        sp: 0.25 + prnd() * 0.6,
        ph: prnd() * Math.PI * 2,
        amp: 8 + prnd() * 22
      });
    }
  }

  /* ---------- dekoracje ---------- */

  drawTree(g, d) {
    const x = d.x, y = d.y + 10, s = d.scale || 1;
    g.fillStyle = 'rgba(0,0,0,0.42)';
    g.beginPath(); g.ellipse(x + 3, y + 2, 14 * s, 5 * s, 0, 0, Math.PI * 2); g.fill();

    // pień
    const tg = g.createLinearGradient(x - 5, 0, x + 5, 0);
    tg.addColorStop(0, '#2b1d12');
    tg.addColorStop(0.4, '#4a3320');
    tg.addColorStop(1, '#241810');
    g.fillStyle = tg;
    g.beginPath();
    g.moveTo(x - 5 * s, y);
    g.lineTo(x - 3 * s, y - 22 * s);
    g.lineTo(x + 3 * s, y - 22 * s);
    g.lineTo(x + 5 * s, y);
    g.closePath(); g.fill();

    // korona — kilka nakładających się kęp
    const leaves = d.v > 0.55
      ? ['#1f4a34', '#2b6146', '#37795a']
      : ['#234a2c', '#2f6339', '#3d7d49'];
    const blobs = [
      [0, -34, 17], [-12, -26, 13], [12, -26, 13], [-6, -42, 12], [7, -41, 12], [0, -30, 15]
    ];
    blobs.forEach((b, i) => {
      g.fillStyle = leaves[i % 3];
      g.beginPath();
      g.ellipse(x + b[0] * s, y + b[1] * s, b[2] * s, b[2] * 0.92 * s, 0, 0, Math.PI * 2);
      g.fill();
    });
    // światło od góry-lewej
    g.fillStyle = 'rgba(140,200,150,0.20)';
    g.beginPath(); g.ellipse(x - 6 * s, y - 42 * s, 9 * s, 7 * s, -0.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(4,10,8,0.28)';
    g.beginPath(); g.ellipse(x + 9 * s, y - 24 * s, 9 * s, 8 * s, 0.3, 0, Math.PI * 2); g.fill();
  }

  drawBush(g, d) {
    const x = d.x, y = d.y + 10, s = 0.8 + (d.v || 0.5) * 0.5;
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(x + 2, y + 2, 11 * s, 4 * s, 0, 0, Math.PI * 2); g.fill();
    [[-6, -4, 8], [6, -4, 8], [0, -9, 9]].forEach((b, i) => {
      g.fillStyle = ['#204a30', '#2a5c3a', '#347048'][i];
      g.beginPath(); g.ellipse(x + b[0] * s, y + b[1] * s, b[2] * s, b[2] * 0.85 * s, 0, 0, Math.PI * 2); g.fill();
    });
    g.fillStyle = 'rgba(150,210,160,0.18)';
    g.beginPath(); g.ellipse(x - 3 * s, y - 12 * s, 5 * s, 3.5 * s, -0.4, 0, Math.PI * 2); g.fill();
  }

  drawFlowers(g, d) {
    const x = d.x, y = d.y + 8;
    const rnd = this.makeRng(Math.floor((d.v || 0.3) * 1e6) + d.c * 31 + d.r);
    const pal = ['#f472b6', '#fbbf24', '#a78bfa', '#f87171', '#e2e8f0'];
    const col = pal[Math.floor((d.v || 0) * pal.length) % pal.length];
    for (let i = 0; i < 9; i++) {
      const fx = x + (rnd() - 0.5) * 24, fy = y + (rnd() - 0.5) * 16;
      g.strokeStyle = '#2f6339'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx, fy - 4); g.stroke();
      g.fillStyle = col;
      g.beginPath(); g.arc(fx, fy - 5, 1.8, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.5)';
      g.fillRect(fx - 0.5, fy - 6, 1, 1);
    }
  }

  drawBench(g, d) {
    const x = d.x, y = d.y + 8;
    g.fillStyle = 'rgba(0,0,0,0.4)';
    g.beginPath(); g.ellipse(x + 2, y + 5, 16, 4, 0, 0, Math.PI * 2); g.fill();
    // nogi
    g.fillStyle = '#1f2733';
    g.fillRect(x - 12, y - 2, 3, 8);
    g.fillRect(x + 9, y - 2, 3, 8);
    // siedzisko
    const wg = g.createLinearGradient(0, y - 10, 0, y);
    wg.addColorStop(0, '#8a5a30');
    wg.addColorStop(1, '#5b3a1e');
    g.fillStyle = wg;
    g.fillRect(x - 15, y - 6, 30, 5);
    // oparcie
    g.fillStyle = '#6d4523';
    g.fillRect(x - 15, y - 16, 30, 4);
    g.fillRect(x - 15, y - 11, 30, 3);
    g.fillStyle = 'rgba(255,220,170,0.18)';
    g.fillRect(x - 15, y - 16, 30, 1);
    g.fillRect(x - 15, y - 6, 30, 1);
    g.fillStyle = '#1f2733';
    g.fillRect(x - 14, y - 17, 3, 12);
    g.fillRect(x + 11, y - 17, 3, 12);
  }

  drawLamp(g, d) {
    const x = d.x, y = d.y + 10;
    g.fillStyle = 'rgba(0,0,0,0.42)';
    g.beginPath(); g.ellipse(x + 2, y + 2, 9, 3.5, 0, 0, Math.PI * 2); g.fill();
    // podstawa
    g.fillStyle = '#141a24';
    g.beginPath(); g.ellipse(x, y, 8, 3.5, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#232c3a';
    g.fillRect(x - 4, y - 6, 8, 6);
    // słup
    const pg = g.createLinearGradient(x - 2, 0, x + 2, 0);
    pg.addColorStop(0, '#39445a');
    pg.addColorStop(0.4, '#5a6880');
    pg.addColorStop(1, '#232c3a');
    g.fillStyle = pg;
    g.fillRect(x - 2, y - 40, 4, 36);
    // ozdobne ramię
    g.strokeStyle = '#4a5670'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x - 6, y - 34); g.lineTo(x, y - 38); g.lineTo(x + 6, y - 34); g.stroke();
    // klosz
    g.fillStyle = '#2b3444';
    g.beginPath();
    g.moveTo(x - 7, y - 40); g.lineTo(x + 7, y - 40); g.lineTo(x + 5, y - 50); g.lineTo(x - 5, y - 50);
    g.closePath(); g.fill();
    const lg = g.createLinearGradient(0, y - 50, 0, y - 40);
    lg.addColorStop(0, 'rgba(255,240,190,0.95)');
    lg.addColorStop(1, 'rgba(250,204,21,0.75)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(x - 5.5, y - 41.5); g.lineTo(x + 5.5, y - 41.5); g.lineTo(x + 4, y - 48.5); g.lineTo(x - 4, y - 48.5);
    g.closePath(); g.fill();
    // kapturek
    g.fillStyle = '#39445a';
    g.beginPath();
    g.moveTo(x - 7, y - 50); g.lineTo(x + 7, y - 50); g.lineTo(x, y - 56);
    g.closePath(); g.fill();
    g.fillStyle = '#facc15';
    g.fillRect(x - 1, y - 58, 2, 3);
  }

  /* ---------- budynki ---------- */

  prerenderBuilding(loc, level) {
    const TS = this.tileSize;
    const bw = loc.w * TS, bh = loc.h * TS;
    // Każdy odblokowany poziom dobudowuje budynkowi jedno piętro w górę.
    const extra = Math.max(0, (level || 1) - 1);
    const FLOOR_H = 40;
    const extraH = extra * FLOOR_H;
    const padX = 28, padTop = 62 + extraH, padBottom = 26;
    const SS = this.ss;
    const cv = document.createElement('canvas');
    const cvW = bw + padX * 2;
    const cvH = bh + padTop + padBottom;
    cv.width = cvW * SS;
    cv.height = cvH * SS;
    const c = cv.getContext('2d');
    c.scale(SS, SS);
    c.translate(padX, padTop);

    const base = loc.color, roof = loc.roofColor;
    const roofH = 48;
    const facadeTop = 26 - extraH;     // górna krawędź muru (poniżej okapu)
    const eave = facadeTop;
    const wallH = bh - facadeTop;

    /* cień rzucany na ziemię */
    c.save();
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.filter = 'blur(6px)';
    c.beginPath();
    c.ellipse(bw / 2 + 8, bh + 2, bw * 0.56, 16, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();

    /* cokół */
    c.fillStyle = this.shade(base, -0.62);
    c.fillRect(-7, bh - 16, bw + 14, 16);
    c.fillStyle = this.shade(base, -0.45);
    c.fillRect(-7, bh - 16, bw + 14, 4);

    /* mur */
    const wg = c.createLinearGradient(0, facadeTop, 0, bh);
    wg.addColorStop(0, this.shade(base, 0.30));
    wg.addColorStop(0.35, this.shade(base, 0.08));
    wg.addColorStop(0.75, this.shade(base, -0.18));
    wg.addColorStop(1, this.shade(base, -0.40));
    c.fillStyle = wg;
    c.fillRect(0, facadeTop, bw, wallH);

    /* faktura kamienia */
    const rnd = this.makeRng(loc.id.length * 9173 + loc.x * 31 + loc.y);
    c.save();
    c.beginPath(); c.rect(0, facadeTop, bw, wallH); c.clip();
    const chH = 13;
    for (let y = facadeTop, row = 0; y < bh; y += chH, row++) {
      c.strokeStyle = 'rgba(0,0,0,0.18)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(bw, y + 0.5); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.05)';
      c.beginPath(); c.moveTo(0, y + 1.5); c.lineTo(bw, y + 1.5); c.stroke();
      for (let x = (row % 2 ? 0 : 22); x < bw; x += 44) {
        c.strokeStyle = 'rgba(0,0,0,0.14)';
        c.beginPath(); c.moveTo(x + 0.5, y); c.lineTo(x + 0.5, y + chH); c.stroke();
        if (rnd() > 0.86) {
          c.fillStyle = 'rgba(255,255,255,0.035)';
          c.fillRect(x + 1, y + 1, 42, chH - 2);
        }
      }
    }
    c.restore();

    /* narożne boniowanie */
    for (let y = facadeTop, i = 0; y < bh - 10; y += 20, i++) {
      const h = 20;
      c.fillStyle = i % 2 ? 'rgba(255,255,255,0.09)' : 'rgba(0,0,0,0.18)';
      c.fillRect(0, y, 12, h);
      c.fillRect(bw - 12, y, 12, h);
    }
    c.fillStyle = 'rgba(0,0,0,0.30)';
    c.fillRect(bw - 5, facadeTop, 5, wallH);
    c.fillStyle = 'rgba(255,255,255,0.10)';
    c.fillRect(0, facadeTop, 3, wallH);

    /* pilastry */
    const colCount = loc.w >= 6 ? 4 : 3;
    const gap = bw / (colCount + 1);
    for (let i = 1; i <= colCount; i++) {
      const cx = i * gap;
      if (Math.abs(cx - bw / 2) < 26) continue;   // nie zasłaniaj drzwi
      const pw = 13;
      const pg = c.createLinearGradient(cx - pw / 2, 0, cx + pw / 2, 0);
      pg.addColorStop(0, this.shade(base, -0.10));
      pg.addColorStop(0.35, this.shade(base, 0.34));
      pg.addColorStop(1, this.shade(base, -0.34));
      c.fillStyle = pg;
      c.fillRect(cx - pw / 2, facadeTop + 6, pw, wallH - 24);
      c.fillStyle = this.shade(base, 0.42);
      c.fillRect(cx - pw / 2 - 3, facadeTop + 2, pw + 6, 5);
      c.fillRect(cx - pw / 2 - 3, bh - 22, pw + 6, 6);
      c.fillStyle = 'rgba(0,0,0,0.25)';
      c.fillRect(cx + pw / 2 - 2, facadeTop + 6, 2, wallH - 24);
    }

    /* okna */
    const winW = 22, winH = 40;
    const colsX = [];
    for (let i = 1; i <= colCount + 1; i++) {
      const cx = (i - 0.5) * gap;
      if (Math.abs(cx - bw / 2) < 30) continue;
      colsX.push(cx);
    }

    // Kondygnacje liczone od góry: dobudowane piętra, a na końcu parter.
    const slots = [];
    for (let f = 0; f <= extra; f++) {
      const rowY = facadeTop + 24 + f * FLOOR_H;
      colsX.forEach(cx => {
        this.drawArchWindow(c, cx, rowY, winW, winH);
        slots.push({ x: cx, y: rowY, w: winW, h: winH });
      });
      // gzyms oddzielający kondygnacje
      if (f < extra) {
        const my = rowY + winH + 10;
        c.fillStyle = this.shade(base, 0.30);
        c.fillRect(-4, my, bw + 8, 5);
        c.fillStyle = 'rgba(0,0,0,0.28)';
        c.fillRect(-4, my + 4, bw + 8, 2);
        c.fillStyle = 'rgba(255,255,255,0.10)';
        c.fillRect(-4, my, bw + 8, 1);
      }
    }

    /* gzyms pod dachem */
    c.fillStyle = this.shade(base, 0.45);
    c.fillRect(-6, facadeTop - 8, bw + 12, 8);
    c.fillStyle = 'rgba(0,0,0,0.32)';
    c.fillRect(-6, facadeTop - 1, bw + 12, 3);
    c.fillStyle = this.shade(base, 0.62);
    c.fillRect(-6, facadeTop - 8, bw + 12, 2);
    // ząbkowanie
    for (let x = -4; x < bw + 8; x += 10) {
      c.fillStyle = 'rgba(0,0,0,0.22)';
      c.fillRect(x, facadeTop - 6, 5, 5);
    }

    /* dach */
    const rL = -18, rR = bw + 18, rTop = -roofH + 6;
    const rg = c.createLinearGradient(0, rTop, 0, eave);
    rg.addColorStop(0, this.shade(roof, 0.35));
    rg.addColorStop(0.55, roof);
    rg.addColorStop(1, this.shade(roof, -0.35));
    c.fillStyle = rg;
    c.beginPath();
    c.moveTo(rL, eave - 6);
    c.lineTo(bw / 2, rTop);
    c.lineTo(rR, eave - 6);
    c.closePath();
    c.fill();

    // dachówki
    c.save();
    c.beginPath();
    c.moveTo(rL, eave - 6); c.lineTo(bw / 2, rTop); c.lineTo(rR, eave - 6); c.closePath();
    c.clip();
    for (let y = rTop; y < eave; y += 7) {
      c.strokeStyle = 'rgba(0,0,0,0.22)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(rL, y); c.lineTo(rR, y); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.10)';
      c.beginPath(); c.moveTo(rL, y + 1); c.lineTo(rR, y + 1); c.stroke();
    }
    for (let x = rL; x < rR; x += 14) {
      c.strokeStyle = 'rgba(0,0,0,0.16)';
      c.beginPath(); c.moveTo(x, rTop); c.lineTo(x, eave); c.stroke();
    }
    // prawa połać ciemniejsza
    c.fillStyle = 'rgba(0,0,0,0.26)';
    c.beginPath();
    c.moveTo(bw / 2, rTop); c.lineTo(rR, eave); c.lineTo(bw / 2, eave); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.07)';
    c.beginPath();
    c.moveTo(bw / 2, rTop); c.lineTo(rL, eave); c.lineTo(bw / 2, eave); c.closePath(); c.fill();
    c.restore();

    // kalenica
    c.strokeStyle = this.shade(roof, 0.55);
    c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(rL + 4, eave - 6); c.lineTo(bw / 2, rTop); c.lineTo(rR - 4, eave - 6); c.stroke();
    c.strokeStyle = 'rgba(6,10,18,0.85)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(rL, eave - 6); c.lineTo(bw / 2, rTop); c.lineTo(rR, eave - 6); c.closePath(); c.stroke();

    // okap
    c.fillStyle = this.shade(roof, -0.55);
    c.fillRect(rL, eave - 8, rR - rL, 7);
    c.fillStyle = 'rgba(255,255,255,0.14)';
    c.fillRect(rL, eave - 8, rR - rL, 1.5);
    c.fillStyle = 'rgba(0,0,0,0.45)';
    c.fillRect(rL, eave - 2, rR - rL, 3);

    // rozeta z godłem
    const oy = rTop + 26;
    c.fillStyle = 'rgba(9,13,22,0.92)';
    c.beginPath(); c.arc(bw / 2, oy, 15, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#facc15'; c.lineWidth = 2;
    c.beginPath(); c.arc(bw / 2, oy, 15, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = 'rgba(250,204,21,0.35)'; c.lineWidth = 1;
    c.beginPath(); c.arc(bw / 2, oy, 11, 0, Math.PI * 2); c.stroke();
    c.font = '15px serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(loc.icon, bw / 2, oy + 1);
    c.textBaseline = 'alphabetic';

    /* schody */
    const stepW0 = 46;
    for (let i = 0; i < 3; i++) {
      const sw = stepW0 + i * 12;
      const sy = bh - 6 + i * 5;
      c.fillStyle = ['#6b7688', '#5b6678', '#4b5668'][i];
      c.fillRect(bw / 2 - sw / 2, sy, sw, 5);
      c.fillStyle = 'rgba(255,255,255,0.16)';
      c.fillRect(bw / 2 - sw / 2, sy, sw, 1);
      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.fillRect(bw / 2 - sw / 2, sy + 4, sw, 1);
    }

    /* wejście */
    const dw = 36, dh = 52;
    const dx = bw / 2 - dw / 2, dy = bh - dh;
    // wnęka
    c.fillStyle = 'rgba(0,0,0,0.55)';
    this.archPath(c, dx - 5, dy - 12, dw + 10, dh + 12);
    c.fill();
    // ościeżnica
    c.fillStyle = this.shade(base, 0.5);
    this.archPath(c, dx - 4, dy - 10, dw + 8, dh + 10);
    c.fill();
    // świetlik nad drzwiami
    c.fillStyle = '#fde68a';
    this.archPath(c, dx, dy - 6, dw, 16);
    c.fill();
    c.strokeStyle = '#78350f'; c.lineWidth = 1.5;
    for (let i = 1; i < 4; i++) {
      c.beginPath();
      c.moveTo(dx + dw / 2, dy + 8);
      c.lineTo(dx + dw / 2 + Math.cos(Math.PI + i * Math.PI / 4) * dw / 2, dy + 8 + Math.sin(Math.PI + i * Math.PI / 4) * dw / 2);
      c.stroke();
    }
    // skrzydła drzwi
    const dg = c.createLinearGradient(dx, 0, dx + dw, 0);
    dg.addColorStop(0, '#3a2313');
    dg.addColorStop(0.45, '#5c3a1e');
    dg.addColorStop(0.55, '#2e1b0e');
    dg.addColorStop(1, '#4a2f18');
    c.fillStyle = dg;
    c.fillRect(dx, dy + 8, dw, dh - 8);
    for (let i = 1; i < 6; i++) {
      c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(dx + i * dw / 6, dy + 8); c.lineTo(dx + i * dw / 6, dy + dh); c.stroke();
    }
    c.strokeStyle = 'rgba(250,204,21,0.55)'; c.lineWidth = 1.5;
    c.strokeRect(dx + 3, dy + 12, dw / 2 - 5, dh - 18);
    c.strokeRect(dx + dw / 2 + 2, dy + 12, dw / 2 - 5, dh - 18);
    c.fillStyle = '#facc15';
    c.beginPath(); c.arc(dx + dw / 2 - 5, dy + dh / 2 + 6, 2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(dx + dw / 2 + 5, dy + dh / 2 + 6, 2, 0, Math.PI * 2); c.fill();

    /* kinkiety przy drzwiach */
    [-1, 1].forEach(s => {
      const lx = bw / 2 + s * (dw / 2 + 18);
      const ly = dy + 4;
      c.strokeStyle = '#b45309'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx, ly - 10); c.stroke();
      c.fillStyle = '#1f2937';
      c.beginPath(); c.moveTo(lx - 5, ly - 10); c.lineTo(lx + 5, ly - 10); c.lineTo(lx + 3, ly - 19); c.lineTo(lx - 3, ly - 19); c.closePath(); c.fill();
      c.fillStyle = '#fde68a';
      c.beginPath(); c.moveTo(lx - 3.5, ly - 11); c.lineTo(lx + 3.5, ly - 11); c.lineTo(lx + 2, ly - 17.5); c.lineTo(lx - 2, ly - 17.5); c.closePath(); c.fill();
    });

    /* szyld nad wejściem */
    const sw = Math.max(84, loc.banner.length * 10 + 34);
    const sx = bw / 2 - sw / 2, sy = facadeTop + 6;
    c.strokeStyle = '#78716c'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(sx + 10, sy); c.lineTo(sx + 14, sy - 7); c.stroke();
    c.beginPath(); c.moveTo(sx + sw - 10, sy); c.lineTo(sx + sw - 14, sy - 7); c.stroke();
    c.fillStyle = 'rgba(9,13,22,0.95)';
    this.roundRect(c, sx, sy, sw, 22, 5); c.fill();
    c.strokeStyle = '#facc15'; c.lineWidth = 1.5;
    this.roundRect(c, sx, sy, sw, 22, 5); c.stroke();
    c.strokeStyle = 'rgba(250,204,21,0.25)';
    this.roundRect(c, sx + 3, sy + 3, sw - 6, 16, 3); c.stroke();
    c.font = '13px serif';
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillText(loc.icon, sx + 8, sy + 12);
    c.fillStyle = '#facc15';
    c.font = 'bold 10px "Courier New", monospace';
    c.textAlign = 'center';
    c.fillText(loc.banner, sx + sw / 2 + 8, sy + 12);
    c.textBaseline = 'alphabetic';

    // znacznik poziomu katedry
    if (level > 1) {
      const stars = '★'.repeat(Math.min(level, 4));
      c.fillStyle = '#fde68a';
      c.font = 'bold 9px serif';
      c.textAlign = 'center';
      c.fillText(stars, bw / 2, sy + 32);
    }

    return {
      canvas: cv,
      w: cvW,
      h: cvH,
      offX: -padX,
      offY: -padTop,
      winSlots: slots,
      doorGlow: { x: bw / 2, y: bh - 20 },
      flag: { x: bw / 2, y: rTop }
    };
  }

  archPath(c, x, y, w, h) {
    const r = w / 2;
    c.beginPath();
    c.moveTo(x, y + h);
    c.lineTo(x, y + r);
    c.arc(x + r, y + r, r, Math.PI, 0);
    c.lineTo(x + w, y + h);
    c.closePath();
  }

  drawArchWindow(c, cx, y, w, h) {
    const x = cx - w / 2;
    // wnęka
    c.fillStyle = 'rgba(0,0,0,0.5)';
    this.archPath(c, x - 3, y - 3, w + 6, h + 5); c.fill();
    // szyba
    const gg = c.createLinearGradient(0, y, 0, y + h);
    gg.addColorStop(0, '#fef3c7');
    gg.addColorStop(0.45, '#fcd34d');
    gg.addColorStop(1, '#b45309');
    c.fillStyle = gg;
    this.archPath(c, x, y, w, h); c.fill();
    // szprosy
    c.strokeStyle = 'rgba(30,20,10,0.75)';
    c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(cx, y + 2); c.lineTo(cx, y + h); c.stroke();
    for (let i = 1; i <= 2; i++) {
      const yy = y + w / 2 + i * (h - w / 2) / 3;
      c.beginPath(); c.moveTo(x, yy); c.lineTo(x + w, yy); c.stroke();
    }
    // rama
    c.strokeStyle = '#1c1917'; c.lineWidth = 2;
    this.archPath(c, x, y, w, h); c.stroke();
    // odblask
    c.fillStyle = 'rgba(255,255,255,0.30)';
    c.beginPath();
    c.moveTo(x + 3, y + h - 4); c.lineTo(x + w * 0.55, y + 5); c.lineTo(x + w * 0.72, y + 5); c.lineTo(x + 7, y + h - 4);
    c.closePath(); c.fill();
    // parapet
    c.fillStyle = '#94a3b8';
    c.fillRect(x - 5, y + h, w + 10, 4);
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.fillRect(x - 5, y + h, w + 10, 1);
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.fillRect(x - 5, y + h + 3, w + 10, 2);
  }

  drawBuilding(loc) {
    if (!this.buildingCache) this.buildingCache = {};
    const level = this.unlockedLevel(loc.id);
    const key = loc.id + '_L' + level;
    if (!this.buildingCache[key]) this.buildingCache[key] = this.prerenderBuilding(loc, level);

    const b = this.buildingCache[key];
    const bx = loc.x * this.tileSize;
    const by = loc.y * this.tileSize;
    const ctx = this.ctx;

    ctx.drawImage(b.canvas, bx + b.offX, by + b.offY, b.w, b.h);

    const t = Date.now() / 1000;
    // migotanie okien
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    b.winSlots.forEach((w, i) => {
      const f = 0.55 + 0.45 * Math.abs(Math.sin(t * 0.7 + i * 1.9 + loc.x));
      const cx = bx + w.x, cy = by + w.y + w.h / 2;
      const rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 34);
      rg.addColorStop(0, `rgba(253,224,150,${0.30 * f})`);
      rg.addColorStop(1, 'rgba(253,224,150,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.fill();
    });
    const dgx = bx + b.doorGlow.x, dgy = by + b.doorGlow.y;
    const drg = ctx.createRadialGradient(dgx, dgy, 4, dgx, dgy, 60);
    drg.addColorStop(0, 'rgba(253,224,150,0.28)');
    drg.addColorStop(1, 'rgba(253,224,150,0)');
    ctx.fillStyle = drg;
    ctx.beginPath(); ctx.arc(dgx, dgy, 60, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // chorągiew na kalenicy
    const fx = bx + b.flag.x, fy = by + b.flag.y;
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(fx, fy + 2); ctx.lineTo(fx, fy - 26); ctx.stroke();
    ctx.fillStyle = '#facc15';
    ctx.beginPath(); ctx.arc(fx, fy - 28, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = loc.roofColor;
    ctx.beginPath();
    ctx.moveTo(fx + 1, fy - 25);
    for (let i = 0; i <= 6; i++) {
      const p = i / 6;
      ctx.lineTo(fx + 1 + p * 22, fy - 25 + Math.sin(t * 3 + p * 4) * 2.2 * p);
    }
    for (let i = 6; i >= 0; i--) {
      const p = i / 6;
      ctx.lineTo(fx + 1 + p * 22, fy - 13 + Math.sin(t * 3 + p * 4) * 2.2 * p);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  }

  /* ---------- fontanna ---------- */

  drawFountain() {
    const ctx = this.ctx;
    const cx = 17 * 32 + 32, cy = 11 * 32 + 32;
    const t = Date.now() / 1000;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(cx + 5, cy + 8, 42, 16, 0, 0, Math.PI * 2); ctx.fill();

    // niecka
    const bg = ctx.createLinearGradient(0, cy - 40, 0, cy + 40);
    bg.addColorStop(0, '#94a3b8');
    bg.addColorStop(0.5, '#64748b');
    bg.addColorStop(1, '#334155');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
    ctx.stroke();
    // segmenty krawędzi
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      ctx.strokeStyle = 'rgba(15,23,42,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 33, cy + Math.sin(a) * 33);
      ctx.lineTo(cx + Math.cos(a) * 40, cy + Math.sin(a) * 40);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 38, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();

    // woda
    const wgr = ctx.createRadialGradient(cx - 8, cy - 8, 4, cx, cy, 33);
    wgr.addColorStop(0, '#7dd3fc');
    wgr.addColorStop(0.55, '#0ea5e9');
    wgr.addColorStop(1, '#075985');
    ctx.fillStyle = wgr;
    ctx.beginPath(); ctx.arc(cx, cy, 33, 0, Math.PI * 2); ctx.fill();

    // fale
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2); ctx.clip();
    for (let k = 0; k < 3; k++) {
      const rr = ((t * 14 + k * 11) % 33);
      ctx.strokeStyle = `rgba(224,242,254,${0.55 * (1 - rr / 33)})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * 0.9, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    // kolumna i misa
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.ellipse(cx, cy + 2, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createLinearGradient(cx - 7, 0, cx + 7, 0);
    cg.addColorStop(0, '#334155');
    cg.addColorStop(0.4, '#94a3b8');
    cg.addColorStop(1, '#1e293b');
    ctx.fillStyle = cg;
    ctx.fillRect(cx - 6, cy - 24, 12, 28);
    ctx.fillStyle = '#64748b';
    ctx.beginPath(); ctx.ellipse(cx, cy - 24, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath(); ctx.ellipse(cx, cy - 25, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

    // złoty stetoskop — godło akademii
    ctx.save();
    ctx.translate(cx, cy - 46);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 2, 11, Math.PI * 0.15, Math.PI * 0.85, true); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, -1); ctx.lineTo(-12, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -1); ctx.lineTo(12, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 15); ctx.stroke();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.arc(0, 19, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 19, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#facc15';
    [[-12, -13], [12, -13]].forEach(p => {
      ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // poświata wokół godła
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(cx, cy - 42, 2, cx, cy - 42, 46);
    const pulse = 0.16 + 0.08 * Math.sin(t * 2);
    glow.addColorStop(0, `rgba(250,204,21,${pulse})`);
    glow.addColorStop(1, 'rgba(250,204,21,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy - 42, 46, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // strugi wody
    ctx.strokeStyle = 'rgba(186,230,253,0.75)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + t * 0.4;
      ctx.beginPath();
      for (let s = 0; s <= 8; s++) {
        const p = s / 8;
        const x = cx + Math.cos(a) * (4 + p * 26);
        const y = cy - 26 + p * 24 - Math.sin(p * Math.PI) * 12;
        s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // krople
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + t * 1.1;
      const p = ((t * 0.9 + i * 0.13) % 1);
      const x = cx + Math.cos(a) * (5 + p * 27);
      const y = cy - 26 + p * 26 - Math.sin(p * Math.PI) * 13;
      ctx.fillStyle = `rgba(224,242,254,${0.8 - p * 0.6})`;
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------- postacie ---------- */

  npcPalette(loc) {
    const map = {
      eba:      { coat: '#e8edf5', accent: '#38bdf8', hair: '#94a3b8', skin: '#f1c9a5' },
      modele:   { coat: '#5b3fa8', accent: '#c084fc', hair: '#2b1f14', skin: '#e8b892' },
      wywiad:   { coat: '#b45309', accent: '#fbbf24', hair: '#4a2c17', skin: '#f1c9a5' },
      rodzina:  { coat: '#0f766e', accent: '#5eead4', hair: '#6b3f20', skin: '#d9a273' },
      testy:    { coat: '#047857', accent: '#4ade80', hair: '#1f2937', skin: '#c98a5e' },
      dziecko:  { coat: '#0e7490', accent: '#67e8f9', hair: '#7c2d12', skin: '#f1c9a5' },
      bufet:    { coat: '#3f3f46', accent: '#f59e0b', hair: '#27272a', skin: '#e0ac7e' },
      neuro:    { coat: '#e8edf5', accent: '#38bdf8', hair: '#cbd5e1', skin: '#f1c9a5' },
      etyka:    { coat: '#1e1b4b', accent: '#f472b6', hair: '#0f172a', skin: '#d9a273' },
      archiwum: { coat: '#450a0a', accent: '#ef4444', hair: '#78350f', skin: '#c98a5e' }
    };
    return map[loc.id] || { coat: loc.roofColor, accent: '#facc15', hair: '#1f2937', skin: '#f1c9a5' };
  }

  drawHuman(x, y, o) {
    const ctx = this.ctx;
    const bob = o.bob || 0;
    const legs = o.legSwing || 0;
    const dir = o.dir || 'down';

    // cień
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(x + 16, y + 31, 10, 3.6, 0, 0, Math.PI * 2); ctx.fill();

    const top = y + bob;
    const stroke = (px, py, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(px, py, w, h); };

    // nogi
    stroke(x + 10, top + 22 + legs, 5, 8, '#1e293b');
    stroke(x + 17, top + 22 - legs, 5, 8, '#1e293b');
    stroke(x + 9, top + 29 + legs, 7, 3, '#0b1220');
    stroke(x + 16, top + 29 - legs, 7, 3, '#0b1220');

    // tors / fartuch
    const bg = ctx.createLinearGradient(x + 7, 0, x + 25, 0);
    bg.addColorStop(0, o.coat);
    bg.addColorStop(0.4, this.shade(o.coat, 0.18));
    bg.addColorStop(1, this.shade(o.coat, -0.30));
    ctx.fillStyle = bg;
    this.roundRect(ctx, x + 7, top + 11, 18, 13, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
    ctx.stroke();
    // poły fartucha
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(x + 15.4, top + 12, 1.2, 12);
    // akcent (krawat / szalik / identyfikator)
    ctx.fillStyle = o.accent;
    ctx.fillRect(x + 14, top + 12, 4, 6);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(x + 9, top + 19, 4, 3);

    // ramiona
    ctx.fillStyle = this.shade(o.coat, -0.12);
    const armS = o.armSwing || 0;
    this.roundRect(ctx, x + 4, top + 12 + armS, 5, 11, 2.4); ctx.fill();
    this.roundRect(ctx, x + 23, top + 12 - armS, 5, 11, 2.4); ctx.fill();
    ctx.fillStyle = o.skin;
    ctx.beginPath(); ctx.arc(x + 6.5, top + 23 + armS, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 25.5, top + 23 - armS, 2.6, 0, Math.PI * 2); ctx.fill();

    // szyja
    ctx.fillStyle = this.shade(o.skin, -0.20);
    ctx.fillRect(x + 14, top + 9, 4, 3);

    // głowa
    const hg = ctx.createRadialGradient(x + 13, top + 4, 1, x + 16, top + 7, 9);
    hg.addColorStop(0, this.shade(o.skin, 0.20));
    hg.addColorStop(1, this.shade(o.skin, -0.14));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(x + 16, top + 6, 7.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x + 16, top + 6, 7.2, 0, Math.PI * 2); ctx.stroke();

    // włosy
    ctx.fillStyle = o.hair;
    ctx.beginPath();
    ctx.arc(x + 16, top + 5, 7.4, Math.PI * 1.02, Math.PI * 2.02);
    ctx.fill();
    if (o.longHair) {
      ctx.fillRect(x + 8.6, top + 4, 3, 9);
      ctx.fillRect(x + 20.4, top + 4, 3, 9);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.ellipse(x + 12.5, top + 2, 3.2, 1.8, -0.5, 0, Math.PI * 2); ctx.fill();

    // twarz
    ctx.fillStyle = '#0b1220';
    if (dir === 'up') {
      // tył głowy — brak rysów
    } else if (dir === 'left') {
      ctx.fillRect(x + 11, top + 5, 2, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + 9, top + 3, 3, 7);
    } else if (dir === 'right') {
      ctx.fillRect(x + 19, top + 5, 2, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + 20, top + 3, 3, 7);
    } else {
      ctx.fillRect(x + 12.6, top + 5, 2, 2);
      ctx.fillRect(x + 17.4, top + 5, 2, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x + 14.5, top + 8.5, 3, 1);
    }

    if (o.glasses) {
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x + 13.5, top + 5.6, 2.4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 18.5, top + 5.6, 2.4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 15.9, top + 5.6); ctx.lineTo(x + 16.1, top + 5.6); ctx.stroke();
      ctx.fillStyle = 'rgba(186,230,253,0.35)';
      ctx.beginPath(); ctx.arc(x + 13.5, top + 5.6, 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 18.5, top + 5.6, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawDetailedNPC(loc) {
    const ctx = this.ctx;
    const nx = loc.npcX * this.tileSize;
    const ny = loc.npcY * this.tileSize;
    const t = Date.now() / 1000;
    const pal = this.npcPalette(loc);
    const bob = Math.sin(t * 1.6 + loc.x) * 1.2;

    this.drawHuman(nx, ny, {
      coat: pal.coat,
      accent: pal.accent,
      hair: pal.hair,
      skin: pal.skin,
      dir: 'down',
      bob,
      legSwing: 0,
      armSwing: Math.sin(t * 1.6 + loc.x) * 1.1,
      glasses: ['eba', 'modele', 'neuro', 'archiwum'].includes(loc.id),
      longHair: ['wywiad', 'dziecko', 'rodzina', 'testy'].includes(loc.id)
    });

    // rekwizyt w dłoni
    ctx.save();
    const hy = ny + bob + 22;
    if (loc.id === 'bufet') {
      ctx.fillStyle = '#f8fafc';
      this.roundRect(ctx, nx + 24, hy - 5, 7, 8, 1.5); ctx.fill();
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(nx + 25, hy - 4, 5, 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.moveTo(nx + 26, hy - 8); ctx.quadraticCurveTo(nx + 28, hy - 11, nx + 26, hy - 14); ctx.stroke();
    } else if (loc.id === 'testy') {
      ctx.fillStyle = '#1e293b';
      this.roundRect(ctx, nx + 23, hy - 8, 9, 12, 1.5); ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(nx + 24, hy - 6, 7, 9);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.8;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(nx + 25, hy - 4 + i * 2); ctx.lineTo(nx + 30, hy - 4 + i * 2); ctx.stroke(); }
    } else if (loc.id === 'etyka') {
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(nx + 27, hy - 14); ctx.lineTo(nx + 27, hy - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(nx + 21, hy - 12); ctx.lineTo(nx + 33, hy - 12); ctx.stroke();
      ctx.beginPath(); ctx.arc(nx + 21, hy - 9, 3, 0, Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(nx + 33, hy - 9, 3, 0, Math.PI); ctx.stroke();
    } else if (loc.id === 'archiwum') {
      ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(nx + 26, hy - 16); ctx.lineTo(nx + 26, hy - 1); ctx.stroke();
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(nx + 22, hy - 2); ctx.lineTo(nx + 30, hy - 2); ctx.stroke();
    } else if (loc.id === 'dziecko') {
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.arc(nx + 27, hy - 3, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.arc(nx + 25.6, hy - 4.4, 1.6, 0, Math.PI * 2); ctx.fill();
    } else if (loc.id === 'neuro' || loc.id === 'eba') {
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nx + 27, hy - 6, 4, Math.PI * 0.2, Math.PI * 1.6); ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(nx + 27, hy + 0.5, 2.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#0f172a';
      this.roundRect(ctx, nx + 23, hy - 7, 9, 11, 1.5); ctx.fill();
      ctx.fillStyle = pal.accent;
      ctx.fillRect(nx + 24, hy - 6, 7, 2);
    }
    ctx.restore();

    // tabliczka z imieniem
    const label = loc.npcName;
    ctx.font = 'bold 9px "Courier New", monospace';
    const tw = ctx.measureText(label).width;
    const lx = nx + 16 - tw / 2 - 6, ly = ny - 20;
    ctx.fillStyle = 'rgba(9,13,22,0.86)';
    this.roundRect(ctx, lx, ly, tw + 12, 14, 6); ctx.fill();
    ctx.strokeStyle = this.tint(pal.accent, 0.65); ctx.lineWidth = 1;
    this.roundRect(ctx, lx, ly, tw + 12, 14, 6); ctx.stroke();
    ctx.fillStyle = '#e5e7eb';
    ctx.textAlign = 'center';
    ctx.fillText(label, nx + 16, ly + 10);

    // wskaźnik interakcji
    if (this.activeInteraction && this.activeInteraction.data.id === loc.id) {
      const bounce = Math.abs(Math.sin(Date.now() / 260)) * 5;
      const iy = ly - 12 - bounce;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(nx + 16, iy, 1, nx + 16, iy, 18);
      gr.addColorStop(0, 'rgba(250,204,21,0.35)');
      gr.addColorStop(1, 'rgba(250,204,21,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(nx + 16, iy, 18, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#facc15';
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2.5;
      ctx.font = 'bold 17px "Courier New", monospace';
      ctx.strokeText('!', nx + 16, iy + 5);
      ctx.fillText('!', nx + 16, iy + 5);
    }
  }

  drawDetailedPlayer() {
    const p = this.player;
    const t = Date.now() / 1000;

    // Podczas wchodzenia postać wtapia się w wejście.
    const tr = this.transition;
    if (tr && tr.phase === 'walkIn') {
      const fade = 1 - Math.max(0, (tr.t - 0.55) / 0.45);
      if (fade <= 0.02) return;
      this.ctx.save();
      this.ctx.globalAlpha = fade;
      this.drawPlayerBody();
      this.ctx.restore();
      return;
    }
    this.drawPlayerBody();
  }

  drawPlayerBody() {
    const p = this.player;
    const t = Date.now() / 1000;
    const idleBob = p.isMoving ? 0 : Math.sin(t * 2.2) * 0.9;
    const swing = p.isMoving ? Math.sin(p.animTimer) * 4 : 0;

    let classColor = '#38bdf8';
    let accent = '#facc15';
    if (p.charClass) {
      if (p.charClass.id === 'klinicysta') { classColor = '#f59e0b'; accent = '#fef3c7'; }
      if (p.charClass.id === 'etyk') { classColor = '#ec4899'; accent = '#fbcfe8'; }
    }

    // aura klasy postaci
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const au = ctx.createRadialGradient(p.x + 16, p.y + 22, 2, p.x + 16, p.y + 22, 44);
    au.addColorStop(0, this.tint(classColor.replace('#', '#'), 0.13));
    au.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = au;
    ctx.beginPath(); ctx.arc(p.x + 16, p.y + 22, 44, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    this.drawHuman(p.x, p.y, {
      coat: '#f1f5f9',
      accent: classColor,
      hair: '#3b1d11',
      skin: '#f5cfa8',
      dir: p.dir,
      bob: idleBob,
      legSwing: swing,
      armSwing: swing * 0.6
    });

    // stetoskop na szyi
    const top = p.y + idleBob;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(p.x + 16, top + 13, 5.5, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath(); ctx.arc(p.x + 16, top + 19.5, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(15,23,42,0.7)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(p.x + 16, top + 19.5, 2.4, 0, Math.PI * 2); ctx.stroke();

    // identyfikator w barwie klasy
    ctx.fillStyle = classColor;
    this.roundRect(ctx, p.x + 8.5, top + 18, 5, 4, 1); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(p.x + 9.3, top + 19, 3.4, 0.8);
  }

  /* ===================== WNĘTRZE BUDYNKU ===================== */

  renderInterior() {
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;
    const loc = this.interiorLoc;
    if (!loc) return;

    const base = loc.color, accent = loc.roofColor;
    const level = this.unlockedLevel(loc.id);
    const t = Date.now() / 1000;

    const floorY = H * 0.62;

    // --- ściana ---
    const wall = ctx.createLinearGradient(0, 0, 0, floorY);
    wall.addColorStop(0, this.shade(base, -0.30));
    wall.addColorStop(0.6, this.shade(base, -0.08));
    wall.addColorStop(1, this.shade(base, -0.42));
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, W, floorY);

    // kasetony ściany
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 2;
    for (let x = W * 0.06; x < W; x += W * 0.11) {
      ctx.strokeRect(x, H * 0.10, W * 0.075, floorY - H * 0.24);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.strokeRect(x + 3, H * 0.10 + 3, W * 0.075 - 6, floorY - H * 0.24 - 6);
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    }

    // boazeria
    ctx.fillStyle = this.shade(base, -0.55);
    ctx.fillRect(0, floorY - H * 0.10, W, H * 0.10);
    ctx.fillStyle = this.shade(accent, -0.20);
    ctx.fillRect(0, floorY - H * 0.10, W, 5);

    // --- podłoga w deski, zbiegające się perspektywicznie ---
    const fl = ctx.createLinearGradient(0, floorY, 0, H);
    fl.addColorStop(0, '#4a3520');
    fl.addColorStop(1, '#26190f');
    ctx.fillStyle = fl;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.strokeStyle = 'rgba(0,0,0,0.30)';
    ctx.lineWidth = 2;
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + i * (W * 0.055), floorY);
      ctx.lineTo(W / 2 + i * (W * 0.20), H);
      ctx.stroke();
    }
    for (let k = 1; k < 5; k++) {
      const yy = floorY + (H - floorY) * (k / 5) * (k / 5);
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }

    // --- okno nocne ---
    const wx = W * 0.09, wy = H * 0.16, ww = W * 0.15, wh = H * 0.26;
    ctx.fillStyle = '#0b1224';
    this.roundRect(ctx, wx, wy, ww, wh, 8); ctx.fill();
    const sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, '#16233f');
    sky.addColorStop(1, '#0d1526');
    ctx.fillStyle = sky;
    this.roundRect(ctx, wx + 5, wy + 5, ww - 10, wh - 10, 6); ctx.fill();
    const srnd = this.makeRng(loc.x * 91 + 7);
    for (let i = 0; i < 26; i++) {
      const sx2 = wx + 8 + srnd() * (ww - 16), sy2 = wy + 8 + srnd() * (wh - 16);
      ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * Math.abs(Math.sin(t * 1.4 + i))})`;
      ctx.fillRect(sx2, sy2, 2, 2);
    }
    ctx.strokeStyle = this.shade(accent, -0.2); ctx.lineWidth = 4;
    this.roundRect(ctx, wx, wy, ww, wh, 8); ctx.stroke();
    ctx.strokeStyle = 'rgba(20,26,40,0.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();

    // --- regał z książkami (tyle półek, ile poziomów + 2) ---
    const bx = W * 0.72, by = H * 0.13, bw = W * 0.20, bh = floorY - H * 0.20;
    ctx.fillStyle = '#3b2717';
    this.roundRect(ctx, bx, by, bw, bh, 4); ctx.fill();
    ctx.fillStyle = '#241708';
    ctx.fillRect(bx + 6, by + 6, bw - 12, bh - 12);
    const shelves = 4;
    const brnd = this.makeRng(loc.y * 313 + 11);
    for (let sIdx = 0; sIdx < shelves; sIdx++) {
      const sy3 = by + 10 + sIdx * ((bh - 20) / shelves);
      const sh = (bh - 20) / shelves - 8;
      let cx2 = bx + 12;
      while (cx2 < bx + bw - 20) {
        const bwid = 7 + brnd() * 9;
        const bhei = sh * (0.72 + brnd() * 0.28);
        const cols = ['#b45309', '#7f1d1d', '#1e3a8a', '#065f46', '#4c1d95', '#78350f'];
        ctx.fillStyle = cols[Math.floor(brnd() * cols.length)];
        ctx.fillRect(cx2, sy3 + sh - bhei, bwid, bhei);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(cx2, sy3 + sh - bhei, bwid, 2);
        cx2 += bwid + 2;
      }
      ctx.fillStyle = '#3b2717';
      ctx.fillRect(bx + 8, sy3 + sh, bw - 16, 5);
    }

    // --- tablica z poziomem katedry ---
    const px2 = W * 0.30, py2 = H * 0.13, pw = W * 0.30, ph = H * 0.22;
    ctx.fillStyle = '#0f172a';
    this.roundRect(ctx, px2, py2, pw, ph, 6); ctx.fill();
    ctx.strokeStyle = this.shade(accent, 0.1); ctx.lineWidth = 5;
    this.roundRect(ctx, px2, py2, pw, ph, 6); ctx.stroke();
    ctx.fillStyle = '#e2e8f0';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(H * 0.035)}px "Courier New", monospace`;
    ctx.fillText(loc.banner, px2 + pw / 2, py2 + ph * 0.34);
    ctx.font = `${Math.round(H * 0.022)}px "Courier New", monospace`;
    ctx.fillStyle = '#facc15';
    ctx.fillText(`POZIOM ${level} / ${this.maxLevelFor(loc.id)}`, px2 + pw / 2, py2 + ph * 0.60);
    ctx.fillStyle = '#94a3b8';
    const prog = this.progressFor(loc.id);
    ctx.fillText(`zaliczone: ${prog.correct} / ${this.questionsFor(loc.id).length}`, px2 + pw / 2, py2 + ph * 0.84);

    // --- dywan pod biurkiem ---
    const dx2 = W * 0.32, dy2 = floorY + (H - floorY) * 0.30, dw2 = W * 0.36, dh2 = H * 0.15;
    ctx.save();
    ctx.fillStyle = this.tint(accent, 0.16);
    ctx.beginPath();
    ctx.ellipse(W / 2, dy2 + dh2 * 1.3, dw2 * 0.85, dh2 * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = this.tint(accent, 0.30); ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(W / 2, dy2 + dh2 * 1.3, dw2 * 0.72, dh2 * 0.76, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // --- NPC stojący za biurkiem (rysowany PRZED blatem, żeby biurko go zasłaniało) ---
    const pal = this.npcPalette(loc);
    const npcScale = Math.max(3.4, H / 215);
    const nx = W / 2 - 16;
    // Sprite skalowany wokół (nx+16, ny+32); ustawiamy go tak, by biurko
    // zasłaniało nogi mniej więcej w połowie postaci.
    const ny = dy2 - 32 + 6;
    ctx.save();
    ctx.translate(nx + 16, ny + 32);
    ctx.scale(npcScale, npcScale);
    ctx.translate(-(nx + 16), -(ny + 32));
    this.drawHuman(nx, ny, {
      coat: pal.coat, accent: pal.accent, hair: pal.hair, skin: pal.skin,
      dir: 'down',
      bob: Math.sin(t * 1.5) * 0.7,
      legSwing: 0,
      armSwing: Math.sin(t * 1.5) * 0.9,
      glasses: ['eba', 'modele', 'neuro', 'archiwum'].includes(loc.id),
      longHair: ['wywiad', 'dziecko', 'rodzina', 'testy'].includes(loc.id)
    });
    ctx.restore();

    // --- biurko ---
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(dx2 + dw2 / 2, dy2 + dh2, dw2 * 0.6, 14, 0, 0, Math.PI * 2); ctx.fill();
    const dg2 = ctx.createLinearGradient(0, dy2, 0, dy2 + dh2);
    dg2.addColorStop(0, '#8a5a30');
    dg2.addColorStop(0.18, '#6d4523');
    dg2.addColorStop(1, '#3a2313');
    ctx.fillStyle = dg2;
    this.roundRect(ctx, dx2, dy2, dw2, dh2, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,225,180,0.22)';
    ctx.fillRect(dx2, dy2, dw2, 5);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2;
    this.roundRect(ctx, dx2, dy2, dw2, dh2, 6); ctx.stroke();
    // szuflady
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    for (let k = 1; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(dx2 + dw2 * (k / 3), dy2 + 8);
      ctx.lineTo(dx2 + dw2 * (k / 3), dy2 + dh2 - 4);
      ctx.stroke();
    }

    // papiery i lampka na blacie
    ctx.fillStyle = '#f8fafc';
    ctx.save(); ctx.translate(dx2 + dw2 * 0.18, dy2 + 2); ctx.rotate(-0.06);
    ctx.fillRect(-24, -10, 48, 22); ctx.restore();
    ctx.fillStyle = '#cbd5e1';
    ctx.save(); ctx.translate(dx2 + dw2 * 0.27, dy2 + 6); ctx.rotate(0.09);
    ctx.fillRect(-20, -9, 40, 20); ctx.restore();
    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(dx2 + dw2 * 0.84, dy2 + 2); ctx.lineTo(dx2 + dw2 * 0.84, dy2 - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dx2 + dw2 * 0.84, dy2 - 30); ctx.lineTo(dx2 + dw2 * 0.90, dy2 - 38); ctx.stroke();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.arc(dx2 + dw2 * 0.91, dy2 - 38, 9, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lampG = ctx.createRadialGradient(dx2 + dw2 * 0.91, dy2 - 38, 4, dx2 + dw2 * 0.91, dy2 - 38, 90);
    lampG.addColorStop(0, 'rgba(253,224,150,0.30)');
    lampG.addColorStop(1, 'rgba(253,224,150,0)');
    ctx.fillStyle = lampG;
    ctx.beginPath(); ctx.arc(dx2 + dw2 * 0.91, dy2 - 38, 90, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // tabliczka z imieniem
    ctx.font = `bold ${Math.round(H * 0.020)}px "Courier New", monospace`;
    const label = `${loc.npcName} — ${loc.npcRole}`;
    const tw = ctx.measureText(label).width;
    // wizualny wierzchołek postaci po przeskalowaniu wokół (ny + 32)
    const npcTop = (ny + 32) - 34 * npcScale;
    const plateY = npcTop - 42;
    ctx.fillStyle = 'rgba(9,13,22,0.92)';
    this.roundRect(ctx, W / 2 - tw / 2 - 14, plateY, tw + 28, 30, 8); ctx.fill();
    ctx.strokeStyle = this.tint(pal.accent, 0.7); ctx.lineWidth = 2;
    this.roundRect(ctx, W / 2 - tw / 2 - 14, plateY, tw + 28, 30, 8); ctx.stroke();
    ctx.fillStyle = '#e5e7eb';
    ctx.textAlign = 'center';
    ctx.fillText(label, W / 2, plateY + 20);

    // --- doniczka z palmą przy ścianie ---
    const potX = W * 0.13, potY = floorY + (H - floorY) * 0.42;
    ctx.fillStyle = 'rgba(0,0,0,0.40)';
    ctx.beginPath(); ctx.ellipse(potX + 4, potY + 34, 44, 12, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.42 + Math.sin(t * 0.7 + i) * 0.03;
      ctx.strokeStyle = i % 2 ? '#2f6339' : '#3d7d49';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(potX, potY);
      ctx.quadraticCurveTo(
        potX + Math.cos(a) * 40, potY - 60,
        potX + Math.cos(a) * 78, potY - 78 + Math.abs(i - 3) * 12
      );
      ctx.stroke();
    }
    const potG = ctx.createLinearGradient(potX - 30, 0, potX + 30, 0);
    potG.addColorStop(0, '#7c4a2a');
    potG.addColorStop(0.4, '#a86a3e');
    potG.addColorStop(1, '#5c3520');
    ctx.fillStyle = potG;
    ctx.beginPath();
    ctx.moveTo(potX - 32, potY - 6);
    ctx.lineTo(potX + 32, potY - 6);
    ctx.lineTo(potX + 24, potY + 36);
    ctx.lineTo(potX - 24, potY + 36);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(potX - 32, potY - 6, 64, 4);

    // --- ciepłe światło wnętrza + winieta ---
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gl2 = ctx.createRadialGradient(W / 2, floorY * 0.75, 40, W / 2, floorY * 0.75, W * 0.55);
    gl2.addColorStop(0, 'rgba(253,224,150,0.14)');
    gl2.addColorStop(1, 'rgba(253,224,150,0)');
    ctx.fillStyle = gl2;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (this.vignette) ctx.drawImage(this.vignette, 0, 0);
  }

  // Czarne przenikanie między kampusem a wnętrzem.
  drawFade() {
    const tr = this.transition;
    if (!tr) return;
    let a = 0;
    if (tr.phase === 'fadeOut') a = tr.t;
    else if (tr.phase === 'fadeIn') a = 1 - tr.t;
    else if (tr.phase === 'walkIn') a = Math.max(0, (tr.t - 0.6) / 0.4) * 0.55;
    if (a <= 0) return;
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.fillStyle = '#03060d';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.restore();
  }

  /* ---------- pętla renderowania ---------- */

  render() {
    if (!this.decor) this.buildDecor();
    if (!this.bgLayer) this.buildStaticLayers();

    const ctx = this.ctx;
    const W = this.cols * 32, H = this.rows * 32;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    if (this.scene === 'interior') {
      this.renderInterior();
      this.drawFade();
      return;
    }

    const view = this.viewSize();
    const cam = this.cameraPos();
    const cameraX = cam.x, cameraY = cam.y;

    ctx.save();
    ctx.scale(this.zoom, this.zoom);
    ctx.translate(-cameraX, -cameraY);

    // teren + dekoracje (prerender nadprobkowany -> skalowany do jednostek swiata)
    ctx.drawImage(this.bgLayer, 0, 0, W, H);

    // fontanna i budynki
    this.drawFountain();
    this.locations.forEach(loc => this.drawBuilding(loc));

    // postacie sortowane wg głębi
    const actors = this.locations.map(loc => ({ y: loc.npcY * 32 + 32, draw: () => this.drawDetailedNPC(loc) }));
    actors.push({ y: this.player.y + 32, draw: () => this.drawDetailedPlayer() });
    actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

    // światło: cień otoczenia + ciepła poświata
    const t = Date.now() / 1000;
    ctx.save();
    ctx.globalAlpha = 0.94 + Math.sin(t * 1.3) * 0.03;
    ctx.drawImage(this.lightLayer, 0, 0);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.85 + Math.sin(t * 2.1) * 0.06;
    ctx.drawImage(this.glowLayer, 0, 0);
    ctx.restore();

    // pyłki
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    this.motes.forEach((m, i) => {
      const mx = m.x + Math.sin(t * m.sp + m.ph) * m.amp;
      const my = m.y + Math.cos(t * m.sp * 0.7 + m.ph) * m.amp * 0.6;
      if (mx < cameraX - 20 || mx > cameraX + view.w + 20) return;
      if (my < cameraY - 20 || my > cameraY + view.h + 20) return;
      const a = 0.25 + 0.35 * Math.abs(Math.sin(t * 1.7 + i));
      ctx.fillStyle = `rgba(253,230,160,${a})`;
      ctx.beginPath(); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    ctx.restore();

    // winieta kadru
    if (!this.vignette) {
      const v = document.createElement('canvas');
      v.width = this.canvas.width; v.height = this.canvas.height;
      const vc = v.getContext('2d');
      const vg = vc.createRadialGradient(
        v.width / 2, v.height / 2, v.height * 0.34,
        v.width / 2, v.height / 2, v.height * 0.92
      );
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(2,6,18,0.55)');
      vc.fillStyle = vg;
      vc.fillRect(0, 0, v.width, v.height);
      this.vignette = v;
    }
    ctx.drawImage(this.vignette, 0, 0);
    this.drawFade();
  }
}

let game = null;
window.addEventListener('load', () => {
  game = new GameEngine();
  window.game = game;

  function gameLoop() {
    game.update();
    game.render();
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);
});
</script>
