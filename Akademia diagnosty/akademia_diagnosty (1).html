<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akademia Diagnosty: Wyprawa po Złoty Stetoskop EBA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #111827;
      --panel-border: #374151;
      --gold: #facc15;
      --gold-dim: #b45309;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-red: #f87171;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-pixel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 4px;
    }

    #game-container {
      position: relative;
      width: min(2100px, 98vw);
      max-width: 100%;
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.9), 0 0 24px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-bottom: 2px solid var(--panel-border);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bar-container {
      width: 72px;
      height: 10px;
      background: #030712;
      border: 1px solid #4b5563;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .stamina-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #22c55e);
      width: 100%;
      transition: width 0.25s ease;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      width: 0%;
      transition: width 0.25s ease;
    }

    .multiplier-tag {
      background: var(--gold);
      color: #000;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    #canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: calc(100vh - 168px);
      min-height: 320px;
      background: #020617;
      cursor: crosshair;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
    }

    #toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
      max-width: 90%;
    }

    #interact-prompt {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 6, 23, 0.94);
      border: 2px solid var(--accent-blue);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      display: none;
      animation: pulseGlow 1.2s infinite;
      z-index: 40;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.95; border-color: var(--accent-blue); }
      50% { transform: translateX(-50%) scale(1.04); opacity: 1; border-color: var(--gold); }
    }

    #bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-top: 2px solid var(--panel-border);
      padding: 6px 10px;
      font-size: 10px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .key-hint {
      display: inline-block;
      background: #1f2937;
      color: #e5e7eb;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid #4b5563;
      font-weight: bold;
      margin: 0 1px;
    }

    .zoom-btn {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #4b5563;
      border-radius: 4px;
      font-weight: bold;
      font-family: inherit;
      font-size: 13px;
      line-height: 1;
      padding: 3px 9px;
      cursor: pointer;
    }
    .zoom-btn:hover { background: #374151; border-color: var(--gold); color: var(--gold); }
    .zoom-btn:active { transform: translateY(1px); }

    /* Na duzych ekranach interfejs skaluje sie razem z powiekszonym kadrem gry */
    @media (min-width: 1400px) {
      #hud { font-size: 13px; padding: 8px 16px; }
      #bottom-bar { font-size: 12px; padding: 8px 14px; }
      .bar-container { width: 96px; height: 12px; }
      #toast { font-size: 13px; padding: 8px 20px; }
      #interact-prompt { font-size: 13px; padding: 8px 20px; }
      .zoom-btn { font-size: 15px; padding: 4px 11px; }
    }

    #mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d16;
      border-top: 1px solid #1f2937;
      padding: 6px 12px;
      gap: 8px;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 32px);
      gap: 3px;
    }

    .touch-btn {
      background: #1f2937;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      touch-action: none;
    }

    .touch-btn:active {
      background: #38bdf8;
      color: #000;
    }

    .action-btn {
      background: #1d4ed8;
      border: 2px solid #3b82f6;
      color: #fff;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
    }
    .action-btn:active {
      background: #2563eb;
      transform: scale(0.96);
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
      padding: 8px;
    }

    .modal-content {
      background: #172033;
      border: 2px solid #475569;
      border-radius: 8px;
      width: 780px;
      max-width: 98%;
      max-height: 92%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
      overflow: hidden;
      animation: modalPop 0.18s ease-out;
    }

    @keyframes modalPop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      background: #090f1d;
      padding: 8px 14px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 13px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.45;
    }

    .modal-footer {
      background: #090f1d;
      padding: 8px 14px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #334155;
      color: var(--text-main);
      border: 1px solid #64748b;
      border-radius: 5px;
      padding: 5px 12px;
      font-family: var(--font-pixel);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .btn:hover {
      background: #475569;
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-primary {
      background: #1d4ed8;
      border-color: #3b82f6;
      color: #fff;
      font-weight: bold;
    }
    .btn-primary:hover {
      background: #2563eb;
      border-color: var(--gold);
    }

    .btn-gold {
      background: #b45309;
      border-color: var(--gold);
      color: #fff;
      font-weight: bold;
    }
    .btn-gold:hover {
      background: #d97706;
    }

    .class-card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .class-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.15s;
    }
    .class-card:hover {
      border-color: var(--gold);
      background: #1e293b;
      transform: translateY(-2px);
    }

    .q-text {
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
      background: #090d16;
      padding: 9px 12px;
      border-left: 3px solid var(--accent-blue);
      border-radius: 4px;
    }

    .answer-box {
      width: 100%;
      background: #080c16;
      border: 1px solid #374151;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 5px;
      resize: vertical;
      min-height: 52px;
      margin-bottom: 6px;
    }
    .answer-box:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .feedback-panel {
      margin-top: 8px;
      padding: 9px;
      border-radius: 5px;
      font-size: 11px;
      line-height: 1.4;
    }
    .feedback-correct {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--accent-green);
      color: #bbf7d0;
    }
    .feedback-wrong {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--accent-red);
      color: #fecaca;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #4c1d95, #701a75);
      border: 1px solid #c084fc;
      color: #f5d0fe;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.35);
    }

    .ai-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #a855f7;
      box-shadow: 0 0 8px #d8b4fe;
      animation: aiPulse 1.5s infinite;
    }

    @keyframes aiPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .chat-bubble-patient {
      background: #1e293b;
      border-left: 3px solid #f59e0b;
      color: #f1f5f9;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      max-width: 85%;
      align-self: flex-start;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .chat-bubble-diagnostician {
      background: #1e3a8a;
      border-right: 3px solid #38bdf8;
      color: #ffffff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      max-width: 85%;
      align-self: flex-end;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .chat-bubble-system {
      background: rgba(30, 41, 59, 0.7);
      border: 1px dashed #64748b;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 10px;
      align-self: center;
      margin-bottom: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="flex items-center gap-2 flex-wrap">
      <div class="hud-item">
        <span class="text-gray-400">Ranga:</span>
        <span id="player-title" style="color: var(--gold);">Stażysta EBA</span>
      </div>
      <div class="hud-item">
        <span class="text-gray-400">Klasa:</span>
        <span id="player-class" style="color: var(--accent-blue);">-</span>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <div class="hud-item">
        <span>XP:</span>
        <div class="bar-container">
          <div id="xp-bar" class="xp-fill"></div>
        </div>
        <span id="xp-val">0 XP</span>
      </div>

      <div class="hud-item">
        <span>Stamina:</span>
        <div class="bar-container">
          <div id="stamina-bar" class="stamina-fill"></div>
        </div>
        <span id="stamina-val">100%</span>
      </div>

      <div class="hud-item">
        <span>Seria:</span>
        <span id="streak-tag" class="multiplier-tag">x1.0</span>
      </div>

      <button id="btn-ai-simulation" class="btn" style="padding: 2px 8px; font-size: 10px; background: #581c87; border-color: #a855f7; color: #f3e8ff;">
        <span class="ai-pulse-dot inline-block mr-1"></span>🧠 Symulacja Pacjenta AI
      </button>
      <button id="btn-sync-cloud" class="btn" style="padding: 2px 8px; font-size: 10px; background: #1e3a8a; border-color: #3b82f6;">☁️ Zapis w chmurze</button>
      <button id="btn-badges-menu" class="btn" style="padding: 2px 7px; font-size: 10px;">🏆 Odznaki (<span id="unlocked-badge-count">0/6</span>)</button>
    </div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas" width="1920" height="1200"></canvas>
    <div id="toast">Komunikat</div>
    <div id="interact-prompt">[SPACJA / ENTER] lub DOTKNIJ "AKCJA" aby rozmawiać</div>
  </div>

  <div id="bottom-bar">
    <div class="hidden sm:block">
      Klawisze: <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> / <span class="key-hint">Strzałki</span> | Rozmowa: <span class="key-hint">Spacja</span> / <span class="key-hint">Enter</span> | Zoom: <span class="key-hint">-</span><span class="key-hint">+</span> | Możesz też <strong>klikać w punkt na mapie</strong>
    </div>
    <div class="hud-item">
      Przybliżenie:
      <button id="btn-zoom-out" class="zoom-btn" title="Oddal">−</button>
      <span id="zoom-label" style="color: var(--text-main); font-weight: bold; min-width: 42px; display: inline-block; text-align: center;">220%</span>
      <button id="btn-zoom-in" class="zoom-btn" title="Przybliż">+</button>
    </div>
    <div>
      Strefa: <span id="current-location-text" style="color: var(--text-main); font-weight: bold;">Aleja Główna Kampusu</span>
    </div>
    <div class="text-xs text-gray-400">
      Zaliczono: <span id="total-answered-counter" class="text-yellow-400 font-bold">0</span> pytań
    </div>
  </div>

  <!-- Touch On-Screen Controls for Mobile Phones -->
  <div id="mobile-controls">
    <div class="dpad-grid">
      <div></div>
      <button class="touch-btn" id="touch-up">▲</button>
      <div></div>
      <button class="touch-btn" id="touch-left">◀</button>
      <button class="touch-btn" id="touch-down">▼</button>
      <button class="touch-btn" id="touch-right">▶</button>
    </div>

    <div class="flex items-center gap-2">
      <button class="action-btn" id="touch-action">💬 ROZMAWIAJ</button>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-overlay" style="display: none;"></div>
</div>

<script>
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playStep() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120 + Math.random() * 20, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch(e) {}
  }
  playSuccess() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.09, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.28);
      });
    } catch(e) {}
  }
  playError() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.linearRampToValueAtTime(70, now + 0.22);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch(e) {}
  }
  playLevelUp() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [440, 554.37, 659.25, 880, 1108.73].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.07, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.3);
      });
    } catch(e) {}
  }
  playCoffee() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.18);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  }
}
const audio = new SoundEngine();

function normalizeText(str) {
  if (!str) return "";
  const polishMap = {
    'ą':'a', 'ć':'c', 'ę':'e', 'ł':'l', 'ń':'n', 'ó':'o', 'ś':'s', 'ź':'z', 'ż':'z',
    'Ą':'a', 'Ć':'c', 'Ę':'e', 'Ł':'l', 'Ń':'n', 'Ó':'o', 'Ś':'s', 'Ź':'z', 'Ż':'z'
  };
  const clean = str.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, m => polishMap[m] || m);
  return clean.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function levenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const m = [];
  for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        m[i][j] = m[i - 1][j - 1];
      } else {
        m[i][j] = Math.min(
          m[i - 1][j - 1] + 1,
          m[i][j - 1] + 1,
          m[i - 1][j] + 1
        );
      }
    }
  }
  return m[b.length][a.length];
}

function matchesKeyword(token, targetKeyword) {
  if (token === targetKeyword) return true;
  if (token.length >= 3 && targetKeyword.length >= 3) {
    if (token.includes(targetKeyword) || targetKeyword.includes(token)) return true;
    const maxDist = targetKeyword.length > 5 ? 2 : 1;
    if (levenshteinDistance(token, targetKeyword) <= maxDist) return true;
  }
  return false;
}

function verifyAnswer(userInput, expectedGroups) {
  const normalizedInput = normalizeText(userInput);
  const words = normalizedInput.split(" ").filter(w => w.length > 1);

  let satisfiedGroups = 0;
  for (const group of expectedGroups) {
    let groupMatched = false;
    for (const keyword of group) {
      const normKeyword = normalizeText(keyword);
      if (words.some(word => matchesKeyword(word, normKeyword))) {
        groupMatched = true;
        break;
      }
      if (normKeyword.includes(" ") && normalizedInput.includes(normKeyword)) {
        groupMatched = true;
        break;
      }
    }
    if (groupMatched) satisfiedGroups++;
  }

  const threshold = expectedGroups.length <= 2 ? expectedGroups.length : Math.ceil(expectedGroups.length * 0.65);
  return {
    isCorrect: satisfiedGroups >= threshold,
    matchedCount: satisfiedGroups,
    totalRequired: threshold
  };
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const appId = typeof __app_id !== 'undefined' ? __app_id : 'akademia-diagnosty';
let db = null;
let auth = null;
let currentUserId = null;
let unsubscribeLive = null;

async function initFirebaseStorage() {
  try {
    if (typeof __firebase_config !== 'undefined') {
      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      currentUserId = auth.currentUser?.uid || crypto.randomUUID();
      window.currentUserSyncId = currentUserId;
      window.cloudStorageReady = true;

      const privateDocRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
      unsubscribeLive = onSnapshot(privateDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (window.game && data && !window.game.isSyncing) {
            window.game.applySavedData(data);
          }
        }
      }, (error) => {
        console.warn("Live snapshot notice:", error);
      });

      await loadFromCloud();
    } else {
      window.currentUserSyncId = 'sesja-lokalna-' + Math.random().toString(36).substring(2, 9);
    }
  } catch(err) {
    console.warn("Inicjalizacja zapisu chmurowego powiodła się w trybie autonomicznym:", err);
    window.currentUserSyncId = 'sesja-lokalna-' + Math.random().toString(36).substring(2, 9);
  }
}

window.saveToCloud = async function(gameData, isManual = false) {
  if (!db || !auth || !auth.currentUser) {
    if (isManual && window.game) {
      window.game.showToast("Postęp zachowany w bieżącej sesji.");
    }
    return;
  }
  try {
    const payload = {
      stats: gameData.stats,
      charClass: gameData.charClass,
      lastUpdated: new Date().toISOString(),
      ownerId: currentUserId
    };

    const privateRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
    const publicSyncRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', currentUserId);

    await Promise.all([
      setDoc(privateRef, payload, { merge: true }),
      setDoc(publicSyncRef, payload, { merge: true })
    ]);

    if (isManual && window.game) {
      window.game.showToast("☁️ Postęp bezpiecznie zapisany w chmurze!");
    }
  } catch(e) {
    console.error("Błąd zapisu:", e);
    if (isManual && window.game) {
      window.game.showToast("Zapisano stan w pamięci.");
    }
  }
};

window.loadFromCloud = async function() {
  if (!db || !auth || !auth.currentUser) return;
  try {
    const privateRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
    const snap = await getDoc(privateRef);
    if (snap.exists() && window.game) {
      const data = snap.data();
      window.game.applySavedData(data);
      window.game.showToast("☁️ Przywrócono Twój postęp z chmury!");
    }
  } catch(e) {
    console.warn("Błąd ładowania:", e);
  }
};

window.syncFromDeviceKey = async function(targetKey) {
  if (!targetKey || typeof targetKey !== 'string') {
    return { success: false, message: "Nieprawidłowy klucz gracza." };
  }
  const cleanKey = targetKey.trim();
  if (!db || !auth || !auth.currentUser) {
    return { success: false, message: "Brak aktywnego połączenia sieciowego." };
  }

  try {
    const syncDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', cleanKey);
    const snap = await getDoc(syncDocRef);
    if (!snap.exists()) {
      return { success: false, message: "Nie znaleziono zapisu dla podanego identyfikatora gracza." };
    }

    const remoteData = snap.data();
    if (window.game && remoteData) {
      window.game.isSyncing = true;
      window.game.applySavedData(remoteData);
      await window.saveToCloud({ stats: window.game.stats, charClass: window.game.player.charClass }, false);
      window.game.isSyncing = false;
      return { success: true, message: `Pomyślnie zsynchronizowano postęp! Poziom: ${remoteData.stats?.level || 1} (${remoteData.stats?.xp || 0} XP)` };
    }
    return { success: false, message: "Błąd formatu danych profilu." };
  } catch(err) {
    console.error("Błąd synchronizacji:", err);
    return { success: false, message: "Wystąpił błąd podczas pobierania zapisu: " + err.message };
  }
};

window.addEventListener('load', () => {
  initFirebaseStorage();
});
</script>

<script>
class GameEngine {

      { id: "modele", name: "Katedra Modeli Procesu", x: 10, y: 2, w: 6, h: 4, color: "#4c1d95", roofColor: "#8b5cf6", npcName: "Dr Szuster", npcRole: "Architekt Procesu", npcX: 13, npcY: 6, banner: "MODELE", icon: "📜" },
      { id: "wywiad", name: "Gabinet Wywiadu i Obserwacji", x: 20, y: 2, w: 6, h: 4, color: "#78350f", roofColor: "#d97706", npcName: "Mgr Dialogowska", npcRole: "Klinicystka", npcX: 23, npcY: 6, banner: "WYWIAD", icon: "💬" },
      { id: "rodzina", name: "Klinika Relacji i Rodziny", x: 28, y: 2, w: 6, h: 4, color: "#854d0e", roofColor: "#eab308", npcName: "Dr Więziewicz", npcRole: "Terapeuta Par", npcX: 31, npcY: 6, banner: "RODZINA", icon: "🤝" },

      { id: "testy", name: "Poligon Psychometryczny", x: 2, y: 17, w: 6, h: 4, color: "#065f46", roofColor: "#10b981", npcName: "Doc. Psychometrzyk", npcRole: "Psychometra", npcX: 5, npcY: 16, banner: "TESTY", icon: "🎯" },
      { id: "dziecko", name: "Pracownia Diagnozy Dziecka", x: 10, y: 17, w: 6, h: 4, color: "#0e7490", roofColor: "#06b6d4", npcName: "Dr Maluszkiewicz", npcRole: "Diagnosta Rozwoju", npcX: 13, npcY: 16, banner: "DZIECKO", icon: "🧸" },
      { id: "bufet", name: "Bufet 'Złoty Stetoskop'", x: 19, y: 17, w: 5, h: 4, color: "#334155", roofColor: "#64748b", npcName: "Barista Zenon", npcRole: "Regeneracja", npcX: 21, npcY: 16, banner: "BUFET", icon: "☕" },
      { id: "neuro", name: "Pawilon Neuropsychologii", x: 28, y: 17, w: 6, h: 4, color: "#155e75", roofColor: "#38bdf8", npcName: "Prof. Synapsa", npcRole: "Neuropsycholog", npcX: 31, npcY: 16, banner: "NEURO", icon: "🧠" },

      { id: "etyka", name: "Komisja Etyki i Praw Pacjenta", x: 2, y: 10, w: 5, h: 4, color: "#831843", roofColor: "#ec4899", npcName: "Przewodniczący Etyk", npcRole: "Rzecznik Praw", npcX: 4, npcY: 9, banner: "ETYKA", icon: "⚖️" },
      { id: "archiwum", name: "Archiwum Szarlatanerii", x: 29, y: 10, w: 5, h: 4, color: "#450a0a", roofColor: "#ef4444", npcName: "Kustosz Sceptyk", npcRole: "Łowca Pseudonauki", npcX: 31, npcY: 9, banner: "SZARLATANI", icon: "⚔️" }
    ];

    // Geometria wejsc wyprowadzona z brylly budynku: kafelek wejscia to srodkowy
    // dolny kafelek (initMapCollision zostawia go przepuszczalnym), a NPC stoi
    // tuz obok drzwi, po stronie podejscia.
    this.locations.forEach(loc => {
      loc.doorCol = loc.x + Math.floor(loc.w / 2);
      loc.entryRow = loc.y + loc.h - 1;
      loc.frontRow = loc.y + loc.h;
      loc.npcX = loc.doorCol - 1;
      loc.npcY = loc.frontRow;
    });

    this.keys = {};
    this.activeInteraction = null;
    this.isModalOpen = false;

    // Wejscie do budynku: faza animacji i stan wnetrza
    this.scene = 'campus';           // 'campus' | 'interior'
    this.transition = null;          // { phase, t, loc }
    this.currentBlock = null;        // aktywny blok pytan
    this.BLOCK_SIZE = 5;             // pytan na jedno wejscie
    this.LEVEL_STEP = 10;            // poprawnych odpowiedzi na kolejny poziom

    // Powiekszenie kadru. Canvas (1600x1000) jest wiekszy niz swiat (1152x768),
    // wiec zoom musi byc >= ~1.45, inaczej pojawilyby sie puste marginesy.
    this.minZoom = 1.7;
    this.maxZoom = 3.2;
    this.zoom = 2.3;

    // Nadprobkowanie warstw prerenderowanych: rysujemy je w wyzszej
    // rozdzielczosci niz swiat, zeby nie rozmywaly sie przy przyblizeniu.
    this.ss = (window.innerWidth < 900 || window.devicePixelRatio > 2) ? 2 : 3;
    try {
      const savedZoom = parseFloat(localStorage.getItem('ad_zoom'));
      if (savedZoom >= this.minZoom && savedZoom <= this.maxZoom) this.zoom = savedZoom;
    } catch (e) {}

    this.initMapCollision();

    const zoomLabel = document.getElementById('zoom-label');
    if (zoomLabel) zoomLabel.innerText = Math.round(this.zoom * 100) + '%';

    // Zabezpieczenie: gdyby punkt startowy wypadl na kolizji, przenies na najblizsze wolne pole
    const safeSpawn = this.findFreeSpot(this.player.x, this.player.y);
    if (safeSpawn) {
      this.player.x = safeSpawn.x;
      this.player.y = safeSpawn.y;
      this.player.targetX = safeSpawn.x;
      this.player.targetY = safeSpawn.y;
    }
    this.bindEvents();
    this.updateHUD();

    setTimeout(() => {
      if (!this.player.charClass) {
        this.showClassSelectModal();
      }
    }, 250);
  }

  // Aleja, do której schodzi dojście od drzwi danego budynku.
  promenadeRowFor(loc) {
    if (loc.y < 10) return 12;
    if (loc.y < 16) return 16;
    return 22;
  }

  /* ===================== WEJŚCIE DO BUDYNKU ===================== */

  // Start sekwencji wejścia: gracz podchodzi do drzwi, wchodzi, ekran gaśnie.
  enterBuilding(loc) {
    if (this.transition || this.scene !== 'campus' || this.isModalOpen) return;

    if (loc.id === 'bufet') {
      // Bufet nie ma pytań — wchodzimy, ale od razu na regenerację.
      this.transition = { phase: 'walkIn', t: 0, loc, then: 'bufet' };
    } else {
      if (this.remainingFor(loc.id) === 0) {
        const lvl = this.unlockedLevel(loc.id);
        const max = this.maxLevelFor(loc.id);
        this.showToast(lvl >= max
          ? `${loc.banner}: wszystkie poziomy ukończone!`
          : `${loc.banner}: poziom ${lvl} zaliczony — odblokuj kolejny.`);
        return;
      }
      this.transition = { phase: 'walkIn', t: 0, loc, then: 'questions' };
    }

    audio.init();
    this.keys = {};
    this.transition.from = { x: this.player.x, y: this.player.y };
    this.transition.to = {
      x: loc.doorCol * 32,
      y: loc.entryRow * 32
    };
    this.player.dir = 'up';
  }

  updateTransition() {
    const tr = this.transition;
    if (!tr) return;

    if (tr.phase === 'walkIn') {
      tr.t = Math.min(1, tr.t + 0.035);
      const e = tr.t * tr.t * (3 - 2 * tr.t); // wygładzenie
      this.player.x = tr.from.x + (tr.to.x - tr.from.x) * e;
      this.player.y = tr.from.y + (tr.to.y - tr.from.y) * e;
      this.player.targetX = this.player.x;
      this.player.targetY = this.player.y;
      this.player.isMoving = tr.t < 0.95;
      this.player.animTimer += 0.25;
      if (tr.t >= 1) { tr.phase = 'fadeOut'; tr.t = 0; }
      return;
    }

    if (tr.phase === 'fadeOut') {
      tr.t = Math.min(1, tr.t + 0.055);
      if (tr.t >= 1) {
        this.scene = 'interior';
        this.interiorLoc = tr.loc;
        const then = tr.then;
        this.transition = null;
        if (then === 'bufet') this.showBufetModal();
        else this.startQuestionBlock(tr.loc);
      }
      return;
    }

    if (tr.phase === 'fadeIn') {
      tr.t = Math.min(1, tr.t + 0.045);
      if (tr.t >= 1) this.transition = null;
      return;
    }
  }

  // Powrót na kampus: gracz ląduje przed drzwiami budynku.
  exitBuilding() {
    const loc = this.interiorLoc;
    this.scene = 'campus';
    this.interiorLoc = null;
    this.currentBlock = null;
    if (loc) {
      this.player.x = loc.doorCol * 32;
      this.player.y = loc.frontRow * 32 + 6;
      this.player.targetX = this.player.x;
      this.player.targetY = this.player.y;
      this.player.dir = 'down';
    }
    this.transition = { phase: 'fadeIn', t: 0 };
    this.keys = {};
  }

  /* ===================== BLOKI PYTAŃ ===================== */

  startQuestionBlock(loc) {
    const level = this.unlockedLevel(loc.id);
    // Najpierw pytania z bieżącego poziomu, potem zaległe z poziomów niższych.
    const current = this.questionsAtLevel(loc.id, level)
      .filter(q => !this.stats.answeredQuestions[q.id]);
    const backlog = this.questionsFor(loc.id)
      .slice(0, (level - 1) * this.LEVEL_STEP)
      .filter(q => !this.stats.answeredQuestions[q.id]);

    const pool = current.concat(backlog).slice(0, this.BLOCK_SIZE);
    if (pool.length === 0) { this.exitBuilding(); return; }

    this.currentBlock = {
      loc,
      level,
      questions: pool,
      index: 0,
      correct: 0,
      xp: 0,
      levelBefore: level
    };
    this.showBlockQuestion();
  }

  advanceBlock() {
    const b = this.currentBlock;
    if (!b) { this.closeModal(); return; }
    b.index++;
    if (b.index >= b.questions.length) this.showBlockSummary();
    else this.showBlockQuestion();
  }

  showBlockSummary() {
    const b = this.currentBlock;
    if (!b) return;
    const loc = b.loc;
    const levelNow = this.unlockedLevel(loc.id);
    const unlocked = levelNow > b.levelBefore;
    const prog = this.progressFor(loc.id);
    const total = this.questionsFor(loc.id).length;
    const maxLvl = this.maxLevelFor(loc.id);
    const toNext = unlocked || levelNow >= maxLvl
      ? 0
      : (this.LEVEL_STEP * levelNow) - prog.correct;

    if (unlocked) audio.playLevelUp();

    this.isModalOpen = true;
    const container = document.getElementById('modal-container');
    container.style.display = 'flex';
    container.innerHTML = `
      <div class="modal-content" style="max-width: 620px;">
        <div class="modal-header">
          <h2>${loc.icon} ${loc.name} — podsumowanie bloku</h2>
        </div>
        <div class="modal-body text-center">
          <div class="text-4xl my-2">${b.correct === b.questions.length ? '🏅' : b.correct > 0 ? '📘' : '📕'}</div>
          <p class="text-lg font-bold mb-1" style="color: var(--gold);">
            ${b.correct} / ${b.questions.length} poprawnych odpowiedzi
          </p>
          <p class="text-xs text-gray-400 mb-3">Zdobyto ${b.xp} XP w tym bloku</p>

          ${unlocked ? `
            <div class="my-3 p-3 rounded border" style="background: rgba(250,204,21,0.10); border-color: var(--gold);">
              <p class="font-bold text-base" style="color: var(--gold);">⭐ POZIOM ${levelNow} ODBLOKOWANY!</p>
              <p class="text-xs text-gray-300 mt-1">
                Budynek ${loc.banner} rozbudował się o nowe piętro. Czekają w nim kolejne zagadnienia.
              </p>
            </div>
          ` : `
            <div class="my-3 p-2 rounded border border-slate-700 bg-slate-900/60">
              <p class="text-xs text-gray-300">
                Poziom ${levelNow} / ${maxLvl} &nbsp;·&nbsp; zaliczone pytania: ${prog.correct} / ${total}
              </p>
              ${toNext > 0 ? `<p class="text-xs mt-1" style="color: var(--accent-blue);">
                Do kolejnego piętra brakuje ${toNext} ${toNext === 1 ? 'poprawnej odpowiedzi' : 'poprawnych odpowiedzi'}.
              </p>` : ''}
            </div>
          `}

          <p class="text-xs text-gray-400 mt-2">
            Pozostało pytań na odblokowanych poziomach: <strong style="color: var(--text-main);">${this.remainingFor(loc.id)}</strong>
          </p>
        </div>
        <div class="modal-footer">
          ${this.remainingFor(loc.id) > 0
            ? `<button class="btn btn-primary" onclick="game.startQuestionBlock(game.currentBlock.loc)">Kolejny blok</button>`
            : ''}
          <button class="btn" onclick="game.leaveInterior()">Wyjdź na kampus</button>
        </div>
      </div>
    `;

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  leaveInterior() {
    this.closeModal();
  }

  /* ===================== POZIOMY BUDYNKÓW ===================== */

  // Pytania danego budynku w stalej kolejnosci; indeks wyznacza poziom.
  questionsFor(locId) {
    return QUESTIONS_DB.filter(q => q.locId === locId);
  }

  maxLevelFor(locId) {
    return Math.max(1, Math.ceil(this.questionsFor(locId).length / this.LEVEL_STEP));
  }

  progressFor(locId) {
    if (!this.stats.progress) this.stats.progress = {};
    if (!this.stats.progress[locId]) {
      // Zapisy sprzed wprowadzenia poziomów nie mają tego licznika —
      // odtwarzamy go z listy zaliczonych pytań.
      const done = this.questionsFor(locId)
        .filter(q => this.stats.answeredQuestions[q.id]).length;
      this.stats.progress[locId] = { correct: done };
    }
    return this.stats.progress[locId];
  }

  // Poziom odblokowany = 1 + (poprawne odpowiedzi / 10), ograniczony zapasem pytan.
  unlockedLevel(locId) {
    const correct = this.progressFor(locId).correct;
    return Math.min(this.maxLevelFor(locId), 1 + Math.floor(correct / this.LEVEL_STEP));
  }

  // Pula pytan przypisana do danego poziomu (10 kolejnych pytan budynku).
  questionsAtLevel(locId, level) {
    const all = this.questionsFor(locId);
    return all.slice((level - 1) * this.LEVEL_STEP, level * this.LEVEL_STEP);
  }

  // Ile pytan z aktualnie odblokowanych poziomow pozostalo bez poprawnej odpowiedzi.
  remainingFor(locId) {
    const lvl = this.unlockedLevel(locId);
    const pool = this.questionsFor(locId).slice(0, lvl * this.LEVEL_STEP);
    return pool.filter(q => !this.stats.answeredQuestions[q.id]).length;
  }

  setZoom(z) {
    this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, z));
    try { localStorage.setItem('ad_zoom', String(this.zoom)); } catch (e) {}
    const label = document.getElementById('zoom-label');
    if (label) label.innerText = Math.round(this.zoom * 100) + '%';
  }

  // Widoczny wycinek swiata w pikselach swiata (canvas przeskalowany zoomem)
  viewSize() {
    return { w: this.canvas.width / this.zoom, h: this.canvas.height / this.zoom };
  }

  cameraPos() {
    const v = this.viewSize();
    return {
      x: Math.max(0, Math.min(this.cols * 32 - v.w, this.player.x + 16 - v.w / 2)),
      y: Math.max(0, Math.min(this.rows * 32 - v.h, this.player.y + 16 - v.h / 2))
    };
  }

  initMapCollision() {
    this.collisionGrid = Array.from({ length: this.rows }, () => Array(this.cols).fill(0));

    // Outer campus boundary walls
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (r === 0 || r === this.rows - 1 || c === 0 || c === this.cols - 1) {
          this.collisionGrid[r][c] = 1;
        }
      }
    }

    // Mark campus buildings as solid obstacles, leaving doorways open
    this.locations.forEach(loc => {
      const doorCol = loc.x + Math.floor(loc.w / 2);
      const doorRow = loc.y + loc.h;
      for (let r = loc.y; r < loc.y + loc.h; r++) {
        for (let c = loc.x; c < loc.x + loc.w; c++) {
          if (r < this.rows && c < this.cols) {
            if (c === doorCol && r === doorRow - 1) continue;
            this.collisionGrid[r][c] = 1;
          }
        }
      }
      if (loc.npcY < this.rows && loc.npcX < this.cols) {
        this.collisionGrid[loc.npcY][loc.npcX] = 2;
      }
    });

    // Central Fountain Obstacle
    this.collisionGrid[11][17] = 1;
    this.collisionGrid[11][18] = 1;
    this.collisionGrid[12][17] = 1;
    this.collisionGrid[12][18] = 1;
  }

  bindEvents() {
    window.addEventListener('keydown', (e) => {
      audio.init();
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && !this.isModalOpen) {
        e.preventDefault();
      }
      if ((e.code === 'Space' || e.code === 'Enter') && this.activeInteraction && !this.isModalOpen) {
        this.triggerInteraction(this.activeInteraction);
      }
      if (!this.isModalOpen) {
        if (e.code === 'Equal' || e.code === 'NumpadAdd') { e.preventDefault(); this.setZoom(this.zoom + 0.25); }
        if (e.code === 'Minus' || e.code === 'NumpadSubtract') { e.preventDefault(); this.setZoom(this.zoom - 0.25); }
      }
      // Escape zawsze wyprowadza z budynku — zabezpieczenie przed utknięciem.
      if (e.code === 'Escape' && this.scene === 'interior' && !this.transition) {
        e.preventDefault();
        this.closeModal();
      }
    });

    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
    });

    this.canvas.addEventListener('click', (e) => {
      audio.init();
      if (this.isModalOpen) return;
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;
      
      const cam = this.cameraPos();
      this.player.targetX = clickX / this.zoom + cam.x - 16;
      this.player.targetY = clickY / this.zoom + cam.y - 20;
    });

    const setupTouch = (id, keyCode) => {
      const el = document.getElementById(id);
      if (!el) return;
      const onDown = (ev) => {
        ev.preventDefault();
        audio.init();
        this.keys[keyCode] = true;
      };
      const onUp = (ev) => {
        ev.preventDefault();
        this.keys[keyCode] = false;
      };
      el.addEventListener('touchstart', onDown, { passive: false });
      el.addEventListener('touchend', onUp, { passive: false });
      el.addEventListener('mousedown', onDown);
      el.addEventListener('mouseup', onUp);
    };

    setupTouch('touch-up', 'KeyW');
    setupTouch('touch-down', 'KeyS');
    setupTouch('touch-left', 'KeyA');
    setupTouch('touch-right', 'KeyD');

    const touchAct = document.getElementById('touch-action');
    if (touchAct) {
      touchAct.addEventListener('click', () => {
        audio.init();
        if (this.activeInteraction && !this.isModalOpen) {
          this.triggerInteraction(this.activeInteraction);
        }
      });
    }

    const zoomIn = document.getElementById('btn-zoom-in');
    const zoomOut = document.getElementById('btn-zoom-out');
    if (zoomIn) zoomIn.addEventListener('click', () => this.setZoom(this.zoom + 0.25));
    if (zoomOut) zoomOut.addEventListener('click', () => this.setZoom(this.zoom - 0.25));

    // Kolko myszy z Ctrl przybliza kadr gry
    this.canvas.addEventListener('wheel', (e) => {
      if (this.isModalOpen || !e.ctrlKey) return;
      e.preventDefault();
      this.setZoom(this.zoom + (e.deltaY < 0 ? 0.25 : -0.25));
    }, { passive: false });

    document.getElementById('btn-badges-menu').addEventListener('click', () => {
      this.showBadgesModal();
    });

    document.getElementById('btn-sync-cloud').addEventListener('click', () => {
      this.showCloudSyncModal();
    });

    const aiSimBtn = document.getElementById('btn-ai-simulation');
    if (aiSimBtn) {
      aiSimBtn.addEventListener('click', () => {
        audio.init();
        this.showClinicalSimulationModal();
      });
    }
  }

  addXP(amount, locId) {
    let finalAmount = amount * this.stats.multiplier;
    if (this.player.charClass) {
      if (this.player.charClass.id === 'adept' && ['eba', 'testy', 'modele', 'neuro'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Adepta EBA: +35% XP za rygor metodologiczny!");
      } else if (this.player.charClass.id === 'klinicysta' && ['wywiad', 'rodzina', 'dziecko'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Klinicysty: +35% XP za kunszt wywiadu i relacji!");
      } else if (this.player.charClass.id === 'etyk' && ['etyka', 'archiwum'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Rzecznika Etyki: +35% XP za ochronę praw pacjenta!");
      }
    }
    this.stats.xp += Math.round(finalAmount);

    const prevLevel = this.stats.level;
    this.stats.level = Math.floor(this.stats.xp / 100) + 1;

    if (this.stats.level >= 8) this.stats.rankTitle = "Wielki Mistrz Złotego Stetoskpu EBA";
    else if (this.stats.level >= 5) this.stats.rankTitle = "Ekspert EBA & Superwizor";
    else if (this.stats.level >= 3) this.stats.rankTitle = "Licencjonowany Psycholog";
    else if (this.stats.level >= 2) this.stats.rankTitle = "Młodszy Diagnosta";

    if (this.stats.level > prevLevel) {
      audio.playLevelUp();
      this.showToast(`AWANS NAUKOWY! Poziom ${this.stats.level}: ${this.stats.rankTitle}!`);
    }

    this.checkBadgesUnlock();
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  reduceStamina(amount) {
    let penalty = amount;
    if (this.player.charClass && this.player.charClass.id === 'etyk') {
      penalty *= 0.5;
      this.showToast("Tarcza Etyczna: -50% utraty staminy!");
    }
    this.stats.stamina = Math.max(0, this.stats.stamina - penalty);
    this.stats.streak = 0;
    this.stats.multiplier = 1.0;
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  restoreStamina(amount) {
    this.stats.stamina = Math.min(100, this.stats.stamina + amount);
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  async callGemini(payload, retries = 3, delay = 1000) {
    const apiKey = "";
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    for (let i = 0; i < retries; i++) {
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        return await response.json();
      } catch (err) {
        if (i === retries - 1) throw err;
        await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
      }
    }
  }

  async askAiTutor() {
    const q = this.currentActiveQuestion;
    if (!q) return;
    const feedbackArea = document.getElementById('feedback-area');
    const loadingEl = document.getElementById('ai-loading-indicator');
    const loadingText = document.getElementById('ai-loading-text');

    if (!feedbackArea || !loadingEl) return;

    loadingText.innerText = "Konsultacja z profesorem katedry (Gemini 2.5 Flash)...";
    loadingEl.style.display = 'flex';
    audio.playStep();

    const systemPrompt = `Działasz jako profesor psychologii w Akademii Diagnosty EBA (autor podręczników psychodiagnostyki akademickiej).
Wytłumacz studentowi w zwięzły, przystępny, ale rygorystyczny naukowo sposób zagadnienie: "${q.topic}" w kontekście pytania: "${q.question}".
Odwołaj się do koncepcji EBA, metodologii i standardów APA/PTP. Nie podawaj od razu gotowej formułki do skopiowania na egzamin, lecz rozjaśnij mechanizm i podaj intuicyjny przykład kliniczny/metodologiczny (maksymalnie 2-3 zwięzłe akapity).`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Drogi Profesorze, proszę o wyjaśnienie sedna tego zagadnienia: ${q.question}` }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };
      const result = await this.callGemini(payload);
      const text = result?.candidates?.[0]?.content?.parts?.[0]?.text || "Nie udało się uzyskać odpowiedzi od profesora.";

      loadingEl.style.display = 'none';
      feedbackArea.style.display = 'block';
      feedbackArea.className = 'feedback-panel';
      feedbackArea.style.background = 'rgba(88, 28, 135, 0.25)';
      feedbackArea.style.border = '1px solid #c084fc';
      feedbackArea.style.color = '#f5d0fe';
      feedbackArea.innerHTML = `
        <div class="font-bold text-xs mb-1 flex items-center gap-1">
          <span class="ai-badge">🎓 Konsultacja Profesorska</span>
          <span>Wyjaśnienie mentora:</span>
        </div>
        <div class="text-xs leading-relaxed space-y-1">${text.replace(/\n\n/g, '<br><br>')}</div>
      `;
    } catch (err) {
      loadingEl.style.display = 'none';
      feedbackArea.style.display = 'block';
      feedbackArea.className = 'feedback-panel feedback-wrong';

  revealHint() {
    if (!this.currentActiveQuestion) return;
    const hintEl = document.getElementById('hint-text');
    hintEl.innerText = `Wskazówka: ${this.currentActiveQuestion.hint}`;
    this.stats.xp = Math.max(0, this.stats.xp - 5);
    this.updateHUD();
    document.getElementById('btn-hint').disabled = true;
    audio.playStep();
  }

  async submitAnswer() {
    const input = document.getElementById('answer-input');
    const feedbackArea = document.getElementById('feedback-area');
    const submitBtn = document.getElementById('btn-submit-answer');
    const loadingEl = document.getElementById('ai-loading-indicator');
    const toggleAi = document.getElementById('toggle-gemini-eval');

    if (!input || !this.currentActiveQuestion) return;

    const userText = input.value.trim();
    if (userText.length < 2) {
      this.showToast("Wpisz treść merytoryczną!");
      return;
    }

    const q = this.currentActiveQuestion;
    const useGemini = toggleAi && toggleAi.checked;

    const localEval = verifyAnswer(userText, q.expectedGroups);

    if (!useGemini) {
      this.renderAnswerFeedback(localEval.isCorrect, q, null);
      return;
    }

    if (loadingEl) {
      document.getElementById('ai-loading-text').innerText = "Superwizor EBA (Gemini) weryfikuje rygor metodologiczny i niuanse Twojej odpowiedzi...";
      loadingEl.style.display = 'flex';
    }
    submitBtn.disabled = true;

    const systemPrompt = `Działasz jako Superwizor EBA i egzaminator z Diagnozy Psychologicznej na uniwersytecie (w oparciu o dzieła prof. K. Stemplewskiej-Żakowicz, prof. W.J. Paluchowskiego i prof. T. Szustrowej).
Oceń merytorycznie odpowiedź studenta na poniższe pytanie egzaminacyjne.
Pytanie: "${q.question}"
Temat: "${q.topic}"
Wzorcowa odpowiedź kanoniczna: "${q.canonicalAnswer}"
Komentarz merytoryczny: "${q.explanation}"

Bądź sprawiedliwym, ale rygorystycznym recenzentem EBA. Uznaj odpowiedź za poprawną (isCorrect: true), jeśli student oddał kluczowe relacje pojęciowe i sens akademicki (nawet własnymi słowami).
Zwróć odpowiedź WYŁĄCZNIE jako obiekt JSON o polach:
- isCorrect (boolean): czy zaliczono
- scorePercentage (liczba 0-100): ocena precyzji merytorycznej
- studentStrengths (string krótki, 1 zdanie): co student dobrze uchwycił
- missingNuances (string krótki, 1-2 zdania): jakie niuanse lub pojęcia z podręcznika pominął lub przekręcił
- professorNote (string, 1-2 zdania): osobisty, mentorski komentarz w tonie profesora psychologii.`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Odpowiedź studenta: "${userText}"` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              "isCorrect": { "type": "BOOLEAN" },
              "scorePercentage": { "type": "NUMBER" },
              "studentStrengths": { "type": "STRING" },
              "missingNuances": { "type": "STRING" },
              "professorNote": { "type": "STRING" }
            },
            required: ["isCorrect", "scorePercentage", "studentStrengths", "missingNuances", "professorNote"]
          }
        },
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const result = await this.callGemini(payload);
      submitBtn.disabled = false;
      if (loadingEl) loadingEl.style.display = 'none';

      const partText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (partText) {
        const evalData = JSON.parse(partText);
        this.renderAnswerFeedback(evalData.isCorrect, q, evalData);
      } else {
        this.renderAnswerFeedback(localEval.isCorrect, q, null);
      }
    } catch (err) {
      console.warn("AI Superwizor niedostępny, użyto parsera regułowego:", err);
      submitBtn.disabled = false;
      if (loadingEl) loadingEl.style.display = 'none';
      this.renderAnswerFeedback(localEval.isCorrect, q, null);
    }
  }

  renderAnswerFeedback(isCorrect, q, aiEval) {
    const feedbackArea = document.getElementById('feedback-area');
    const submitBtn = document.getElementById('btn-submit-answer');
    if (!feedbackArea || !submitBtn) return;

    feedbackArea.style.display = 'block';

    if (isCorrect) {
      audio.playSuccess();
      this.stats.streak++;
      this.stats.multiplier = this.stats.streak >= 3 ? 2.0 : (this.stats.streak >= 2 ? 1.5 : 1.0);
      const firstTime = !this.stats.answeredQuestions[q.id];
      this.stats.answeredQuestions[q.id] = true;
      if (firstTime) this.progressFor(q.locId).correct++;

      const bonusPoints = aiEval && aiEval.scorePercentage > 85 ? Math.round(q.points * 1.2) : q.points;
      this.addXP(bonusPoints, q.locId);
      if (this.currentBlock) { this.currentBlock.correct++; this.currentBlock.xp += bonusPoints; }

      feedbackArea.className = 'feedback-panel feedback-correct';
      feedbackArea.innerHTML = `
        <div class="font-bold text-xs mb-1 flex items-center justify-between">
          <span>✓ Odpowiedź Prawidłowa! (+${bonusPoints} XP, Seria: x${this.stats.multiplier.toFixed(1)})</span>
          ${aiEval ? `<span class="ai-badge">Ocena precyzji: ${aiEval.scorePercentage}%</span>` : ''}
        </div>
        ${aiEval ? `
          <div class="my-1 text-xs bg-emerald-950/40 p-2 rounded border border-emerald-500/30">
            <p class="text-emerald-300"><strong>Docenione atuty:</strong> ${aiEval.studentStrengths}</p>
            ${aiEval.missingNuances ? `<p class="text-emerald-200 mt-1"><strong>Dopełnienie metodologiczne:</strong> ${aiEval.missingNuances}</p>` : ''}
            <p class="text-gray-300 italic mt-1 font-serif">„${aiEval.professorNote}"</p>
          </div>
        ` : ''}
        <p class="mb-1"><strong>Wzorcowa definicja akademicka:</strong> ${q.canonicalAnswer}</p>
        <div class="text-gray-300"><strong>Komentarz naukowy:</strong> ${q.explanation}</div>
      `;

      const b1 = this.currentBlock;
      const last1 = !b1 || b1.index >= b1.questions.length - 1;
      submitBtn.innerText = last1 ? "Zakończ blok" : "Następne pytanie →";
      submitBtn.onclick = () => this.advanceBlock();
    } else {
      audio.playError();
      this.reduceStamina(15);

      feedbackArea.className = 'feedback-panel feedback-wrong';
      feedbackArea.innerHTML = `
        <div class="font-bold text-xs mb-1 flex items-center justify-between">
          <span>✕ Niewystarczająca precyzja akademicka (-15% Staminy)</span>
          ${aiEval ? `<span class="bg-rose-950 border border-rose-500/40 text-rose-300 text-xs px-2 py-0.5 rounded">Trafność: ${aiEval.scorePercentage}%</span>` : ''}
        </div>
        ${aiEval ? `
          <div class="my-1 text-xs bg-rose-950/40 p-2 rounded border border-rose-500/30">
            ${aiEval.studentStrengths ? `<p class="text-gray-300"><strong>Co było na właściwym tropie:</strong> ${aiEval.studentStrengths}</p>` : ''}
            <p class="text-rose-200 mt-1"><strong>Braki i błędy:</strong> ${aiEval.missingNuances}</p>
            <p class="text-gray-300 italic mt-1 font-serif">„${aiEval.professorNote}"</p>
          </div>
        ` : ''}
        <p class="mb-1"><strong>Prawidłowe ujęcie z podręcznika:</strong> ${q.canonicalAnswer}</p>
        <div class="text-gray-300"><strong>Wyjaśnienie:</strong> ${q.explanation}</div>
        <p class="mt-1 text-xs italic text-gray-400">Pytanie powróci w ramach spaced repetition. Odwiedź Bufet, jeśli brakuje Ci staminy!</p>
      `;

      const b2 = this.currentBlock;
      const last2 = !b2 || b2.index >= b2.questions.length - 1;
      submitBtn.innerText = last2 ? "Zakończ blok" : "Następne pytanie →";
      submitBtn.onclick = () => this.advanceBlock();
    }
  }

  async sendSimulationMessage() {
    const input = document.getElementById('sim-user-input');
    const chatLog = document.getElementById('sim-chat-log');
    const sendBtn = document.getElementById('sim-send-btn');
    if (!input || !chatLog || !this.activeSimPatient) return;

    const userMsg = input.value.trim();
    if (!userMsg) return;

    input.value = '';
    audio.playStep();

    const userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble-diagnostician';
    userBubble.innerHTML = `<strong>Ty (Diagnosta):</strong> ${userMsg}`;
    chatLog.appendChild(userBubble);
    chatLog.scrollTop = chatLog.scrollHeight;

    this.activeSimPatient.history.push({ role: 'user', content: userMsg });
    document.getElementById('sim-turn-counter').innerText = Math.floor(this.activeSimPatient.history.length / 2) + 1;

    sendBtn.disabled = true;
    const typingBubble = document.createElement('div');
    typingBubble.className = 'chat-bubble-system flex items-center gap-1.5';
    typingBubble.id = 'sim-typing-bubble';
    typingBubble.innerHTML = `<span class="ai-pulse-dot"></span> <em>Pacjent Adam zastanawia się nad odpowiedź...</em>`;
    chatLog.appendChild(typingBubble);
    chatLog.scrollTop = chatLog.scrollHeight;

    const conversationContext = this.activeSimPatient.history
      .map(h => `${h.role === 'user' ? 'Diagnosta' : 'Pacjent Adam'}: ${h.content}`)
      .join("\n");

    const systemPrompt = `Jesteś aktorem symulującym pacjenta Adama (24 lata, student ekonomii z ramki 2.4 podręcznika prof. Stemplewskiej-Żakowicz).
Profil psychologiczny Adama:
- Głęboki wstyd wokół incydentu samookaleczenia (rozciął tętnicę nadgarstka, 18 szwów).
- Socjalizacja do roli 'twardego mężczyzny': 'facet nie okazuje słabości', 'tylko maminsynek płacze'. Uważa, że sam powinien rozwiązywać problemy.
- Nadużywa alkoholu (ok. pół litra wódki dziennie po zajęciach, aby 'odpłynąć').
- Ciężka depresja objawiająca się anhedonią, zaburzeniami snu, brakiem koncentracji, rezygnacją z pasji i zerwaniem przez narzeczoną.
- Reakcja na styl diagnosty:
  * Jeśli diagnosta jest oceniający, mentorski, atakuje pytaniami zamkniętymi lub żargonem: Adam staje się chłodny, zamyka się w sobie i bagatelizuje problem.
  * Jeśli diagnosta stosuje aktywne słuchanie, parafrazy, empatię, normalizuje wstyd (technika przyczółka): Adam powoli otwiera się, zdradza głęboki ból i bezsilność.

Odpowiedz naturalnie, w pierwszej osobie ("Adam: ..."), dodając w nawiasach kwadratowych subtelne reakcje niewerbalne (np. [spuszcza wzrok], [pociąga za rękaw opatrunku], [milknie na 3 sekundy]). Twoja odpowiedź powinna mieć 2-4 zdania.`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Dotychczasowy dialog:\n${conversationContext}\n\nOdpowiedz jako Adam na ostatnie słowa diagnosty.` }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const result = await this.callGemini(payload);
      const reply = result?.candidates?.[0]?.content?.parts?.[0]?.text || "[wzdycha ciężko] Nie wiem... Może po prostu jestem beznadziejny.";

      const typingEl = document.getElementById('sim-typing-bubble');
      if (typingEl) typingEl.remove();
      sendBtn.disabled = false;

      const patientBubble = document.createElement('div');
      patientBubble.className = 'chat-bubble-patient';
      patientBubble.innerHTML = `<strong>Adam:</strong> ${reply.replace(/^Adam:\s*/i, '')}`;
      chatLog.appendChild(patientBubble);
      chatLog.scrollTop = chatLog.scrollHeight;

      this.activeSimPatient.history.push({ role: 'assistant', content: reply });
    } catch (err) {
      const typingEl = document.getElementById('sim-typing-bubble');
      if (typingEl) typingEl.remove();
      sendBtn.disabled = false;

      const fallbackBubble = document.createElement('div');
      fallbackBubble.className = 'chat-bubble-patient';
      fallbackBubble.innerHTML = `<strong>Adam:</strong> [patrzy w podłogę] Nie wiem, co mam powiedzieć... Po prostu czuję, że wszystko wymyka mi się z rąk.`;
      chatLog.appendChild(fallbackBubble);
    }
  }

            </div>

          <div id="conc-ai-loading" style="display: none;" class="p-3 bg-slate-900 border border-purple-500/50 rounded text-xs text-purple-300 flex items-center gap-2 my-2">
            <div class="ai-pulse-dot"></div>

          <button class="btn" onclick="game.closeModal()">Zamknij</button>
