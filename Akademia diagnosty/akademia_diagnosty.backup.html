<!DOCTYPE html>
<html lang="pl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akademia Diagnosty: Wyprawa po Złoty Stetoskop EBA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #111827;
      --panel-border: #374151;
      --gold: #facc15;
      --gold-dim: #b45309;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-red: #f87171;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-pixel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 4px;
    }

    #game-container {
      position: relative;
      width: 1000px;
      max-width: 100%;
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.9), 0 0 24px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-bottom: 2px solid var(--panel-border);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bar-container {
      width: 72px;
      height: 10px;
      background: #030712;
      border: 1px solid #4b5563;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .stamina-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #22c55e);
      width: 100%;
      transition: width 0.25s ease;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      width: 0%;
      transition: width 0.25s ease;
    }

    .multiplier-tag {
      background: var(--gold);
      color: #000;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    #canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 65vh;
      background: #020617;
      cursor: crosshair;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
      max-width: 90%;
    }

    #interact-prompt {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 6, 23, 0.94);
      border: 2px solid var(--accent-blue);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      display: none;
      animation: pulseGlow 1.2s infinite;
      z-index: 40;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.95; border-color: var(--accent-blue); }
      50% { transform: translateX(-50%) scale(1.04); opacity: 1; border-color: var(--gold); }
    }

    #bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-top: 2px solid var(--panel-border);
      padding: 6px 10px;
      font-size: 10px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .key-hint {
      display: inline-block;
      background: #1f2937;
      color: #e5e7eb;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid #4b5563;
      font-weight: bold;
      margin: 0 1px;
    }

    #mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d16;
      border-top: 1px solid #1f2937;
      padding: 6px 12px;
      gap: 8px;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 32px);
      gap: 3px;
    }

    .touch-btn {
      background: #1f2937;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      touch-action: none;
    }

    .touch-btn:active {

      color: #000;
    }

    .action-btn {
      background: #1d4ed8;

      color: #fff;

      padding: 8px 18px;
      border-radius: 8px;

<script>
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playStep() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120 + Math.random() * 20, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch(e) {}
  }
  playSuccess() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.09, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.28);
      });
    } catch(e) {}
  }
  playError() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.linearRampToValueAtTime(70, now + 0.22);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch(e) {}
  }
  playLevelUp() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [440, 554.37, 659.25, 880, 1108.73].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.07, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.3);
      });
    } catch(e) {}
  }
  playCoffee() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.18);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  }
}
const audio = new SoundEngine();

function normalizeText(str) {
  if (!str) return "";
  const polishMap = {
    'ą':'a', 'ć':'c', 'ę':'e', 'ł':'l', 'ń':'n', 'ó':'o', 'ś':'s', 'ź':'z', 'ż':'z',
    'Ą':'a', 'Ć':'c', 'Ę':'e', 'Ł':'l', 'Ń':'n', 'Ó':'o', 'Ś':'s', 'Ź':'z', 'Ż':'z'
  };
  const clean = str.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, m => polishMap[m] || m);
  return clean.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function levenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const m = [];
  for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        m[i][j] = m[i - 1][j - 1];
      } else {
        m[i][j] = Math.min(
          m[i - 1][j - 1] + 1,
          m[i][j - 1] + 1,
          m[i - 1][j] + 1
        );
      }
    }
  }
  return m[b.length][a.length];
}

function matchesKeyword(token, targetKeyword) {
  if (token === targetKeyword) return true;
  if (token.length >= 3 && targetKeyword.length >= 3) {
    if (token.includes(targetKeyword) || targetKeyword.includes(token)) return true;
    const maxDist = targetKeyword.length > 5 ? 2 : 1;
    if (levenshteinDistance(token, targetKeyword) <= maxDist) return true;
  }
  return false;
}

function verifyAnswer(userInput, expectedGroups) {
  const normalizedInput = normalizeText(userInput);
  const words = normalizedInput.split(" ").filter(w => w.length > 1);

  let satisfiedGroups = 0;
  for (const group of expectedGroups) {
    let groupMatched = false;
    for (const keyword of group) {
      const normKeyword = normalizeText(keyword);
      if (words.some(word => matchesKeyword(word, normKeyword))) {
        groupMatched = true;
        break;
      }
      if (normKeyword.includes(" ") && normalizedInput.includes(normKeyword)) {
        groupMatched = true;
        break;
      }
    }
    if (groupMatched) satisfiedGroups++;
  }

  const threshold = expectedGroups.length <= 2 ? expectedGroups.length : Math.ceil(expectedGroups.length * 0.65);
  return {
    isCorrect: satisfiedGroups >= threshold,
    matchedCount: satisfiedGroups,
    totalRequired: threshold
  };
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const appId = typeof __app_id !== 'undefined' ? __app_id : 'akademia-diagnosty';
let db = null;
let auth = null;
let currentUserId = null;
let unsubscribeLive = null;

async function initFirebaseStorage() {
  try {
    if (typeof __firebase_config !== 'undefined') {
      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      currentUserId = auth.currentUser?.uid || crypto.randomUUID();
      window.currentUserSyncId = currentUserId;
      window.cloudStorageReady = true;

      const privateDocRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
      unsubscribeLive = onSnapshot(privateDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (window.game && data && !window.game.isSyncing) {
            window.game.applySavedData(data);
          }
        }
      }, (error) => {
        console.warn("Live snapshot notice:", error);
      });

      await loadFromCloud();
    } else {
      window.currentUserSyncId = 'sesja-lokalna-' + Math.random().toString(36).substring(2, 9);
    }
  } catch(err) {
    console.warn("Inicjalizacja zapisu chmurowego powiodła się w trybie autonomicznym:", err);
    window.currentUserSyncId = 'sesja-lokalna-' + Math.random().toString(36).substring(2, 9);
  }
}

window.saveToCloud = async function(gameData, isManual = false) {
  if (!db || !auth || !auth.currentUser) {
    if (isManual && window.game) {
      window.game.showToast("Postęp zachowany w bieżącej sesji.");
    }
    return;
  }
  try {
    const payload = {
      stats: gameData.stats,
      charClass: gameData.charClass,
      lastUpdated: new Date().toISOString(),
      ownerId: currentUserId
    };

    const privateRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
    const publicSyncRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', currentUserId);

    await Promise.all([
      setDoc(privateRef, payload, { merge: true }),
      setDoc(publicSyncRef, payload, { merge: true })
    ]);

    if (isManual && window.game) {
      window.game.showToast("☁️ Postęp bezpiecznie zapisany w chmurze!");
    }
  } catch(e) {
    console.error("Błąd zapisu:", e);
    if (isManual && window.game) {
      window.game.showToast("Zapisano stan w pamięci.");
    }
  }
};

window.loadFromCloud = async function() {
  if (!db || !auth || !auth.currentUser) return;
  try {
    const privateRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
    const snap = await getDoc(privateRef);
    if (snap.exists() && window.game) {
      const data = snap.data();
      window.game.applySavedData(data);
      window.game.showToast("☁️ Przywrócono Twój postęp z chmury!");
    }
  } catch(e) {
    console.warn("Błąd ładowania:", e);
  }
};

window.syncFromDeviceKey = async function(targetKey) {
  if (!targetKey || typeof targetKey !== 'string') {
    return { success: false, message: "Nieprawidłowy klucz gracza." };
  }
  const cleanKey = targetKey.trim();
  if (!db || !auth || !auth.currentUser) {
    return { success: false, message: "Brak aktywnego połączenia sieciowego." };
  }

  try {
    const syncDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', cleanKey);
    const snap = await getDoc(syncDocRef);
    if (!snap.exists()) {
      return { success: false, message: "Nie znaleziono zapisu dla podanego identyfikatora gracza." };
    }

    const remoteData = snap.data();
    if (window.game && remoteData) {
      window.game.isSyncing = true;
      window.game.applySavedData(remoteData);
      await window.saveToCloud({ stats: window.game.stats, charClass: window.game.player.charClass }, false);
      window.game.isSyncing = false;
      return { success: true, message: `Pomyślnie zsynchronizowano postęp! Poziom: ${remoteData.stats?.level || 1} (${remoteData.stats?.xp || 0} XP)` };
    }
    return { success: false, message: "Błąd formatu danych profilu." };
  } catch(err) {
    console.error("Błąd synchronizacji:", err);
    return { success: false, message: "Wystąpił błąd podczas pobierania zapisu: " + err.message };
  }
};

window.addEventListener('load', () => {
  initFirebaseStorage();
});
</script>

<script>
class GameEngine {

      { id: "wywiad", name: "Gabinet Wywiadu i Obserwacji", x: 20, y: 2, w: 6, h: 4, color: "#78350f", roofColor: "#d97706", npcName: "Mgr Dialogowska", npcRole: "Klinicystka", npcX: 23, npcY: 6, banner: "WYWIAD", icon: "💬" },

      { id: "testy", name: "Poligon Psychometryczny", x: 2, y: 17, w: 6, h: 4, color: "#065f46", roofColor: "#10b981", npcName: "Doc. Psychometrzyk", npcRole: "Psychometra", npcX: 5, npcY: 16, banner: "TESTY", icon: "🎯" },
      { id: "dziecko", name: "Pracownia Diagnozy Dziecka", x: 10, y: 17, w: 6, h: 4, color: "#0e7490", roofColor: "#06b6d4", npcName: "Dr Maluszkiewicz", npcRole: "Diagnosta Rozwoju", npcX: 13, npcY: 16, banner: "DZIECKO", icon: "🧸" },
      { id: "bufet", name: "Bufet 'Złoty Stetoskop'", x: 19, y: 17, w: 5, h: 4, color: "#334155", roofColor: "#64748b", npcName: "Barista Zenon", npcRole: "Regeneracja", npcX: 21, npcY: 16, banner: "BUFET", icon: "☕" },
      { id: "neuro", name: "Pawilon Neuropsychologii", x: 28, y: 17, w: 6, h: 4, color: "#155e75", roofColor: "#38bdf8", npcName: "Prof. Synapsa", npcRole: "Neuropsycholog", npcX: 31, npcY: 16, banner: "NEURO", icon: "🧠" },

      { id: "etyka", name: "Komisja Etyki i Praw Pacjenta", x: 2, y: 10, w: 5, h: 4, color: "#831843", roofColor: "#ec4899", npcName: "Przewodniczący Etyk", npcRole: "Rzecznik Praw", npcX: 4, npcY: 9, banner: "ETYKA", icon: "⚖️" },
      { id: "archiwum", name: "Archiwum Szarlatanerii", x: 29, y: 10, w: 5, h: 4, color: "#450a0a", roofColor: "#ef4444", npcName: "Kustosz Sceptyk", npcRole: "Łowca Pseudonauki", npcX: 31, npcY: 9, banner: "SZARLATANI", icon: "⚔️" }

    this.keys = {};
    this.activeInteraction = null;

    this.updateHUD();

    setTimeout(() => {
      if (!this.player.charClass) {
        this.showClassSelectModal();
      }
    }, 250);
  }

  initMapCollision() {
    this.collisionGrid = Array.from({ length: this.rows }, () => Array(this.cols).fill(0));

    // Outer campus boundary walls
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (r === 0 || r === this.rows - 1 || c === 0 || c === this.cols - 1) {
          this.collisionGrid[r][c] = 1;
        }
      }
    }

    // Mark campus buildings as solid obstacles, leaving doorways open
    this.locations.forEach(loc => {
      const doorCol = loc.x + Math.floor(loc.w / 2);
      const doorRow = loc.y + loc.h;
      for (let r = loc.y; r < loc.y + loc.h; r++) {
        for (let c = loc.x; c < loc.x + loc.w; c++) {
          if (r < this.rows && c < this.cols) {
            if (c === doorCol && r === doorRow - 1) continue;
            this.collisionGrid[r][c] = 1;
          }
        }
      }
      if (loc.npcY < this.rows && loc.npcX < this.cols) {
        this.collisionGrid[loc.npcY][loc.npcX] = 2;
      }
    });

    // Central Fountain Obstacle
    this.collisionGrid[11][17] = 1;
    this.collisionGrid[11][18] = 1;
    this.collisionGrid[12][17] = 1;
    this.collisionGrid[12][18] = 1;
  }

  bindEvents() {
    window.addEventListener('keydown', (e) => {
      audio.init();
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && !this.isModalOpen) {
        e.preventDefault();
      }
      if ((e.code === 'Space' || e.code === 'Enter') && this.activeInteraction && !this.isModalOpen) {
        this.triggerInteraction(this.activeInteraction);
      }
    });

    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
    });

    this.canvas.addEventListener('click', (e) => {
      audio.init();
      if (this.isModalOpen) return;
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;
      
      const cameraX = Math.max(0, Math.min(this.cols * 32 - this.canvas.width, this.player.x + 16 - this.canvas.width / 2));
      const cameraY = Math.max(0, Math.min(this.rows * 32 - this.canvas.height, this.player.y + 16 - this.canvas.height / 2));

      this.player.targetX = clickX + cameraX - 16;
      this.player.targetY = clickY + cameraY - 20;
    });

    const setupTouch = (id, keyCode) => {
      const el = document.getElementById(id);
      if (!el) return;
      const onDown = (ev) => {
        ev.preventDefault();
        audio.init();
        this.keys[keyCode] = true;
      };
      const onUp = (ev) => {
        ev.preventDefault();
        this.keys[keyCode] = false;
      };
      el.addEventListener('touchstart', onDown, { passive: false });
      el.addEventListener('touchend', onUp, { passive: false });
      el.addEventListener('mousedown', onDown);
      el.addEventListener('mouseup', onUp);
    };

    setupTouch('touch-up', 'KeyW');
    setupTouch('touch-down', 'KeyS');
    setupTouch('touch-left', 'KeyA');
    setupTouch('touch-right', 'KeyD');

    const touchAct = document.getElementById('touch-action');
    if (touchAct) {
      touchAct.addEventListener('click', () => {
        audio.init();
        if (this.activeInteraction && !this.isModalOpen) {
          this.triggerInteraction(this.activeInteraction);
        }
      });
    }

    document.getElementById('btn-badges-menu').addEventListener('click', () => {
      this.showBadgesModal();
    });

    document.getElementById('btn-sync-cloud').addEventListener('click', () => {
      this.showCloudSyncModal();
    });

    const aiSimBtn = document.getElementById('btn-ai-simulation');
    if (aiSimBtn) {
      aiSimBtn.addEventListener('click', () => {
        audio.init();
        this.showClinicalSimulationModal();
      });
    }
  }

  showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.opacity = '1';
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      t.style.opacity = '0';
    }, 2800);
  }

  updateHUD() {
    document.getElementById('player-class').innerText = this.player.charClass ? this.player.charClass.name : "Nie wybrano";
    document.getElementById('player-title').innerText = this.stats.rankTitle;
    document.getElementById('stamina-val').innerText = `${Math.round(this.stats.stamina)}%`;
    document.getElementById('stamina-bar').style.width = `${Math.max(0, this.stats.stamina)}%`;

    const curLvlXp = this.stats.xp % 100;
    document.getElementById('xp-bar').style.width = `${(curLvlXp / 100) * 100}%`;
    document.getElementById('xp-val').innerText = `${this.stats.xp} XP (Lvl ${this.stats.level})`;
    document.getElementById('streak-tag').innerText = `x${this.stats.multiplier.toFixed(1)}`;

    const answeredCount = Object.values(this.stats.answeredQuestions).filter(Boolean).length;
    document.getElementById('total-answered-counter').innerText = `${answeredCount}/${QUESTIONS_DB.length}`;

    const unlockedBadgeCount = Object.values(this.stats.badges).filter(Boolean).length;
    document.getElementById('unlocked-badge-count').innerText = `${unlockedBadgeCount}/${BADGES_LIST.length}`;
  }

  applySavedData(data) {
    if (data.stats) this.stats = Object.assign(this.stats, data.stats);
    if (data.charClass) this.player.charClass = data.charClass;
    this.updateHUD();
  }

  addXP(amount, locId) {
    let finalAmount = amount * this.stats.multiplier;
    if (this.player.charClass) {
      if (this.player.charClass.id === 'adept' && ['eba', 'testy', 'modele', 'neuro'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Adepta EBA: +35% XP za rygor metodologiczny!");
      } else if (this.player.charClass.id === 'klinicysta' && ['wywiad', 'rodzina', 'dziecko'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Klinicysty: +35% XP za kunszt wywiadu i relacji!");
      } else if (this.player.charClass.id === 'etyk' && ['etyka', 'archiwum'].includes(locId)) {
        finalAmount *= 1.35;
        this.showToast("Bonus Rzecznika Etyki: +35% XP za ochronę praw pacjenta!");
      }
    }
    this.stats.xp += Math.round(finalAmount);

    const prevLevel = this.stats.level;
    this.stats.level = Math.floor(this.stats.xp / 100) + 1;

    if (this.stats.level >= 8) this.stats.rankTitle = "Wielki Mistrz Złotego Stetoskpu EBA";
    else if (this.stats.level >= 5) this.stats.rankTitle = "Ekspert EBA & Superwizor";
    else if (this.stats.level >= 3) this.stats.rankTitle = "Licencjonowany Psycholog";
    else if (this.stats.level >= 2) this.stats.rankTitle = "Młodszy Diagnosta";

    if (this.stats.level > prevLevel) {
      audio.playLevelUp();
      this.showToast(`AWANS NAUKOWY! Poziom ${this.stats.level}: ${this.stats.rankTitle}!`);
    }

    this.checkBadgesUnlock();
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  reduceStamina(amount) {
    let penalty = amount;
    if (this.player.charClass && this.player.charClass.id === 'etyk') {
      penalty *= 0.5;
      this.showToast("Tarcza Etyczna: -50% utraty staminy!");
    }
    this.stats.stamina = Math.max(0, this.stats.stamina - penalty);
    this.stats.streak = 0;
    this.stats.multiplier = 1.0;
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

  restoreStamina(amount) {
    this.stats.stamina = Math.min(100, this.stats.stamina + amount);
    this.updateHUD();

    if (window.saveToCloud) {
      window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
    }
  }

    if (!this.stats.badges[badgeId]) {
      this.stats.badges[badgeId] = true;

      audio.playLevelUp();
      this.showToast(`ODBLOKOWANO ODZNAKĘ: ${b.icon} ${b.name}!`);
      this.updateHUD();

      if (window.saveToCloud) {
        window.saveToCloud({ stats: this.stats, charClass: this.player.charClass });
      }
    }
  }

  checkBadgesUnlock() {
    if (this.stats.answeredQuestions["arch_1"]) this.unlockBadge("pogromca");
    if (this.stats.answeredQuestions["mod_1"]) this.unlockBadge("piec_krokow");
    if (this.stats.answeredQuestions["ety_1"] && this.stats.answeredQuestions["ety_2"]) this.unlockBadge("straznik_etyki");
    if (this.stats.answeredQuestions["eba_1"] && this.stats.answeredQuestions["eba_2"]) this.unlockBadge("metodolog");
    if (this.stats.answeredQuestions["wyw_1"] && this.stats.answeredQuestions["wyw_3"]) this.unlockBadge("klinicysta");
    if (this.stats.answeredQuestions["psy_1"] && this.stats.answeredQuestions["dziec_2"]) this.unlockBadge("psychometra");
  }

  showClassSelectModal() {
    this.isModalOpen = true;
    const container = document.getElementById('modal-container');
    container.style.display = 'flex';
    container.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <h2>🎓 Wybierz Swoją Ścieżkę Naukową</h2>

            </div>
            <div class="class-card" onclick="game.selectClass('klinicysta')">
              <h3 class="text-amber-400 font-bold">💬 Klinicysta Narracyjny</h3>
              <p class="text-gray-400 text-xs">Relacja diagnostyczna, wywiad pogłębiony, przymierze terapeutyczne i radzenie sobie z oporem.</p>
              <div class="text-emerald-400 font-semibold text-xs mt-1">+35% XP w Gabinecie Wywiadu, Klinice Rodziny i Pracowni Dziecka.</div>
            </div>
            <div class="class-card" onclick="game.selectClass('etyk')">
              <h3 class="text-pink-400 font-bold">⚖️ Rzecznik Etyki</h3>
              <p class="text-gray-400 text-xs">Prawa pacjenta, świadoma zgoda, relacje podwójne i demistyfikacja pseudonauki.</p>
              <div class="text-emerald-400 font-semibold text-xs mt-1">-50% utraty Staminy przy błędach + 35% XP w Komisji Etyki i Archiwum.</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  selectClass(classId) {

  async callGemini(payload, retries = 3, delay = 1000) {
    const apiKey = "";
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    for (let i = 0; i < retries; i++) {
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        return await response.json();
      } catch (err) {
        if (i === retries - 1) throw err;
        await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
      }
    }
  }

  async submitAnswer() {
    const input = document.getElementById('answer-input');
    const feedbackArea = document.getElementById('feedback-area');
    const submitBtn = document.getElementById('btn-submit-answer');
    const loadingEl = document.getElementById('ai-loading-indicator');
    const toggleAi = document.getElementById('toggle-gemini-eval');

    if (!input || !this.currentActiveQuestion) return;

    const userText = input.value.trim();
    if (userText.length < 2) {
      this.showToast("Wpisz treść merytoryczną!");
      return;
    }

    const q = this.currentActiveQuestion;
    const useGemini = toggleAi && toggleAi.checked;

    const localEval = verifyAnswer(userText, q.expectedGroups);

    if (!useGemini) {
      this.renderAnswerFeedback(localEval.isCorrect, q, null);
      return;
    }

    if (loadingEl) {
      document.getElementById('ai-loading-text').innerText = "Superwizor EBA (Gemini) weryfikuje rygor metodologiczny i niuanse Twojej odpowiedzi...";
      loadingEl.style.display = 'flex';
    }
    submitBtn.disabled = true;

    const systemPrompt = `Działasz jako Superwizor EBA i egzaminator z Diagnozy Psychologicznej na uniwersytecie (w oparciu o dzieła prof. K. Stemplewskiej-Żakowicz, prof. W.J. Paluchowskiego i prof. T. Szustrowej).
Oceń merytorycznie odpowiedź studenta na poniższe pytanie egzaminacyjne.
Pytanie: "${q.question}"
Temat: "${q.topic}"
Wzorcowa odpowiedź kanoniczna: "${q.canonicalAnswer}"
Komentarz merytoryczny: "${q.explanation}"

Bądź sprawiedliwym, ale rygorystycznym recenzentem EBA. Uznaj odpowiedź za poprawną (isCorrect: true), jeśli student oddał kluczowe relacje pojęciowe i sens akademicki (nawet własnymi słowami).
Zwróć odpowiedź WYŁĄCZNIE jako obiekt JSON o polach:
- isCorrect (boolean): czy zaliczono
- scorePercentage (liczba 0-100): ocena precyzji merytorycznej
- studentStrengths (string krótki, 1 zdanie): co student dobrze uchwycił
- missingNuances (string krótki, 1-2 zdania): jakie niuanse lub pojęcia z podręcznika pominął lub przekręcił
- professorNote (string, 1-2 zdania): osobisty, mentorski komentarz w tonie profesora psychologii.`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Odpowiedź studenta: "${userText}"` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              "isCorrect": { "type": "BOOLEAN" },
              "scorePercentage": { "type": "NUMBER" },
              "studentStrengths": { "type": "STRING" },
              "missingNuances": { "type": "STRING" },
              "professorNote": { "type": "STRING" }
            },
            required: ["isCorrect", "scorePercentage", "studentStrengths", "missingNuances", "professorNote"]
          }
        },
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const result = await this.callGemini(payload);
      submitBtn.disabled = false;
      if (loadingEl) loadingEl.style.display = 'none';

      const partText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (partText) {
        const evalData = JSON.parse(partText);
        this.renderAnswerFeedback(evalData.isCorrect, q, evalData);
      } else {
        this.renderAnswerFeedback(localEval.isCorrect, q, null);
      }
    } catch (err) {
      console.warn("AI Superwizor niedostępny, użyto parsera regułowego:", err);
      submitBtn.disabled = false;
      if (loadingEl) loadingEl.style.display = 'none';
      this.renderAnswerFeedback(localEval.isCorrect, q, null);
    }
  }

  renderAnswerFeedback(isCorrect, q, aiEval) {
    const feedbackArea = document.getElementById('feedback-area');
    const submitBtn = document.getElementById('btn-submit-answer');
    if (!feedbackArea || !submitBtn) return;

    feedbackArea.style.display = 'block';

    if (isCorrect) {
      audio.playSuccess();
      this.stats.streak++;
      this.stats.multiplier = this.stats.streak >= 3 ? 2.0 : (this.stats.streak >= 2 ? 1.5 : 1.0);
      this.stats.answeredQuestions[q.id] = true;

      const bonusPoints = aiEval && aiEval.scorePercentage > 85 ? Math.round(q.points * 1.2) : q.points;
      this.addXP(bonusPoints, q.locId);

      feedbackArea.className = 'feedback-panel feedback-correct';
      feedbackArea.innerHTML = `
        <div class="font-bold text-xs mb-1 flex items-center justify-between">
          <span>✓ Odpowiedź Prawidłowa! (+${bonusPoints} XP, Seria: x${this.stats.multiplier.toFixed(1)})</span>
          ${aiEval ? `<span class="ai-badge">Ocena precyzji: ${aiEval.scorePercentage}%</span>` : ''}
        </div>
        ${aiEval ? `
          <div class="my-1 text-xs bg-emerald-950/40 p-2 rounded border border-emerald-500/30">
            <p class="text-emerald-300"><strong>Docenione atuty:</strong> ${aiEval.studentStrengths}</p>
            ${aiEval.missingNuances ? `<p class="text-emerald-200 mt-1"><strong>Dopełnienie metodologiczne:</strong> ${aiEval.missingNuances}</p>` : ''}
            <p class="text-gray-300 italic mt-1 font-serif">„${aiEval.professorNote}"</p>
          </div>
        ` : ''}
        <p class="mb-1"><strong>Wzorcowa definicja akademicka:</strong> ${q.canonicalAnswer}</p>
        <div class="text-gray-300"><strong>Komentarz naukowy:</strong> ${q.explanation}</div>
      `;

      submitBtn.innerText = "Świetnie! Kontynuuj";
      submitBtn.onclick = () => this.closeModal();
    } else {
      audio.playError();
      this.reduceStamina(15);

      feedbackArea.className = 'feedback-panel feedback-wrong';
      feedbackArea.innerHTML = `
        <div class="font-bold text-xs mb-1 flex items-center justify-between">
          <span>✕ Niewystarczająca precyzja akademicka (-15% Staminy)</span>
          ${aiEval ? `<span class="bg-rose-950 border border-rose-500/40 text-rose-300 text-xs px-2 py-0.5 rounded">Trafność: ${aiEval.scorePercentage}%</span>` : ''}
        </div>
        ${aiEval ? `
          <div class="my-1 text-xs bg-rose-950/40 p-2 rounded border border-rose-500/30">
            ${aiEval.studentStrengths ? `<p class="text-gray-300"><strong>Co było na właściwym tropie:</strong> ${aiEval.studentStrengths}</p>` : ''}
            <p class="text-rose-200 mt-1"><strong>Braki i błędy:</strong> ${aiEval.missingNuances}</p>
            <p class="text-gray-300 italic mt-1 font-serif">„${aiEval.professorNote}"</p>
          </div>
        ` : ''}
        <p class="mb-1"><strong>Prawidłowe ujęcie z podręcznika:</strong> ${q.canonicalAnswer}</p>
        <div class="text-gray-300"><strong>Wyjaśnienie:</strong> ${q.explanation}</div>
        <p class="mt-1 text-xs italic text-gray-400">Pytanie powróci w ramach spaced repetition. Odwiedź Bufet, jeśli brakuje Ci staminy!</p>

Profil psychologiczny Adama:

Odpowiedz naturalnie, w pierwszej osobie ("Adam: ..."), dodając w nawiasach kwadratowych subtelne reakcje niewerbalne (np. [spuszcza wzrok], [pociąga za rękaw opatrunku], [milknie na 3 sekundy]). Twoja odpowiedź powinna mieć 2-4 zdania.`;

    try {

  async evaluateConceptualizationWithGemini() {

    if (submitBtn) submitBtn.disabled = true;
    audio.playStep();

    const studentReport = `
1. Hipotezy: ${hInput}
2. Mechanizmy i kontekst: ${mInput}
3. Interwencje: ${iInput}
    `;

    const interviewHistory = this.activeSimPatient.history
      .map(h => `${h.role === 'user' ? 'Diagnosta' : 'Pacjent'}: ${h.content}`)
      .join("\n");

    const systemPrompt = `Działasz jako Przewodniczący Komisji Superwizyjnej EBA (ekspert od modeli procesu Maloneya i Warda, Paluchowskiego oraz GAP).
Oceń konceptualizację przypadku pacjenta Adama przygotowaną przez studenta na podstawie wywiadu klinicznego.
Oryginalny przypadek: Adam, 24 lata, samookaleczenie po alkoholu, ciężka depresja męska, anhedonia, wysokie ryzyko samobójcze, schematy męskości blokujące pomoc.

Zwróć odpowiedź w formacie JSON z polami:
- grade (string: "Doskonały", "Pozytywny", "Wymaga poprawy")
- awardedXp (liczba od 30 do 70)
- evaluationSummary (string: 2-3 zdania podsumowujące trafność diagnozy i planu leczenia)
- clinicalAdvice (string: 2 zdania na temat tego, co w praktyce szpitalnej/ambulatoryjnej byłoby kluczowe)`;

    try {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: `Zapis wywiadu zebranego przez studenta:\n${interviewHistory}\n\nKonceptualizacja studenta:\n${studentReport}` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              "grade": { "type": "STRING" },
              "awardedXp": { "type": "NUMBER" },
              "evaluationSummary": { "type": "STRING" },
              "clinicalAdvice": { "type": "STRING" }

  closeModal() {
    document.getElementById('modal-container').style.display = 'none';
    this.isModalOpen = false;
    this.currentActiveQuestion = null;
  }

  triggerInteraction(interaction) {
    if (interaction.type === 'location') {
      if (interaction.data.id === 'bufet') {
        this.showBufetModal();
      } else {
        this.showQuestionModal(interaction.data);
      }
    }
  }

  update() {
    if (this.isModalOpen) return;

    let dx = 0;
    let dy = 0;

    if (this.keys['ArrowUp'] || this.keys['KeyW']) { dy -= 1; this.player.dir = 'up'; }
    if (this.keys['ArrowDown'] || this.keys['KeyS']) { dy += 1; this.player.dir = 'down'; }
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) { dx -= 1; this.player.dir = 'left'; }
    if (this.keys['ArrowRight'] || this.keys['KeyD']) { dx += 1; this.player.dir = 'right'; }

    const distToTarget = Math.hypot(this.player.targetX - this.player.x, this.player.targetY - this.player.y);
    if (distToTarget > 6 && dx === 0 && dy === 0) {
      const angle = Math.atan2(this.player.targetY - this.player.y, this.player.targetX - this.player.x);
      dx = Math.cos(angle);
      dy = Math.sin(angle);
      if (Math.abs(dx) > Math.abs(dy)) {
        this.player.dir = dx > 0 ? 'right' : 'left';
      } else {
        this.player.dir = dy > 0 ? 'down' : 'up';
      }
    } else if (distToTarget <= 6) {
      this.player.targetX = this.player.x;
      this.player.targetY = this.player.y;
    }

    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }

    if (dx !== 0 || dy !== 0) {
      const nextX = this.player.x + dx * this.player.speed;
      const nextY = this.player.y + dy * this.player.speed;
      this.player.isMoving = true;
      this.player.animTimer += 0.2;

      if (!this.checkCollision(nextX, this.player.y)) {
        this.player.x = nextX;
      } else {
        this.player.targetX = this.player.x;
      }

      if (!this.checkCollision(this.player.x, nextY)) {
        this.player.y = nextY;
      } else {
        this.player.targetY = this.player.y;
      }

      if (Math.floor(this.player.animTimer) % 6 === 0) {
        audio.playStep();
      }
    } else {
      this.player.isMoving = false;
    }

    this.checkInteractions();
  }

  checkCollision(x, y) {
    const pBox = { x: x + 8, y: y + 20, w: 16, h: 10 };
    const minC = Math.floor(pBox.x / this.tileSize);
    const maxC = Math.floor((pBox.x + pBox.w) / this.tileSize);
    const minR = Math.floor(pBox.y / this.tileSize);
    const maxR = Math.floor((pBox.y + pBox.h) / this.tileSize);

    for (let r = minR; r <= maxR; r++) {
      for (let c = minC; c <= maxC; c++) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return true;
        if (this.collisionGrid[r][c] > 0) return true;
      }
    }
    return false;
  }

  checkInteractions() {
    const pCenter = { x: this.player.x + 16, y: this.player.y + 16 };
    let found = null;

    for (const loc of this.locations) {
      const npcPos = { x: loc.npcX * 32 + 16, y: loc.npcY * 32 + 16 };
      const dist = Math.hypot(pCenter.x - npcPos.x, pCenter.y - npcPos.y);
      if (dist < 46) {
        found = { type: 'location', data: loc };
        break;
      }
    }

    const promptEl = document.getElementById('interact-prompt');
    const locTextEl = document.getElementById('current-location-text');

    if (found) {
      this.activeInteraction = found;
      promptEl.style.display = 'block';
      promptEl.innerText = `[ROZMOWA] ${found.data.icon} ${found.data.npcName} (${found.data.npcRole})`;
      locTextEl.innerText = `${found.data.name}`;
    } else {
      this.activeInteraction = null;
      promptEl.style.display = 'none';
      locTextEl.innerText = "Plac Główny Kampusu EBA";
    }
  }

  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    const cameraX = Math.max(0, Math.min(this.cols * 32 - this.canvas.width, this.player.x + 16 - this.canvas.width / 2));
    const cameraY = Math.max(0, Math.min(this.rows * 32 - this.canvas.height, this.player.y + 16 - this.canvas.height / 2));

    this.ctx.save();
    this.ctx.translate(-cameraX, -cameraY);

    this.drawGround();
    this.drawFountain();
    this.locations.forEach(loc => this.drawBuilding(loc));
    this.locations.forEach(loc => this.drawDetailedNPC(loc));
    this.drawDetailedPlayer();

    this.ctx.restore();
  }

  drawGround() {
    this.ctx.fillStyle = "#121b18";
    this.ctx.fillRect(0, 0, this.cols * 32, this.rows * 32);

    this.ctx.fillStyle = "#1c2c26";
    for (let i = 0; i < 75; i++) {
      const gx = (i * 97) % (this.cols * 32);
      const gy = (i * 83) % (this.rows * 32);
      this.ctx.fillRect(gx, gy, 3, 2);
      this.ctx.fillRect(gx + 2, gy - 2, 2, 2);
    }

    this.ctx.fillStyle = "#253141";
    this.ctx.fillRect(0, 11 * 32, this.cols * 32, 2 * 32);

    this.ctx.fillRect(17 * 32, 0, 2 * 32, this.rows * 32);

    this.ctx.fillStyle = "#1f2937";
    this.ctx.fillRect(0, 5 * 32, this.cols * 32, 32);
    this.ctx.fillRect(0, 16 * 32, this.cols * 32, 32);

    this.locations.forEach(loc => {
      const doorX = (loc.x + loc.w / 2) * 32;
      const doorY = (loc.y + loc.h) * 32;
      this.ctx.fillStyle = "#334155";
      if (loc.y < 10) {
        this.ctx.fillRect(doorX - 16, doorY, 32, 11 * 32 - doorY);
      } else if (loc.y > 14) {
        this.ctx.fillRect(doorX - 16, 13 * 32, 32, loc.y * 32 - 13 * 32);
      }
    });

    this.ctx.strokeStyle = "#37475d";
    this.ctx.lineWidth = 1;
    for (let c = 0; c < this.cols; c++) {
      this.ctx.strokeRect(c * 32 + 1, 11 * 32 + 1, 30, 30);
      this.ctx.strokeRect(c * 32 + 1, 12 * 32 + 1, 30, 30);
    }
  }

  drawFountain() {
    const fx = 17 * 32;
    const fy = 11 * 32;

    this.ctx.fillStyle = "#1f2937";
    this.ctx.beginPath();
    this.ctx.arc(fx + 32, fy + 32, 32, 0, Math.PI * 2);
    this.ctx.fill();
    this.ctx.strokeStyle = "#94a3b8";
    this.ctx.lineWidth = 3;
    this.ctx.stroke();

    this.ctx.fillStyle = "#0284c7";
    this.ctx.beginPath();
    this.ctx.arc(fx + 32, fy + 32, 26, 0, Math.PI * 2);
    this.ctx.fill();

    const wave = (Date.now() / 250) % 12;
    this.ctx.strokeStyle = "rgba(224, 242, 254, 0.75)";
    this.ctx.lineWidth = 1.5;
    this.ctx.beginPath();
    this.ctx.arc(fx + 32, fy + 32, 4 + wave, 0, Math.PI * 2);
    this.ctx.stroke();

    this.ctx.fillStyle = "#facc15";
    this.ctx.fillRect(fx + 30, fy + 22, 4, 18);
    this.ctx.beginPath();
    this.ctx.arc(fx + 32, fy + 20, 6, 0, Math.PI * 2);
    this.ctx.fill();
  }

  drawBuilding(loc) {
    const bx = loc.x * this.tileSize;
    const by = loc.y * this.tileSize;
    const bw = loc.w * this.tileSize;
    const bh = loc.h * this.tileSize;

    this.ctx.fillStyle = "rgba(0,0,0,0.55)";
    this.ctx.fillRect(bx + 4, by + bh - 4, bw, 8);

    this.ctx.fillStyle = loc.color;
    this.ctx.fillRect(bx, by + 24, bw, bh - 24);

    this.ctx.fillStyle = "#0f172a";
    this.ctx.fillRect(bx + 4, by + 24, 8, bh - 24);
    this.ctx.fillRect(bx + bw - 12, by + 24, 8, bh - 24);

    this.ctx.fillStyle = loc.roofColor;
    this.ctx.beginPath();
    this.ctx.moveTo(bx - 4, by + 24);
    this.ctx.lineTo(bx + bw / 2, by - 6);
    this.ctx.lineTo(bx + bw + 4, by + 24);
    this.ctx.closePath();
    this.ctx.fill();
    this.ctx.strokeStyle = "#090d16";
    this.ctx.lineWidth = 2;
    this.ctx.stroke();

    const dw = 26;
    const dh = 30;
    const dx = bx + bw / 2 - dw / 2;
    const dy = by + bh - dh;
    this.ctx.fillStyle = "#1c1917";
    this.ctx.fillRect(dx, dy, dw, dh);
    this.ctx.strokeStyle = "#d97706";
    this.ctx.lineWidth = 1.8;
    this.ctx.strokeRect(dx, dy, dw, dh);

    this.ctx.fillStyle = "#38bdf8";
    this.ctx.fillRect(bx + 16, by + 34, 16, 20);
    this.ctx.fillRect(bx + bw - 32, by + 34, 16, 20);
    this.ctx.strokeStyle = "#0f172a";
    this.ctx.strokeRect(bx + 16, by + 34, 16, 20);
    this.ctx.strokeRect(bx + bw - 32, by + 34, 16, 20);

    this.ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
    this.ctx.fillRect(bx + 6, by + 6, bw - 12, 14);
    this.ctx.strokeStyle = "#facc15";
    this.ctx.lineWidth = 1;
    this.ctx.strokeRect(bx + 6, by + 6, bw - 12, 14);

    this.ctx.fillStyle = "#facc15";
    this.ctx.font = "bold 9px monospace";
    this.ctx.textAlign = "center";
    this.ctx.fillText(loc.banner, bx + bw / 2, by + 17);
  }

  drawDetailedNPC(loc) {
    const nx = loc.npcX * this.tileSize;
    const ny = loc.npcY * this.tileSize;

    this.ctx.fillStyle = "rgba(0,0,0,0.45)";
    this.ctx.beginPath();
    this.ctx.ellipse(nx + 16, ny + 30, 11, 4, 0, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = "#1f2937";
    this.ctx.fillRect(nx + 10, ny + 22, 4, 8);
    this.ctx.fillRect(nx + 18, ny + 22, 4, 8);

    this.ctx.fillStyle = loc.roofColor;
    this.ctx.fillRect(nx + 8, ny + 10, 16, 13);

    if (loc.id === 'bufet') {
      this.ctx.fillStyle = "#ffffff";
      this.ctx.fillRect(nx + 10, ny + 12, 12, 10);
      this.ctx.fillStyle = "#facc15";
      this.ctx.fillRect(nx + 21, ny + 14, 5, 5);
    } else if (loc.id === 'eba') {
      this.ctx.fillStyle = "#f8fafc";
      this.ctx.fillRect(nx + 13, ny + 13, 6, 7);
    } else if (loc.id === 'etyka') {
      this.ctx.fillStyle = "#facc15";
      this.ctx.beginPath();
      this.ctx.arc(nx + 16, ny + 16, 3, 0, Math.PI * 2);
      this.ctx.fill();
    } else if (loc.id === 'dziecko') {
      this.ctx.fillStyle = "#f43f5e";
      this.ctx.fillRect(nx + 20, ny + 16, 6, 6);
    }

    this.ctx.fillStyle = "#fed7aa";
    this.ctx.beginPath();
    this.ctx.arc(nx + 16, ny + 8, 7, 0, Math.PI * 2);
    this.ctx.fill();

    if (loc.id === 'eba' || loc.id === 'modele' || loc.id === 'neuro') {
      this.ctx.fillStyle = "#0f172a";
      this.ctx.fillRect(nx + 7, ny - 1, 18, 4);
      this.ctx.fillStyle = "#facc15";
      this.ctx.fillRect(nx + 22, ny + 1, 2, 6);
    } else {
      this.ctx.fillStyle = loc.id === 'bufet' ? "#451a03" : "#64748b";
      this.ctx.beginPath();
      this.ctx.arc(nx + 16, ny + 5, 7, Math.PI, Math.PI * 2);
      this.ctx.fill();
    }

    this.ctx.fillStyle = "#0f172a";
    this.ctx.fillRect(nx + 13, ny + 7, 2, 2);
    this.ctx.fillRect(nx + 17, ny + 7, 2, 2);

    this.ctx.fillStyle = "#ffffff";
    this.ctx.font = "bold 9px monospace";
    this.ctx.textAlign = "center";
    this.ctx.fillText(loc.npcName, nx + 16, ny - 6);

    if (this.activeInteraction && this.activeInteraction.data.id === loc.id) {
      const bounce = Math.sin(Date.now() / 150) * 3;
      this.ctx.fillStyle = "#facc15";
      this.ctx.font = "bold 13px monospace";
      this.ctx.fillText("!", nx + 16, ny - 16 + bounce);
    }
  }

  drawDetailedPlayer() {
    const px = this.player.x;
    const py = this.player.y;

    this.ctx.fillStyle = "rgba(0,0,0,0.5)";
    this.ctx.beginPath();
    this.ctx.ellipse(px + 16, py + 30, 11, 4, 0, 0, Math.PI * 2);
    this.ctx.fill();

    const legOffset = this.player.isMoving ? Math.sin(this.player.animTimer) * 4 : 0;
    this.ctx.fillStyle = "#0f172a";
    this.ctx.fillRect(px + 9, py + 22 + legOffset, 5, 8);
    this.ctx.fillRect(px + 18, py + 22 - legOffset, 5, 8);

    this.ctx.fillStyle = "#334155";
    this.ctx.fillRect(px + 8, py + 28 + legOffset, 6, 3);
    this.ctx.fillRect(px + 18, py + 28 - legOffset, 6, 3);

    this.ctx.fillStyle = "#f8fafc";
    this.ctx.fillRect(px + 7, py + 10, 18, 14);

    let classColor = "#38bdf8";
    if (this.player.charClass) {
      if (this.player.charClass.id === 'klinicysta') classColor = "#f59e0b";
      if (this.player.charClass.id === 'etyk') classColor = "#ec4899";
    }
    this.ctx.fillStyle = classColor;
    this.ctx.fillRect(px + 11, py + 12, 10, 11);

    this.ctx.strokeStyle = "#facc15";
    this.ctx.lineWidth = 1.8;
    this.ctx.beginPath();
    this.ctx.arc(px + 16, py + 14, 5, 0, Math.PI);
    this.ctx.stroke();

    this.ctx.fillStyle = "#e2e8f0";
    this.ctx.beginPath();
    this.ctx.arc(px + 16, py + 19, 2, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = "#fed7aa";
    this.ctx.beginPath();
    this.ctx.arc(px + 16, py + 7, 7, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = "#3b1d11";
    this.ctx.beginPath();
    this.ctx.arc(px + 16, py + 4, 7, Math.PI, Math.PI * 2);
    this.ctx.fill();
    this.ctx.fillRect(px + 9, py + 3, 3, 5);

    this.ctx.fillStyle = "#090d16";
    if (this.player.dir === 'down') {
      this.ctx.fillRect(px + 13, py + 6, 2, 2);
      this.ctx.fillRect(px + 17, py + 6, 2, 2);
    } else if (this.player.dir === 'left') {
      this.ctx.fillRect(px + 11, py + 6, 2, 2);
    } else if (this.player.dir === 'right') {
      this.ctx.fillRect(px + 19, py + 6, 2, 2);
    } else if (this.player.dir === 'up') {
      this.ctx.fillStyle = "#3b1d11";
      this.ctx.beginPath();
      this.ctx.arc(px + 16, py + 6, 6, 0, Math.PI * 2);
      this.ctx.fill();
    }
  }
}

let game = null;
window.addEventListener('load', () => {
  game = new GameEngine();
  window.game = game;

  function gameLoop() {
    game.update();
    game.render();
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);
});
</script>
