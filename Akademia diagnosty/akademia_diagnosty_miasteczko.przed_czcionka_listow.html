  /* ---------------- EFEKTY WIZUALNE MODULACJI SNU ---------------- */
  drawDreamEffects(ctx, W, H, t) {
    const dm = this.state.dream && this.state.dream.activeMods ? this.state.dream.activeMods : null;
    if (!dm) return;

    // 1. Filtr artystyczny
    if (dm.style === 'sepia') {
      ctx.save();
      ctx.globalCompositeOperation = 'color';
      ctx.fillStyle = 'rgba(112, 66, 20, 0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (dm.style === 'negatyw') {
      ctx.save();
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (dm.style === 'psychedelic') {
      ctx.save();
      const hue = Math.floor((t * 60) % 360);
      ctx.globalCompositeOperation = 'hue';
      ctx.fillStyle = `hsl(${hue}, 90%, 50%)`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 2. Modulacja pory roku: Jesień (złote liście) lub Zima (śnieg)
    if (dm.season === 'jesien') {
      ctx.save();
      for (let i = 0; i < 18; i++) {
        const lx = ((t * 40 + i * 83) % (W + 60)) - 30;
        const ly = ((t * 30 + i * 59 + Math.sin(t * 2 + i) * 20) % (H + 40)) - 20;
        ctx.fillStyle = ['#e8972c', '#d65b27', '#f2c94c', '#a8421e'][i % 4];
        ctx.fillRect(Math.round(lx), Math.round(ly), 2, 2);
      }
      // Ciepły filtr jesienny
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = 'rgba(235, 140, 50, 0.22)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (dm.season === 'zima' || dm.weather === 'snow') {
      ctx.save();
      for (let i = 0; i < 28; i++) {
        const sx = ((t * 15 + i * 67 + Math.cos(t * 1.5 + i) * 15) % (W + 40)) - 20;
        const sy = ((t * 45 + i * 43) % (H + 40)) - 20;
        ctx.fillStyle = 'rgba(240, 248, 255, 0.85)';
        ctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
      }
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = 'rgba(180, 220, 255, 0.18)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 3. Materiały: Cukierki (kolorowe landrynkowe iskry i różowy odcień)
    if (dm.material === 'cukierki') {
      ctx.save();
      for (let i = 0; i < 14; i++) {
        const cx = ((i * 137 + t * 20) % W);
        const cy = ((i * 93 + Math.sin(t * 2.5 + i) * 30) % H);
        const col = ['#ff6b9d', '#ffd166', '#06d6a0', '#118ab2', '#a05cf6'][i % 5];
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(cx), Math.round(cy), 3, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(cx) + 1, Math.round(cy) + 1, 1, 1);
      }
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = 'rgba(255, 180, 220, 0.15)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (dm.material === 'krysztal') {
      ctx.save();
      // Błyski kryształowe
      for (let i = 0; i < 10; i++) {
        const kx = (i * 191) % W, ky = (i * 137) % H;
        const flash = Math.max(0, Math.sin(t * 4 + i * 2));
        if (flash > 0.4) {
          ctx.fillStyle = `rgba(200, 245, 255, ${flash * 0.7})`;
          ctx.fillRect(kx - 1, ky - 3, 2, 6);
          ctx.fillRect(kx - 3, ky - 1, 6, 2);
        }
      }
      ctx.restore();
    }

    // 4. Pogoda: Fioletowy deszcz
    if (dm.weather === 'rain') {
      ctx.save();
      ctx.strokeStyle = 'rgba(180, 140, 255, 0.45)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 35; i++) {
        const rx = ((t * 80 + i * 47) % (W + 40)) - 20;
        const ry = ((t * 220 + i * 63) % (H + 40)) - 20;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx - 3, ry + 12);
        ctx.stroke();
      }
      ctx.restore();
    }
  },

  /* ---------------- wejście i wyjście z domu-przedmiotu ---------------- */
  enterSubjectHouse(b) {
    if (this.transition) return;
    const S = SUBJECTS[b.subject], sid = b.subject;
    audio.door();
    this.goZone('in:' + sid, subjectZoneW(sid) * 8, (SUBJ_H - 1) * 16 + 4, 'up', {
      after: () => {
        this.showBanner(S.icon + ' ' + S.name, S.subject);
        const st = this.subjState(sid);
        if (!st._seen) { st._seen = true; setTimeout(() => this.toast('Każdy pokój to mini-gra. Ukończ ją, a zapalisz w nim światło — nocą rozbłyśnie też okno domu!', 5200), 900); }
      }
    });
  },
  exitSubjectHouse() {
    const Z = this.zone, sid = Z.subject, outer = Z.outer;
    if (!this.zones[outer]) this.zones[outer] = buildZone(outer);
    const b = this.zones[outer].buildings.find(x => x.subject === sid);
    audio.door();
    this.goZone(outer, b ? b.doorCol * 16 + 8 : 20 * 16, b ? (b.doorRow + 1) * 16 + 10 : 12 * 16, 'down', { quiet: true });
  },
  refreshSubjectLights() {
    const Z = this.zone;
    if (!Z || !Z.subject) return;
    Z.lights = subjectLights(Z, this);
    Z.lightShape = null; Z.glowShape = null;
  },
  // okna domu = pokoje; ukończony pokój świeci swoim kolorem, reszta ciemna
  tintSubjectWindows(b) {
    const S = SUBJECTS[b.subject];
    (b.win || []).forEach((w, i) => {
      const R = S.rooms[i];
      if (!R) return;
      const lit = this.roomStars(b.subject, i) > 0;
      w.col = lit ? R.light : null; w.dark = !lit;
    });
  },
  drawSubjectBuilding(b, t) {
    const ctx = this.ctx;
    (b.win || []).forEach((w, i) => {
      if (!w.col) return;
      ctx.fillStyle = rgbaOf(w.col, 0.28 + 0.12 * Math.sin(t * 2 + i));
      ctx.fillRect(w.x, w.y, w.w, w.h);
    });
    const ck = b.spr.clock;
    if (ck) {
      const cx = b.X + 1 + ck.x, cy = b.Y + 1 + ck.y, tm = this.state.time;
      const dark = this.darkness();
      if (dark > 0.15) { ctx.fillStyle = `rgba(255,240,170,${Math.min(0.9, dark * 1.3)})`; ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, ck.r, 0, Math.PI * 2); ctx.fill(); }
      const ha = ((tm / 60) % 12) / 12 * Math.PI * 2 - Math.PI / 2, ma = (tm % 60) / 60 * Math.PI * 2 - Math.PI / 2;
      line(ctx, cx, cy, cx + Math.cos(ma) * 8, cy + Math.sin(ma) * 8, '#2a2a30');
      line(ctx, cx, cy, cx + Math.cos(ha) * 5, cy + Math.sin(ha) * 5, '#b0302a');
      ctx.fillStyle = '#2a2a30'; ctx.fillRect(cx, cy, 1, 1);
    }
  },

  },

  /* ---------------- zabawa światłem ---------------- */
  // cienie chmur sunące po mieście za dnia
  drawCloudShadows(Z, t) {
    const tm = this.state.time;
    if (tm < 6.5 * 60 || tm > 19 * 60) return;
    const fade = Math.min(1, (tm - 6.5 * 60) / 60, (19 * 60 - tm) / 60);
    const W = Z.w * 16, H = Z.h * 16, ctx = this.ctx;
    if (Z._cseed == null) Z._cseed = hashStr(Z.id) % 400;
    ctx.save();
    for (let k = 0; k < 4; k++) {
      const span = W + 420, x = ((t * (6 + k * 2.2) + k * 257 + Z._cseed) % span) - 210;
      const y = ((k * 131 + 70 + Z._cseed) % (H - 40)) + Math.sin(t * 0.05 + k) * 16;
      const rx = 95 + k * 18, ry = 42 + (k % 2) * 16;
      ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(20,30,70,${0.13 * fade})`); g.addColorStop(0.6, `rgba(20,30,70,${0.08 * fade})`); g.addColorStop(1, 'rgba(20,30,70,0)');
      ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
      ctx.restore();
    }
    ctx.restore();
  },
  // snopy dziennego (albo księżycowego) światła z okien w domach-przedmiotach, z drobinkami kurzu
  drawShafts(Z, t) {
    const tm = this.state.time, day = tm > 6.5 * 60 && tm < 19.5 * 60;
    const ctx = this.ctx, col = day ? '255,240,200' : '150,180,255', a0 = day ? 0.16 : 0.07;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    (Z.shafts || []).forEach((w, i) => {
      const a = a0 * (0.8 + 0.2 * Math.sin(t * 0.8 + i));
      const g = ctx.createLinearGradient(w.x, w.y, w.x + 26, w.y + 70);
      g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + w.w, w.y); ctx.lineTo(w.x + w.w + 30, w.y + 72); ctx.lineTo(w.x + 18, w.y + 72); ctx.closePath(); ctx.fill();
      for (let k = 0; k < 5; k++) {
        const ph = (t * 0.12 + k * 0.2 + i * 0.37) % 1;
        ctx.fillStyle = `rgba(${col},${a * 2.4})`;
        ctx.fillRect(Math.round(w.x + 4 + ph * 26 + Math.sin(t + k) * 3), Math.round(w.y + ph * 66), 1, 1);
      }
    });
    ctx.restore();
  },
  // nocne efekty wysp: świecący plankton przy brzegu i Reflektor Uwagi z kopuły obserwatorium
  drawIsleNight(Z, dark, t) {
    const ctx = this.ctx;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    if (Z.shoreWater && dark > 0.25) {
      Z.shoreWater.forEach(([x, y], i) => {
        const ph = Math.sin(t * 1.7 + i * 1.3) * 0.5 + 0.5;
        if (ph < 0.35) return;
        const px = x * 16 + ((i * 7) % 12) + 2, py = y * 16 + ((i * 5) % 12) + 2;
        ctx.fillStyle = `rgba(110,240,255,${ph * dark})`;
        ctx.fillRect(px, py, 2, 1); ctx.fillRect(px + 5, py + 4, 1, 1);
      });
    }
    (Z.buildings || []).forEach(b => {
      if (!b.spr || !b.spr.spot || dark < 0.3) return;
      const ox = b.X + 1 + b.spr.spot.x, oy = b.Y + 1 + b.spr.spot.y;
      const ang = Math.PI / 2 + Math.sin(t * 0.4) * 1.15, len = 180;
      const tx = ox + Math.cos(ang) * len, ty = oy + Math.sin(ang) * len;
      const nx = -Math.sin(ang), ny = Math.cos(ang), wEnd = 26;
      const g = ctx.createLinearGradient(ox, oy, tx, ty);
      g.addColorStop(0, `rgba(200,230,255,${0.26 * dark})`); g.addColorStop(1, `rgba(200,230,255,${0.05 * dark})`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(ox - nx * 2, oy - ny * 2); ctx.lineTo(ox + nx * 2, oy + ny * 2); ctx.lineTo(tx + nx * wEnd, ty + ny * wEnd); ctx.lineTo(tx - nx * wEnd, ty - ny * wEnd); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(tx, ty); ctx.scale(1, 0.55);
      const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
      sg.addColorStop(0, `rgba(220,240,255,${0.34 * dark})`); sg.addColorStop(1, 'rgba(220,240,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(-34, -34, 68, 68);
      ctx.restore();
    });
    ctx.restore();
  },
  drawRoomLabels(s, cam) {
    const ctx = this.ctx, Z = this.zone;
    const fs = Math.max(9, Math.round(s * 3.6));
    ctx.font = `700 ${fs}px ${WORLD_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    Z.roomLabels.forEach(l => {
      const x = (l.x - cam.x) * s, y = (l.y - cam.y) * s;
      if (x < -200 || x > this.canvas.width + 200 || y < -40 || y > this.canvas.height + 40) return;
      const lit = this.roomStars(Z.subject, l.i) > 0;
      const w = ctx.measureText(l.text).width + 14;
      ctx.fillStyle = 'rgba(30,20,14,0.88)'; ctx.fillRect(x - w / 2, y - fs * 0.8, w, fs * 1.6);
      ctx.fillStyle = lit ? l.col : '#6a5a4a'; ctx.fillRect(x - w / 2, y + fs * 0.8 - 2, w, 2);
      ctx.fillStyle = lit ? '#fff6dc' : '#d8c8a8';
      ctx.fillText((lit ? '★ ' : '') + l.text, x, y);
    });
  }
});


/* ---------- mini-gra: rozpiętość pamięci (digit span) ---------- */
MINIGAMES.span = function (ctx) {
  let len = 3, fails = 0, best = 0, busy = false, seq = '', ended = false;
  const tmos = [];
  const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-len">Długość: 3</span><span class="tag" id="mg-best">Rekord: 0</span><span class="grow"></span><span class="small muted">Wskazówka: grupuj cyfry po 2–3 (np. 58 · 21 · 7).</span></div>
    <div class="mg-digit" id="mg-digit">·</div>
    <div class="mg-tf"><input id="mg-in" class="mg-input" inputmode="numeric" autocomplete="off" placeholder="wpisz cyfry…" disabled><button class="btn btn-green" id="mg-ok">▶ Start</button></div>
    <div id="mg-fb" class="small center mt"></div>`);
  const el = m.querySelector('#mg-digit'), inp = m.querySelector('#mg-in'), btn = m.querySelector('#mg-ok'), fb = m.querySelector('#mg-fb');
  const present = () => {
    busy = true; inp.value = ''; inp.disabled = true; btn.disabled = true; btn.textContent = '👀';
    seq = '';
    for (let k = 0; k < len; k++) { let d; do { d = String(Math.floor(Math.random() * 10)); } while (seq.endsWith(d)); seq += d; }
    m.querySelector('#mg-len').textContent = 'Długość: ' + len;
    [...seq].forEach((d, k) => {
      tmos.push(setTimeout(() => { if (ctx.dead) return; el.textContent = d; el.classList.add('on'); audio.blip(); }, 600 + k * 1000));
      tmos.push(setTimeout(() => { el.classList.remove('on'); el.textContent = '·'; }, 600 + k * 1000 + 700));
    });
    tmos.push(setTimeout(() => {
      if (ctx.dead) return;
      busy = false; inp.disabled = false; btn.disabled = false; btn.textContent = 'Sprawdź [Enter]'; el.textContent = '?'; inp.focus();
    }, 600 + len * 1000));
  };
  const end = () => {
    if (ended) return;
    ended = true;
    ctx.finish(clamp((best - 3) / 5, 0, 1), `<p class="center">Twoja rozpiętość pamięci: <b>${best || '—'}</b> cyfr.</p>
      <p class="small">George Miller (1956): pamięć krótkotrwała mieści ok. <b>7 ± 2</b> elementów. Nowsze badania (Cowan) mówią raczej o ok. 4 „porcjach” — ale porcja może być duża, jeśli połączysz cyfry w znane liczby (np. rok urodzenia). To właśnie <b>grupowanie (chunking)</b>. Pamięć robocza to też powód, dla którego lepiej uczyć się w krótszych blokach.</p>`);
  };
  const check = () => {
    if (busy || ctx.dead || ended) return;
    if (!seq) return present();
    const ans = inp.value.replace(/\D/g, ''), good = ans === seq;
    if (good) { audio.success(); best = Math.max(best, len); len++; fails = 0; fb.innerHTML = `<span class="mg-good">✔ Brawo! ${seq.length} cyfr.</span>`; }
    else { audio.error(); fails++; fb.innerHTML = `<span class="mg-bad">✘ Było: ${seq}</span>${fails === 1 ? ' — jeszcze jedna próba na tej długości.' : ''}`; }
    m.querySelector('#mg-best').textContent = 'Rekord: ' + best;
    seq = '';
    if (fails >= 2 || len > 10) { tmos.push(setTimeout(end, 900)); return; }
    busy = true; btn.disabled = true;
    tmos.push(setTimeout(() => { busy = false; present(); }, 1000));
  };
  btn.addEventListener('click', check);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  ctx.cleanups.push(() => tmos.forEach(clearTimeout));
};

  h: () => 106,
  draw(g, o) {
    const { W, MX, SH, doorX, C, n, win, rnd } = o, cx = MX + W / 2, drumH = 34, dy = SH - drumH;
    wallFill(g, MX, dy, W, drumH, 'stone', C, rnd);
    R(g, MX + W - 3, dy, 3, drumH, 'rgba(0,0,0,0.12)');
    R(g, MX - 2, dy - 3, W + 4, 4, shade(C.trim, -0.3)); R(g, MX - 2, dy - 3, W + 4, 1, shade(C.trim, 0.1));
    const rx = Math.min(W / 2 + 4, 62), ry = 30, by = dy - 3 - ry;
    const hx = rx * 0.5, hr = rx * 0.54, pink = C.roof, dark = shade(pink, -0.3), light = shade(pink, 0.22);
    const inside = (x, y) => [-1, 1].some(sd => { const dx = (x - (cx + sd * hx)) / hr, dq = (y - by) / ry; return dx * dx + dq * dq <= 1; });
    for (let y = Math.floor(by - ry); y <= by + ry; y++) for (let x = Math.floor(cx - rx - 2); x <= cx + rx + 2; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      const gyrus = Math.sin(x * 0.42 + Math.sin(y * 0.33) * 2.4) + Math.sin(y * 0.5 + x * 0.13) > 1.2;
      const lit = (x - cx) + (y - by) * 1.4 < -rx * 0.55;
      P(g, x, y, edge ? shade(pink, -0.45) : gyrus ? dark : lit ? light : pink);
    }
    for (let y = Math.floor(by - ry); y <= by + ry; y++) if (inside(cx, y)) { P(g, cx, y, shade(pink, -0.5)); P(g, cx + 1, y, dark); }
    [[-0.55, -0.55], [0.35, -0.7], [-0.2, -0.25]].forEach(([fx, fy]) => P(g, cx + fx * rx, by + fy * ry, '#ffffff'));
    // okna rozstawione symetrycznie od drzwi
    const offs = [];
    for (let d = 22; offs.length < n && d < W; d += 18) [d, -d].forEach(v => { const x = doorX + v - 4; if (offs.length < n && x > MX + 3 && x < MX + W - 12) offs.push(x); });
    offs.forEach(x => sbWin(g, x, dy + 14, 'round', C, win));
    sbDoor(g, doorX, SH, C);
    sbSign(g, doorX, dy + 1, 60, o);
  }
};

/* ---------- mini-gra: efekt Stroopa ---------- */
MINIGAMES.stroop = function (ctx) {
  const COLS = [['CZERWONY', '#ff5a4e'], ['NIEBIESKI', '#5aa0ff'], ['ZIELONY', '#3fd06a'], ['ŻÓŁTY', '#ffd23a']];
  const N = 24, LIMIT = 3000;
  // połowa prób zgodnych (słowo = kolor czcionki), połowa niezgodnych; każdy kolor czcionki tyle samo razy
  const trials = shuffle(Math.random, Array.from({ length: N }, (_, k) => {
    const ink = k % 4, cong = k < N / 2;
    let word = ink;
    if (!cong) do { word = Math.floor(Math.random() * 4); } while (word === ink);
    return { ink, word, cong };
  }));
  let i = 0, live = false, t0 = 0, tmo = null, ended = false;
  const res = [];
  const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-n">Próba 1/${N}</span><span class="grow"></span><span class="small muted">Wskaż KOLOR CZCIONKI · klawisze 1–4</span></div>
    <div class="mg-stroop" id="mg-word">+</div>
    <div class="mg-tf">${COLS.map(([nm, c], k) => `<button class="btn mg-sbtn" data-k="${k}"><i style="background:${c}"></i>${k + 1} · ${nm.toLowerCase()}</button>`).join('')}</div>
    <div id="mg-fb" class="small center mt"></div>`);
  const word = m.querySelector('#mg-word'), fb = m.querySelector('#mg-fb');
  const present = () => {
    live = false; word.textContent = '+'; word.style.color = '';
    m.querySelector('#mg-n').textContent = `Próba ${i + 1}/${N}`;
    tmo = setTimeout(() => {
      if (ctx.dead) return;
      const T = trials[i];
      word.textContent = COLS[T.word][0]; word.style.color = COLS[T.ink][1];
      t0 = performance.now(); live = true;
      tmo = setTimeout(() => answer(-1), LIMIT);
    }, 450 + Math.random() * 300);
  };
  const end = () => {
    if (ended || ctx.dead) return;
    ended = true;
    const acc = res.filter(r => r.good).length / res.length;
    const mean = cong => { const rs = res.filter(r => r.good && r.cong === cong).map(r => r.rt); return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0; };
    const mc = mean(true), mi = mean(false), diff = Math.round(mi - mc), mx = Math.max(mc, mi, 1);
    const bar = (v, lab) => `<div class="mg-barcol"><div class="mg-barval">${v ? Math.round(v) + ' ms' : '—'}</div><div class="mg-bar" style="height:${Math.round(v / mx * 90) + 4}px"></div><div class="mg-barlab">${lab}</div></div>`;
    ctx.finish(acc, `<div class="mg-bars">${bar(mc, 'zgodne')}${bar(mi, 'niezgodne')}</div>
      <p class="small">Poprawność: <b>${Math.round(acc * 100)}%</b>. ${diff > 0 ? `Przy niezgodnych słowach odpowiadasz średnio o <b>${diff} ms</b> wolniej — to efekt Stroopa (1935)!` : 'Tym razem różnicy nie widać; przy kilkunastu próbach szum bywa większy niż efekt. Spróbuj jeszcze raz.'} Czytanie jest tak zautomatyzowane, że trzeba je aktywnie hamować. Tę kontrolę zapewniają płaty czołowe, m.in. przedni zakręt obręczy — dlatego test Stroopa służy do badania funkcji wykonawczych, np. po urazach głowy.</p>`);
  };
  const answer = k => {
    if (!live || ctx.dead) return;
    live = false; clearTimeout(tmo);
    const T = trials[i], rt = performance.now() - t0, good = k === T.ink;
    res.push({ cong: T.cong, rt, good });
    if (good) audio.blip(); else audio.error();
    fb.innerHTML = good ? `<span class="mg-good">✔</span> ${Math.round(rt)} ms` : k < 0 ? '<span class="mg-bad">⏱ Za wolno!</span>' : `<span class="mg-bad">✘ Czcionka była: ${COLS[T.ink][0].toLowerCase()}.</span>`;
    i++;
    if (i >= N) { word.textContent = '✓'; word.style.color = ''; tmo = setTimeout(end, 350); return; }
    present();
  };
  m.querySelectorAll('.mg-sbtn').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  ctx.key = e => { const k = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4'].indexOf(e.code); if (k >= 0) answer(k % 4); };
  ctx.cleanups.push(() => clearTimeout(tmo));
  this.mgKeys(ctx);
  present();
};

/* ---------- mini-gra: wysokość dźwięku (amuzja) ---------- */
MINIGAMES.pitch = function (ctx) {
  const STEPS = [4, 2, 1, 0.75, 0.5, 0.35, 0.25, 0.15]; // różnica w półtonach, coraz mniejsza
  const trials = STEPS.flatMap(st => [0, 1].map(() => ({ st, up: Math.random() < 0.5, base: 300 + Math.random() * 200 })));
  let i = 0, phase = 'idle', ended = false;
  const res = [], tmos = [];
  audio.init();
  const musicTo = v => { const g = audio.musicGain; if (!g || !audio.ctx) return; g.gain.cancelScheduledValues(audio.ctx.currentTime); g.gain.value = v; };
  musicTo(0); // muzyka gry zagłuszałaby porównanie
  const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-n">Próba 1/${trials.length}</span><span class="tag" id="mg-st">Poziom 1/${STEPS.length}</span><span class="grow"></span><span class="small muted">🔊 Włącz dźwięk · muzyka gry jest na chwilę wyciszona</span></div>
    <div class="mg-lamp mg-ear" id="mg-ear">🎵</div>
    <div class="mg-tf"><button class="btn" id="mg-play">▶ Posłuchaj [spacja]</button></div>
    <div class="mg-tf mt"><button class="btn btn-green" id="mg-up" disabled>⬆ Drugi wyżej [↑]</button><button class="btn btn-purple" id="mg-down" disabled>⬇ Drugi niżej [↓]</button></div>
    <div id="mg-fb" class="small center mt"></div>`);
  const ear = m.querySelector('#mg-ear'), fb = m.querySelector('#mg-fb'), bPlay = m.querySelector('#mg-play'), bUp = m.querySelector('#mg-up'), bDown = m.querySelector('#mg-down');
  const answering = on => { bUp.disabled = bDown.disabled = !on; };
  const play = () => {
    if (phase !== 'idle' || ctx.dead || ended) return;
    phase = 'playing'; bPlay.disabled = true; answering(false);
    const T = trials[i], f2 = T.base * Math.pow(2, (T.up ? 1 : -1) * T.st / 12);
    m.querySelector('#mg-n').textContent = `Próba ${i + 1}/${trials.length}`;
    m.querySelector('#mg-st').textContent = `Poziom ${STEPS.indexOf(T.st) + 1}/${STEPS.length}`;
    audio.tone(T.base, 0.55, { type: 'sine', vol: 0.14 });
    audio.tone(f2, 0.55, { type: 'sine', vol: 0.14, at: 0.85 });
    ear.classList.add('on');
    tmos.push(setTimeout(() => { if (ctx.dead) return; ear.classList.remove('on'); phase = 'answer'; answering(true); }, 1500));
  };
  const end = () => {
    if (ended || ctx.dead) return;
    ended = true;
    const acc = res.filter(r => r.good).length / res.length;
    const clean = STEPS.filter(st => res.filter(r => r.st === st).every(r => r.good));

/* ---------- mini-gra: wspólne pastwisko (Hardin, 1968; Ostrom) ---------- */
MINIGAMES.commons = function (ctx) {
  const YEARS = 6, NORM = 2, EAT = 3;
  // fazy jak w eksperymencie Ostrom: bez rozmów → narada → narada i kary
  const PHASES = [
    { from: 1, name: 'Każdy sobie', rule: 'Bez rozmów i bez kar. Każdy baca wypasa, ile chce.' },
    { from: 3, name: 'Narada', rule: 'Bacowie umówili się: najwyżej 2 owce na osobę. Kar nie ma — liczy się słowo.' },
    { from: 5, name: 'Narada i kary', rule: 'Umowa: najwyżej 2 owce. Kto wypasie więcej, oddaje za każdą nadmiarową owcę 1,5 kłębka wełny.' }
  ];
  const phaseOf = y => PHASES.filter(p => y >= p.from).pop();
  let year = 1, grass = 100, myWool = 0, allWool = 0, kept = 0, ended = false;
  let last = { id: 4, ego: 3, sup: NORM, me: NORM };
  const rows = [];
  const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="cm-year">Rok 1/${YEARS}</span><span class="tag" id="cm-phase"></span><span class="grow"></span><span class="tag" id="cm-wool">🧶 Twoja wełna: 0</span></div>
    <div class="fb ai small" id="cm-rule"></div>
    <p class="small mt" id="cm-gtxt"></p>
    <div class="mg-timer"><i id="cm-bar" style="width:100%;background:#5ab04a"></i></div>
    <ul class="mg-list small" id="cm-last"></ul>
    <p class="center"><b>Ile owiec wypasasz w tym roku?</b></p>
    <div class="mg-tf">${[1, 2, 3, 4].map(n => `<button class="btn cm-btn" data-n="${n}">${'🐑'.repeat(n)} ${n} [${n}]</button>`).join('')}</div>
    <div id="mg-fb" class="small center mt"></div>`);
  const show = () => {
    const ph = phaseOf(year);
    m.querySelector('#cm-year').textContent = `Rok ${year}/${YEARS}`;
    m.querySelector('#cm-phase').textContent = ph.name;
    m.querySelector('#cm-rule').textContent = ph.rule;
    m.querySelector('#cm-wool').textContent = `🧶 Twoja wełna: ${Math.round(myWool * 10) / 10}`;
    m.querySelector('#cm-gtxt').textContent = `Trawa na pastwisku: ${Math.round(grass)}%`;
    const bar = m.querySelector('#cm-bar');
    bar.style.width = clamp(grass, 0, 100) + '%';
    bar.style.background = grass > 60 ? '#5ab04a' : grass > 30 ? '#d8b040' : '#c8503a';
  };
  const ego = ph => ph === PHASES[0] ? Math.round((last.id + last.sup + last.me) / 3) : ph === PHASES[2] ? NORM : (last.me <= NORM ? NORM : 3);
  const end = () => {
    if (ended || ctx.dead) return;
    ended = true;
    const health = clamp(grass / 60, 0, 1), loyal = kept / YEARS;
    const table = rows.map(r => `<li>Rok ${r.y} (${r.ph}): Ty ${r.me}, Id ${r.id}, Ego ${r.ego}, Superego ${r.sup} → trawa ${Math.round(r.g)}%</li>`).join('');
    const future = grass < 20
      ? '<div class="fb bad small">Przez kilka lat wełny było sporo, ale pastwisko jest martwe: w siódmym roku nikt nie wypasie ani jednej owcy. Zysk „teraz” zjadł zysk „na zawsze”.</div>'
      : grass < 50

  finishMinigame(ctx, ratio, summary = "") {

  dreamWorldFilter(t) {
    const s = this.dreamSession(); if (!s) return "none";

  drawDreamSprite(sprite, x, y, object) {
    const s = this.dreamSession(), ctx = this.ctx;
    if (!s) { ctx.drawImage(sprite.c, x, y); return; }
    if (object.dreamPal) {
      if (!object.dreamSprite) {
        const [c, g] = mkCanvas(sprite.c.width, sprite.c.height); g.drawImage(sprite.c, 0, 0);
        const pixels = g.getImageData(0, 0, c.width, c.height), pal = object.dreamPal.map(hexToRgb);
        for (let i = 0; i < pixels.data.length; i += 4) {

          if (pixels.data[i + 3] && green > r * 1.1 && green > b * 0.95) {

    const dist = Math.hypot(x + sprite.c.width / 2 - this.player.x, y + sprite.c.height - this.player.y);

      const y = (i * 137 + t * (rain ? 175 : 28)) % (H + 20) - 10;

   monster Haliny to sadzonki-siostry: nie piją od gracza, tylko szepczą
   i przypominają. Groza nie jest zapisywana — wylicza się ją z dnia
   ostatniego podlania (state.halina.w).
   ===================================================================== */
const HALINA_EVERY = 3;
const HALINA_ROOM = { wall: '#d8c0cc', wallPattern: 'diamond', floorType: 'carpet', floorColor: '#8a5a48' };
const HALINA_MONSTERAS = [

// Każda litera w osobnym spanie drży (CSS .shaky); a = siła 0–4 px. Słowa się nie łamią.
function shakyHTML(text, a) {
  if (!a) return esc(text);
  const sp = Math.max(0.12, 0.42 - a * 0.07).toFixed(2);
  const words = String(text).split(/(\s+)/).map(w => !w || /^\s+$/.test(w) ? w
    : `<span class="shk-w">${[...w].map(ch => `<span class="shk-l" style="--d:-${(Math.random() * 0.4).toFixed(2)}s">${esc(ch)}</span>`).join('')}</span>`);
  return `<span class="shaky" style="--a:${a.toFixed(2)};--sp:${sp}s">${words.join('')}</span>`;
}

// Wnętrze domu Pani Haliny — ta sama izba 14×10 co dom gracza, inne meble
function buildHalinaZone() {
  const W = HOME.w, H = HOME.h;
  const Z = {
    id: 'halina', halina: true,
    def: { name: 'Dom Pani Haliny', icon: '🌿', song: 'dom', motto: '', particles: 'none', interior: true, pal: {} },
    w: W, h: H, interior: true,
    solid: new Uint8Array(W * H), objects: [], npcs: [{ id: 'halina', x: 9, y: 6 }], interacts: [], lights: [], buildings: [],
    exits: { S: true }, neighbors: {}
  };
  const sol = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < H) Z.solid[y * W + x] = 1; };
  for (let x = 0; x < W; x++) { sol(x, 0); sol(x, 1); }
  const put = (o, interact) => {
    o = Object.assign({ type: 'furn', fw: 1, fh: 1 }, o);
    Z.objects.push(o);
    for (let yy = o.y; yy < o.y + o.fh; yy++) for (let xx = o.x; xx < o.x + o.fw; xx++) sol(xx, yy);
    if (interact) Z.interacts.push(Object.assign({ x: o.x, y: o.y, w: o.fw, h: o.fh }, interact));
  };
  HALINA_MONSTERAS.forEach((m, idx) => put({ id: 'monstera', x: m.x, y: m.y }, { kind: 'halina_monstera', idx }));
  put({ id: 'stolik', x: 5, y: 4, fw: 2 }, { kind: 'halina_szarlotka' });
  put({ id: 'fotel', x: 8, y: 4 });
  put({ id: 'gramofon', x: 12, y: 4 });
  Z.interacts.push({ x: 6, y: 1, w: 2, h: 1, kind: 'halina_portret' });   // portret na ścianie
  Z.lights.push({ x: 7 * 16, y: 3 * 16, r: 90, col: '#ffcf8a', s: 0.9 });
  return Z;
}

const halinaBase = { update: Game.prototype.update };

Object.assign(Game.prototype, {
  halinaData() {
    const s = this.state;
    // stary zapis i nowa gra: licznik rusza od dnia pierwszego wczytania
    if (!s.halina || !Number.isInteger(s.halina.w)) s.halina = { w: s.day, done: [], letterFor: null, learned: false, introduced: false, pieDay: 0, remindDay: 0 };
    if (!Array.isArray(s.halina.done)) s.halina.done = [];
    return s.halina;
  },
  halinaDue() { return this.halinaData().w + HALINA_EVERY; },
  halinaThirsty() { return this.state.day >= this.halinaDue(); },
  halinaLevel() { return clamp(this.state.day - this.halinaDue(), 0, 5); },
  // monstery stojące w domu gracza (zwykle jedna — ta od cioci Jadzi); klucz = miejsce w pokoju
  homeMonsteras() { return this.state.home.placed.filter(p => p.id === 'monstera').map(p => p.x + ',' + p.y); },
  halinaLeft() { const done = this.halinaData().done; return this.halinaThirsty() ? this.homeMonsteras().filter(k => !done.includes(k)).length : 0; },
  // siła drżenia liter: rośnie z grozą, a u Haliny także z napięciem wizyty
  halinaShake() {
    const lvl = this.halinaLevel();
    if (!lvl) return 0;
    return Math.min(4, 0.35 + lvl * 0.45 + (this.zone && this.zone.halina ? (this._halinaTension || 0) * 1.4 : 0));
  },
  halinaDoor() { const oz = this.zones.osiedle; return oz ? oz.buildings.find(b => b.kind === 'halina') || null : null; },
  toastShaky(msg, a, ms = 4200) {
    this.toast(msg, ms);
    if (a) document.getElementById('toast').innerHTML = shakyHTML(msg, a);
  },

  update(dt) {
    halinaBase.update.call(this, dt);
    if (this.state && this.state.created && this.zone) this.updateHalina(dt);
  },
  updateHalina(dt) {
    const Z = this.zone, s = this.state, lvl = this.halinaLevel();
    if (Z.halina) {
      // napięcie wizyty u Haliny: ~45 s do maksimum, dopóki monstera w domu gracza jest zaniedbana
      const cap = lvl ? 1 : 0;
      let tn = this._halinaTension || 0;
      if (tn > cap) tn = Math.max(cap, tn - dt / 3);
      else if (!this.paused()) tn = Math.min(cap, tn + dt / 45);
      this._halinaTension = tn;
    }
    // komunikaty w mieście od grozy 4 — nigdy w trakcie nauki, dialogu, snu ani u Haliny
    if (lvl < 4 || this.paused() || this.dreamSession() || Z.subject || Z.halina) return;
    const now = s.day * 1440 + s.time;
    if (this._halinaNagAt == null) this._halinaNagAt = now + 20;
    if (now < this._halinaNagAt) return;
    this._halinaNagAt = now + (lvl >= 5 ? 30 : 60);
    this.toastShaky(pick(Math.random, HALINA_NAGS), this.halinaShake(), 5200);
  },

  // po wejściu do domu gracza: raz dziennie przypomnienie, gdy monstera chce pić
  halinaHomeReminder() {
    const h = this.halinaData(), s = this.state;
    if (!this.halinaThirsty() || h.remindDay === s.day) return;
    h.remindDay = s.day;
    if (!this.homeMonsteras().length) return this.toast('📦 Monstera cioci Jadzi wciąż stoi w kartonie. Postaw ją (🛠️ Urządzaj) i podlej.', 5200);
    if (!this.halinaLeft()) return;
    const lvl = this.halinaLevel();
    if (!lvl) this.toast('💧 Dziś dzień podlewania monstery cioci Jadzi. Podejdź do doniczki i naciśnij Spację.', 5200);
    else this.toastShaky('🌿 Monstera cioci Jadzi szeleści: „pić…”', this.halinaShake(), 5200);
  },
  halinaOnEnter() {
    const h = this.halinaData();
    if (h.introduced) return;
    const n = this.npcs.find(x => x.id === 'halina');
    if (n) this.halinaTalk(n);
  },
  halinaIntro() {
    const due = this.halinaDue(), when = due <= this.state.day ? 'dziś' : `w dniu ${due}`;
    return [
      'Wejdź, wejdź, nie stój w progu. Tak, to wszystko monstery. Siedem. Sadzonki od monstery Jadzi — tej, która stoi teraz u ciebie.',
      `Jadzia napisała, że będziesz ją podlewać. Co trzy dni. ${this.gf('Obiecałaś', 'Obiecałeś')} jej. Nie pamiętasz? Moje pamiętają. Siostry zawsze wiedzą, kiedy jednej jest sucho.`,
      `Pierwsze podlewanie: ${when}. Wystarczy podejść w domu do doniczki. A jak się spóźnisz… no. Zobaczysz.`
    ];
  },
  halinaCreepy(lvl) {
    const late = this.state.day - this.halinaDue(), name = this.state.player.name || 'dziecko';
    return [
      ['Moje monstery pytały o twoją. Nie, nie mówią. Ale pytały.', 'Coś szeleści w nocy. To pewnie wiatr. W zamkniętym pokoju.'],
      [`Liście szeleszczą twoje imię. „${name}”. Tak, dokładnie tak.`, 'Nie śpię. Pilnuję ich. One pilnują twojej. A ktoś musi pilnować ciebie.'],
      ['Jadzia dzwoniła. Nie mam telefonu. Ale dzwoniła.', 'Superego mówi, że to twoja wina. Id mówi, że nie obchodzi go, czyja. Chce, żeby siostra piła.'],
      ['Wyparcie udaje, że wszystko w porządku. Ono zawsze tak udaje.', `${late} dni spóźnienia. Monstera Jadzi nie piła od ${late + HALINA_EVERY} dni. Moje nie śpią.`],
      ['Nie patrz tak na mnie. Idź do domu. Ona patrzy na drzwi od rana.', 'Monstera Jadzi. W twoim domu. Sucha. Monstera Jadzi. W twoim domu. Sucha.']
    ][lvl - 1];
  },
  // szepty monster Haliny — o siostrze w domu gracza
  halinaWhispers(lvl) {
    const all = [
      ['ona pije?', 'siostra…', 'sucho u ciebie…'],
      ['PIĆ', 'pamiętamy', 'trzy dni…', 'Jadzia?'],
      ['JADZIA WIE', 'ona usycha', this.gf('obiecałaś', 'obiecałeś')],
      ['WIDZIMY CIĘ', 'wracaj do niej', 'nie tu. TAM.'],
      ['PODLEJ JĄ', 'korzenie pamiętają', 'JUŻ?']
    ];
    return all.slice(0, lvl).flat();
  },
  // szepty samej monstery cioci Jadzi w domu gracza
  halinaHomeWhispers(lvl) {
    const all = [['pić…'], ['sucho…', 'wody…'], ['Jadzia…', 'SUCHO'], ['siostry czekają', 'PIĆ'], ['Halina dzwoniła', 'SIEDEM SIÓSTR', 'PODLEJ']];
    return all.slice(0, lvl).flat();
  },
  halinaTalk(n) {
    const def = n.def, h = this.halinaData(), lvl = this.halinaLevel();
    let pages, shaky = 0;
    if (!h.introduced) { h.introduced = true; pages = this.halinaIntro(); }
    else if (!this.halinaThirsty()) pages = [pick(Math.random, [...HALINA_CALM, ...def.lines])];
    else if (!this.homeMonsteras().length) { pages = ['Jadzia mówi, że jej monstera stoi u ciebie w kartonie. W KARTONIE, dziecko! Postaw ją w domu i podlej.']; shaky = this.halinaShake(); }
    else if (!lvl) pages = [pick(Math.random, HALINA_DUE)];
    else { pages = [pick(Math.random, this.halinaCreepy(lvl))]; shaky = this.halinaShake(); }
    this.showDialogue({ name: def.name, npc: def, pages, pitch: shaky ? 0.75 : 1, shaky });
  },

  halinaPrompt(it) {
    const k = it.kind;
    if (k === 'halina_portret') return 'Portret cioci Jadzi';
    if (k === 'halina_szarlotka') return 'Szarlotka Pani Haliny';
    if (k === 'halina_monstera') return `Monstera „${HALINA_MONSTERAS[it.idx].name}” · siostra monstery Jadzi`;
    // home_monstera
    if (!this.halinaThirsty()) return `Monstera cioci Jadzi · napojona (podlewanie: dzień ${this.halinaDue()})`;
    return this.halinaData().done.includes(it.key) ? 'Monstera cioci Jadzi · pije' : 'Monstera cioci Jadzi · podlej 💧';
  },
  useHalinaSpot(it) {
    const k = it.kind;
    if (!isHalinaSpot(k)) return false;
    const s = this.state, h = this.halinaData(), lvl = this.halinaLevel();
    if (k === 'home_monstera') this.halinaWater(it.key);
    else if (k === 'halina_monstera') {
      const name = `Monstera „${HALINA_MONSTERAS[it.idx].name}”`;
      if (!this.halinaThirsty()) this.say(name, 'Rośnie spokojnie. Halina podlewa swoje sama — mówi, że to łatwe, kiedy się pamięta.', '🌿');
      else if (!lvl) this.say(name, 'Liście zwracają się powoli w stronę twojego domu. Dziś dzień podlewania.', '🌿');
      else this.say(name, `Liście szeleszczą: „${pick(Math.random, this.halinaWhispers(lvl))}”.`, '🌿', this.halinaShake());
    } else if (k === 'halina_portret') {
      this.say('Portret cioci Jadzi', lvl >= 2 ? pick(Math.random, HALINA_PORTRAIT) : 'Ciocia Jadzia uśmiecha się z ramki. Pod spodem ktoś dopisał ołówkiem: „co 3 dni”.', '🖼️', lvl >= 2 ? this.halinaShake() : 0);
    } else if (k === 'halina_szarlotka') {
      if (h.pieDay === s.day) { this.say('Szarlotka', 'Talerzyk jest pusty. Halina już kroi następny kawałek — na jutro.', '🥧'); return true; }
      h.pieDay = s.day; s.energy = Math.min(100, s.energy + 10); audio.coin(); this.updateHUD(); this.save();
      this.say('Szarlotka Pani Haliny', lvl >= 3 ? 'Szarlotka jest ciepła. Między jabłkami coś zielonego… Liść? Nie. Cynamon. Na pewno cynamon. +10 energii.' : 'Szarlotka jest ciepła. Zawsze jest ciepła. Nikt nigdy nie widział, kiedy Halina piecze. +10 energii.', '🥧');
    }
    return true;
  },
  // podlewanie monstery cioci Jadzi (i każdej innej monstery stojącej w domu)
  halinaWater(key) {
    const h = this.halinaData(), name = 'Monstera cioci Jadzi';
    if (!this.halinaThirsty()) return this.say(name, `${pick(Math.random, HALINA_FULL)} Następne podlewanie: dzień ${this.halinaDue()}.`, '🌿');
    if (h.done.includes(key)) return this.say(name, 'Ta już piła. Ziemia ciemnieje od wody.', '🌿');
    h.done.push(key); audio.pickup();
    const [x, y] = key.split(',').map(Number);
    (this._halinaDrops = this._halinaDrops || []).push({ x: x * 16 + 8, y: y * 16 - 6, t0: performance.now() });
    if (!this.halinaLeft()) return this.halinaComplete();
    const all = this.homeMonsteras().length;
    this.toast(`💧 Monstera pije. (${all - this.halinaLeft()}/${all})`);
    this.save();
  },
  halinaComplete() {
    const h = this.halinaData(), late = this.halinaLevel(), first = !h.learned;
    h.w = this.state.day; h.done = []; h.learned = true;
    this._halinaTension = 0; this._halinaNagAt = null;
    this.addMoney(5); audio.coin();
    const thanks = late >= 3 ? 'Monstera pije łapczywie. Gdzieś na Osiedlu siedem liści odwraca się z ulgą. Chyba już się nie gniewają.'
      : late ? 'Monstera pije. Trochę się spóźniło, ale ona wybacza. Prawie zawsze.'
      : 'Monstera pije i jakby prostuje liście. Ciocia Jadzia byłaby dumna.';
    const card = first ? `<div class="scroll-fact mt"><b>🧠 Czy wiesz, że… ta monstera to czysta psychologia?</b><br>
      Bluma Zeigarnik (1927), studentka Kurta Lewina (tego od Wyspy Lewina), opisała, że przerwane zadania pamiętamy lepiej niż ukończone.
      Jej koleżanka Maria Owsiankina (1928) zauważyła coś innego: do przerwanego zadania nas <i>ciągnie</i> — chcemy je dokończyć.
      Metaanaliza prawie stu lat badań (Ghibellini i Meier, 2025) pokazała, że przewagi pamięciowej zwykle nie widać, za to skłonność do powrotu do niedokończonej sprawy jest silna i powtarzalna.
      Monstera, która „nie daje ci spokoju”, to efekt Owsiankiny w doniczce.</div>` : '';
    this.openModal(this.panel('🌿 Monstera cioci Jadzi podlana', `<p>${esc(thanks)}</p><p class="small mt">+5 🟡 · następne podlewanie za ${HALINA_EVERY} dni (dzień ${h.w + HALINA_EVERY}).</p>${card}`,
      '<button class="btn btn-green" data-close>Do zobaczenia za 3 dni</button>', 'narrow'));
    this.save(); this.updateHUD();
  },
  halinaLetterDue() { const h = this.halinaData(); return this.halinaLevel() >= 3 && h.letterFor !== h.w; },
  showHalinaLetter() {
    const h = this.halinaData(), dry = this.state.day - h.w;
    h.letterFor = h.w; audio.pickup();
    const text = `Kochanie!\n\nNa Maderze wszystko dobrze. Ocean szumi. Szumi jakoś dziwnie. Jakby liśćmi.\n\nHalina pisze, że moja monstera nie piła od ${dry} dni. Na pewno się myli. Prawda?\n\nOna jest bardzo wrażliwa. Rośnie, gdy ją chwalisz. Usycha, gdy o niej zapominasz.\n\nStoi u ciebie przy oknie.\nStoi u ciebie przy oknie.\nStoi u ciebie przy oknie.\n\nBuziaki,\nCiocia Jadzia\n\nPS. Nie odpisuj. Po prostu podlej. Siostry u Haliny też pytają.`;
    this.showLetter('Ciocia Jadzia', shakyHTML(text, Math.max(1, this.halinaShake())), () => this.save());
  },

  /* ---------- rysowanie ---------- */
  // płaskie elementy izby Haliny (pod meblami): dywan, zegar, portret
  drawHalinaRoom(Z, t) {
    const ctx = this.ctx, lvl = this.halinaLevel();
    const rug = furnitureSprite('dywan_rorschach'); ctx.drawImage(rug.c, 6 * 16 - 1, 6 * 16 - 1);
    const clock = furnitureSprite('zegar_pawlow'); ctx.drawImage(clock.c, 10 * 16 + Math.round((16 - (clock.c.width - 2)) / 2) - 1, 1);
    // portret cioci Jadzi — oczy podążają za graczem, od grozy 3 czerwienieją
    const fx = 6 * 16 + 4, fy = 5, look = clamp(Math.round((this.player.x - (fx + 12)) / 40), -1, 1);
    R(ctx, fx, fy, 24, 22, '#b8923a'); R(ctx, fx + 2, fy + 2, 20, 18, '#e9dcc0');
    R(ctx, fx + 8, fy + 3, 8, 3, '#9a9a9a'); R(ctx, fx + 7, fy + 5, 10, 3, '#a8a8a8');
    R(ctx, fx + 8, fy + 7, 8, 8, '#f1c9a5');
    const eye = lvl >= 3 ? '#b0182a' : '#2a1a10';
    P(ctx, fx + 10 + look, fy + 10, eye); P(ctx, fx + 13 + look, fy + 10, eye);
    R(ctx, fx + 10, fy + 13, 4, 1, lvl >= 3 ? '#6a2a2a' : '#b0605a');
    R(ctx, fx + 6, fy + 15, 12, 5, '#7a4f8a');
  },
  // litery rysowane osobno, każda z własnym drgnięciem (świat, nie ekran)
  drawShakyWorldText(ctx, text, cx, y, size, amp, alpha, color, paper) {
    const still = REDUCED_MOTION && REDUCED_MOTION.matches;
    ctx.save();
    ctx.font = `700 ${size}px ${WORLD_FONT}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    // przy drżeniu litery dostają odstęp i skaczą mocniej w pionie niż w poziomie — tekst zostaje czytelny
    const gap = amp ? 0.7 : 0, chars = [...text], widths = chars.map(c => ctx.measureText(c).width + gap), total = widths.reduce((a, b) => a + b, 0);
    if (paper) { ctx.globalAlpha = 0.95; R(ctx, cx - total / 2 - 3, y - size, total + 6, size + 4, paper); }
    ctx.globalAlpha = still && amp ? alpha * (0.7 + 0.3 * Math.sin(performance.now() / 300)) : alpha;
    let x = cx - total / 2;
    chars.forEach((c, i) => {
      const dx = !still && amp ? (Math.random() - 0.5) * 1.2 * amp : 0, dy = !still && amp ? (Math.random() - 0.5) * 2 * amp : 0;
      if (!paper) { ctx.fillStyle = 'rgba(12,20,10,0.85)'; ctx.fillText(c, x + dx + 0.6, y + dy + 0.6); }
      ctx.fillStyle = color; ctx.fillText(c, x + dx, y + dy);
      x += widths[i];
    });
    ctx.restore();
  },
  drawHalina(ctx, W, H, s, cam, t) {
    const Z = this.zone;
    if (!this.state || !this.state.created || !(Z.halina || Z.id === 'osiedle' || Z.id === 'dom')) return;
    const lvl = this.halinaLevel(), thirsty = this.halinaThirsty(), tn = this._halinaTension || 0, amp = this.halinaShake() * 0.32;
    // winieta u Haliny: im dłużej zwlekasz, tym ciemniej na brzegach
    if (Z.halina && tn > 0.01) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.22, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, 'rgba(14,26,14,0)'); g.addColorStop(1, `rgba(14,26,14,${(0.3 + lvl * 0.08) * tn})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
    ctx.save(); ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
    // siostry u Haliny szepczą na zmianę; im większa groza i napięcie, tym częściej wszystkie naraz
    if (Z.halina && lvl) {
      const pool = this.halinaWhispers(lvl);
      HALINA_MONSTERAS.forEach((m, i) => {
        if (Math.sin(t * 0.8 + i * 2.4) < 0.55 - tn * 1.1 - lvl * 0.1) return;
        const y = m.y * 16 - 14 - (i % 2) * 7 - Math.sin(t * 1.3 + i) * 1.5;
        this.drawShakyWorldText(ctx, pool[Math.floor(t / 2.6 + i * 1.7) % pool.length], m.x * 16 + 8, y, 7, amp, Math.min(1, 0.5 + tn * 0.5 + lvl * 0.08), '#e4f2d0');
      });
    }
    // monstera cioci Jadzi w domu gracza: kropelka w dniu terminu, potem coraz bardziej drżące szepty
    if (Z.id === 'dom' && thirsty) {
      const done = this.halinaData().done, pool = this.halinaHomeWhispers(Math.max(1, lvl));
      Z.objects.filter(o => o.id === 'monstera' && o.placed && !done.includes(o.x + ',' + o.y)).forEach((o, i) => {
        const x = o.x * 16 + 8, y = o.y * 16 - 14 - Math.sin(t * 1.3 + i) * 1.5;
        if (!lvl) { R(ctx, x - 1, y - 2, 2, 1, '#8fd0ee'); R(ctx, x - 2, y - 1, 4, 3, '#5aa8e0'); return; }
        this.drawShakyWorldText(ctx, pool[Math.floor(t / 2.6 + i) % pool.length], x, y, 7, amp, 0.9, '#e4f2d0');
      });
    }
    if (Z.id === 'dom' && this._halinaDrops && this._halinaDrops.length) {
      const now = performance.now();
      this._halinaDrops = this._halinaDrops.filter(d => now - d.t0 < 800);
      this._halinaDrops.forEach(d => { const k = (now - d.t0) / 800; for (let j = 0; j < 5; j++) R(ctx, d.x - 4 + j * 2, d.y + k * 12 + (j % 2) * 3, 1, 2, '#6fc0f0'); });
    }
    if (Z.id === 'osiedle' && thirsty) {
      const b = Z.buildings.find(x => x.kind === 'halina');
      if (b) {
        // karteczka przypięta do drzwi Haliny + napis nad dachem (szyld na fasadzie zostaje czytelny)
        R(ctx, b.doorCol * 16 + 5, b.doorRow * 16 + 3, 6, 5, '#f6efd8'); R(ctx, b.doorCol * 16 + 7, b.doorRow * 16 + 3, 2, 1, '#b0182a');
        this.drawShakyWorldText(ctx, HALINA_DOOR_NOTE[lvl], b.x * 16 + b.w * 8, b.Y + 4, 7, lvl ? amp : 0, 1, lvl >= 3 ? '#8a1c2c' : '#3a2a1a', '#f6efd8');
      }
    }
    ctx.restore();
  }
});

/* =====================================================================
   ZAPIS I PANEL TESTERKI — autozapis co 20 s, kopia zapisu w pliku
   (okno „💾 Zapis gry”) i ukryty panel pod F9 do swobodnego testowania.
   Zapis siedzi w localStorage przypisanym do adresu strony (host + port).
   ===================================================================== */
const AUTOSAVE_EVERY = 20;   // sekund czasu rzeczywistego
const TESTER_CHECKPOINT_KEY = 'akademia_freudowice_punkt_kontrolny';
const testerBase = { update: Game.prototype.update, bindInput: Game.prototype.bindInput };

Object.assign(Game.prototype, {
  update(dt) {
    testerBase.update.call(this, dt);
    if (!this.state || !this.state.created) return;
    this._autoSaveT = (this._autoSaveT || 0) + dt;
    if (this._autoSaveT >= AUTOSAVE_EVERY) { this._autoSaveT = 0; this.save(); }
  },
  bindInput() {
    testerBase.bindInput.call(this);
    window.addEventListener('keydown', e => {
      if (e.code !== 'F9' || e.repeat) return;
      e.preventDefault();
      if (this.modalOpen && this._testerOpen) this.closeModal(true); else this.openTesterPanel();
    });
  },

  /* ---------- kopia zapisu w pliku ---------- */
  saveFileName() {
    const name = String(this.state.player.name || '').trim().replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-+|-+$/g, '') || 'postac';
    return `akademia-zapis-${name}-dzien${this.state.day}.json`;
  },
  exportSaveText() { this.save(); return JSON.stringify(this.state); },
  // przyjmuje plik JSON albo dawny „kod zapisu” (base64) z okna zapisu
  parseSaveText(text) {
    const raw = String(text || '').trim();
    let data;
    try { data = JSON.parse(raw); } catch (e) { data = JSON.parse(decodeURIComponent(escape(atob(raw)))); }
    if (!data || typeof data !== 'object' || !data.player || !data.v) throw new Error('To nie jest zapis Akademii.');
    return data;
  },
  applyImportedSave(data) {
    this.closeModal(true); this.closeDialog(true);
    this.state = deepMerge(this.newState(), data);
    this.state.created = true;
    this.zones = {};
    this.save(); this.startWorld(); this.updateHUD();
  },
  downloadSave() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([this.exportSaveText()], { type: 'application/json' }));
    a.download = this.saveFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    this.toast('⬇️ Pobrano plik zapisu: ' + a.download, 4000);
  },
  importSaveFile(file) {
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      let data;
      try { data = this.parseSaveText(rd.result); } catch (e) { this.toast('✕ Ten plik nie wygląda na zapis Akademii.', 4000); return; }
      const who = `${data.player.name || 'bez imienia'}, dzień ${data.day || 1}`;
      this.closeModal(true);
      this.showDialogue({ name: 'Wczytać zapis?', emoji: '📂', pages: [`Plik: ${who}. Obecny postęp w tej przeglądarce zostanie zastąpiony. Jeśli chcesz go zachować, najpierw pobierz jego kopię.`],
        options: [{ label: 'Tak, wczytaj', fn: () => { this.applyImportedSave(data); this.toast('📂 Wczytano zapis: ' + who, 4000); } }, { label: 'Nie, zostaw', fn: null }] });
    };
    rd.readAsText(file);
  },

  /* ---------- panel testerki (F9) ---------- */
  openTesterPanel() {
    if (!this.state || !this.state.created) return;
    const s = this.state, lvl = this.halinaThirsty() ? this.halinaLevel() : null;
    let cp = null; try { cp = JSON.parse(localStorage.getItem(TESTER_CHECKPOINT_KEY) || 'null'); } catch (e) {}
    const b = (act, arg, label, on) => `<button class="btn btn-sm ${on ? 'btn-purple' : ''}" data-tester="${act}" data-arg="${arg}">${label}</button>`;
    const zones = [['dom', '🏠 Twój dom'], ['halina', '🌿 Dom Pani Haliny'], ...Object.keys(ZONES).map(id => [id, `${ZONES[id].icon} ${ZONES[id].name}`])];
    const body = `<p class="small muted">Tylko do testów. Zmiany zapisują się jak zwykła gra — przed eksperymentem zapamiętaj punkt kontrolny.</p>
      <div class="card mt"><b>📌 Punkt kontrolny</b><p class="small">${cp ? `Zapamiętany: ${esc(cp.player.name || '')} · dzień ${cp.day} · ${new Date(cp.savedAt).toLocaleString('pl-PL')}` : 'Brak zapamiętanego punktu.'}</p>
        <div class="row">${b('checkpoint-save', '', '📌 Zapamiętaj stan')}${cp ? b('checkpoint-load', '', '↩️ Wróć do punktu') : ''}</div></div>

      <div class="card mt"><b>🌿 Monstera cioci Jadzi</b> <span class="small">${lvl == null ? 'napojona' : lvl ? 'groza ' + lvl : 'dziś termin'}</span>

      <div class="card mt"><b>🎒 Zasoby i sen</b><div class="row mt" style="flex-wrap:wrap">${b('money', '', '🟡 +100 Dopaminek')}${b('energy', '', '⚡ Pełna energia')}${b('dream-reset', '', '🌙 Odnów trening snu')}</div></div>
      <div class="card mt"><b>🗺️ Przenieś do</b><div class="row mt"><select id="tester-zone" class="text-in grow">${zones.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('')}</select>${b('goto-select', '', 'Idź')}</div></div>`;
    const m = this.openModal(this.panel('🧪 Panel testerki [F9]', body, '<button class="btn" data-close>Zamknij</button>', 'narrow'), { onClose: () => { this._testerOpen = false; } });
    this._testerOpen = true;
    m.querySelectorAll('[data-tester]').forEach(el => el.addEventListener('click', () => {
      const act = el.dataset.tester, arg = el.dataset.arg;
      if (act === 'goto-select') this.testerAction('goto', m.querySelector('#tester-zone').value);
      else this.testerAction(act, /^\d+$/.test(arg) ? Number(arg) : arg);
    }));
  },
  testerAction(act, arg) {
    const s = this.state, dream = !!this.dreamSession();
    const refresh = () => { this.save(); this.updateHUD(); if (this._testerOpen) this.openTesterPanel(); };
    if (act === 'checkpoint-save') {
      this.save();
      try { localStorage.setItem(TESTER_CHECKPOINT_KEY, JSON.stringify(s)); this.toast('📌 Zapamiętano punkt kontrolny.'); } catch (e) { this.toast('✕ Nie udało się zapamiętać punktu.'); }
      return refresh();
    }
    if (act === 'checkpoint-load') {
      let data = null; try { data = this.parseSaveText(localStorage.getItem(TESTER_CHECKPOINT_KEY)); } catch (e) {}
      if (!data) return this.toast('Brak punktu kontrolnego.');
      this.applyImportedSave(data); this.toast('↩️ Przywrócono punkt kontrolny.');
      return;
    }
    if (dream && (act === 'next-day' || act === 'goto')) { this.toast('Najpierw obudź się ze snu (☀).'); return; }
    if (act === 'next-day') { this.newDay(false); this.toast(`⏭ Dzień ${s.day}.`); }
    else if (act === 'hour') s.time = Math.min(PASS_OUT - 5, s.time + 60);
    else if (act === 'monstera') {
      const h = this.halinaData();
      h.w = arg === 'podlana' ? s.day : s.day - HALINA_EVERY - (arg === 'termin' ? 0 : Number(arg));
      h.done = []; h.letterFor = null; h.remindDay = 0; this._halinaNagAt = null;
    }
    else if (act === 'money') this.addMoney(100);
    else if (act === 'energy') s.energy = 100;
    else if (act === 'dream-reset') { if (!dream) this.dreamData().daily.trainingDay = 0; }
    else if (act === 'goto') {
      this.closeModal(true);
      if (arg === 'dom') this.goZone('dom', 7 * 16, 9 * 16 + 4, 'up', { after: () => this.halinaHomeReminder() });
      else if (arg === 'halina') this.goZone('halina', 7 * 16, 9 * 16 + 4, 'up', { after: () => this.halinaOnEnter() });
      else if (ZONES[arg]) this.goZone(arg, 20 * 16, 14 * 16, 'down');
      return;
    }
    refresh();
  }
});

window.addEventListener('load', () => {
  game = new Game();
  window.game = game;
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try { game.update(dt); game.render(); } catch (e) { console.error(e); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});

  function npFreeSpot(B, px, py) {

    Z.objects.forEach(o => { if (['bench', 'cafetable', 'bleachers', 'haystack', 'parasol', 'deckchair', 'crate'].includes(o.type) && !o.interact) Z.interacts.push({ x: o.x, y: o.y, w: o.fw, h: o.fh, kind: 'np_reflect', seat: o.type }); });
    Z.flats.forEach(f => { if (f.type === 'stump') Z.interacts.push({ x: f.x, y: f.y, w: 1, h: 1, kind: 'np_reflect', seat: 'stump' }); });

      const X0 = 31, Y0 = 19, X1 = 38, Y1 = 24, inR = (x, y) => x >= X0 && x < X1 && y >= Y0 && y < Y1;
      Z.objects = Z.objects.filter(o => o.type === 'building' || !inR(o.x, o.y));
      Z.flats = Z.flats.filter(f => !inR(f.x, f.y));
      Z.interacts = Z.interacts.filter(it => !inR(it.x, it.y));
      for (let y = Y0; y < Y1; y++) for (let x = X0; x < X1; x++) Z.solid[B.i(x, y)] = 0;

         <div class="row" style="gap:6px;justify-content:center">${[1, 2, 3, 4, 5].map(v => `<button class="btn btn-sm" data-rate="${v}">${v}</button>`).join('')}</div>
         <p class="tiny muted center">1 — wcale · 5 — idealnie</p>`, '', 'narrow'));
      m.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => this.npGraphReveal(+b.dataset.rate)));
    },
    npGraphReveal(r) {
      const s = this.state, np = this.npData();
      const first = np.graphDay !== s.day;
      np.graphDay = s.day;
      if (first) this.addXP(5, 'archiwum');
      this.openModal(this.panel('🔍 Demaskowanie',
        `<div class="fb ${r >= 4 ? 'bad' : 'ok'} mb">Oceniasz trafność na <b>${r}/5</b>. ${r >= 4 ? 'Większość osób ocenia podobnie wysoko…' : 'Czujność! Mało kto ocenia ten opis tak nisko.'}</div>
         <p class="mb"><b>Każda osoba, która się tu podpisze, dostaje DOKŁADNIE ten sam opis</b> — niezależnie od pisma. To <b>efekt Barnuma</b> (inaczej efekt Forera).</p>
         <p class="small mb">W 1949 r. Bertram Forer dał studentom „indywidualne” profile osobowości. Każdy dostał ten sam tekst, złożony z ogólników wziętych m.in. z horoskopów. Średnia ocen trafności: ponad 4 w skali 0–5.</p>
         <p class="small mb">A sama grafologia? W metaanalizie Neter i Ben-Shakhar (1989) grafolodzy przewidywali wyniki w pracy nie lepiej niż osoby bez żadnego szkolenia, a gdy tekst nie zdradzał treści (np. przepisany fragment), trafność spadała prawie do zera. W zestawieniu metod rekrutacji Schmidta i Huntera (1998) trafność grafologii to ok. 0,02 — praktycznie zero.</p>
         <p class="small mb">Dlaczego to działa? Opis jest <b>ogólny</b> („czasem bywasz…”), <b>pochlebny</b>, podany przez <b>autorytet</b> i w <b>osobistej</b> formie. Tak samo działają horoskopy i internetowe „testy osobowości”.</p>
         <p class="tiny muted">Źródła: Forer, B. R. (1949). The fallacy of personal validation. <i>Journal of Abnormal and Social Psychology</i>, 44, 118–123 · Neter, E., Ben-Shakhar, G. (1989). <i>Personality and Individual Differences</i>, 10, 737–745 · Schmidt, F. L., Hunter, J. E. (1998). <i>Psychological Bulletin</i>, 124, 262–274.</p>
         ${first ? '<p class="center"><span class="tag gold">+5 XP · Archiwum Szarlatanerii</span></p>' : ''}`,
        '<button class="btn btn-gold" data-close>Dzięki, Panie Grafologu</button>', 'narrow'));
      this.save();
    },

    /* ----- rysowanie: numery domów, serduszka kaczek, chmurka myśli ----- */
    drawLabels(s, cam, t) {
      npBase.drawLabels.call(this, s, cam, t);
      if (this.scene !== 'world' || !this.zone) return;
      this.npDrawHouseNumbers(s, cam);
      this.npDrawHearts(s, cam);
      this.npDrawThought(s, cam);
    },
    npDrawHouseNumbers(s, cam) {
      const Z = this.zone, ctx = this.ctx;
      if (!Z.buildings || !Z.buildings.length) return;
      if (!Z._npNums) {
        Z._npNums = new Map();
        Z.buildings.slice().sort((a, b) => a.x - b.x || a.y - b.y).forEach((b, i) => Z._npNums.set(b, i + 1));
      }
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.max(7, Math.round(s * 3.4))}px ${WORLD_FONT}`;
      Z._npNums.forEach((n, b) => {
        const x = Math.round((b.doorCol * 16 + 18 - cam.x) * s), y = Math.round(((b.y + b.h) * 16 - 19 - cam.y) * s);
        if (x < -30 || y < -30 || x > this.canvas.width + 30 || y > this.canvas.height + 30) return;
        const w = Math.round(s * (n > 9 ? 8 : 6)), h = Math.round(s * 5);
        ctx.fillStyle = '#f4f0e6'; ctx.fillRect(x - Math.round(w / 2) - 1, y - Math.round(h / 2) - 1, w + 2, h + 2);
        ctx.fillStyle = '#1f4fa0'; ctx.fillRect(x - Math.round(w / 2), y - Math.round(h / 2), w, h);
        ctx.fillStyle = '#ffffff'; ctx.fillText(String(n), x, y + 1);
      });
      ctx.restore();
    },
    npDrawHearts(s, cam) {
      const now = performance.now(), ctx = this.ctx;
      this.npcs.forEach(n => {
        if (!n.npHeart || n.npHeart < now) return;
        const k = 1 - (n.npHeart - now) / 2600;
        ctx.save(); ctx.globalAlpha = Math.min(1, (1 - k) * 2); ctx.textAlign = 'center';
        ctx.font = `700 ${Math.round(s * 5)}px ${WORLD_FONT}`; ctx.fillStyle = '#e0406a';
        ctx.fillText('♥', (n.x - cam.x) * s, (n.y - 14 - k * 10 - cam.y) * s);
        ctx.restore();
      });
    },
    npDrawThought(s, cam) {
      const q = this.npT().thoughts;
      if (!q.length) return;
      const th = q[0], now = performance.now();
      if (!th.t0) th.t0 = now;
      const age = now - th.t0;
      if (age > th.ms) { q.shift(); return; }
      const ctx = this.ctx, p = this.player, W = this.canvas.width;
      const fs = Math.max(12, Math.round(s * 3.5)), lh = Math.round(fs * 1.25);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, age / 250, (th.ms - age) / 400));
      ctx.font = `600 ${fs}px ${WORLD_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const lines = npWrap(ctx, th.text, Math.min(W - 48, fs * 17));
      const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + fs * 1.4, bh = lines.length * lh + fs * 0.9;
      const hx = (p.x - cam.x) * s, hy = (p.y - 30 - cam.y) * s;
      const bx = clamp(hx - bw / 2, 8, W - bw - 8), by = Math.max(8, hy - bh - fs * 1.7);
      ctx.fillStyle = '#fffdf6'; ctx.strokeStyle = '#3a2616'; ctx.lineWidth = Math.max(1.5, s * 0.5);
      [[fs * 0.2, fs * 0.3], [fs * 0.34, fs * 1.0]].forEach(([r, dy]) => { ctx.beginPath(); ctx.arc(hx + r, hy - dy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
      npRound(ctx, bx, by, bw, bh, fs * 0.7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3a2616';
      lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + fs * 0.45 + i * lh));
      ctx.restore();
    }
  });
})();
</script>

  /* ---------- style ---------- */

  /* ---------- dane i rysowanie mapy ---------- */
  function mapZone(game, id) {

  }
  // układ świata liczony z danych: nowa wyspa czy przedmieście Ψ pojawi się samo

  }
  function zonePic(Z, P) {
    if (!Z._mapImg) Z._mapImg = {};
    if (Z._mapImg[P]) return Z._mapImg[P];
    const [c, g] = mkCanvas(Z.w * P, Z.h * P);
    const pal = Object.assign({}, DEFAULT_PAL, Z.pal || {});
    for (let y = 0; y < Z.h; y++) for (let x = 0; x < Z.w; x++) {
      const t = Z.terrain[y * Z.w + x];
      g.fillStyle = pal[t] || DEFAULT_PAL[t] || '#8a8a8a';
      g.fillRect(x * P, y * P, P, P);
      if (P >= 12 && ((x + y) & 1)) { g.fillStyle = 'rgba(0,0,0,0.035)'; g.fillRect(x * P, y * P, P, P); }
    }
    (Z.hedges || []).forEach(h => { g.fillStyle = '#3f7a3a'; g.fillRect(h.x * P, h.y * P, P, P); });
    Z.objects.forEach(o => {
      if (!MAP_TREES.has(o.type)) return;
      const cx = (o.x + o.fw / 2) * P, cy = (o.y + o.fh / 2) * P, r = Math.max(1.5, P * (o.type === 'tree' ? 0.55 : 0.4));

    if (P >= 12) Z.objects.forEach(o => {
      if (o.type === 'building' || MAP_TREES.has(o.type) || o.solid === false) return;
      const x = o.x * P, y = o.y * P, w = o.fw * P, h = o.fh * P, pad = Math.round(P * 0.18);
      g.fillStyle = 'rgba(62,50,40,0.38)'; g.fillRect(x + pad, y + pad, w - 2 * pad, h - 2 * pad);
      g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(x + pad, y + pad, w - 2 * pad, 2);
    });
    Z.buildings.forEach(b => {

      g.fillStyle = shade(b.roof || '#6a5a5a', -0.35); g.fillRect(x - 1, y - 1, w + 2, h + 2);

  function pill(g, text, x, y, opts = {}) {

  function dashed(g, x1, y1, x2, y2, col, label) {

    g.strokeStyle = 'rgba(20,20,30,0.45)'; g.lineWidth = 5; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();

    g.beginPath(); g.arc(x, y, 5.5, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
    if (label) pill(g, label, x, y - 30, { center: true, bg: '#e0344a', color: '#fff', font: `400 10px ${PIXEL_FONT}` });
  }
  function objCenter(o, P, ox = 0, oy = 0) { return [ox + (o.x + o.fw / 2) * P, oy + (o.y + o.fh / 2) * P]; }

  /* ---------- niebo z latarni ---------- */
  function skyAt(m) {
    let k = 0;
