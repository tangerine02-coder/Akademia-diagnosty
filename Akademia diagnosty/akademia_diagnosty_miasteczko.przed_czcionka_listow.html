        pill(g, seen ? `${z.icon} ${z.name}` : dream ? '≈≈≈ ≈≈' : (c.group === 'wyspy' ? 'Nieodkryta wyspa' : 'Nieodkryte'), c.x + 4, c.y + 4);
      });
      if (!dream && here.zone && byId[here.zone] && here.x != null) {
        const c = byId[here.zone];
        drawMarker(g, c.x + here.x * MAP_P, c.y + here.y * MAP_P, t, 'TU JESTEŚ');
      }
    },
    mapDrawZone(g, id, st, t, here) {
      const Z = mapZone(this, id), P = MAP_PZ, nums = houseNums(Z);
      g.clearRect(0, 0, Z.w * P, Z.h * P);
      g.drawImage(zonePic(Z, P), 0, 0);
      g.save(); g.font = '18px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      Z.objects.forEach(o => {
        const ic = o.interact === 'np_info' ? '🪧' : MAP_ICONS[o.type];
        if (ic) { const [x, y] = objCenter(o, P); g.fillText(ic, x, y); }
      });
      g.restore();
      Z.buildings.forEach(b => {
        const x = b.x * P, y = b.y * P, w = b.w * P, h = b.h * P;
        if ((st.hover && st.hover.b === b) || st.sel === b) { g.strokeStyle = st.sel === b ? '#ffd23f' : '#ffffff'; g.lineWidth = 4; g.strokeRect(x - 2, y - 2, w + 4, h + 4); }
        const lab = bLabel(b);
        if (lab) pill(g, lab, x + w / 2, y + 4, { center: true, font: `600 12px ${WORLD_FONT}`, h: 18 });
        const n = nums.get(b);
        if (n) pill(g, String(n), b.doorCol * P + P + 4, (b.doorRow + 1) * P - 18, { bg: '#1f4fa0', color: '#fff', stroke: '#f4f0e6', font: `400 10px ${PIXEL_FONT}`, h: 14 });
      });
      if (here.zone === id && here.x != null) drawMarker(g, here.x * P, here.y * P, t, here.inside ? 'TU JESTEŚ (w środku)' : 'TU JESTEŚ');
    },
    mapZoneInfo(id) {
      const z = ZONES[id], Z = mapZone(this, id);
      const n = Z.buildings.length;
      return `<b>${z.icon} ${esc(z.name)}</b> <span class="muted">— ${esc(z.motto || '')}</span><br><span class="muted">${n} ${n === 1 ? 'budynek' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'budynki' : 'budynków'} · kliknij budynek, żeby zobaczyć, co w nim jest.</span>`;
    },
    mapBuildingInfo(b, num) {
      const s = this.state, bar = (d, n) => `<div class="prog"><i style="width:${Math.round(d / Math.max(1, n) * 100)}%"></i></div>`;
      let desc = '', prog = '';
      if (b.subject && SUBJECTS[b.subject]) {
        const S = SUBJECTS[b.subject], d = this.subjDoneCount(b.subject);
        desc = `${S.icon} Dom przedmiotu: <b>${esc(S.subject)}</b> · pokoje ukończone: ${d}/${S.rooms.length}`;
        prog = bar(d, S.rooms.length);
      } else if (b.loc && LOCATIONS[b.loc]) {
        const Lc = LOCATIONS[b.loc], all = this.questionsFor(b.loc), done = all.filter(q => s.stats.answeredQuestions[q.id]).length;
        desc = `${Lc.icon} Katedra · poziom ${this.unlockedLevel(b.loc)} · pytania: ${done}/${all.length}`;
        prog = bar(done, all.length);
      } else if (MAP_KIND_DESC[b.kind]) desc = MAP_KIND_DESC[b.kind];
      else if (b.locked) desc = esc(b.locked);
      else desc = '<span class="muted">Mieszkańcy nie przyjmują dziś gości.</span>';
      return `<b>${num ? `<span class="map-no">${num}</span>` : ''}${esc(bName(b))}</b><br>${desc}${prog}`;
    },

    /* ---------- Latarnia Wglądu ---------- */
    openLighthouse() {
      mapStyles();
      const md = this.mapData(), first = !md.odkryta;
      if (first) { md.odkryta = true; md.odkrytaDnia = this.state.day; }
      const m = this.openModal(this.panel('🗼 Latarnia Wglądu',
        `<canvas id="lh-cv" class="map-cv lh-cv" width="720" height="360"></canvas>
         <p class="small mt" id="lh-time"></p><p class="small" id="lh-fact"></p>
         ${first ? '<div class="card hl small mt">🗺️ <b>Z latarni widać cały świat — mgła na mapie zniknęła!</b> Dzielnice i wyspy zobaczysz teraz na mapie (klawisz M), choć żeby je naprawdę poznać, i tak trzeba tam pójść.</div>' : ''}`,
        '<button class="btn" id="lh-map">🗺️ Mapa świata</button><span class="grow"></span><button class="btn" data-close>Zejdź na dół</button>', 'wide'),
        { onClose: () => { if (first) this.think(`Stąd widać wszystko — nawet miejsca, w których jeszcze nie ${this.gf('byłam', 'byłem')}.`); } });
      if (first) { audio.click(); this.save(); }
      m.querySelector('#lh-map').addEventListener('click', () => { audio.click(); this.closeModal(true); this.showMap(); });
      const cv = m.querySelector('#lh-cv'), tEl = m.querySelector('#lh-time'), fEl = m.querySelector('#lh-fact'), t0 = performance.now();
      const nIsles = ISLE_GRID.flat().filter(Boolean).length;
      let lastFact = '', lastTime = '';
      const loop = () => {
        if (!cv.isConnected) return;
        const s = this.state, mm = ((s.time % 1440) + 1440) % 1440, t = (performance.now() - t0) / 1000;
        drawSky(cv.getContext('2d'), cv.width, cv.height, mm, s.day, t, nIsles);
        const ph = MOON_PHASES[moonPhaseIdx(s.day)], moonUp = mm >= 1140 || mm <= 420;
        const tl = `🕐 ${hhmm(mm)} · ${ph[0]} Księżyc: ${ph[1]}${moonUp ? '' : ' (teraz pod horyzontem)'}`;
        if (tl !== lastTime) { tEl.textContent = tl; lastTime = tl; }
        const f = lhFact(mm, s.day);
        if (f !== lastFact) { fEl.innerHTML = f; lastFact = f; }
        requestAnimationFrame(loop);
      };
      loop();
      return m;
    },

    useSpot(it) {
      if (it && it.kind === 'latarnia') return this.openLighthouse();
      return mapBase.useSpot.call(this, it);
    },
    spotPrompt(it) {
      if (it && it.kind === 'latarnia') return 'Wejdź na Latarnię Wglądu';
      return mapBase.spotPrompt.call(this, it);
    }
  });
})();
</script>

<script>
/* =====================================================================
   TABLICZKI Z NUMERAMI DOMÓW (2026-09-30) — każdy właściciel ma inną
   tabliczkę (emalia Pani Haliny z listkiem monstery, zardzewiała blacha
   Archiwum, kredowa tablica kawiarni, lustrzane cyfry Lustra REM…).
   Tabliczka szuka wolnego kawałka ściany przy drzwiach (omija okna, szyld,
   bramę, puste tło) i rysuje się razem z budynkiem: noc ją przyciemnia,
   postać może ją zasłonić. Numery te same co na mapie świata.
   ===================================================================== */
(() => {
  'use strict';

  /* ---------- pikselowe cyfry 3×5 (i rzymskie) ---------- */
  const PL_FONT = {
    '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'], '2': ['111', '001', '111', '100', '111'],
    '3': ['111', '001', '111', '001', '111'], '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'],
    '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'], '8': ['111', '101', '111', '101', '111'],
    '9': ['111', '101', '111', '001', '111'], 'I': ['1', '1', '1', '1', '1'], 'V': ['101', '101', '101', '101', '010'],
    'X': ['101', '101', '010', '101', '101'], 'L': ['100', '100', '100', '100', '111']
  };
  const roman = n => [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']].reduce((a, [v, r]) => { while (n >= v) { a += r; n -= v; } return a; }, '');
  const textW = str => [...str].reduce((a, ch) => a + (PL_FONT[ch] || PL_FONT['0'])[0].length + 1, -1);
  function digits(g, str, cx, cy, col, o = {}) {
    const gl = [...str].map(ch => PL_FONT[ch] || PL_FONT['0']), k = o.k || 1;
    const w = textW(str) * k, seq = o.mirror ? gl.slice().reverse() : gl;
    let x = Math.round(cx - w / 2);
    const y = Math.round(cy - 2.5 * k);
    g.fillStyle = col;
    seq.forEach(f => {
      const fw = f[0].length;
      for (let r = 0; r < 5; r++) for (let c = 0; c < fw; c++) {
        const rr = o.flip ? 4 - r : r, cc = o.mirror ? fw - 1 - c : c;
        if (f[rr][cc] === '1') g.fillRect(x + c * k, y + r * k, k, k);
      }
      x += (fw + 1) * k;
    });
    return w;
  }
  const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  // prostokątna tabliczka z obwódką, zaokrąglonymi rogami i cieniem; zwraca lewy górny róg
  function plate(g, w, h, fill, rim, round = 1) {
    const x = -Math.floor(w / 2), y = -Math.floor(h / 2);
    R(g, x, y + h + 1, w + 1, 1, 'rgba(0,0,0,0.22)');
    R(g, x - 1, y, w + 2, h, rim); R(g, x, y - 1, w, h + 2, rim);
    R(g, x, y, w, h, fill);
    if (round) [[x, y], [x + w - 1, y], [x, y + h - 1], [x + w - 1, y + h - 1]].forEach(([px, py]) => R(g, px, py, 1, 1, rim));
    return { x, y };
  }
  const mask = (g, rows, ox, oy, col) => rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') R(g, ox + c, oy + r, 1, 1, col); }));
  const HEART = ['..111.111..', '.111111111.', '11111111111', '11111111111', '.111111111.', '..1111111..', '...11111...', '....111....', '.....1.....'];

  /* ---------- katalog tabliczek: size(n) → [szer, wys], draw(g, n, t) wokół (0,0) ---------- */
  const std = (extraW, h) => n => [Math.max(9, textW(String(n)) + extraW), h];
  const PLATES = {
    emalia: { name: 'Niebieska emalia', size: std(4, 7), draw(g, n) { const { x, y } = plate(g, this.size(n)[0], 7, '#1f4fa0', '#f4f0e6'); R(g, x, y, this.size(n)[0], 1, '#3b6cc4'); digits(g, String(n), 0, 0.5, '#ffffff'); } },
    halina: { name: 'Owal z listkiem monstery', size: n => [textW(String(n)) + 10, 9], draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 9, '#fbf8ef', '#2f5fa8');
      R(g, x, y, 1, 2, '#2f5fa8'); R(g, x + w - 1, y, 1, 2, '#2f5fa8'); R(g, x, y + 7, 1, 2, '#2f5fa8'); R(g, x + w - 1, y + 7, 1, 2, '#2f5fa8');
      digits(g, String(n), -2, 0, '#2f5fa8');
      mask(g, ['.11', '1.1', '111', '.1.'], x + w - 5, y + 2, '#3f8a3a');
    } },
    drewno: { name: 'Deska z wypalonym numerem', size: std(7, 7), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 7, '#b07a45', '#5a3a1e', 0);
      R(g, x + 1, y + 1, w - 3, 1, '#c48c52'); R(g, x + 2, y + 5, w - 4, 1, '#8f5f30');
      digits(g, String(n), 0, 0.5, '#3a2412'); R(g, x + 1, y + 3, 1, 1, '#e0e0e0'); R(g, x + w - 2, y + 3, 1, 1, '#e0e0e0');
    } },
    ceramika: { name: 'Ceramika z kwiatkiem', size: std(7, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#f6efdc', '#3f6ea8');
      R(g, x + 1, y + 1, 1, 1, '#e86a8a'); R(g, x + 2, y + 1, 1, 1, '#f2c94c'); R(g, x + 1, y + 2, 1, 1, '#e86a8a');
      digits(g, String(n), 1, 0.5, '#2f4f8a');
    } },
    kafel: { name: 'Zielony kafel', size: std(7, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#d8efc8', '#3f7a3a');
      R(g, x + w - 2, y + 1, 1, 2, '#4caf50'); R(g, x + w - 3, y + 1, 1, 1, '#4caf50');
      digits(g, String(n), -1, 0.5, '#2f5a2a');
    } },
    rodzina: { name: 'Domek (Klinika Rodziny)', size: std(6, 7), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 7, '#f4c98a', '#8a4a2a', 0);
      for (let r = 1; r <= 3; r++) R(g, x + r - 2, y - r, w - 2 * r + 4, 1, r === 3 ? '#8a4a2a' : '#b8543a');
      digits(g, String(n), 0, 0.5, '#5a2a1a');
    } },
    sklep: { name: 'Płaska żółto-niebieska', size: std(5, 7), draw(g, n) { const [w] = this.size(n), { x, y } = plate(g, w, 7, '#f2c94c', '#1f3f8a', 0); R(g, x, y + 6, w, 1, '#1f3f8a'); digits(g, String(n), 0, -0.5, '#1f3f8a'); } },
    mosiadz: { name: 'Mosiądz z nitami', size: std(8, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#c9a13a', '#6a4a12');
      R(g, x, y, w, 1, '#f3d98a'); R(g, x, y, 1, 8, '#e3c46a');
      [[x + 1, y + 1], [x + w - 2, y + 1], [x + 1, y + 6], [x + w - 2, y + 6]].forEach(([a, b]) => R(g, a, b, 1, 1, '#7a5a1a'));
      digits(g, String(n), 0, 0.5, '#4a3208');
    } },
    kamien: { name: 'Kamień, cyfry rzymskie', size: n => [Math.max(9, textW(roman(n)) + 6), 9], draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 9, '#bdb8ac', '#6f6b62', 0);
      [[1, 1], [w - 3, 6], [3, 7], [w - 2, 2]].forEach(([a, b]) => R(g, x + a, y + b, 1, 1, '#a8a398'));
      digits(g, roman(n), 0, 0.5, '#34322c');
    } },
    apteka: { name: 'Apteka z krzyżykiem', size: std(10, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#fbfbf6', '#2f8a4a');
      R(g, x + 2, y + 3, 3, 1, '#2f9a4a'); R(g, x + 3, y + 2, 1, 3, '#2f9a4a');
      digits(g, String(n), 3, 0.5, '#1f5a32');
    } },
    biblio: { name: 'Sygnatura biblioteczna', size: std(6, 10), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 10, '#f4efe0', '#7a4b3a', 0);
      R(g, x, y, w, 1, '#b8475f');
      for (let i = 1; i < w - 1; i++) if ((i * 7) % 3) R(g, x + i, y + 8, 1, 1, '#3a3a3a');
      digits(g, String(n), 0, -0.5, '#3a2a22');
    } },
    kreda: { name: 'Kredowa tablica', size: std(7, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#2a3430', '#8a5a2a', 0);
      R(g, x + 1, y + 6, 2, 1, '#6a7470'); R(g, x + w - 3, y + 1, 1, 1, '#4a5450');
      digits(g, String(n), 0, 0, 'rgba(244,244,236,0.92)');
    } },
    poczta: { name: 'Pocztowa, żółto-czerwona', size: std(8, 7), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 7, '#f2c94c', '#c0392b');
      R(g, x + 1, y + 3, 2, 1, '#c0392b'); R(g, x + 2, y + 2, 1, 3, '#c0392b');
      digits(g, String(n), 2, 0.5, '#c0392b');
    } },
    dymek: { name: 'Dymek z rozmowy', size: std(5, 7), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 7, '#ffffff', '#5a4a3a');
      R(g, x + 1, y + 8, 2, 1, '#5a4a3a'); R(g, x + 1, y + 7, 2, 1, '#ffffff'); R(g, x, y + 9, 1, 1, '#5a4a3a');
      digits(g, String(n), 0, 0.5, '#3a3a3a');
    } },
    rdza: { name: 'Zardzewiała, krzywo przybita', size: std(6, 8), draw(g, n) {
      const [w] = this.size(n);
      g.rotate(0.16);
      const { x, y } = plate(g, w, 8, '#8a4a2a', '#3e1e10', 0);
      [[1, 1, '#b8703a'], [w - 3, 5, '#b8703a'], [2, 6, '#5a2a14'], [w - 2, 1, '#5a2a14']].forEach(([a, b, c]) => R(g, x + a, y + b, 2, 1, c));
      digits(g, String(n), 0, 0.5, '#d9c7a4');
      R(g, x + 1, y + 1, 1, 1, '#c8c8c8');
      for (let i = 0; i < 3; i++) R(g, x + w - 3 + i, y + 3 + i, 1, 1, '#3e1e10');
    } },
    magnes: { name: 'Mesmer: z magnesem', size: std(10, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#6a5a7a', '#3a2a4a');
      digits(g, String(n), -2, 0.5, '#f0e0ff');
      mask(g, ['1.1', '1.1', '111'], x + w - 5, y + 2, '#d9534f'); R(g, x + w - 5, y + 2, 1, 1, '#d8d8e0'); R(g, x + w - 3, y + 2, 1, 1, '#d8d8e0');
    } },
    reka: { name: 'Kartka pisana odręcznie', size: n => [15 + String(n).length * 3, 9], draw(g, n) {
      const [w] = this.size(n);
      g.rotate(-0.08);
      plate(g, w, 9, '#f4ecd4', '#b8a888', 0);
      R(g, 0, -5, 1, 1, '#d9534f');
      g.fillStyle = '#23235e'; g.font = `italic 600 6px ${WORLD_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('nr ' + n, 0, 1);
    } },
    gwiazdy: { name: 'Granat z gwiazdkami', size: std(8, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#1a2450', '#d9b44a');
      [[1, 1], [w - 2, 5], [2, 6], [w - 3, 1]].forEach(([a, b]) => R(g, x + a, y + b, 1, 1, '#fff6c0'));
      digits(g, String(n), 0, 0.5, '#f2d27a');
    } },
    led_g: { name: 'Wyświetlacz LED (zielony)', size: std(6, 8), draw(g, n) { ledDraw(this, g, n, '#6cf07a', '#1c2a20'); } },
    led_r: { name: 'Wyświetlacz LED (czerwony)', size: std(6, 8), draw(g, n) { ledDraw(this, g, n, '#ff5a4a', '#2c1614'); } },
    karta: { name: 'Karta odpowiedzi', size: std(10, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#fbfbf6', '#2f7a3a');
      [[1, 1], [3, 1], [1, 3], [3, 3], [1, 5], [3, 5]].forEach(([a, b], i) => R(g, x + a, y + b, 1, 1, i === 3 ? '#1a1a1a' : '#9ab89a'));
      digits(g, String(n), 3, 0.5, '#1a3a1a');
    } },
    klocki: { name: 'Klocki dziecięce', size: n => [String(n).length * 6 - 1, 7], draw(g, n) {
      const s = String(n), cols = ['#d9534f', '#f2c94c', '#3b8fd8', '#4caf50'];
      [...s].forEach((ch, i) => { const bx = -Math.floor(this.size(n)[0] / 2) + i * 6; R(g, bx, -3 + (i % 2), 5, 7, shade(cols[(n + i) % 4], -0.35)); R(g, bx, -4 + (i % 2), 5, 7, cols[(n + i) % 4]); digits(g, ch, bx + 2.5, -0.5 + (i % 2), '#ffffff'); });
    } },
    szablon: { name: 'Szablon malowany na blasze', size: n => [textW(String(n)) * 2 + 2, 12], draw(g, n) {
      const [w] = this.size(n);
      R(g, -w / 2, -6, w, 12, 'rgba(242,201,76,0.12)');
      digits(g, String(n), 0, 0, 'rgba(242,201,76,0.95)', { k: 2 });
      R(g, -w / 2 + 2, 5, 1, 2, 'rgba(242,201,76,0.8)'); R(g, w / 2 - 3, 5, 1, 1, 'rgba(242,201,76,0.8)');
    } },
    babel: { name: 'Wieża Babel: numer w wielu pismach', size: () => [13, 9], draw(g, n, t) {
      plate(g, 13, 9, '#e8d8a8', '#8a6a3a');
      const k = Math.floor(t / 1.6) % 4, CJK = '一二三四五六七八九十', AR = '٠١٢٣٤٥٦٧٨٩';
      if (k === 0) digits(g, String(n), 0, 0.5, '#5a3a1a');
      else if (k === 1) digits(g, roman(n), 0, 0.5, '#5a3a1a');
      else { g.fillStyle = '#5a3a1a'; g.font = `700 7px ${WORLD_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(k === 2 ? (n <= 10 ? CJK[n - 1] : '十' + (CJK[n - 11] || '')) : [...String(n)].map(d => AR[+d]).join(''), 0, 1); }
    } },
    zegar: { name: 'Tarcza zegara', size: () => [12, 12], draw(g, n) {
      g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.arc(0.5, 1.5, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5a4a3a'; g.beginPath(); g.arc(0, 0, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fbf8ef'; g.beginPath(); g.arc(0, 0, 5, 0, Math.PI * 2); g.fill();
      [[0, -4], [4, 0], [0, 4], [-4, 0]].forEach(([a, b]) => R(g, Math.round(a), Math.round(b), 1, 1, '#5a4a3a'));
      digits(g, String(n), 0.5, 0.5, '#3a2a1a');
    } },
    chmurka: { name: 'Chmurka wyobraźni', size: std(7, 8), draw(g, n) {
      const [w] = this.size(n);
      [[-w / 2 + 3, 1, 3.5], [0, -1, 4.5], [w / 2 - 3, 1, 3.5]].forEach(([a, b, r]) => { g.fillStyle = '#9ab0d0'; g.beginPath(); g.arc(a, b, r + 1, 0, Math.PI * 2); g.fill(); });
      [[-w / 2 + 3, 1, 3.5], [0, -1, 4.5], [w / 2 - 3, 1, 3.5]].forEach(([a, b, r]) => { g.fillStyle = '#ffffff'; g.beginPath(); g.arc(a, b, r, 0, Math.PI * 2); g.fill(); });
      digits(g, String(n), 0, 0.5, '#5a6aa0');
    } },
    kolo: { name: 'Koło ratunkowe (Arka)', size: n => [textW(String(n)) + 15, 10], draw(g, n) {
      const [w] = this.size(n), x0 = -Math.floor(w / 2), px0 = x0 + 9, pw = w - 9, lx = x0 + 4.5;
      R(g, px0 - 1, -3, pw + 2, 8, 'rgba(0,0,0,0.22)'); R(g, px0 - 1, -4, pw + 2, 8, '#5a3a1e'); R(g, px0, -3, pw, 6, '#b07a45');
      digits(g, String(n), px0 + pw / 2, 0, '#3a2412');
      for (let q = 0; q < 4; q++) { g.fillStyle = q % 2 ? '#ffffff' : '#d9534f'; g.beginPath(); g.moveTo(lx, 0); g.arc(lx, 0, 4.8, q * Math.PI / 2, (q + 1) * Math.PI / 2); g.fill(); }
      g.strokeStyle = '#7a2a2a'; g.lineWidth = 0.6; g.beginPath(); g.arc(lx, 0, 4.8, 0, Math.PI * 2); g.stroke();
      g.fillStyle = '#6a4a2a'; g.beginPath(); g.arc(lx, 0, 2, 0, Math.PI * 2); g.fill();
    } },
    budka: { name: 'Budka lęgowa (Tinbergen)', size: n => [Math.max(7, textW(String(n)) + 2) + 2, 14], draw(g, n) {
      const bw = Math.max(7, textW(String(n)) + 2), x = -Math.floor(bw / 2);
      R(g, x, 7, bw + 1, 1, 'rgba(0,0,0,0.22)');
      R(g, x - 1, -3, bw + 2, 10, '#6a4a2a'); R(g, x, -3, bw, 9, '#c89a5a');
      for (let i = 0; i < 4; i++) R(g, x - 2 + i, -4 - i, bw + 4 - 2 * i, 1, i ? '#8a3a2a' : '#6a2a1a');
      R(g, -1, -2, 2, 2, '#2a1a0a');
      digits(g, String(n), 0, 3, '#3a2412');
    } },
    serce: { name: 'Serduszko (Buss)', size: () => [11, 9], draw(g, n) {
      mask(g, HEART, -5, -3, '#9a2a4a'); mask(g, HEART, -5, -4, '#e86a8a');
      digits(g, String(n), 0, -0.5, '#ffffff');
    } },
    ogrod: { name: 'Deska z kiełkiem', size: std(7, 7), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 7, '#c89a5a', '#5a3a1e', 0);
      R(g, x + 1, y - 2, 1, 2, '#4caf50'); R(g, x, y - 3, 1, 1, '#4caf50'); R(g, x + 2, y - 3, 1, 1, '#6cc070');
      digits(g, String(n), 0, 0.5, '#2f5a2a');
    } },
    swiecaca: { name: 'Fosforyzująca (Wyspa Snu)', size: std(6, 8), draw(g, n, t) { glowDraw(this, g, n, t); } },
    ksiezyc: { name: 'Z sierpem księżyca', size: std(9, 8), draw(g, n, t) { const { x, y } = glowDraw(this, g, n, t, 2); R(g, x + 1, y + 2, 1, 4, '#f4f0dc'); R(g, x + 2, y + 1, 1, 1, '#f4f0dc'); R(g, x + 2, y + 6, 1, 1, '#f4f0dc'); } },
    mak: { name: 'Z makiem Hypnosa', size: std(9, 8), draw(g, n, t) { const { x, y } = glowDraw(this, g, n, t, 2); R(g, x + 1, y + 2, 3, 3, '#e04a3a'); R(g, x + 2, y + 3, 1, 1, '#2a1a1a'); R(g, x + 2, y + 5, 1, 2, '#4caf50'); } },
    lustro: { name: 'Lustro: cyfry odwrócone', size: std(6, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#c8d0d8', '#6a7480');
      for (let i = 0; i < 3; i++) R(g, x + 1 + i, y + 3 - i, 1, 1, '#f4f8fc'); for (let i = 0; i < 2; i++) R(g, x + w - 3 + i, y + 6 - i, 1, 1, '#f4f8fc');
      digits(g, String(n), 0, 0.5, '#3a4450', { mirror: true });
    } },
    escher: { name: 'Do góry nogami (Escher)', size: std(6, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#b8a0d8', '#4a3a6a');
      R(g, x + 1, y + 6, 1, 1, '#e0e0e8'); R(g, x + w - 2, y + 6, 1, 1, '#e0e0e8');
      digits(g, String(n), 0, 0, '#2a1a4a', { mirror: true, flip: true });
    } },
    szpital: { name: 'Szpitalna z czerwonym paskiem', size: std(6, 8), draw(g, n) { const [w] = this.size(n), { x, y } = plate(g, w, 8, '#f8f8f4', '#9aa0a8'); R(g, x, y, w, 1, '#d9534f'); digits(g, String(n), 0, 1, '#2a3a5a'); } },
    mozg: { name: 'Różowy mózg', size: std(7, 9), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 9, '#f0a0b8', '#a84a6a');
      R(g, x, y, 2, 1, '#a84a6a'); R(g, x + w - 2, y, 2, 1, '#a84a6a'); R(g, x, y + 8, 1, 1, '#a84a6a'); R(g, x + w - 1, y + 8, 1, 1, '#a84a6a');
      R(g, x + 1, y + 1, 2, 1, '#c86a8a'); R(g, x + w - 4, y + 7, 2, 1, '#c86a8a'); R(g, Math.round(x + w / 2), y, 1, 2, '#c86a8a');
      digits(g, String(n), 0, 1, '#6a1a3a');
    } },
    tecza: { name: 'Tęczowa (neuroróżnorodność)', size: std(6, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#ffffff', '#5a5a7a'), cols = ['#e8434a', '#f29a2c', '#f2d23c', '#4caf50', '#3b8fd8', '#8a5ad8'];
      for (let i = 0; i < w; i++) R(g, x + i, y, 1, 1, cols[Math.floor(i / w * cols.length)]);
      digits(g, String(n), 0, 1, '#3a3a5a');
    } },
    tajfel: { name: 'Pół na pół: „my” i „oni”', size: std(6, 8), draw(g, n) { const [w] = this.size(n), { x, y } = plate(g, w, 8, '#3b6cc4', '#2a2a3a'); R(g, x + Math.floor(w / 2), y, Math.ceil(w / 2), 8, '#f08a2a'); digits(g, String(n), 0, 0.5, '#ffffff'); } },
    lotnisko: { name: 'Lotnicze pasy ostrzegawcze', size: std(6, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#f2c94c', '#1a1a1a', 0);
      for (let i = -1; i <= w; i += 2) { R(g, x + i, y - 1, 1, 1, '#f2c94c'); R(g, x + i + 1, y + 8, 1, 1, '#f2c94c'); }
      digits(g, String(n), 0, 0.5, '#1a1a1a');
    } },
    uczelnia: { name: 'Uczelniana z herbem', size: std(9, 8), draw(g, n) {
      const [w] = this.size(n), { x, y } = plate(g, w, 8, '#1f2f5a', '#d9b44a');
      R(g, x + 1, y + 2, 3, 3, '#d9b44a'); R(g, x + 2, y + 5, 1, 1, '#d9b44a'); R(g, x + 2, y + 3, 1, 1, '#1f2f5a');
      digits(g, String(n), 2, 0.5, '#f4e6c4');
    } }
  };
  function ledDraw(P, g, n, col, ghost) {
    const [w] = P.size(n), { x, y } = plate(g, w, 8, '#0e1216', '#3a4048');
    digits(g, '8'.repeat(String(n).length), 0, 0.5, ghost);
    digits(g, String(n), 0, 0.5, col);
    R(g, x + w - 2, y + 1, 1, 1, col);
  }
  function glowDraw(P, g, n, t, shift = 0) {
    const [w] = P.size(n), bob = Math.round(Math.sin(t * 1.6) * 0.8), a = 0.26 + 0.12 * Math.sin(t * 2.3);
    g.translate(0, bob);
    const rg = g.createRadialGradient(0, 0, 2, 0, 0, w);
    rg.addColorStop(0, `rgba(200,170,255,${a.toFixed(3)})`); rg.addColorStop(1, 'rgba(200,170,255,0)');
    g.fillStyle = rg; g.fillRect(-w, -w, w * 2, w * 2);
    const p = plate(g, w, 8, '#2a1a4a', '#b8a0f0');
    digits(g, String(n), shift, 0.5, '#f0e6ff');
    return p;
  }

  /* ---------- kto ma jaką tabliczkę ---------- */
  const PL_BY_ID = {
    home: 'drewno', halina_dom: 'halina', rodzina: 'rodzina', dom_a: 'ceramika', dom_b: 'emalia', dom_c: 'kafel', ikego: 'sklep',
    eba: 'mosiadz', etyka: 'kamien', apteka: 'apteka', biblioteka: 'biblio',
    kawiarnia: 'kreda', poczta: 'poczta', wywiad: 'dymek',
    archiwum: 'rdza', mesmer: 'magnes', grafologia: 'reka',
    modele: 'gwiazdy', neuro: 'led_g', testy: 'karta', dziecko: 'klocki', magazyn: 'szablon',
    babel: 'babel', chronos: 'zegar', predykcja: 'gwiazdy', wyobraznia: 'chmurka',
    arka: 'kolo', gniazdo: 'budka', buss: 'serce', szklarnia: 'ogrod',
    katedra_snu: 'swiecaca', lustro_rem: 'lustro', latarnia_faz: 'ksiezyc', ogrod_hipnosa: 'mak', wieza_eschera: 'escher',
    sanatorium: 'szpital', pawilon_z: 'szpital', mozgownica: 'mozg', uzdrowisko: 'kafel', dom_nr: 'tecza',
    ratusz_t: 'tajfel', rakieta: 'led_r', wieza_k: 'lotnisko', oranzeria: 'ogrod', forum: 'kamien'
  };
  const PL_BY_ZONE = { kampus: 'uczelnia', wyspa_snu: 'swiecaca', wyspa_pinela: 'szpital' };
  const plStyleOf = (b, zoneId) => PL_BY_ID[b.id] || PL_BY_ZONE[String(zoneId || '').replace(/^dream:/, '')] || 'emalia';

  /* ---------- numery: te same co na mapie (po x, potem po y) ---------- */
  function houseNumbers(Z) {
    if (!Z._npNums) {
      Z._npNums = new Map();
      (Z.buildings || []).slice().sort((a, b) => a.x - b.x || a.y - b.y).forEach((b, i) => Z._npNums.set(b, i + 1));
    }
    return Z._npNums;
  }

  /* ---------- gdzie przybić: wolna ściana przy drzwiach ---------- */
  function doorBox(b) {
    const special = !!SPECIAL_BUILDINGS[b.style];
    const hw = b.style === 'warehouse' ? 15 : special || ['classic', 'townhall', 'shop', 'lab'].includes(b.style) ? 8 : 6;
    const dh = b.style === 'warehouse' ? 23 : special ? 20 : 18;
    const dx = b.doorCol * 16 + 8, by = (b.y + b.h) * 16;
    return { dx, by, hw, dh };
  }
  function plSpot(b, w, h) {
    if (b._pl && b._pl.spr === b.spr && b._pl.w === w && b._pl.h === h) return b._pl;
    const { dx, by, hw, dh } = doorBox(b), c = b.spr.c;
    let px = null;
    try { px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; } catch (e) {}
    const opaque = (wx, wy) => {
      if (!px) return true;
      const sx = Math.floor(wx - b.X), sy = Math.floor(wy - b.Y);
      if (sx < 0 || sy < 0 || sx >= c.width || sy >= c.height) return false;
      return px[(sy * c.width + sx) * 4 + 3] > 200;
    };
    const hits = (r1, r2) => r2 && r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    const door = { x: dx - hw - 1, y: by - dh - 1, w: hw * 2 + 2, h: dh + 1 };
    const ok = (cx, cy, onDoor) => {
      const r = { x: cx - w / 2 - 1, y: cy - h / 2 - 1, w: w + 2, h: h + 2 };
      if ((!onDoor && hits(r, door)) || hits(r, b.signW) || (b.win || []).some(wn => hits(r, wn))) return false;
      for (let i = 0; i <= 2; i++) for (let j = 0; j <= 2; j++) if (!opaque(r.x + 1 + i * (r.w - 3) / 2, r.y + 1 + j * (r.h - 3) / 2)) return false;
      return true;
    };
    const side = hw + 3 + w / 2, mid = by - 10, high = by - 16, top = by - dh - 3 - h / 2;
    const cand = [[dx + side, mid], [dx - side, mid], [dx + side, high], [dx - side, high], [dx, top], [dx + side + 10, mid], [dx - side - 10, mid], [dx + side + 10, high], [dx - side - 10, high], [dx, top - 6]];
    // dalej: przesuwamy się po ścianie co 2 px od drzwi (na przemian w prawo i w lewo) — najpierw blisko
    const scan = (d0, d1) => { const out = []; for (const y of [mid, high, by - 13, by - 19]) for (let d = d0; d <= d1; d += 2) out.push([dx + side + d, y], [dx - side - d, y]); return out; };
    let hit = cand.concat(scan(0, 16)).find(([x, y]) => ok(x, y)), onDoor = false;
    // przy drzwiach nie ma wolnej ściany (witryny, szyld, markiza) — tabliczka wisi na samych drzwiach, jak w kamienicy
    if (!hit && w <= hw * 2 + 2 && ok(dx, by - dh + h / 2 + 2, true)) { hit = [dx, by - dh + h / 2 + 2]; onDoor = true; }
    if (!hit) hit = scan(18, 44).find(([x, y]) => ok(x, y));
    b._pl = { spr: b.spr, w, h, x: Math.round((hit || cand[0])[0]), y: Math.round((hit || cand[0])[1]), onDoor, fallback: !hit };
    return b._pl;
  }

  /* ---------- rysowanie razem z budynkiem ---------- */
  function drawHousePlate(g, Z, b, t, dream) {
    if (!b.spr || !Z) return;
    let n = houseNumbers(Z).get(b);
    if (!n) return;
    if (dream) n = 1 + (hashStr(b.id + ':' + Math.floor(t * 1.4)) % 19);   // we śnie numery się zmieniają
    const st = plStyleOf(b, Z.id), P = PLATES[st];
    const [w, h] = P.size(n);
    // numer z szablonu malujemy prosto na bramie magazynu
    const spot = st === 'szablon' && b.style === 'warehouse' ? { x: b.doorCol * 16 + 8, y: (b.y + b.h) * 16 - 13 } : plSpot(b, w, h);
    g.save(); g.translate(spot.x, spot.y);
    P.draw(g, n, t);
    g.restore();
  }
  // do testów i podglądu w konsoli
  window.TABLICZKI = { PLATES, styleOf: plStyleOf, spot: plSpot, numbers: houseNumbers };

  const plBase = { drawDreamSprite: Game.prototype.drawDreamSprite };
  Object.assign(Game.prototype, {
    drawDreamSprite(spr, X, Y, o) {
      plBase.drawDreamSprite.call(this, spr, X, Y, o);
      const Z = this.zone;
      if (o && o.type === 'building' && Z) drawHousePlate(this.ctx, Z, o.b, performance.now() / 1000, !!(Z.dreamOf || String(Z.id).startsWith('dream:')));
    },
    // dawne niebieskie kwadraciki z modułu „Poprawki z Notion” — zastąpione tabliczkami powyżej
    npDrawHouseNumbers() {}
  });
})();
</script>

<!-- Zapis w chmurze: działa w środowisku Gemini Canvas (Firebase). Poza nim gra zapisuje postęp w przeglądarce. -->
<script type="module">
const appId = typeof __app_id !== 'undefined' ? __app_id : 'akademia-diagnosty';
let db = null, auth = null, currentUserId = null, fs = null;

async function initCloud() {
  try {
    if (typeof __firebase_config === 'undefined') return;
    const [{ initializeApp }, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
    ]);
    fs = fsMod;
    const app = initializeApp(JSON.parse(__firebase_config));
    db = fsMod.getFirestore(app);
    auth = authMod.getAuth(app);
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await authMod.signInWithCustomToken(auth, __initial_auth_token);
    else await authMod.signInAnonymously(auth);
    currentUserId = auth.currentUser?.uid || crypto.randomUUID();
    window.currentUserSyncId = currentUserId;
    window.cloudStorageReady = true;
    const ref = fs.doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile');
    const snap = await fs.getDoc(ref);
    if (snap.exists() && window.game) window.game.applySavedData(snap.data());
  } catch (err) {
    console.warn('Zapis w chmurze niedostępny — gra zapisuje postęp lokalnie.', err);
  }
}

window.saveToCloud = async function (data) {
  if (!db || !auth || !auth.currentUser) return;
  try {
    const payload = { stats: data.stats, charClass: data.charClass, save: data.save, lastUpdated: new Date().toISOString(), ownerId: currentUserId };
    await Promise.all([
      fs.setDoc(fs.doc(db, 'artifacts', appId, 'users', currentUserId, 'game_saves', 'profile'), payload, { merge: true }),
      fs.setDoc(fs.doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', currentUserId), payload, { merge: true })
    ]);
  } catch (e) { console.warn('Błąd zapisu w chmurze:', e); }
};

window.syncFromDeviceKey = async function (key) {
  const k = (key || '').trim();
  if (!k) return { success: false, message: 'Podaj klucz.' };
  if (!db) return { success: false, message: 'Brak połączenia z chmurą.' };
  try {
    const snap = await fs.getDoc(fs.doc(db, 'artifacts', appId, 'public', 'data', 'cloud_saves', k));
    if (!snap.exists()) return { success: false, message: 'Nie znaleziono zapisu dla tego klucza.' };
    const d = snap.data();
    if (d.save) d.save.savedAt = Date.now();
    window.game.applySavedData(d);
    window.game.save(true);
    return { success: true, message: 'Zsynchronizowano postęp!' };
  } catch (e) { return { success: false, message: 'Błąd: ' + e.message }; }
};

window.addEventListener('load', () => { setTimeout(initCloud, 300); });
</script>
