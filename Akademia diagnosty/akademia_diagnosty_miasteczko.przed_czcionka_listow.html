      return this.say('Kominek', 'Kominek cioci Jadzi. Najprzytulniej jest przy nim wieczorem.', '🔥');
    }
    if (k === 'lustro') return this.say('Lustro Odzwierciedlania', `Widzisz siebie: ${s.player.name}, ${s.stats.rankTitle}. Lustro mówi: „Słyszę, że dużo się dziś uczysz. To musi być dla Ciebie ważne.”`, '🪞');
    if (k === 'pianino') { [0, 4, 7, 12, 7, 4, 0].forEach((n, i) => audio.tone(261.6 * Math.pow(2, n / 12), 0.3, { type: 'triangle', vol: 0.06, at: i * 0.16 })); return this.say('Pianino uliczne', '♪ Grasz krótką melodię. Pan Obserwator coś notuje: „reakcja społeczna: pozytywna, kaczki: obojętne”.', '🎹'); }
    if (k === 'mlyn') return this.say('Młyn Hipotez', 'Młyn miele hipotezy. Te, które da się sfalsyfikować, przechodzą dalej. Te, których obalić się nie da („wszystko zależy od wszystkiego”), lądują w Archiwum Szarlatanerii.', '🌾');
    if (k === 'teleskop') return this.say('Teleskop', `Patrzysz przez teleskop… Widać stąd całe ${TOWN_NAME}: dachy Rynku Superego, mgłę nad Wypartym Przedmieściem i plażę Id. Każda dzielnica = inny rozdział wiedzy.`, '🔭');
    if (k === 'gauss') return this.say('Wzgórze Rozkładu Normalnego', ['Tabliczka na szczycie: μ (średnia) — tu mieszka większość.', 'Reguła 68–95–99,7: w odległości 1 odchylenia standardowego od średniej mieści się ok. 68% wyników, w 2 σ — ok. 95%, w 3 σ — ok. 99,7%.'], '🔔');
    if (k === 'tablica') return this.say('Tablica wyników', 'μ = 100, σ = 15 — skala ilorazów dewiacyjnych (np. Wechsler). Wynik 130 to +2σ: lepiej niż ok. 98% populacji. Wynik 85 to −1σ — wciąż w granicach normy!', '📊');
    if (k === 'karuzela') return this.say('Karuzela Pseudonauki', 'Zardzewiała karuzela kręci się w kółko od stu lat i nigdzie nie dojeżdża. Na koniach napisy: „grafologia”, „frenologia”, „magnetyzm”. Przejażdżka niezalecana.', '🎠');
    if (k === 'budowa') return this.say('Plac budowy', ['TU POWSTANĄ: Dzielnica Psychologii Społecznej · Aleja Psychologii Poznawczej · Park Psychologii Pozytywnej · Osiedle Psychologii Rozwoju.', 'Inwestor: Przyszłe Ja. Termin: od jutra.', 'AKTUALIZACJA: prom „Transfer Wiedzy” przy nabrzeżu kursuje już na Archipelag Wiedzy — stanęły tam pierwsze domy-przedmioty!'], '🏗️');
    if (k === 'prom') return this.say('Prom „Transfer Wiedzy”', 'Rozkład rejsów: prom wypłynie, gdy w mieście powstanie nowa dzielnica. Kapitan: „Transfer wiedzy działa najlepiej, gdy rozumiesz zasadę, a nie tylko pamiętasz przykład."', '⛴️');
    if (k === 'well') return this.showDialogue({
      name: 'Studnia życzeń', emoji: '🪣', pages: ['Studnia życzeń. Wrzucisz Dopaminkę?'],
      options: [{ label: '🪙 Wrzuć 1 🟡', disabled: s.money < 1, fn: () => {
        this.addMoney(-1); audio.coin();
        this.say('Studnia', pick(Math.random, [
          'Twoje życzenie: zdać egzamin. Studnia odpowiada: „Rób powtórki.”',
          'Echo ze studni: „…ćwicz przypominanie… przypominanie… minanie…"',
          'Studnia szepcze: „Śpij 8 godzin.” Studnie są zaskakująco evidence-based.',
          'Studnia milczy. To też jest odpowiedź. (Technika milczenia w wywiadzie!)',
          'Głos ze studni: „Wrzucenie monety nie podnosi prawdopodobieństwa sukcesu. Iluzja kontroli w czystej postaci!”',
          'Studnia odpowiada: „Twoje marzenie zostało zarejestrowane. Aktualny współczynnik korelacji z rzeczywistością: r = 0,08.”',
          'Echo ze studni: „...zamiast wrzucać monety, przeczytaj jeszcze raz rozdział o trafności kryterialnej...”',
          'Studnia wzdycha: „Kolejna dopaminka? Dziękuję. Od razu poziom serotoniny w wodach gruntowych wzrósł o 15%.”',
          'Głos z głębin: „Pamiętaj: korelacja to nie przyczynowość. Wrzucenie monety skorelowało z twoją stratą 1 🟡.”'
        ]), '🪣');
      } }, { label: 'Nie tym razem', fn: null }]
    });
    this.say('?', 'Nic ciekawego.', '❔');
  },
  enterDoor(b) {
    if (this.transition || this.dialog || this.modalOpen) return;
    const back = () => { this.player.y = (b.doorRow + 1) * 16 + 8; this.clickTarget = null; this.keys = {}; };
    if (b.subject) return this.enterSubjectHouse(b);
    if (b.loc) return this.enterBuilding(b);
    if (b.kind === 'home') { audio.door(); return this.goZone('dom', 7 * 16, 9 * 16 + 4, 'up', { after: () => this.halinaHomeReminder() }); }
    if (b.kind === 'halina') { audio.door(); return this.goZone('halina', 7 * 16, 9 * 16 + 4, 'up', { after: () => this.halinaOnEnter() }); }
    back();
    if (b.kind === 'shop') { audio.door(); return this.openShop(); }
    if (b.kind === 'cafe') { audio.door(); return this.openCafe(); }
    if (b.kind === 'lustro') { audio.door(); return this.openDreamModulation(); }
    if (b.locked) return this.say('Drzwi', b.locked, '🚪');
  },

  /* ---------------- mapa ---------------- */
  showMap() {
    const s = this.state;
    const here = this.zone && this.zone.subject ? this.zone.outer : this.zone && this.zone.interior ? 'osiedle' : s.zone;
    const cards = ZONE_GRID.flat().map(id => {
      const z = ZONES[id];
      const vis = s.visited[id] || id === here;
      const bg = `linear-gradient(160deg, ${z.mapColor[0]}, ${z.mapColor[1]})`;
      let prog = '';
      if (z.topics.length) {
        const all = z.topics.flatMap(t => this.questionsFor(t));
        const done = all.filter(q => s.stats.answeredQuestions[q.id]).length;
        prog = `<div class="tiny">${z.topics.map(t => LOCATIONS[t].icon + ' ' + LOCATIONS[t].short + ' poz. ' + this.unlockedLevel(t)).join(' · ')}</div><div class="prog"><i style="width:${Math.round(done / all.length * 100)}%"></i></div>`;
      } else prog = '<div class="tiny">🏗️ Przyszłe dzielnice (kolejne obszary psychologii)</div>';
      return `<div class="district ${vis ? '' : 'fog'} ${id === here ? 'here' : ''}" style="background:${bg}">
        ${id === here ? '<span class="you">TU JESTEŚ</span>' : ''}
        <div class="d-icon">${vis ? z.icon : '❓'}</div>
        <div class="d-name">${vis ? esc(z.name) : 'Nieodkryta dzielnica'}</div>
        <div class="d-sub">${vis ? esc(z.motto) : 'Idź tam, żeby odkryć.'}</div>
        ${vis ? prog : ''}
      </div>`;
    }).join('');
    this.openModal(this.panel(`🗺️ ${TOWN_NAME} — mapa miasta`,
      `<div class="town-map">${cards}</div>${this.islandsMapHtml(here)}${this.busZonesMapHtml(here)}
       <p class="small muted mt">🧠 <b>Metoda loci:</b> każda dzielnica to inny obszar wiedzy. Kiedy zapomnisz definicji — przypomnij sobie <i>miejsce</i>, w którym się jej ${this.gf('uczyłaś', 'uczyłeś')}: widok, mieszkańców, muzykę. Pamięć przestrzenna to jedna z najsilniejszych wskazówek wydobycia.</p>`,
      '<button class="btn" data-close>Zamknij [Esc]</button>', 'wide'));
  },

  /* ---------------- dziennik ---------------- */
  showJournal(tab = 'quests', fromBoard = false) {
    const s = this.state;
    const tabs = [['quests', '📌 Zadania dnia'], ['progress', '📈 Postępy'], ['review', '🔁 Do powtórki'], ['stats', '📊 Statystyki']];
    let body = '';
    if (tab === 'quests') {
      const list = s.quests.list.map(q => `<div class="card ${q.done ? '' : 'hl'} row" style="margin-bottom:6px">
          <span style="font-size:22px">${q.done ? '✅' : q.icon}</span>
          <div class="grow"><b>${esc(q.text)}</b><div class="tiny muted">Postęp: ${Math.min(q.progress, q.n)}/${q.n} · nagroda: ${q.reward} 🟡 + ${q.xp} XP</div></div>
        </div>`).join('');
      body = `${fromBoard ? '<p class="muted small mb">📌 Na tablicy wiszą dzisiejsze ogłoszenia. Superego miasta pilnuje terminów.</p>' : ''}
        ${list || '<p class="muted">Brak zadań.</p>'}
        <p class="small muted mt">Wykonanie wszystkich trzech: <b>+25 🟡</b> i odznaka „Dzienna Dawka Dopaminy”. Nowe zadania pojawiają się każdego ranka.</p>`;
    } else if (tab === 'progress') {
      body = Object.keys(LOCATIONS).map(loc => {
        const L = LOCATIONS[loc], qs = this.questionsFor(loc);
        const done = qs.filter(q => s.stats.answeredQuestions[q.id]).length;
        return `<div class="card" style="margin-bottom:6px"><div class="row"><b>${L.icon} ${esc(L.name)}</b><span class="tag">${esc(ZONES[L.zone].name)}</span><span class="grow"></span><span class="tag gold">poziom ${this.unlockedLevel(loc)}/${this.maxLevelFor(loc)}</span></div>
          <div class="row mt"><div class="prog grow"><i style="width:${Math.round(done / qs.length * 100)}%"></i></div><span class="small">${done}/${qs.length}</span></div></div>`;
      }).join('');
    } else if (tab === 'review') {
      const ids = Object.keys(s.stats.wrong || {}).filter(id => !s.stats.answeredQuestions[id]).concat(Object.keys(s.stats.review || {}));
      const uniq = [...new Set(ids)].map(id => QUESTIONS_DB.find(q => q.id === id)).filter(Boolean);
      body = uniq.length ? `<p class="small muted mb">Zagadnienia, z którymi był kłopot. Spróbuj najpierw przypomnieć sobie odpowiedź, dopiero potem ją odkryj (efekt testowania!).</p>` + uniq.map(q => `
        <details class="card" style="margin-bottom:6px"><summary style="cursor:pointer"><b>${esc(q.topic)}</b> <span class="tag">${LOCATIONS[q.locId].icon} ${LOCATIONS[q.locId].short}</span></summary>
        <p class="small mt"><b>${esc(q.question)}</b></p><p class="small mt">${esc(q.canonicalAnswer)}</p></details>`).join('')
        : '<p class="muted">Na razie pusto — świetnie! Tu trafią pytania, na które odpowiedź była błędna, i fiszki oznaczone „muszę powtórzyć”.</p>';
    } else {
      const T = s.totals;
      const acc = T.answered ? Math.round(T.correct / T.answered * 100) : 0;
      body = `<div class="grid2">
        <div class="card">📅 Dzień w ${TOWN_NAME}: <b>${s.day}</b></div>
        <div class="card">🎯 Odpowiedzi: <b>${T.answered}</b> (trafność ${acc}%)</div>
        <div class="card">✅ Zaliczone zagadnienia: <b>${Object.keys(s.stats.answeredQuestions).length}/${QUESTIONS_DB.length}</b></div>
        <div class="card">📜 Zebrane fiszki: <b>${T.fiszki}</b></div>
        <div class="card">⚡ Wygrane szybkie quizy: <b>${T.quizWins}</b></div>
        <div class="card">🟡 Zarobione Dopaminki: <b>${T.moneyEarned}</b></div>
        <div class="card">🗺️ Odkryte dzielnice: <b>${Object.keys(s.visited).length}/9</b></div>
        <div class="card">⭐ Poziom: <b>${s.stats.level}</b> (${s.stats.xp} XP)</div>
      </div>`;
    }
    const tabHtml = tabs.map(([id, name]) => `<button class="chip ${id === tab ? 'sel' : ''}" data-tab="${id}">${name}</button>`).join(' ');
    const m = this.openModal(this.panel(fromBoard ? '📌 Tablica ogłoszeń' : '📜 Dziennik', `<div class="row mb">${tabHtml}</div>${body}`, '<button class="btn" data-close>Zamknij</button>'));
    m.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { audio.click(); this.showJournal(b.dataset.tab, fromBoard); }));
  },

  /* ---------------- odznaki ---------------- */
  showBadges() {
    const s = this.state;
    const items = ALL_BADGES.map(b => {
      const u = !!s.stats.badges[b.id];
      return `<div class="card row ${u ? 'hl' : ''}" style="align-items:flex-start">
        <div style="font-size:28px;${u ? '' : 'filter:grayscale(1);opacity:.35'}">${b.icon}</div>
        <div class="grow"><div class="pix" style="font-weight:700">${esc(b.name)}</div><div class="small muted">${esc(b.desc)}</div>
        <span class="tag ${u ? 'green' : ''}">${u ? '✓ zdobyta' : '🔒 zablokowana'}</span></div></div>`;
    }).join('');
    this.openModal(this.panel(`🏆 Odznaki (${ALL_BADGES.filter(b => s.stats.badges[b.id]).length}/${ALL_BADGES.length})`, `<p class="small muted mb">Odznaki stoją też jako trofea na półce w Twoim domu. Za każdą: +30 🟡.</p><div class="grid2">${items}</div>`, '<button class="btn" data-close>Zamknij</button>'));
  },

  /* ---------------- zapis ---------------- */
  showSaveMenu() {
    const s = this.state;
    const code = (() => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(s)))); } catch (e) { return ''; } })();
    const when = s.savedAt ? new Date(s.savedAt).toLocaleString('pl-PL') : '—';
    const cloud = window.cloudStorageReady ? `<div class="card mt"><b>☁️ Chmura</b><p class="small">Twój klucz: <code>${esc(window.currentUserSyncId || '')}</code></p>
        <div class="row mt"><input id="sync-key" class="text-in grow" placeholder="Wklej klucz z innego urządzenia…"><button class="btn btn-blue btn-sm" id="btn-sync">Pobierz</button></div><div id="sync-msg" class="small mt"></div></div>` : '';
    const m = this.openModal(this.panel('💾 Zapis gry',
      `<div class="card"><b>Zapis automatyczny</b> — w tej przeglądarce, co 20 sekund i przy każdym ważnym wydarzeniu. Zapis należy do adresu strony, więc graj zawsze pod tym samym adresem.<br><span class="small muted">Ostatni zapis: ${when}</span></div>
       <div class="card mt"><b>🗂️ Kopia zapisu w pliku</b><p class="small muted">Pobierz plik przed eksperymentem i wróć do niego jednym kliknięciem. Plik przeniesiesz też do innej przeglądarki albo do Gemini.</p>
         <div class="row"><button class="btn btn-sm btn-green" id="btn-save-file">⬇️ Pobierz plik zapisu</button><button class="btn btn-sm btn-blue" id="btn-load-file">📂 Wczytaj z pliku</button><input type="file" id="load-file" accept=".json,application/json,text/plain" hidden></div>
         <p class="small muted mt">🧪 Panel testerki: klawisz F9.</p></div>
       <div class="card mt"><b>📤 Przenieś postęp na inne urządzenie</b><p class="small muted">Skopiuj kod zapisu i wklej go w tym samym oknie na drugim urządzeniu.</p>
         <textarea id="save-code" class="answer-box" style="min-height:70px;font-size:11px" readonly>${code}</textarea>
         <div class="row"><button class="btn btn-sm" id="btn-copy">📋 Kopiuj kod</button></div></div>
       <div class="card mt"><b>📥 Wczytaj kod zapisu</b>
         <textarea id="load-code" class="answer-box" style="min-height:60px;font-size:11px" placeholder="Wklej tutaj kod zapisu…"></textarea>
         <div class="row"><button class="btn btn-sm btn-blue" id="btn-load">Wczytaj</button><span id="load-msg" class="small"></span></div></div>
       ${cloud}
       <div class="card mt" style="border-color:#e0968c"><b>🧨 Zacznij od nowa</b><div class="row mt"><button class="btn btn-sm" id="btn-reset">Usuń postęp i zacznij od nowa</button></div></div>`,
      '<button class="btn btn-green" id="btn-save-now">💾 Zapisz teraz</button><button class="btn" data-close>Zamknij</button>', 'narrow'));
    m.querySelector('#btn-save-now').addEventListener('click', () => { this.save(true); this.toast('💾 Zapisano!'); audio.coin(); });
    const lf = m.querySelector('#load-file');
    m.querySelector('#btn-save-file').addEventListener('click', () => this.downloadSave());
    m.querySelector('#btn-load-file').addEventListener('click', () => lf.click());
    lf.addEventListener('change', () => this.importSaveFile(lf.files[0]));
    m.querySelector('#btn-copy').addEventListener('click', () => {
      const ta = m.querySelector('#save-code'); ta.select();
      (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => this.toast('📋 Skopiowano kod zapisu')).catch(() => { try { document.execCommand('copy'); this.toast('📋 Skopiowano'); } catch (e) { this.toast('Zaznacz i skopiuj ręcznie'); } });
    });
    m.querySelector('#btn-load').addEventListener('click', () => {
      const raw = m.querySelector('#load-code').value.trim();
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (!data || !data.player) throw new Error('format');
        this.state = deepMerge(this.newState(), data);
        this.state.created = true;
        this.zones = {};
        this.save();
        this.closeModal(true);
        this.startWorld();
        this.toast('📥 Wczytano zapis!');
      } catch (e) { m.querySelector('#load-msg').textContent = '✕ To nie wygląda na poprawny kod zapisu.'; }
    });
    m.querySelector('#btn-reset').addEventListener('click', () => {
      this.closeModal(true);
      this.showDialogue({ name: 'Na pewno?', emoji: '🧨', pages: ['Cały postęp (poziomy, odznaki, dom, Dopaminki) zostanie usunięty z tej przeglądarki. Tego nie da się cofnąć.'],
        options: [{ label: 'Tak, zacznij od nowa', fn: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); } }, { label: 'Nie, zostaw', fn: null }] });
    });
    const sb = m.querySelector('#btn-sync');
    if (sb) sb.addEventListener('click', async () => {
      const msg = m.querySelector('#sync-msg');
      msg.textContent = 'Pobieranie…';
      const res = window.syncFromDeviceKey ? await window.syncFromDeviceKey(m.querySelector('#sync-key').value) : { success: false, message: 'Brak połączenia.' };
      msg.textContent = (res.success ? '✓ ' : '✕ ') + res.message;
    });
  },

  /* ---------------- kreator postaci ---------------- */
  showCreator(isNew) {
    const s = this.state;
    const draft = { name: s.player.name || '', form: s.player.form || 'f', look: Object.assign({}, s.player.look), cls: s.player.charClass ? s.player.charClass.id : 'adept' };
    const sw = (arr, key, sel) => `<div class="swatches">${arr.map(c => `<div class="sw ${c === sel ? 'sel' : ''}" style="background:${c}" data-k="${key}" data-v="${c}"></div>`).join('')}</div>`;
    const chips = (arr, key, sel) => `<div class="row">${arr.map(o => `<button class="chip ${o.id === sel ? 'sel' : ''}" data-k="${key}" data-v="${o.id}">${o.name}</button>`).join('')}</div>`;
    const render = () => {
      const L = draft.look;

/* =====================================================================
   NAUKA: bloki pytań, poziomy katedr, quizy, fiszki, zadania, odznaki
   ===================================================================== */
function bakeClassroom(loc, masterDef, playerLook) {
  const L = LOCATIONS[loc];
  const [c, g] = mkCanvas(256, 144);
  const wall = mix(L.color, '#f4e6c8', 0.72), wallD = shade(wall, -0.18);
  R(g, 0, 0, 256, 70, wall);
  for (let x = 0; x < 256; x += 8) R(g, x, 0, 1, 70, shade(wall, -0.05));
  R(g, 0, 54, 256, 16, wallD); R(g, 0, 53, 256, 2, '#6b4526');
  R(g, 0, 70, 256, 74, '#b98a5a');
  for (let y = 70; y < 144; y += 6) { R(g, 0, y + 5, 256, 1, '#9a6a3f'); for (let x = (y % 12) * 3; x < 256; x += 40) R(g, x, y, 1, 5, '#9a6a3f'); }
  // tablica
  R(g, 76, 8, 104, 42, '#6b4526'); R(g, 79, 11, 98, 36, '#2f5a3a');
  const rnd = mulberry(hashStr(loc));
  for (let i = 0; i < 6; i++) { const y = 16 + i * 5; R(g, 84, y, 20 + Math.floor(rnd() * 60), 1, 'rgba(240,240,230,0.75)'); }
  if (loc === 'testy' || loc === 'eba') for (let x = 0; x < 50; x++) { const z = (x - 25) / 8; P(g, 120 + x, 42 - Math.round(Math.exp(-z * z / 2) * 18), '#f4f0e0'); }
  R(g, 80, 47, 96, 2, '#8a5a30'); R(g, 150, 45, 6, 2, '#f4f0e6');
  // regały
  [[8, 14], [212, 14]].forEach(([x, y]) => {
    R(g, x, y, 36, 56, '#7a4a2a'); R(g, x + 2, y + 2, 32, 52, '#4a2a18');
    for (let sy = y + 14; sy < y + 56; sy += 13) { R(g, x + 1, sy, 34, 2, '#9a6a3f'); let bx = x + 3; while (bx < x + 32) { const w = 2 + Math.floor(rnd() * 2), h = 7 + Math.floor(rnd() * 4); R(g, bx, sy - h, w, h, pick(rnd, ['#d9534f', '#3a74b8', '#f2c94c', '#4f8f35', '#7b55b8', '#e98a3a'])); bx += w + 1; } }
  });
  // okna
  [[52, 12], [190, 12]].forEach(([x, y]) => { R(g, x, y, 16, 26, '#f4f0e6'); R(g, x + 2, y + 2, 12, 22, '#8fd0ee'); R(g, x + 2, y + 2, 12, 8, '#bfe4f5'); R(g, x + 7, y + 2, 2, 22, '#f4f0e6'); });
  // ławki i postacie
  const drawChar = (look, dir, x, y) => { const sp = characterSprite(look, dir, 0, false); g.drawImage(sp.c, x - sp.ax, y - sp.ay); };
  drawChar(Object.assign({}, masterDef.look), 'down', 190, 84);
  [[56, 104], [128, 104], [200, 104], [56, 130], [200, 130]].forEach(([x, y]) => { R(g, x - 18, y - 6, 36, 8, '#8a5a30'); R(g, x - 18, y - 6, 36, 2, '#b07a45'); R(g, x - 16, y + 2, 2, 8, '#5a3a1e'); R(g, x + 14, y + 2, 2, 8, '#5a3a1e'); R(g, x - 6, y - 8, 10, 3, '#fdf6e3'); });
  drawChar(playerLook, 'up', 128, 134);
  R(g, 118, 124, 20, 6, '#8a5a30');
  return c;
}

Object.assign(Game.prototype, {
  /* ---------------- ekonomia i statystyki ---------------- */
  addMoney(n, silent) {
    const s = this.state;
    s.money = Math.max(0, s.money + n);
    s.today.money += n;
    if (n > 0) { s.totals.moneyEarned += n; if (!silent && this.scene === 'world') this.floater(`+${n} 🟡`, '#ffd66b'); }
    this.updateHUD();
  },
  addEnergy(n) {
    const s = this.state;
    s.energy = clamp(s.energy + n, 0, 100);
    s.stats.stamina = s.energy;
    if (n > 0 && this.scene === 'world') this.floater(`+${n} ⚡`, '#9ae07a');
    this.updateHUD();
  },
  addXP(amount, locId) {
    const s = this.state, st = s.stats;
    let finalAmount = amount * st.multiplier;
    let bonus = false;
    const cls = s.player.charClass ? CLASSES[s.player.charClass.id] : null;
    if (cls && locId && cls.locs.includes(locId)) { finalAmount *= 1.35; bonus = true; }
    finalAmount = Math.max(0, Math.round(finalAmount));
    st.xp += finalAmount;
    s.today.xp += finalAmount;
    const prev = st.level;
    st.level = Math.floor(st.xp / 100) + 1;
    st.rankTitle = st.level >= 8 ? 'Wielki Mistrz Złotego Stetoskopu' : st.level >= 5 ? 'Ekspert EBA & Superwizor' : st.level >= 3 ? 'Licencjonowany Psycholog' : st.level >= 2 ? 'Młodszy Diagnosta' : 'Stażysta EBA';
    if (st.level > prev) { audio.levelUp(); setTimeout(() => this.toast(`⭐ AWANS! Poziom ${st.level}: ${st.rankTitle}`, 4000), 400); }
    this.updateHUD();
    return { amount: finalAmount, bonus };
  },

  /* ---------------- poziomy katedr ---------------- */
  questionsFor(locId) { return QUESTIONS_DB.filter(q => q.locId === locId); },
  maxLevelFor(locId) { return Math.max(1, Math.ceil(this.questionsFor(locId).length / LEVEL_STEP)); },
  progressFor(locId) {
    const st = this.state.stats;
    if (!st.progress) st.progress = {};
    if (!st.progress[locId]) st.progress[locId] = { correct: this.questionsFor(locId).filter(q => st.answeredQuestions[q.id]).length };
    return st.progress[locId];
  },
  unlockedLevel(locId) { return Math.min(this.maxLevelFor(locId), 1 + Math.floor(this.progressFor(locId).correct / LEVEL_STEP)); },
  questionsAtLevel(locId, level) { return this.questionsFor(locId).slice((level - 1) * LEVEL_STEP, level * LEVEL_STEP); },
  remainingFor(locId) {
    const lvl = this.unlockedLevel(locId);
    return this.questionsFor(locId).slice(0, lvl * LEVEL_STEP).filter(q => !this.state.stats.answeredQuestions[q.id]).length;
  },

  /* ---------------- wejście do katedry ---------------- */
  enterBuilding(b) {
    const s = this.state;
    if (this.transition) return;
    const back = () => { this.player.y = (b.doorRow + 1) * 16 + 8; this.keys = {}; this.clickTarget = null; };
    if (s.energy < 10) { back(); return this.say('Drzwi katedry', 'Brakuje Ci energii (⚡ poniżej 10%). Zmęczony mózg daje zmęczone odpowiedzi. Wypij coś w Kawiarni „Pod Dopaminą” na Bulwarze Empatii albo idź spać.', '😴'); }
    if (this.remainingFor(b.loc) === 0) { back(); return this.say(LOCATIONS[b.loc].name, 'Wszystkie zagadnienia tej katedry są zaliczone! Wróć na szybki quiz do mistrza albo sprawdź „Do powtórki” w dzienniku.', '🏅'); }
    audio.door();
    this.keys = {};
    this.clickTarget = null;
    this.transition = {
      phase: 'out', t: 0, speed: 3,
      then: () => {
        this.scene = 'interior';
        this.interiorB = b;
        const master = NPCS[LOCATIONS[b.loc].master];
        this.classroom = bakeClassroom(b.loc, master, this.playerLook());
        this.startQuestionBlock(b.loc);
      }
    };
  },
  renderInterior() {
    const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    if (!this.classroom) return;
    const c = this.classroom;
    const sc = Math.max(W / c.width, H / c.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(c, (W - c.width * sc) / 2, (H - c.height * sc) / 2, c.width * sc, c.height * sc);
  },
  leaveInterior() {
    const b = this.interiorB;
    const lvlChanged = this._levelChanged;
    this._levelChanged = false;
    this.scene = 'world';
    this.closeModal(true);
    this.currentBlock = null;
    this.interiorB = null;
    if (b) {
      this.player.x = b.doorCol * 16 + 8; this.player.y = (b.doorRow + 1) * 16 + 10; this.player.dir = 'down';
      if (lvlChanged) { this.prepareBuildings(this.zone); setTimeout(() => this.toast(`🏗️ ${LOCATIONS[b.loc].name} dobudowuje nowe piętro!`, 4000), 500); }
    }
    this.transition = { phase: 'in', t: 0, speed: 2.5 };
    this.save(true);
  },

  /* ---------------- bloki pytań ---------------- */
  startQuestionBlock(loc) {
    const st = this.state.stats;
    const level = this.unlockedLevel(loc);
    const current = this.questionsAtLevel(loc, level).filter(q => !st.answeredQuestions[q.id]);
    const backlog = this.questionsFor(loc).slice(0, (level - 1) * LEVEL_STEP).filter(q => !st.answeredQuestions[q.id]);
    const pool = current.concat(backlog).slice(0, BLOCK_SIZE);
    if (!pool.length) { this.leaveInterior(); return; }
    this.currentBlock = { loc, level, questions: pool, index: 0, correct: 0, xp: 0, money: 0, levelBefore: level };
    this.showBlockQuestion();
  },
  showBlockQuestion() {
    const b = this.currentBlock;
    if (!b) return;
    const L = LOCATIONS[b.loc], q = b.questions[b.index];
    const st = this.state.stats;
    this.currentQ = q;
    this.hintUsed = false;
    this._answered = false;
    const all = this.questionsFor(b.loc);
    const dots = b.questions.map((_, i) => `<span class="${i < b.index ? 'done' : i === b.index ? 'now' : ''}"></span>`).join('');
    const aiOn = !this.aiOffline;
    const master = NPCS[L.master];
    const body = `
      <div class="row small mb"><span class="dots">${dots}</span><b>Pytanie ${b.index + 1}/${b.questions.length}</b><span class="grow"></span>
        <span class="tag">Katedra: ${all.filter(x => st.answeredQuestions[x.id]).length}/${all.length}</span><span class="tag">⚡ ${Math.round(this.state.energy)}%</span></div>
      <div class="q-topic">${esc(q.topic)}</div>
      <div class="q-text">${esc(q.question)}</div>
      <textarea id="answer" class="answer-box" placeholder="Odpowiedz własnymi słowami. Najpierw spróbuj sobie przypomnieć — to właśnie przypominanie uczy najmocniej."></textarea>
      <div class="row small">
        <button class="btn btn-sm" id="btn-hint">💡 Podpowiedź (−5 XP)</button>
        <button class="btn btn-sm btn-purple" id="btn-prof">🎓 Wyjaśnij mechanizm</button>
        <span class="grow"></span>
        <label class="row small" style="gap:4px;cursor:pointer"><input type="checkbox" id="ai-eval" ${aiOn ? 'checked' : ''} ${this.aiOffline ? 'disabled' : ''}> Ocena Superwizora AI${this.aiOffline ? ' (offline)' : ''}</label>
      </div>
      <div id="hint-text" class="small mt" style="color:#8a5a10;font-style:italic"></div>
      <div id="ai-loading" class="fb ai small" hidden><span class="ai-dot"></span> <span id="ai-loading-text">Superwizor czyta odpowiedź…</span></div>
      <div id="fb"></div>`;
    const foot = `<button class="btn btn-sm" id="btn-skip">🤷 Nie wiem — pokaż odpowiedź</button><span class="grow"></span><button class="btn" id="btn-leave">Wyjdź z budynku</button><button class="btn btn-green" id="btn-submit">Sprawdź [Enter]</button>`;
    const m = this.openModal(this.panel(`${L.icon} ${esc(L.name)} · poziom ${b.level} — ${esc(master.name)}`, body, foot), { onClose: () => { if (this.scene === 'interior') this.leaveInterior(); } });
    const ta = m.querySelector('#answer');
    setTimeout(() => ta.focus(), 60);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); m.querySelector('#btn-submit').click(); } });
    m.querySelector('#btn-hint').addEventListener('click', e => {
      if (this.hintUsed) return;
      this.hintUsed = true;
      e.target.disabled = true;
      m.querySelector('#hint-text').textContent = '💡 ' + q.hint;
      st.xp = Math.max(0, st.xp - 5);
      st.level = Math.floor(st.xp / 100) + 1;
      audio.click();
      this.updateHUD();
    });
    m.querySelector('#btn-prof').addEventListener('click', () => this.askProfessor(q));
    m.querySelector('#btn-skip').addEventListener('click', () => this.renderAnswerFeedback(false, q, null, { skipped: true }));
    m.querySelector('#btn-leave').addEventListener('click', () => this.leaveInterior());
    m.querySelector('#btn-submit').addEventListener('click', () => this.submitAnswer());
  },
  async callGemini(payload) {
    if (this.aiOffline) throw new Error('offline');
    const apiKey = '';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      // Poza środowiskiem Gemini Canvas brak klucza — nie próbujemy w kółko.
      this.aiOffline = true;
      throw e;
    }
  },
  async askProfessor(q) {
    const m = document.getElementById('modal');
    const fb = m.querySelector('#fb'), ld = m.querySelector('#ai-loading');
    if (this.aiOffline) {
      fb.innerHTML = `<div class="fb ai"><b>🎓 Profesor (tryb offline)</b><br>${esc(q.explanation)}<br><span class="small muted">Wskazówka: ${esc(q.hint)}</span></div>`;
      return;
    }
    ld.hidden = false; m.querySelector('#ai-loading-text').textContent = 'Profesor zbiera myśli…';
    const sys = `Jesteś profesorem psychologii w Akademii Diagnosty. Wyjaśnij studentowi zwięźle, przystępnie i rygorystycznie naukowo zagadnienie „${q.topic}” w kontekście pytania „${q.question}”. Nie podawaj gotowej formułki do skopiowania — rozjaśnij mechanizm i daj jeden przykład kliniczny lub metodologiczny (max 2-3 krótkie akapity).`;
    try {
      const res = await this.callGemini({ contents: [{ role: 'user', parts: [{ text: 'Proszę o wyjaśnienie: ' + q.question }] }], systemInstruction: { parts: [{ text: sys }] } });
      const text = res?.candidates?.[0]?.content?.parts?.[0]?.text || q.explanation;
      ld.hidden = true;
      fb.innerHTML = `<div class="fb ai"><b>🎓 Wyjaśnienie profesora</b><br>${esc(text).replace(/\n\n/g, '<br><br>')}</div>`;
    } catch (e) {
      ld.hidden = true;
      fb.innerHTML = `<div class="fb ai"><b>🎓 Profesor (tryb offline)</b><br>${esc(q.explanation)}<br><span class="small muted">Wskazówka: ${esc(q.hint)}</span></div>`;
    }
  },
  async submitAnswer() {
    const m = document.getElementById('modal');
    const ta = m.querySelector('#answer'), q = this.currentQ;
    if (!ta || !q || this._answered) return;
    const text = ta.value.trim();
    if (text.length < 2) { this.toast('Wpisz odpowiedź — nawet niepełną. Próba przypomnienia też uczy!'); return; }
    const local = verifyAnswer(text, q.expectedGroups, q.question);
    const useAI = m.querySelector('#ai-eval') && m.querySelector('#ai-eval').checked && !this.aiOffline;
    if (!useAI) return this.renderAnswerFeedback(local.isCorrect, q, null, { local });
    const btn = m.querySelector('#btn-submit');
    btn.disabled = true;
    m.querySelector('#ai-loading').hidden = false;
    m.querySelector('#ai-loading-text').textContent = 'Superwizor AI analizuje Twoją odpowiedź…';
    const sys = `Działasz jako Superwizor EBA i egzaminator z diagnozy psychologicznej (podręczniki: K. Stemplewska-Żakowicz, W.J. Paluchowski, T. Szustrowa).
Oceń merytorycznie odpowiedź studenta.
Pytanie: "${q.question}"
Temat: "${q.topic}"
Wzorzec: "${q.canonicalAnswer}"
Komentarz: "${q.explanation}"
Uznaj za poprawną (isCorrect: true), jeśli student oddał kluczowe relacje pojęciowe, nawet własnymi słowami.
Zwróć WYŁĄCZNIE JSON: isCorrect (boolean), scorePercentage (0-100), studentStrengths (1 zdanie), missingNuances (1-2 zdania), professorNote (1-2 zdania, ciepły ton mentora).`;
    try {
      const res = await this.callGemini({
        contents: [{ role: 'user', parts: [{ text: `Odpowiedź studenta: "${text}"` }] }],
        generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'OBJECT', properties: { isCorrect: { type: 'BOOLEAN' }, scorePercentage: { type: 'NUMBER' }, studentStrengths: { type: 'STRING' }, missingNuances: { type: 'STRING' }, professorNote: { type: 'STRING' } }, required: ['isCorrect', 'scorePercentage', 'studentStrengths', 'missingNuances', 'professorNote'] } },
        systemInstruction: { parts: [{ text: sys }] }
      });
      const part = res?.candidates?.[0]?.content?.parts?.[0]?.text;
      const ev = part ? JSON.parse(part) : null;
      this.renderAnswerFeedback(ev ? ev.isCorrect : local.isCorrect, q, ev, { local });
    } catch (e) {
      this.toast('Superwizor AI niedostępny — ocenia parser lokalny.');
      this.renderAnswerFeedback(local.isCorrect, q, null, { local });
    }
  },
  renderAnswerFeedback(ok, q, ai, opts = {}) {
    const m = document.getElementById('modal');
    const fb = m.querySelector('#fb'), btn = m.querySelector('#btn-submit');
    if (!fb || !btn) return;
    const s = this.state, st = s.stats, b = this.currentBlock;
    if (this._answered) return;
    this._answered = true;
    const ld = m.querySelector('#ai-loading'); if (ld) ld.hidden = true;
    ['#btn-skip', '#btn-hint', '#btn-prof'].forEach(sel => { const el = m.querySelector(sel); if (el) el.disabled = true; });
    const ta = m.querySelector('#answer'); if (ta) ta.readOnly = true;
    btn.disabled = false;
    s.totals.answered++; s.today.answered++;
    const lastInBlock = !b || b.index >= b.questions.length - 1;
    btn.textContent = lastInBlock ? 'Zakończ blok →' : 'Następne pytanie →';
    btn.onclick = null;
    const nb = btn.cloneNode(true); btn.replaceWith(nb);
    nb.addEventListener('click', () => this.advanceBlock());
    const aiBox = ai ? `<div class="fb ai small"><b>Superwizor AI · ${Math.round(ai.scorePercentage)}%</b><br>${ai.studentStrengths ? '👍 ' + esc(ai.studentStrengths) + '<br>' : ''}${ai.missingNuances ? '🧩 ' + esc(ai.missingNuances) + '<br>' : ''}<i>„${esc(ai.professorNote)}”</i></div>` : '';
    if (ok) {
      this.markCorrect(q, ai && ai.scorePercentage > 85 ? 1.2 : 1);
      const res = this._lastXP;
      fb.innerHTML = `<div class="fb ok"><b>✓ Dobrze! +${res.amount} XP${res.bonus ? ' (bonus ścieżki +35%)' : ''} · +${this._lastMoney} 🟡 · seria x${st.multiplier.toFixed(1)}</b>
        ${aiBox}<p class="mt"><b>Wzorzec:</b> ${esc(q.canonicalAnswer)}</p><p class="small mt"><b>Komentarz:</b> ${esc(q.explanation)}</p></div>`;
    } else {
      const skipped = !!opts.skipped;
      st.streak = 0; st.multiplier = 1;
      st.wrong = st.wrong || {}; st.wrong[q.id] = (st.wrong[q.id] || 0) + 1;
      const cls = s.player.charClass ? s.player.charClass.id : null;
      const cost = skipped ? 5 : (cls === 'etyk' ? 9 : 15);
      this.addEnergy(-cost);
      audio.error();
      fb.innerHTML = `<div class="fb bad"><b>${skipped ? '🤷 Uczciwie — to też nauka.' : '✕ Jeszcze nie to.'} (−${cost}% ⚡)</b>
        ${aiBox}<p class="mt"><b>Wzorzec:</b> ${esc(q.canonicalAnswer)}</p><p class="small mt"><b>Wyjaśnienie:</b> ${esc(q.explanation)}</p>
        <p class="small mt muted">To pytanie wróci w kolejnym bloku i trafia do zakładki „Do powtórki” w dzienniku.</p>
        ${!skipped && !ai ? `<div class="row mt"><button class="btn btn-sm" id="btn-self">Porównuję ze wzorcem — moja odpowiedź była równoważna ✓</button></div>` : ''}</div>`;
      const selfBtn = fb.querySelector('#btn-self');
      if (selfBtn) selfBtn.addEventListener('click', () => {
        selfBtn.disabled = true;
        this.addEnergy(cost);
        this.markCorrect(q, 1);
        const res = this._lastXP;
        selfBtn.parentElement.innerHTML = `<span class="tag green">✓ Zaliczone po samoocenie: +${res.amount} XP · +${this._lastMoney} 🟡</span>`;
      });
    }
    this.save();
  },
  markCorrect(q, mult) {
    const s = this.state, st = s.stats, b = this.currentBlock;
    audio.success();
    st.streak++;
    st.multiplier = st.streak >= 3 ? 2 : st.streak >= 2 ? 1.5 : 1;
    const first = !st.answeredQuestions[q.id];
    st.answeredQuestions[q.id] = true;
    if (first) this.progressFor(q.locId).correct++;
    s.totals.correct++; s.today.correct++;
    this.addEnergy(-3);
    const res = this.addXP(Math.round(q.points * mult), q.locId);
    const money = Math.max(3, Math.round(q.points / 5));
    this.addMoney(money, true);
    this._lastXP = res; this._lastMoney = money;
    if (b) { b.correct++; b.xp += res.amount; b.money += money; }
    if (this.unlockedLevel(q.locId) > (b ? b.levelBefore : 1)) this._levelChanged = true;
    this.questEvent('answer', q.locId);
    this.checkBadges();
  },
  advanceBlock() {
    const b = this.currentBlock;
    if (!b) return this.leaveInterior();
    b.index++;
    if (b.index >= b.questions.length) this.showBlockSummary();
    else this.showBlockQuestion();
  },
  showBlockSummary() {
    const b = this.currentBlock, s = this.state;
    const L = LOCATIONS[b.loc];
    const now = this.unlockedLevel(b.loc), unlocked = now > b.levelBefore;
    const prog = this.progressFor(b.loc), max = this.maxLevelFor(b.loc), total = this.questionsFor(b.loc).length;
    const toNext = unlocked || now >= max ? 0 : LEVEL_STEP * now - prog.correct;
    s.totals.blocks++;
    let extra = '';
    if (unlocked) { audio.levelUp(); this.addMoney(25, true); extra += `<div class="fb ok center"><b>⭐ POZIOM ${now} ODBLOKOWANY! +25 🟡</b><br>Budynek dobudowuje nowe piętro — zobaczysz je po wyjściu.</div>`; this._levelChanged = true; }
    if (!s.home.gotDiploma) { s.home.gotDiploma = true; s.home.inventory.dyplom = (s.home.inventory.dyplom || 0) + 1; extra += `<div class="fb ok center mt"><b>🎓 Pierwszy blok ukończony!</b> W ekwipunku czeka oprawiony <b>Dyplom Akademii</b> — powieś go w domu.</div>`; }
    const emoji = b.correct === b.questions.length ? '🏅' : b.correct > 0 ? '📘' : '📕';
    this.openModal(this.panel(`${L.icon} ${esc(L.name)} — podsumowanie`,
      `<div class="center"><div class="big-emoji">${emoji}</div>
        <p class="pix" style="font-size:22px;color:var(--wood-600)"><b>${b.correct} / ${b.questions.length}</b> poprawnych</p>
        <p class="small muted mb">+${b.xp} XP · +${b.money} 🟡 · energia ${Math.round(s.energy)}%</p></div>
       ${extra}
       <div class="card mt small center">Poziom ${now}/${max} · zaliczone ${prog.correct}/${total}${toNext > 0 ? ` · do następnego piętra: <b>${toNext}</b>` : ''}<br>Pozostało pytań na odblokowanych piętrach: <b>${this.remainingFor(b.loc)}</b></div>`,
      `${this.remainingFor(b.loc) > 0 && s.energy >= 10 ? '<button class="btn btn-green" id="btn-next-block">Kolejny blok</button>' : ''}<button class="btn" id="btn-out">Wyjdź na zewnątrz</button>`, 'narrow'),
      { onClose: () => { if (this.scene === 'interior') this.leaveInterior(); } });
    const m = document.getElementById('modal');
    const nb = m.querySelector('#btn-next-block');
    if (nb) nb.addEventListener('click', () => { const loc = b.loc; this.modalOpts = null; this.startQuestionBlock(loc); });
    m.querySelector('#btn-out').addEventListener('click', () => this.leaveInterior());
    this.save(true);
  },

  /* ---------------- szybki quiz u mistrza ---------------- */
  startQuiz(n) {
    const loc = n.def.master;
    const pool = shuffle(Math.random, this.questionsFor(loc));
    this.quiz = { n, loc, round: 0, score: 0, items: pool.slice(0, 3) };
    this.showQuizRound();
  },
  showQuizRound() {
    const Q = this.quiz, q = Q.items[Q.round];
    const others = shuffle(Math.random, this.questionsFor(Q.loc).filter(x => x.id !== q.id)).slice(0, 2);
    const trunc = s => s.length > 230 ? s.slice(0, 227) + '…' : s;
    const modeDef = Math.random() < 0.6;
    const opts = shuffle(Math.random, [q].concat(others));
    const qText = modeDef ? `Który opis pasuje do zagadnienia: <b>„${esc(q.topic)}”</b>?` : `Do którego zagadnienia pasuje opis:<br><i>„${esc(trunc(q.canonicalAnswer))}”</i>`;
    const body = `<div class="row small mb"><span class="tag gold">Runda ${Q.round + 1}/3</span><span class="tag green">Wynik: ${Q.score}</span></div>
      <div class="q-text" style="font-size:15px">${qText}</div>
      ${opts.map((o, i) => `<button class="quiz-opt" data-id="${o.id}"><b>${String.fromCharCode(65 + i)}.</b> ${esc(modeDef ? trunc(o.canonicalAnswer) : o.topic)}</button>`).join('')}
      <div id="quiz-fb"></div>`;
    const m = this.openModal(this.panel(`⚡ Szybki quiz — ${esc(Q.n.def.name)}`, body, '<button class="btn" id="quiz-next" disabled>Dalej →</button>', 'narrow', false), { locked: true });
    m.querySelectorAll('.quiz-opt').forEach(b => b.addEventListener('click', () => {
      const right = b.dataset.id === q.id;
      m.querySelectorAll('.quiz-opt').forEach(x => { x.disabled = true; if (x.dataset.id === q.id) x.classList.add('right'); });
      if (right) { Q.score++; audio.success(); } else { b.classList.add('wrong'); audio.error(); }
      m.querySelector('#quiz-fb').innerHTML = `<div class="fb ${right ? 'ok' : 'bad'} small">${right ? '✓ Tak!' : '✕ Nie tym razem.'} <b>${esc(q.topic)}</b>: ${esc(q.hint)}</div>`;
      m.querySelector('#quiz-next').disabled = false;
    }));
    m.querySelector('#quiz-next').addEventListener('click', () => {
      Q.round++;
      if (Q.round < 3) this.showQuizRound(); else this.finishQuiz();
    });
  },
  finishQuiz() {
    const Q = this.quiz, s = this.state;
    s.quizDay[Q.n.id] = s.day;
    const reward = [0, 4, 9, 16][Q.score], xp = [2, 5, 10, 18][Q.score];
    this.addMoney(reward, true);
    const res = this.addXP(xp, Q.loc);
    if (Q.score === 3) { s.totals.quizWins++; this.questEvent('quiz', Q.n.id); if (s.totals.quizWins === 5) { s.home.inventory.puchar_quiz = (s.home.inventory.puchar_quiz || 0) + 1; } }
    this.checkBadges();
    this.save();
    this.openModal(this.panel('⚡ Wynik quizu', `<div class="center"><div class="big-emoji">${Q.score === 3 ? '🏆' : Q.score === 2 ? '👏' : '📚'}</div>
      <p class="pix" style="font-size:22px"><b>${Q.score}/3</b></p><p class="small">+${reward} 🟡 · +${res.amount} XP</p>
      <p class="small muted mt">${Q.score === 3 ? `${Q.n.def.name}: „Znakomicie! Tak się rozpoznaje wiedzę.”` : `${Q.n.def.name}: „Rozpoznawanie to pierwszy krok. Przypominanie — w katedrze!"`}</p></div>`,
      '<button class="btn btn-green" data-close>Super!</button>', 'narrow'));
    this.quiz = null;
  },

  /* ---------------- zgubione fiszki ---------------- */
  collectFiszka(f) {
    const s = this.state, Z = this.zone;
    this.fiszki = this.fiszki.filter(x => x !== f);
    const got = s.fiszki.got[Z.id] || (s.fiszki.got[Z.id] = []);
    got.push(f.k);
    s.totals.fiszki++; s.today.fiszki++;
    audio.pickup();
    this.addMoney(3, true);
    this.questEvent('fiszki');
    this.checkBadges();
    const topics = Z.def.topics.length ? Z.def.topics : Object.keys(LOCATIONS);
    const pool = QUESTIONS_DB.filter(q => topics.includes(q.locId));
    const known = pool.filter(q => s.stats.answeredQuestions[q.id]);
    const src = known.length && Math.random() < 0.6 ? known : pool;
    const q = src[Math.floor(Math.random() * src.length)];
    const L = LOCATIONS[q.locId];
    const m = this.openModal(this.panel('📜 Zgubiona fiszka!',
      `<div class="scroll-fact"><div class="row"><span class="tag">${L.icon} ${esc(L.name)}</span><span class="tag gold">+3 🟡</span></div>
        <p class="q-topic mt">${esc(q.topic)}</p>
        <p class="mt"><b>${esc(q.question)}</b></p>
        <details class="mt"><summary style="cursor:pointer;font-weight:700">Najpierw spróbuj odpowiedzieć w myślach… potem kliknij</summary>
          <p class="mt">${esc(q.canonicalAnswer)}</p><p class="small muted mt">${esc(q.explanation)}</p></details></div>`,
      '<button class="btn" id="fz-rev">🔁 Muszę powtórzyć</button><button class="btn btn-green" id="fz-ok">✓ Wiem to</button>', 'narrow'));
    m.querySelector('#fz-ok').addEventListener('click', () => this.closeModal());
    m.querySelector('#fz-rev').addEventListener('click', () => { s.stats.review = s.stats.review || {}; s.stats.review[q.id] = true; this.toast('Dodano do „Do powtórki” w dzienniku.'); this.closeModal(); });
    this.save();
  },

  /* ---------------- zadania dnia ---------------- */
  generateQuests() {
    const s = this.state;
    const rnd = mulberry(hashStr('quests|' + s.day + '|' + (s.player.name || '')));
    const locs = Object.keys(LOCATIONS).filter(l => this.remainingFor(l) > 0);
    const list = [];
    const L = locs.length ? pick(rnd, locs) : 'eba';
    list.push({ type: 'answer', target: L, n: 2 + Math.floor(rnd() * 2), icon: LOCATIONS[L].icon, text: `Zalicz pytania w: ${LOCATIONS[L].name} (${ZONES[LOCATIONS[L].zone].name})`, reward: 25, xp: 15 });
    const pool = shuffle(rnd, ['fiszki', 'quiz', 'talk', 'visit']).slice(0, 2);
    pool.forEach(t => {
      if (t === 'fiszki') list.push({ type: 'fiszki', target: null, n: 3, icon: '📜', text: 'Znajdź 3 zgubione fiszki (leżą w różnych dzielnicach)', reward: 15, xp: 10 });
      if (t === 'quiz') { const loc = pick(rnd, Object.keys(LOCATIONS)); const mid = LOCATIONS[loc].master; list.push({ type: 'quiz', target: mid, n: 1, icon: '⚡', text: `Wygraj szybki quiz 3/3 u: ${NPCS[mid].name} (${ZONES[LOCATIONS[loc].zone].name})`, reward: 20, xp: 15 }); }
      if (t === 'talk') {
        const fun = Object.keys(NPCS).filter(id => !NPCS[id].master && NPCS[id].kind === 'human' && !NPCS[id].night);
        const id = pick(rnd, fun);
        const zid = Object.keys(ZONES).find(z => { const src = ZONES[z].build.toString(); return src.includes(`'${id}'`); });
        list.push({ type: 'talk', target: id, n: 1, icon: '💬', text: `Porozmawiaj z: ${NPCS[id].name}${zid ? ' (' + ZONES[zid].name + ')' : ''}`, reward: 10, xp: 8 });
      }
      if (t === 'visit') { const z = pick(rnd, Object.keys(ZONES).filter(z => z !== s.zone)); list.push({ type: 'visit', target: z, n: 1, icon: ZONES[z].icon, text: `Odwiedź: ${ZONES[z].name}`, reward: 10, xp: 8 }); }
    });
    list.forEach(q => { q.progress = 0; q.done = false; });
    s.quests = { day: s.day, list, bonus: false };
  },
  questEvent(type, target) {
    const s = this.state;
    if (!s.quests || s.quests.day !== s.day) return;
    let changed = false;
    s.quests.list.forEach(q => {
      if (q.done || q.type !== type) return;
      if (q.target && q.target !== target) return;
      q.progress++;
      changed = true;
      if (q.progress >= q.n) {
        q.done = true;
        this.addMoney(q.reward, true);
        this.addXP(q.xp);
        audio.coin();
        setTimeout(() => this.toast(`📌 Zadanie wykonane: ${q.text} (+${q.reward} 🟡)`, 4200), 700);
      }
    });
    if (changed && !s.quests.bonus && s.quests.list.every(q => q.done)) {
      s.quests.bonus = true;
      this.addMoney(25, true);
      this.unlockBadge('zadaniowiec');
      setTimeout(() => this.toast('✅ Wszystkie zadania dnia! Dzienna dawka dopaminy: +25 🟡', 4500), 2600);
    }
  },

  /* ---------------- odznaki ---------------- */
  unlockBadge(id) {
    const s = this.state;
    if (s.stats.badges[id]) return;
    s.stats.badges[id] = true;
    const b = ALL_BADGES.find(x => x.id === id);
    audio.levelUp();
    this.addMoney(30, true);
    setTimeout(() => this.toast(`🏆 Nowa odznaka: ${b.icon} ${b.name}! (+30 🟡)`, 4500), 1200);
    const count = ALL_BADGES.filter(x => s.stats.badges[x.id]).length;
    if (count === 10) { s.home.inventory.zloty_stetoskop = (s.home.inventory.zloty_stetoskop || 0) + 1; setTimeout(() => this.toast('🥇 10 odznak! W ekwipunku czeka trofeum: Złoty Stetoskop.', 5000), 5000); }
    this.updateHUD();
    this.save();
  },
  checkBadges() {
    const s = this.state, a = s.stats.answeredQuestions;
    if (a.arch_1) this.unlockBadge('pogromca');
    if (a.mod_1) this.unlockBadge('piec_krokow');
    if (a.ety_1 && a.ety_2) this.unlockBadge('straznik_etyki');
    if (a.eba_1 && a.eba_2) this.unlockBadge('metodolog');
    if (a.wyw_1 && a.wyw_3) this.unlockBadge('klinicysta');
    if (a.psy_1 && a.dziec_2) this.unlockBadge('psychometra');
    if (ZONE_GRID.flat().every(z => s.visited[z])) this.unlockBadge('kartograf');
    if (s.totals.fiszki >= 15) this.unlockBadge('fiszkarz');
    if (s.home.placed.length >= 6) this.unlockBadge('dekorator');
    if (s.totals.quizWins >= 5) this.unlockBadge('quizmistrz');
  },

  /* ---------------- symulacja pacjenta (Gemini) ---------------- */
  showClinicalSimulationModal() {
    if (this.aiOffline) {
      return this.openModal(this.panel('🧠 Symulacja pacjenta', `<p>Symulacja rozmowy z pacjentem korzysta z modelu Gemini i działa w środowisku <b>Gemini Canvas</b> (tam, gdzie gra powstała).</p><p class="small muted mt">W tym trybie Superwizor AI jest niedostępny — możesz za to ćwiczyć zagadnienia wywiadu w Gabinecie Wywiadu.</p>`, '<button class="btn" data-close>Rozumiem</button>', 'narrow'));
    }
    this.sim = { history: [] };
    const m = this.openModal(this.panel('🧠 Gabinet symulacji: wywiad z pacjentem',
      `<div class="card small"><b>Adam K., 24 lata.</b> Student ekonomii skierowany po ostrym dyżurze (18 szwów na nadgarstku po samouszkodzeniu w upojeniu). Rozstanie 6 mies. temu, problemy z koncentracją, anhedonia.<br>
        <span style="color:var(--blue)"><b>Zadanie:</b> przeprowadź wywiad (pytania otwarte, parafraza, bez sugerowania). Zbadaj ryzyko samobójcze, depresję i picie.</span></div>
       <div id="sim-log" class="chat mt" style="height:280px">
         <div class="bubble sys">Pacjent siedzi w fotelu i patrzy na opatrunek.</div>
         <div class="bubble pat"><b>Adam:</b> Dzień dobry… Lekarz kazał mi tu przyjść, inaczej nie podpisze wypisu. To był po prostu wypadek po pijaku…</div>
       </div>
       <div class="row mt"><input id="sim-in" class="text-in grow" placeholder="Zadaj pytanie lub sparafrazuj…"><button class="btn btn-blue" id="sim-send">Wyślij</button></div>`,
      '<button class="btn btn-gold" id="sim-concept">📋 Zakończ i napisz konceptualizację</button><button class="btn" data-close>Zamknij</button>'));
    const inp = m.querySelector('#sim-in');
    const send = () => this.simSend();
    m.querySelector('#sim-send').addEventListener('click', send);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
    m.querySelector('#sim-concept').addEventListener('click', () => this.simConcept());
    setTimeout(() => inp.focus(), 80);
  },
  async simSend() {
    const m = document.getElementById('modal');
    const inp = m.querySelector('#sim-in'), log = m.querySelector('#sim-log');
    const msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';
    log.insertAdjacentHTML('beforeend', `<div class="bubble me"><b>Ty:</b> ${esc(msg)}</div><div class="bubble sys" id="sim-typing"><span class="ai-dot"></span> Adam się zastanawia…</div>`);
    log.scrollTop = log.scrollHeight;
    this.sim.history.push({ role: 'user', content: msg });
    const ctxt = this.sim.history.map(h => `${h.role === 'user' ? 'Diagnosta' : 'Adam'}: ${h.content}`).join('\n');
    const sys = `Jesteś aktorem grającym pacjenta Adama (24 l.): wstyd po samookaleczeniu, norma „twardego faceta”, pije ok. pół litra wódki dziennie, depresja (anhedonia, bezsenność, brak koncentracji), rozstanie. Gdy diagnosta ocenia, moralizuje, zadaje zamknięte pytania lub używa żargonu — zamykasz się i bagatelizujesz. Gdy słucha aktywnie, parafrazuje, normalizuje wstyd — powoli się otwierasz. Odpowiadaj w 1. osobie, 2-4 zdania, z reakcjami niewerbalnymi w nawiasach kwadratowych.`;
    let reply;
    try {
      const res = await this.callGemini({ contents: [{ role: 'user', parts: [{ text: `Dialog:\n${ctxt}\n\nOdpowiedz jako Adam.` }] }], systemInstruction: { parts: [{ text: sys }] } });
      reply = res?.candidates?.[0]?.content?.parts?.[0]?.text || '[wzdycha] Nie wiem…';
    } catch (e) { reply = '[patrzy w podłogę] Nie wiem, co powiedzieć… (Połączenie z Gemini przerwane.)'; }
    const ty = log.querySelector('#sim-typing'); if (ty) ty.remove();
    log.insertAdjacentHTML('beforeend', `<div class="bubble pat"><b>Adam:</b> ${esc(reply.replace(/^Adam:\s*/i, ''))}</div>`);
    log.scrollTop = log.scrollHeight;
    this.sim.history.push({ role: 'assistant', content: reply });
  },
  simConcept() {
    if (!this.sim || this.sim.history.length < 4) { this.toast('Porozmawiaj z Adamem jeszcze chwilę (min. 2 pytania).'); return; }
    const m = this.openModal(this.panel('📋 Konceptualizacja przypadku',
      `<div class="col small">
        <label><b>1. Hipotezy (co się dzieje z Adamem?)</b><textarea id="c1" class="answer-box" style="min-height:56px"></textarea></label>
        <label><b>2. Mechanizmy i kontekst (np. norma męskości)</b><textarea id="c2" class="answer-box" style="min-height:56px"></textarea></label>
        <label><b>3. Rekomendacje (plan interwencji)</b><textarea id="c3" class="answer-box" style="min-height:56px"></textarea></label>
       </div><div id="c-fb"></div>`,
      '<button class="btn btn-green" id="c-send">Oceń konceptualizację</button><button class="btn" data-close>Zamknij</button>'));
    m.querySelector('#c-send').addEventListener('click', async () => {
      const v = id => m.querySelector(id).value.trim();
      if (v('#c1').length < 5 || v('#c2').length < 5) { this.toast('Uzupełnij punkty 1 i 2.'); return; }
      const fb = m.querySelector('#c-fb');
      fb.innerHTML = '<div class="fb ai small"><span class="ai-dot"></span> Komisja superwizyjna czyta…</div>';
      const hist = this.sim.history.map(h => `${h.role === 'user' ? 'Diagnosta' : 'Pacjent'}: ${h.content}`).join('\n');
      try {
        const res = await this.callGemini({
          contents: [{ role: 'user', parts: [{ text: `Wywiad:\n${hist}\n\nKonceptualizacja:\n1. ${v('#c1')}\n2. ${v('#c2')}\n3. ${v('#c3')}` }] }],
          generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'OBJECT', properties: { grade: { type: 'STRING' }, awardedXp: { type: 'NUMBER' }, evaluationSummary: { type: 'STRING' }, clinicalAdvice: { type: 'STRING' } }, required: ['grade', 'awardedXp', 'evaluationSummary', 'clinicalAdvice'] } },
          systemInstruction: { parts: [{ text: 'Jesteś przewodniczącym komisji superwizyjnej (modele Maloneya i Warda, Paluchowskiego, GAP). Oceń konceptualizację przypadku Adama. Zwróć JSON: grade ("Doskonały"/"Pozytywny"/"Wymaga poprawy"), awardedXp (30-70), evaluationSummary (2-3 zdania), clinicalAdvice (2 zdania).' }] }
        });
        const d = JSON.parse(res?.candidates?.[0]?.content?.parts?.[0]?.text);
        const r = this.addXP(clamp(d.awardedXp || 40, 30, 70), 'wywiad');
        fb.innerHTML = `<div class="fb ok small"><b>🎓 ${esc(d.grade)} (+${r.amount} XP)</b><br>${esc(d.evaluationSummary)}<br><i>${esc(d.clinicalAdvice)}</i></div>`;
      } catch (e) {
        const r = this.addXP(35, 'wywiad');
        fb.innerHTML = `<div class="fb ok small"><b>✓ Konceptualizacja przyjęta do akt (+${r.amount} XP)</b></div>`;
      }
      this.save();
    });
  }
});

/* =====================================================================
   DOM GRACZA: wnętrze, trofea, tryb urządzania
   ===================================================================== */
const FIXED_WALL = [{ x: 3, w: 2 }, { x: 6, w: 3 }, { x: 9, w: 2 }];       // okno, półka, kominek
const FIXED_FLOOR = [{ x: 1, y: 2, w: 1, h: 1 }, { x: 3, y: 2, w: 2, h: 1 }, { x: 11, y: 2, w: 2, h: 2 }];

Object.assign(Game.prototype, {
  badgeFlags() {
    const b = this.state.stats.badges;
    const n = ALL_BADGES.filter(x => b[x.id]).length;
    return Array.from({ length: 12 }, (_, i) => i < n);
  },
  drawRoomFlat(Z) {
    const ctx = this.ctx, home = this.state.home;
    const t = (performance.now() - this.time0) / 1000;
    // dywany
    home.placed.forEach(p => {
      const it = ITEMS[p.id];
      if (!it || it.layer !== 'floor') return;
      const spr = furnitureSprite(p.id);
      ctx.drawImage(spr.c, p.x * 16 - 1, p.y * 16 - 1);
    });
    // półka z trofeami i kominek
    const flags = this.badgeFlags();
    const shelf = furnitureSprite('_shelf', { badges: flags, key: flags.filter(Boolean).length });
    ctx.drawImage(shelf.c, 6 * 16 - 1, 2);
    const fp = furnitureSprite('_fireplace');
    ctx.drawImage(fp.c, 9 * 16 - 1, -1);
    // ogień
    const fx = 9 * 16 + 8, fy = 30;
    for (let i = 0; i < 7; i++) {
      const h = 4 + Math.round((Math.sin(t * 9 + i * 1.7) + 1) * 3);
      ctx.fillStyle = i % 2 ? '#ffb040' : '#ff7a2a';
      ctx.fillRect(fx + i * 2, fy - h, 2, h);
    }
    ctx.fillStyle = '#ffe080'; ctx.fillRect(fx + 5, fy - 3, 4, 3);
    // obrazy na ścianie
    home.placed.forEach(p => {
      const it = ITEMS[p.id];
      if (!it || it.layer !== 'wall') return;
      const spr = furnitureSprite(p.id);
      ctx.drawImage(spr.c, p.x * 16 + Math.round((it.w * 16 - (spr.c.width - 2)) / 2) - 1, p.y * 16 + 1);
    });
    // lampa lawa świeci
    home.placed.forEach(p => {
      if (p.id !== 'lampa_lawa') return;
      ctx.fillStyle = `rgba(255,120,220,${0.5 + Math.sin(t * 2) * 0.3})`;
      ctx.fillRect(p.x * 16 + 7, p.y * 16 + 2 + Math.round(Math.sin(t) * 3), 2, 2);
    });
  },

  /* ---------------- tryb urządzania ---------------- */
  toggleDeco(force) {
    const on = force !== undefined ? force : !this.deco.active;
    if (on && !(this.zone && this.zone.interior && !this.zone.subject)) { this.toast('Urządzać możesz tylko w domu 🏠'); return; }
    if (on && (this.modalOpen || this.dialog)) return;
    this.deco.active = on;
    this.deco.sel = null;
    this.deco.hover = null;
    document.getElementById('t-deco').classList.toggle('on', on);
    document.getElementById('deco-panel').hidden = !on;
    document.getElementById('prompt').style.display = 'none';
    if (on) { this.renderDecoPanel(this.deco.tab || 'items'); this.toast('Tryb urządzania: wybierz mebel i kliknij w pokoju. Kliknięcie w postawiony mebel go podnosi.', 4500); }
    else this.save();
  },
  renderDecoPanel(tab) {
    this.deco.tab = tab;
    const s = this.state, home = s.home;
    const el = document.getElementById('deco-panel');
    const tabs = [['items', '🛋️ Meble'], ['walls', '🧱 Ściany'], ['floor', '🪵 Podłoga'], ['house', '🏡 Dom']];
    const sw = (arr, key, sel) => `<div class="swatches">${arr.map(c => `<div class="sw ${c === sel ? 'sel' : ''}" style="background:${c}" data-set="${key}" data-v="${c}"></div>`).join('')}</div>`;
    const chips = (arr, key, sel) => `<div class="row">${arr.map(o => `<button class="chip ${o.id === sel ? 'sel' : ''}" data-set="${key}" data-v="${o.id}">${o.name}</button>`).join('')}</div>`;
    let body = '';
    if (tab === 'items') {
      const inv = Object.entries(home.inventory).filter(([, n]) => n > 0);
      body = inv.length ? `<div class="inv-grid">${inv.map(([id, n]) => `<div class="inv-slot ${this.deco.sel === id ? 'sel' : ''}" data-item="${id}"><span class="cnt">${n}</span><img src="${itemIconURL(id)}" alt="">${esc(ITEMS[id].name)}</div>`).join('')}</div>`
        : '<p class="small muted">Ekwipunek pusty. Kup meble w <b>Egosyntonii</b> (Osiedle Bezpiecznej Bazy) albo przestaw te, które już stoją — kliknij mebel w pokoju, żeby go podnieść.</p>';
      body += `<p class="tiny muted mt">Dywany kładziesz na podłodze, obrazy i plakaty wieszasz na ścianie (górne dwa rzędy). Prawy przycisk myszy lub ponowne kliknięcie na mebel — podnieś.</p>`;
    } else if (tab === 'walls') {
      body = `<div class="opt-label">Kolor ścian</div>${sw(WALL_COLORS, 'wall', home.wall)}<div class="opt-label">Wzór</div>${chips(WALL_PATTERNS, 'wallPattern', home.wallPattern)}`;
    } else if (tab === 'floor') {
      body = `<div class="opt-label">Rodzaj podłogi</div>${chips(FLOOR_TYPES, 'floorType', home.floorType)}<div class="opt-label">Kolor podłogi</div>${sw(FLOOR_COLORS, 'floorColor', home.floorColor)}<div class="opt-label">Pościel</div>${sw(CLOTH_COLORS, 'quilt', home.quilt)}`;
    } else {
      const b = { id: 'home_prev', kind: 'home', style: 'cottage', x: 0, y: 0, w: 6, h: 4, doorCol: 3, doorRow: 3, wall: home.extWall, roof: home.extRoof, trim: '#ffffff' };
      const prev = buildingSprite(b, 1).c.toDataURL();
      body = `<div class="center"><img src="${prev}" style="width:200px;image-rendering:pixelated" alt="Podgląd domu"></div>
        <div class="opt-label">Ściany domu</div>${sw(EXT_WALLS, 'extWall', home.extWall)}<div class="opt-label">Dach</div>${sw(EXT_ROOFS, 'extRoof', home.extRoof)}
        <p class="tiny muted mt">Tak Twój domek wygląda z ulicy na Osiedlu Bezpiecznej Bazy.</p>`;
    }
    el.innerHTML = `<div class="panel-head" style="border-radius:0"><h2 style="font-size:16px">🛠️ Urządzaj dom</h2><button class="x-btn" id="deco-x">✕</button></div>
      <div class="deco-tabs">${tabs.map(([id, n]) => `<button class="${id === tab ? 'sel' : ''}" data-tab="${id}">${n}</button>`).join('')}</div>
      <div class="deco-body">${body}</div>
      <div class="deco-foot row"><span class="grow">🟡 ${s.money} · przedmiotów w domu: ${home.placed.length}</span><button class="btn btn-sm btn-green" id="deco-done">Gotowe</button></div>`;
    el.querySelector('#deco-x').addEventListener('click', () => this.toggleDeco(false));
    el.querySelector('#deco-done').addEventListener('click', () => this.toggleDeco(false));
    el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { audio.click(); this.renderDecoPanel(b.dataset.tab); }));
    el.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', () => { audio.click(); this.deco.sel = this.deco.sel === b.dataset.item ? null : b.dataset.item; this.renderDecoPanel('items'); }));
    el.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
      audio.click();
      home[b.dataset.set] = b.dataset.v;
      this.refreshHome();
      if (b.dataset.set === 'extWall' || b.dataset.set === 'extRoof') { if (this.zones.osiedle) this.prepareBuildings(this.zones.osiedle); }
      this.renderDecoPanel(tab);
    }));
  },
  refreshHome() {
    const Z = buildHomeZone(this.state.home);
    Z.ground = bakeRoom(this.state.home);
    this.zone = Z;
    this.unstick();
  },
  itemRect(p) { const it = ITEMS[p.id]; return { x: p.x, y: p.y, w: it.w, h: it.h, layer: it.layer }; },
  placedAt(tx, ty) {
    const home = this.state.home;
    const hit = layer => home.placed.slice().reverse().find(p => { const r = this.itemRect(p); return r.layer === layer && tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h; });
    return hit('obj') || hit('wall') || hit('floor');
  },
  canPlace(id, tx, ty) {
    const it = ITEMS[id], home = this.state.home;
    if (!it) return false;
    if (tx < 0 || tx + it.w > HOME.w) return false;
    const over = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const me = { x: tx, y: ty, w: it.w, h: it.h };
    if (it.layer === 'wall') {
      if (ty < 0 || ty + it.h > 2) return false;
      if (FIXED_WALL.some(f => over(me, { x: f.x, y: 0, w: f.w, h: 2 }))) return false;
      return !home.placed.some(p => ITEMS[p.id].layer === 'wall' && over(me, this.itemRect(p)));
    }
    if (ty < 2 || ty + it.h > HOME.h) return false;
    if (it.layer === 'floor') return !home.placed.some(p => ITEMS[p.id].layer === 'floor' && over(me, this.itemRect(p)));
    if (FIXED_FLOOR.some(f => over(me, f))) return false;
    if (over(me, { x: HOME.doorCols[0], y: HOME.h - 2, w: 2, h: 2 })) return false;
    const pt = { x: Math.floor(this.player.x / 16), y: Math.floor((this.player.y - 2) / 16), w: 1, h: 1 };
    if (over(me, pt)) return false;
    return !home.placed.some(p => ITEMS[p.id].layer === 'obj' && over(me, this.itemRect(p)));
  },
  decoClick(w, right) {
    const tx = Math.floor(w.x / 16), ty = Math.floor(w.y / 16);
    const home = this.state.home;
    if (this.deco.sel && !right) {
      const id = this.deco.sel;
      if (!this.canPlace(id, tx, ty)) { audio.error(); this.toast('Tu się nie zmieści 🙃'); return; }
      home.placed.push({ id, x: tx, y: ty });
      home.inventory[id]--;
      if (home.inventory[id] <= 0) { delete home.inventory[id]; this.deco.sel = null; }
      audio.coin();
      this.refreshHome();
      this.checkBadges();
      this.renderDecoPanel('items');
      return;
    }
    const p = this.placedAt(tx, ty);
    if (!p) { if (right) this.deco.sel = null; this.renderDecoPanel('items'); return; }
    home.placed.splice(home.placed.indexOf(p), 1);
    home.inventory[p.id] = (home.inventory[p.id] || 0) + 1;
    this.deco.sel = right ? null : p.id;
    audio.pickup();
    this.refreshHome();
    this.renderDecoPanel('items');
  },
  drawDecoGhost() {
    const h = this.deco.hover;
    if (!h) return;
    const ctx = this.ctx;
    if (this.deco.sel) {
      const id = this.deco.sel, it = ITEMS[id];
      const ok = this.canPlace(id, h.tx, h.ty);
      const spr = furnitureSprite(id);
      ctx.save();
      ctx.globalAlpha = 0.7;
      if (it.layer === 'obj') ctx.drawImage(spr.c, Math.round((h.tx + it.w / 2) * 16 - spr.ax), Math.round((h.ty + it.h) * 16 - spr.ay));
      else ctx.drawImage(spr.c, h.tx * 16 - 1, h.ty * 16 - 1);
      ctx.globalAlpha = 0.35;

      ctx.restore();
    } else {
      const p = this.placedAt(h.tx, h.ty);

      ctx.lineWidth = 1;
      const r = p ? this.itemRect(p) : { x: h.tx, y: h.ty, w: 1, h: 1 };
      ctx.strokeRect(r.x * 16 + 0.5, r.y * 16 + 0.5, r.w * 16 - 1, r.h * 16 - 1);
      ctx.restore();
    }
  }
});

/* =====================================================================

const MINIGAMES = {
  // Quiz ABCD z wyjaśnieniem po każdej odpowiedzi
  quiz(ctx) {

      const it = items[i], opts = shuffle(Math.random, it.a.map((t, k) => ({ t, k })));

        <div class="mg-q">${esc(it.q)}</div>
        <div class="mg-opts">${opts.map((o, j) => `<button class="mg-opt" data-k="${o.k}"><b>${'ABCD'[j]}.</b> ${esc(o.t)}</button>`).join('')}</div><div id="mg-fb"></div>`;
      const pickOpt = btn => {
        if (locked || ctx.dead) return;
        locked = true;
        const good = +btn.dataset.k === 0;
        if (good) { ok++; audio.success(); } else audio.error();
        box.querySelectorAll('.mg-opt').forEach(b2 => { if (+b2.dataset.k === 0) b2.classList.add('ok'); else if (b2 === btn) b2.classList.add('bad'); b2.disabled = true; });
        box.querySelector('#mg-fb').innerHTML = `<div class="fb ${good ? 'ok' : 'bad'} mt">${good ? '✔ Dobrze!' : '✘ Nie tym razem.'} ${esc(it.why || '')}</div>
          <div class="row mt"><span class="grow"></span><button class="btn btn-green" id="mg-next">${i + 1 < items.length ? 'Dalej ▶' : 'Wynik ▶'} [Enter]</button></div>`;
        box.querySelector('#mg-next').addEventListener('click', next);
      };
      box.querySelectorAll('.mg-opt').forEach(btn => btn.addEventListener('click', () => pickOpt(btn)));
      ctx.key = e => {
        const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);

        if (e.code === 'Enter' && locked) next();

    let lastAdvanced = -1;

      if (ctx.dead || lastAdvanced === i) return;

  // Memory: pojęcie ↔ definicja
  pairs(ctx) {
    const P = ctx.R.pairs;
    const cards = shuffle(Math.random, P.flatMap((p, k) => [{ k, t: p[0], term: true }, { k, t: p[1] }]));
    let open = [], matched = 0, moves = 0, lock = false;
    const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-moves">Ruchy: 0</span><span class="tag">Par: ${P.length}</span><span class="small muted">Pojęcia są pogrubione, definicje — zwykłą czcionką.</span></div>
      <div class="mg-cards">${cards.map((c, i) => `<button class="mg-card back" data-i="${i}"><span>${c.term ? '<b>' + esc(c.t) + '</b>' : esc(c.t)}</span></button>`).join('')}</div>`);
    m.querySelectorAll('.mg-card').forEach(el => el.addEventListener('click', () => {
      const c = cards[+el.dataset.i];

  // Sortownia: kafelek → przegródka
  sort(ctx) {
    const R = ctx.R, items = shuffle(Math.random, R.items.map(([t, b]) => ({ t, b })));
    let sel = null, errors = 0, placed = 0;
    const m = this.mgPanel(ctx, `<div class="mg-top"><span class="small muted">Kliknij kafelek, a potem przegródkę, do której pasuje.</span><span class="grow"></span><span class="tag" id="mg-err">Błędy: 0</span></div>

      const it = items[+sel.dataset.i], j = +bin.dataset.j;

  // Układanka: klikaj kroki we właściwej kolejności
  order(ctx) {
    const R = ctx.R, N = R.items.length;

  // Błyskawica: prawda/fałsz na czas
  tf(ctx) {

      <div class="mg-timer"><i id="mg-bar" style="width:100%"></i></div>

      <div class="mg-tf"><button class="btn btn-green" id="mg-t">✔ Prawda [←]</button><button class="btn mg-false" id="mg-f">✘ Fałsz [→]</button></div>
      <div id="mg-fb" class="small mt center"></div>`);

      m.querySelector('#mg-fb').innerHTML = good ? '<span class="mg-good">✔ Tak!</span>' : `<span class="mg-bad">✘ To ${truth ? 'prawda' : 'fałsz'}.</span> ${esc(why || '')}`;
      i++;

    m.querySelector('#mg-t').addEventListener('click', () => answer(true));
    m.querySelector('#mg-f').addEventListener('click', () => answer(false));

  // Eksperyment: reprodukcja czasu trwania świecenia lampy (metoda Rammsayera)
  timeest(ctx) {
    const R = ctx.R, durs = shuffle(Math.random, (R.durations || [1.5, 3, 4.5, 6]).slice());
    let i = 0, phase = 'ready', t0 = 0, tmo = null;
    const res = [];
    const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-n">Próba 1/${durs.length}</span><span class="grow"></span><span class="small muted">Nie licz w myślach „raz, dwa, trzy” — liczenie zmienia zadanie!</span></div>
      <div class="mg-lamp" id="mg-lamp"></div>
      <p class="center" id="mg-msg">Naciśnij przycisk (albo spację) i patrz na lampę.</p>
      <button class="btn btn-green mg-hold" id="mg-btn">▶ Start</button>
      <div id="mg-log" class="mg-log"></div>`);
    const lamp = m.querySelector('#mg-lamp'), msg = m.querySelector('#mg-msg'), btn = m.querySelector('#mg-btn');
    const present = () => {
      phase = 'show'; btn.disabled = true; btn.textContent = '👀'; msg.textContent = 'Uwaga… lampa zaraz się zapali.';
      m.querySelector('#mg-n').textContent = `Próba ${i + 1}/${durs.length}`;
      tmo = setTimeout(() => {
        lamp.classList.add('on'); audio.blip();

          lamp.classList.remove('on'); phase = 'wait';

          btn.disabled = false; btn.textContent = '⏺ Przytrzymaj';
        }, durs[i] * 1000);
      }, 900 + Math.random() * 800);
    };
    const down = () => {
      if (ctx.dead) return;
      if (phase === 'ready') return present();
      if (phase !== 'wait') return;
      phase = 'hold'; t0 = performance.now(); lamp.classList.add('on', 'you'); btn.textContent = '… puść, gdy minie tyle samo';
    };
    const up = () => {
      if (phase !== 'hold') return;
      const rep = (performance.now() - t0) / 1000, d = durs[i], err = (rep - d) / d;
      lamp.classList.remove('on', 'you');
      res.push({ d, rep, err });
      m.querySelector('#mg-log').insertAdjacentHTML('beforeend', `<div>Próba ${i + 1}: lampa ${d.toFixed(1)} s → Ty ${rep.toFixed(2)} s <b class="${Math.abs(err) < 0.15 ? 'mg-good' : 'mg-bad'}">${err >= 0 ? '+' : ''}${Math.round(err * 100)}%</b></div>`);
      i++;
      if (i >= durs.length) { phase = 'done'; setTimeout(end, 500); return; }
      phase = 'pause'; btn.disabled = true; btn.textContent = '…';
      msg.textContent = 'Zapisane. Za chwilę kolejna próba.';
      tmo = setTimeout(() => { phase = 'ready'; btn.disabled = false; btn.textContent = '▶ Następna próba'; msg.textContent = 'Gotowe? Naciśnij, żeby zobaczyć lampę.'; }, 700);
    };
    const end = () => {
      if (ctx.dead) return;
      const mean = res.reduce((a, r) => a + Math.abs(r.err), 0) / res.length;
      const short = res.filter(r => r.d <= 2), long = res.filter(r => r.d >= 4.5);
      const avg = a => a.reduce((s, r) => s + r.err, 0) / Math.max(1, a.length);
      const vier = short.length && long.length && avg(short) > avg(long);
      const rows = res.slice().sort((a, b) => a.d - b.d).map(r => `<tr><td>${r.d.toFixed(1)} s</td><td>${r.rep.toFixed(2)} s</td><td>${r.err >= 0 ? '+' : ''}${Math.round(r.err * 100)}%</td></tr>`).join('');
      ctx.finish(clamp(1 - mean * 1.25, 0, 1), `<table class="mg-table"><tr><th>Lampa</th><th>Twoja reprodukcja</th><th>Błąd</th></tr>${rows}</table>
        <p class="small">Średni błąd bezwzględny: <b>${Math.round(mean * 100)}%</b>. ${vier ? 'Krótsze interwały oceniasz względnie dłużej niż długie — to klasyczne <b>prawo Vierordta</b> (ciążenie ocen ku środkowi zakresu).' : 'Zwykle krótkie interwały przeszacowujemy, a długie niedoszacowujemy (prawo Vierordta) — sprawdź, czy u Ciebie też to wyjdzie przy kolejnej próbie.'} Im dłuższy interwał, tym większa zmienność ocen — to właściwość skalarna.</p>`);
    };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
    btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up);
    ctx.key = e => { if (e.code === 'Space' && !e.repeat) down(); };
    ctx.keyUp = e => { if (e.code === 'Space') up(); };
    ctx.cleanups.push(() => clearTimeout(tmo));
    this.mgKeys(ctx);
  },

  // Eksperyment: rotacja mentalna (Shepard i Metzler, 1971)
  rotate(ctx) {
    const SHAPES = [[[1, 0], [2, 0], [0, 1], [1, 1], [1, 2]], [[0, 0], [0, 1], [0, 2], [0, 3], [1, 3]], [[1, 0], [1, 1], [0, 2], [1, 2], [0, 3]], [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2]], [[1, 0], [0, 1], [1, 1], [1, 2], [1, 3]]];
    const ANGLES = [0, 60, 120, 180];
    const trials = shuffle(Math.random, ANGLES.flatMap(a => [0, 1, 2].map(k => ({ a, mirror: Math.random() < 0.5, shape: SHAPES[Math.floor(Math.random() * SHAPES.length)], flipDir: k % 2 ? -1 : 1 }))));
    let i = 0, tStart = 0, live = false, tmo = null;
    const res = [];
    const col = ctx.R.light;
    const m = this.mgPanel(ctx, `<div class="mg-top"><span class="tag" id="mg-n">Próba 1/${trials.length}</span><span class="grow"></span><span class="small muted">[F] = ta sama · [J] = lustrzana</span></div>
      <canvas class="mg-canvas" id="mg-cv" width="360" height="170"></canvas>
      <div class="mg-tf"><button class="btn btn-green" id="mg-same">🟰 Ta sama [F]</button><button class="btn btn-purple" id="mg-mir">🪞 Lustrzana [J]</button></div>
      <div id="mg-fb" class="small center mt"></div>`);
    const cv = m.querySelector('#mg-cv'), g = cv.getContext('2d');
    const drawShape = (cells, cx, cy, ang, mirror) => {
      const S = 20, mx = cells.reduce((a, c) => a + c[0], 0) / cells.length + 0.5, my = cells.reduce((a, c) => a + c[1], 0) / cells.length + 0.5;
      g.save(); g.translate(cx, cy); g.rotate(ang * Math.PI / 180); if (mirror) g.scale(-1, 1);
      cells.forEach(([x, y]) => {
        const px = (x - mx) * S, py = (y - my) * S;
        g.fillStyle = col; g.fillRect(px, py, S, S);
        g.fillStyle = 'rgba(255,255,255,0.45)'; g.fillRect(px, py, S, 3);
        g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(px + S - 3, py, 3, S);
        g.strokeStyle = '#1f1a2e'; g.lineWidth = 2; g.strokeRect(px, py, S, S);
      });
      g.restore();
    };
    const clear = () => { g.fillStyle = '#1f1a2e'; g.fillRect(0, 0, cv.width, cv.height); };
    const present = () => {
      clear(); live = false;
      g.fillStyle = '#fff'; g.font = `24px ${PIXEL_FONT}`; g.textAlign = 'center'; g.fillText('+', 180, 95);
      m.querySelector('#mg-n').textContent = `Próba ${i + 1}/${trials.length}`;
      tmo = setTimeout(() => {
        if (ctx.dead) return;
        const T = trials[i];
        clear(); drawShape(T.shape, 90, 85, 0, false); drawShape(T.shape, 270, 85, T.a * T.flipDir, T.mirror);
        tStart = performance.now(); live = true;
      }, 550);
    };
    const answer = saysMirror => {
      if (!live || ctx.dead) return;
      live = false;
      const T = trials[i], rt = performance.now() - tStart, good = saysMirror === T.mirror;
      res.push({ a: T.a, rt, good });
      if (good) audio.blip(); else audio.error();
      m.querySelector('#mg-fb').innerHTML = good ? `<span class="mg-good">✔</span> ${Math.round(rt)} ms` : `<span class="mg-bad">✘ To była figura ${T.mirror ? 'lustrzana' : 'ta sama'}.</span>`;
      i++;
      if (i >= trials.length) return setTimeout(end, 300);
      present();
    };
    const end = () => {
      if (ctx.dead) return;
      const acc = res.filter(r => r.good).length / res.length;
      const means = ANGLES.map(a => { const rs = res.filter(r => r.a === a && r.good).map(r => r.rt); return rs.length ? rs.reduce((x, y) => x + y, 0) / rs.length : 0; });
      const mx = Math.max(...means, 1);
      const bars = ANGLES.map((a, k) => `<div class="mg-barcol"><div class="mg-barval">${means[k] ? Math.round(means[k]) + ' ms' : '—'}</div><div class="mg-bar" style="height:${Math.round(means[k] / mx * 90) + 4}px"></div><div class="mg-barlab">${a}°</div></div>`).join('');
      const rising = means[3] > means[0];
      ctx.finish(acc, `<div class="mg-bars">${bars}</div>
        <p class="small">Poprawność: <b>${Math.round(acc * 100)}%</b>. ${rising ? 'Twój czas reakcji rośnie wraz z kątem obrotu — dokładnie jak u Sheparda i Metzlera (1971)!' : 'U Sheparda i Metzlera czas rósł liniowo z kątem; przy kilku próbach szum bywa większy niż efekt — spróbuj jeszcze raz.'} Wniosek: obraz umysłowy „obracamy” w stałym tempie, jak prawdziwy przedmiot — argument za analogową (obrazową) naturą wyobrażeń.</p>`);
    };
    m.querySelector('#mg-same').addEventListener('click', () => answer(false));
    m.querySelector('#mg-mir').addEventListener('click', () => answer(true));
    ctx.key = e => { if (e.code === 'KeyF') answer(false); if (e.code === 'KeyJ') answer(true); };
    ctx.cleanups.push(() => clearTimeout(tmo));
    this.mgKeys(ctx);
    present();
  }
};

Object.assign(Game.prototype, {
  /* ---------------- postęp w domach-przedmiotach ---------------- */
  subjState(sid) {
    const s = this.state;
    if (!s.subj) s.subj = {};
    if (!s.subj[sid]) s.subj[sid] = {};
    return s.subj[sid];
  },
  roomStars(sid, i) {
    const r = SUBJECTS[sid].rooms[i], st = this.subjState(sid)[r.id];
    return st && st.stars ? st.stars : 0;
  },
  subjDoneCount(sid) { return SUBJECTS[sid].rooms.filter((r, i) => this.roomStars(sid, i) > 0).length; },
  subjectDoorPrompt(b) {
    const S = SUBJECTS[b.subject];
    return `Wejdź: ${S.name} · ${S.subject} · pokoje ${this.subjDoneCount(b.subject)}/${S.rooms.length}`;
  },
  spotPrompt(it) {
    if (isHalinaSpot(it.kind)) return this.halinaPrompt(it);
    if (it.kind === 'station') {
      const R = SUBJECTS[it.subj].rooms[it.room], st = this.roomStars(it.subj, it.room);
      return `${R.icon} ${R.name} — ${MG_KIND[R.kind].name}${st ? ' · ' + '★'.repeat(st) : ''}`;
    }
    if (it.kind === 'lectern') return 'Pulpit gospodarza — o przedmiocie';
    if (it.kind === 'prom_powrot') return 'Prom — wróć do Portu';
