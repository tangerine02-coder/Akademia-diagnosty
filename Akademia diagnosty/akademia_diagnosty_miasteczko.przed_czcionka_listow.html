// Tło pokoju (ściana + podłoga) z wybranymi kolorami
function bakeRoom(home) {
  const Wd = HOME.w * 16, Hd = HOME.h * 16;
  const [c, g] = mkCanvas(Wd, Hd);
  const wc = home.wall || WALL_COLORS[0], fc = home.floorColor || FLOOR_COLORS[0];
  const wallH = 32;
  R(g, 0, 0, Wd, wallH, wc);
  const pat = home.wallPattern || 'plain';
  if (pat === 'stripes') for (let x = 0; x < Wd; x += 8) R(g, x, 0, 3, wallH, shade(wc, -0.07));
  if (pat === 'dots') for (let y = 3; y < wallH - 4; y += 6) for (let x = ((y / 6) % 2) * 4 + 2; x < Wd; x += 8) P(g, x, y, shade(wc, -0.2));
  if (pat === 'diamond') for (let y = 0; y < wallH; y += 8) for (let x = 0; x < Wd; x += 8) { P(g, x + 4, y, shade(wc, -0.15)); P(g, x + 3, y + 1, shade(wc, -0.15)); P(g, x + 5, y + 1, shade(wc, -0.15)); P(g, x + 4, y + 2, shade(wc, -0.15)); }
  if (pat === 'wood') { R(g, 0, 16, Wd, 16, shade(wc, -0.25)); for (let x = 0; x < Wd; x += 6) R(g, x, 16, 1, 16, shade(wc, -0.38)); R(g, 0, 15, Wd, 2, shade(wc, -0.1)); }
  R(g, 0, 0, Wd, 2, shade(wc, -0.3));
  R(g, 0, wallH - 3, Wd, 3, '#6b4526'); R(g, 0, wallH - 3, Wd, 1, '#8a5a30');
  // podłoga
  const ft = home.floorType || 'planks';
  R(g, 0, wallH, Wd, Hd - wallH, fc);
  if (ft === 'planks') for (let y = wallH; y < Hd; y += 6) { R(g, 0, y + 5, Wd, 1, shade(fc, -0.25)); for (let x = ((y / 6) % 3) * 13; x < Wd; x += 38) R(g, x, y, 1, 5, shade(fc, -0.25)); }
  if (ft === 'parquet') for (let y = wallH; y < Hd; y += 8) for (let x = 0; x < Wd; x += 8) { if (((x + y) / 8) % 2) for (let k = 0; k < 8; k += 2) R(g, x + k, y, 1, 8, shade(fc, -0.15)); else for (let k = 0; k < 8; k += 2) R(g, x, y + k, 8, 1, shade(fc, -0.15)); }
  if (ft === 'tiles') for (let y = wallH; y < Hd; y += 16) for (let x = 0; x < Wd; x += 16) { if (((x + y) / 16) % 2) R(g, x, y, 16, 16, shade(fc, 0.12)); R(g, x, y, 16, 1, shade(fc, -0.2)); R(g, x, y, 1, 16, shade(fc, -0.2)); }
  if (ft === 'carpet') { const rnd = mulberry(5); for (let i = 0; i < 500; i++) P(g, rnd() * Wd, wallH + rnd() * (Hd - wallH), shade(fc, rnd() > 0.5 ? -0.08 : 0.08)); }
  R(g, 0, wallH, Wd, 3, 'rgba(0,0,0,0.12)');
  // wycieraczka przy drzwiach
  R(g, HOME.doorCols[0] * 16 + 2, Hd - 10, 28, 9, '#8a6a3a'); R(g, HOME.doorCols[0] * 16 + 4, Hd - 8, 24, 5, '#a8844a');
  // okno na ścianie
  const wx = 3 * 16 + 4;
  R(g, wx, 5, 22, 18, '#f4f0e6'); R(g, wx + 2, 7, 18, 14, '#8fd0ee'); R(g, wx + 2, 7, 18, 6, '#bfe4f5'); R(g, wx + 10, 7, 2, 14, '#f4f0e6'); R(g, wx + 2, 13, 18, 1, '#f4f0e6');
  R(g, wx - 2, 23, 26, 2, '#8a5a30');
  return c;
}

/* =====================================================================
   BUDOWNICZY DZIELNIC — z opisu w ZONES tworzy teren, kolizje i obiekty
   ===================================================================== */
function zoneNeighbors(id) {
  const def = ZONES[id];
  const G = GRIDS[def.grid || 'main'];
  const at = (x, y) => (G[y] && G[y][x]) || null;
  return { N: at(def.gx, def.gy - 1), S: at(def.gx, def.gy + 1), W: at(def.gx - 1, def.gy), E: at(def.gx + 1, def.gy) };
}

class ZoneBuilder {
  constructor(id) {
    const def = ZONES[id];
    this.def = def;
    const nb = zoneNeighbors(id);
    this.Z = {
      id, def, w: ZW, h: ZH, pal: def.pal,
      terrain: new Array(ZW * ZH).fill('grass'),
      solid: new Uint8Array(ZW * ZH),
      reserved: new Uint8Array(ZW * ZH),
      objects: [], flats: [], fences: [], fenceSet: new Set(), hedges: [], hedgeSet: new Set(),
      buildings: [], npcs: [], interacts: [], lights: [], patches: [],
      neighbors: nb,
      exits: { N: !!nb.N, S: !!nb.S, W: !!nb.W, E: !!nb.E }
    };
    this.rnd = mulberry(hashStr('zone:' + id));
  }
  in(x, y) { return x >= 0 && y >= 0 && x < ZW && y < ZH; }
  i(x, y) { return y * ZW + x; }
  T(x, y) { return this.in(x, y) ? this.Z.terrain[this.i(x, y)] : null; }
  setT(x, y, t) { if (this.in(x, y)) this.Z.terrain[this.i(x, y)] = t; }
  solidAt(x, y) { if (this.in(x, y)) this.Z.solid[this.i(x, y)] = 1; }
  reserve(x, y, w = 1, h = 1) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (this.in(xx, yy)) this.Z.reserved[this.i(xx, yy)] = 1; }
  isReserved(x, y) { return !this.in(x, y) || this.Z.reserved[this.i(x, y)] === 1; }
  inExitLane(x, y) {
    const E = this.Z.exits;
    const inRows = y >= EXIT_ROWS[0] - 1 && y <= EXIT_ROWS[1] + 1;
    const inCols = x >= EXIT_COLS[0] - 1 && x <= EXIT_COLS[1] + 1;
    return (E.W && x <= 3 && inRows) || (E.E && x >= ZW - 4 && inRows) || (E.N && y <= 3 && inCols) || (E.S && y >= ZH - 4 && inCols);
  }

  fill(t) { this.Z.terrain.fill(t); }
  rect(x, y, w, h, t) {
    for (let yy = Math.floor(y); yy < y + h; yy++) for (let xx = Math.floor(x); xx < x + w; xx++) this.setT(xx, yy, t);
  }
  disc(cx, cy, r, t) {
    for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) this.setT(x, y, t);
    }
  }
  // falista linia brzegowa: od wiersza y0 mokry piasek, dalej woda do końca mapy
  shore(y0, land) {
    for (let x = 0; x < ZW; x++) {
      const off = Math.round(Math.sin(x * 0.45) * 0.7 + Math.sin(x * 0.17 + 1.3) * 0.8);
      const y = y0 + off;
      this.rect(x, y - 1, 1, 1, land);
      this.rect(x, y, 1, 2, 'wetsand');
      this.rect(x, y + 2, 1, ZH - y - 2, 'water');
    }
  }
  patches(t, n, rmin, rmax) {
    for (let k = 0; k < n; k++) this.Z.patches.push({ x: this.rnd() * ZW, y: this.rnd() * ZH, r: rmin + this.rnd() * (rmax - rmin) });
  }

  border(kind, depth, opts = {}) {
    const skip = opts.skip || [];
    const E = this.Z.exits;
    const kinds = opts.kinds || (kind === 'deadtrees' ? ['dead'] : ['oak', 'pine', 'oak', 'birch']);
    for (let y = 0; y < ZH; y++) for (let x = 0; x < ZW; x++) {
      const dN = y, dS = ZH - 1 - y, dW = x, dE = ZW - 1 - x;
      const d = Math.min(dN, dS, dW, dE);
      if (d >= depth) continue;
      const side = d === dN ? 'N' : d === dS ? 'S' : d === dW ? 'W' : 'E';
      if (skip.includes(side)) continue;
      // przejścia do sąsiednich dzielnic zostają otwarte
      if ((dN < depth && E.N && x >= EXIT_COLS[0] && x <= EXIT_COLS[1]) || (dS < depth && E.S && x >= EXIT_COLS[0] && x <= EXIT_COLS[1])) continue;
      if ((dW < depth && E.W && y >= EXIT_ROWS[0] && y <= EXIT_ROWS[1]) || (dE < depth && E.E && y >= EXIT_ROWS[0] && y <= EXIT_ROWS[1])) continue;
      if (this.T(x, y) === 'water') continue;
      if (kind === 'trees' || kind === 'deadtrees') {
        this.solidAt(x, y); this.reserve(x, y);
        if ((x + y) % 2 === 0 || (d === 0 && this.rnd() < 0.5)) {
          const k = pick(this.rnd, kinds);
          this.Z.objects.push({ type: 'tree', kind: k, x, y, fw: 1, fh: 1, v: Math.floor(this.rnd() * 3), pal: this.def.song === 'las' ? 'las' : '', border: true });
        }
        if (kind === 'deadtrees' && d === 0 && this.rnd() < 0.3) this.addFence(x, y, 'iron');
      } else if (kind === 'hedge') {
        this.addHedge(x, y);
      } else if (kind === 'fence') {
        if (d === 0) this.addFence(x, y, this.def.song === 'plaza' ? 'rope' : this.def.song === 'port' ? 'barrier' : 'wood');
        else { this.solidAt(x, y); }
      }
    }
  }
  addFence(x, y, style) {
    if (!this.in(x, y) || this.Z.fenceSet.has(x + ',' + y)) return;
    this.Z.fences.push({ x, y, style }); this.Z.fenceSet.add(x + ',' + y);
    this.solidAt(x, y); this.reserve(x, y);
  }
  addHedge(x, y) {
    if (!this.in(x, y) || this.Z.hedgeSet.has(x + ',' + y)) return;
    this.Z.hedges.push({ x, y }); this.Z.hedgeSet.add(x + ',' + y);
    this.solidAt(x, y); this.reserve(x, y);
  }
  fence(x1, y1, x2, y2, style = 'wood') {
    const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
    let x = x1, y = y1;
    for (let k = 0; k < 200; k++) { this.addFence(x, y, style); if (x === x2 && y === y2) break; x += dx; y += dy; }
  }
  // gaps: { top:[c1,c2], bottom:[c1,c2], left:[r1,r2], right:[r1,r2] } — furtki
  fenceRect(x, y, w, h, style = 'wood', gaps = {}) {
    const inGap = (g, v) => g && v >= g[0] && v <= g[1];
    for (let xx = x; xx < x + w; xx++) {
      if (!inGap(gaps.top, xx)) this.addFence(xx, y, style);
      if (!inGap(gaps.bottom, xx)) this.addFence(xx, y + h - 1, style);
    }
    for (let yy = y + 1; yy < y + h - 1; yy++) {
      if (!inGap(gaps.left, yy)) this.addFence(x, yy, style);
      if (!inGap(gaps.right, yy)) this.addFence(x + w - 1, yy, style);
    }
    this.reserve(x, y, w, h);
  }
  hedge(x, y, w, h) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.addHedge(xx, yy); }

  building(spec) {
    const b = Object.assign({}, spec);
    b.doorCol = b.x + Math.floor(b.w / 2);
    b.doorRow = b.y + b.h - 1;
    for (let yy = b.y; yy < b.y + b.h; yy++) for (let xx = b.x; xx < b.x + b.w; xx++) {
      if (xx === b.doorCol && yy === b.doorRow) continue;
      this.solidAt(xx, yy);
    }
    this.reserve(b.x - 1, b.y - 1, b.w + 2, b.h + 2);
    this.Z.buildings.push(b);
    this.Z.objects.push({ type: 'building', b, x: b.x, y: b.y, fw: b.w, fh: b.h });
    return b;
  }
  obj(type, x, y, opts = {}) {
    const o = Object.assign({ type, x, y, fw: 1, fh: 1 }, opts);
    if (type === 'tree' && o.v == null) o.v = Math.floor(this.rnd() * 3);
    if (type === 'tree' && !o.pal) o.pal = this.def.song === 'las' ? 'las' : '';
    if (type === 'parasol' && o.v == null) o.v = this.rnd();
    if (o.solid !== false) for (let yy = y; yy < y + o.fh; yy++) for (let xx = x; xx < x + o.fw; xx++) this.solidAt(xx, yy);
    this.reserve(x, y, o.fw, o.fh);
    this.Z.objects.push(o);
    if (o.interact) this.Z.interacts.push({ x, y, w: o.fw, h: o.fh, kind: o.interact });
    return o;
  }
  flat(type, x, y, opts = {}) {
    const f = Object.assign({ type, x, y, w: opts.w || 1, h: opts.h || 1 }, opts);
    if (opts.solid) for (let yy = y; yy < y + f.h; yy++) for (let xx = x; xx < x + f.w; xx++) this.solidAt(xx, yy);
    this.reserve(x, y, f.w, f.h);
    this.Z.flats.push(f);
    return f;
  }
  sign(x, y, text) { this.Z.interacts.push({ x, y, w: 1, h: 1, kind: 'sign', text }); }
  interact(x, y, opts) { this.Z.interacts.push(Object.assign({ x, y, w: 1, h: 1 }, opts)); }
  plaque(x, y, loc) { this.Z.interacts.push({ x, y, w: 1, h: 1, kind: 'plaque', loc }); }
  tombstones(x, y, w, h, loc) {
    const qs = QUESTIONS_DB.filter(q => q.locId === loc);
    let k = 0;
    for (let yy = y + 2; yy < y + h - 1; yy += 2) for (let xx = x + 2; xx < x + w - 1; xx += 2) {
      if (k >= qs.length) return;
      this.obj('tombstone', xx, yy, { variant: k, qid: qs[k].id });
      this.Z.interacts.push({ x: xx, y: yy, w: 1, h: 1, kind: 'tomb', qid: qs[k].id });
      k++;
    }
  }
  npc(id, x, y) {
    this.Z.npcs.push({ id, x, y });
    this.reserve(x - 1, y - 1, 3, 3);
  }

  scatter(type, n, opts = {}) {
    const terr = opts.terrain ? new Set(opts.terrain) : null;
    const [ax, ay, aw, ah] = opts.area || [0, 0, ZW, ZH];
    const cands = [];
    for (let y = ay; y < ay + ah; y++) for (let x = ax; x < ax + aw; x++) {
      if (!this.in(x, y)) continue;
      if (terr && !terr.has(this.T(x, y))) continue;
      if (this.isReserved(x, y) || this.Z.solid[this.i(x, y)]) continue;
      if (this.inExitLane(x, y)) continue;
      if (!opts.flat && y >= ZH - 1) continue;
      cands.push([x, y]);
    }
    const chosen = [];
    const md = opts.minDist || 0;
    const sh = shuffle(this.rnd, cands);
    for (const [x, y] of sh) {
      if (chosen.length >= n) break;
      if (md && chosen.some(([cx, cy]) => Math.abs(cx - x) < md && Math.abs(cy - y) < md)) continue;
      if (this.isReserved(x, y)) continue;
      chosen.push([x, y]);
      const FLAT_TYPES = ['flowers', 'wildflowers', 'crop', 'shell', 'towel', 'dunegrass', 'rock', 'rubble', 'crack', 'weeds', 'mushroom', 'fern', 'stump', 'lily'];
      if (opts.flat || FLAT_TYPES.includes(type)) {
        const f = this.flat(type, x, y, { solid: !!opts.solid });
        if (opts.glow) this.Z.lights.push({ x: x * 16 + 8, y: y * 16 + 10, r: 22, col: '#7af0ff', s: 0.55 });
        if (!opts.solid) this.Z.reserved[this.i(x, y)] = 0; // na kwiatkach można stać
        f.walk = !opts.solid;
      } else if (type === 'tree') {
        this.obj('tree', x, y, { kind: pick(this.rnd, opts.kinds || ['oak']) });
        this.reserve(x - 1, y - 1, 3, 2);
      } else {
        this.obj(type, x, y, {});
      }
    }
  }

  finalize() {
    const Z = this.Z;
    for (let y = 0; y < ZH; y++) for (let x = 0; x < ZW; x++) {
      const t = Z.terrain[this.i(x, y)];
      if (TERRAIN[t] && !TERRAIN[t].walk) Z.solid[this.i(x, y)] = 1;
    }
    // NPC nie mogą stać w drzewie ani w murze
    Z.npcs.forEach(n => {
      const def = NPCS[n.id] || {};
      if (def.kind === 'seahorse' || def.water) return;
      Z.solid[this.i(n.x, n.y)] = 0;
      Z.objects = Z.objects.filter(o => o.type === 'building' || !(n.x >= o.x && n.x < o.x + o.fw && n.y >= o.y && n.y < o.y + o.fh));
    });
    // światła nocne
    Z.objects.forEach(o => {
      const cx = (o.x + o.fw / 2) * 16, by = (o.y + o.fh) * 16;
      if (o.type === 'lamp') {
        const k = o.kind || 'iron';
        if (k === 'broken') Z.lights.push({ x: cx, y: by - 22, r: 34, col: '#d8e0a0', s: 0.5, flicker: true });
        else if (k === 'mushroom') Z.lights.push({ x: cx, y: by - 18, r: 58, col: '#b89aff', s: 0.9 });
        else Z.lights.push({ x: cx, y: by - 24, r: 64, col: o.lightCol || '#ffd98a', s: 1 });
      }
      if (o.type === 'tree' && o.kind === 'neuron') Z.lights.push({ x: cx, y: by - 22, r: 40, col: '#7ae8f0', s: 0.6 });
      if (o.type === 'fountain') Z.lights.push({ x: cx, y: by - 16, r: 70, col: '#9ad8ff', s: 0.55 });
      if (o.type === 'lighthouse') Z.lights.push({ x: cx, y: by - 76, r: 60, col: '#ffe6a0', s: 1, beacon: true });
      if (o.type === 'icecream') Z.lights.push({ x: cx, y: by - 14, r: 40, col: '#ffd0e0', s: 0.6 });
    });
    return Z;
  }
}

function buildZone(id) {
  const B = new ZoneBuilder(id);
  B.def.build(B);
  if (!B.def.grid || B.def.busOnly) placeBusStop(B);
  return B.finalize();
}

// Wnętrze domu gracza jako chodzona "dzielnica"
function buildHomeZone(home) {
  const Z = {
    id: 'dom', def: { name: 'Twój dom', icon: '🏠', song: 'dom', motto: '', particles: 'none', interior: true, pal: {} },
    w: HOME.w, h: HOME.h, interior: true,

    exits: { S: true }, neighbors: {}
  };
  const sol = (x, y) => { if (x >= 0 && y >= 0 && x < HOME.w && y < HOME.h) Z.solid[y * HOME.w + x] = 1; };
  for (let x = 0; x < HOME.w; x++) { sol(x, 0); sol(x, 1); }

  const fixed = [
    { type: 'furn', id: '_wardrobe', x: 1, y: 2, fw: 1, fh: 1, interact: 'wardrobe' },

  ];
  fixed.forEach(o => { Z.objects.push(o); for (let yy = o.y; yy < o.y + o.fh; yy++) for (let xx = o.x; xx < o.x + o.fw; xx++) sol(xx, yy); Z.interacts.push({ x: o.x, y: o.y, w: o.fw, h: o.fh, kind: o.interact }); });
  Z.wallFixed = [
    { id: '_shelf', x: 6, y: 0, w: 3, h: 2, interact: 'shelf' },
    { id: '_fireplace', x: 9, y: 0, w: 2, h: 2, interact: 'fireplace' }
  ];
  Z.interacts.push({ x: 6, y: 1, w: 3, h: 1, kind: 'shelf' });
  Z.interacts.push({ x: 9, y: 1, w: 2, h: 1, kind: 'fireplace' });
  Z.lights.push({ x: 10 * 16, y: 1.5 * 16, r: 90, col: '#ffb060', s: 1 });
  // meble gracza
  (home.placed || []).forEach(p => {
    const it = ITEMS[p.id]; if (!it) return;
    if (it.layer === 'obj') {
      Z.objects.push({ type: 'furn', id: p.id, x: p.x, y: p.y, fw: it.w, fh: it.h, placed: p });
      for (let yy = p.y; yy < p.y + it.h; yy++) for (let xx = p.x; xx < p.x + it.w; xx++) sol(xx, yy);
      if (p.id === 'lampa_lawa') Z.lights.push({ x: p.x * 16 + 8, y: p.y * 16 + 4, r: 40, col: '#d08aff', s: 0.8 });
      if (p.id === 'monstera') Z.interacts.push({ x: p.x, y: p.y, w: 1, h: 1, kind: 'home_monstera', key: p.x + ',' + p.y });   // podlewanie co 3 dni (Dom Pani Haliny)
    }
  });
  return Z;
}

/* =====================================================================
   ARCHIPELAG WIEDZY — wyspy z domami-przedmiotami (z notatek ze studiów)

const ISLE_GRID = [
  ['wyspa_poznania', 'wyspa_darwina', 'wyspa_snu']
];
const GRIDS = { main: ZONE_GRID, wyspy: ISLE_GRID };

// mokry piasek na styku z wodą + lista brzegowych kafelków wody (bioluminescencja nocą)
function isleShore(B) {
  const wet = [], glow = [];
  const nb = (x, y, t) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => B.T(x + dx, y + dy) === t);
  for (let y = 0; y < ZH; y++) for (let x = 0; x < ZW; x++) {
    if (B.T(x, y) === 'sand' && nb(x, y, 'water')) wet.push([x, y]);
  }
  wet.forEach(([x, y]) => B.setT(x, y, 'wetsand'));
  for (let y = 0; y < ZH; y++) for (let x = 0; x < ZW; x++) if (B.T(x, y) === 'water' && nb(x, y, 'wetsand')) glow.push([x, y]);
  B.Z.shoreWater = glow;
  glow.forEach(([x, y], i) => { if (i % 4 === 0) B.Z.lights.push({ x: x * 16 + 8, y: y * 16 + 8, r: 26, col: '#6ff0ff', s: 0.4 }); });
}

// Przystanek stawiamy automatycznie w każdej dzielnicy centrum (i na przedmieściach): najbliższe wolne miejsce do def.busAt.
function placeBusStop(B) {
  const def = B.def, Z = B.Z;
  const [px, py] = def.busAt || [26, 10];
  const free = (x, y) => {
    if (!B.in(x, y) || Z.solid[B.i(x, y)] || B.isReserved(x, y) || B.inExitLane(x, y)) return false;
    const t = TERRAIN[B.T(x, y)];
    return !!(t && t.walk);
  };
  // wiata nie może stać na drodze (blokowałaby przejście), ale miejsce do czekania — już tak
  const ROADS = new Set(['path', 'cobble', 'asphalt', 'plaza', 'brick', 'planks', 'track']);
  const ok = (x, y) => x >= 2 && y >= 3 && x < ZW - 3 && y < ZH - 3 && free(x, y) && free(x + 1, y) && free(x, y + 1) && free(x + 1, y + 1) && !ROADS.has(B.T(x, y)) && !ROADS.has(B.T(x + 1, y));
  for (let r = 0; r < 24; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const x = px + dx, y = py + dy;
    if (!ok(x, y)) continue;
    B.obj('busstop', x, y, { fw: 2, fh: 1, interact: 'bus' });
    B.reserve(x, y + 1, 2, 1);
    Z.busStop = { x, y };
    Z.lights.push({ x: (x + 1) * 16, y: y * 16 + 2, r: 46, col: '#9ad8ff', s: 0.8 });
    return;
  }
}

function deepMerge(base, over) {
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return over === undefined ? base : over;
  const out = Object.assign({}, base);
  if (over && typeof over === 'object') for (const k of Object.keys(over)) {
    out[k] = (k in base && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) ? deepMerge(base[k], over[k]) : over[k];
  }
  return out;
}

class Game {
  constructor() {

    this.saveT = 0;
    this.stepT = 0;

    try { const z = parseFloat(localStorage.getItem('ad_zoom2')); if (z >= 0.6 && z <= 1.8) this.zoomMul = z; } catch (e) {}

    if (this.state && this.state.created) {
      this.startWorld();
    } else {
      this.state = this.newState();
      this.setZone('dom');
      this.player.x = 7 * 16; this.player.y = 7 * 16;
      this.showCreator(true);
    }

  }

  /* ---------------- stan i zapis ---------------- */
  newState() {
    return {
      v: 1, created: false, savedAt: 0,
      player: { name: '', form: 'f', look: Object.assign({}, DEFAULT_LOOK), charClass: null },
      stats: { xp: 0, level: 1, rankTitle: 'Stażysta EBA', stamina: 100, streak: 0, multiplier: 1, answeredQuestions: {}, badges: {}, progress: {}, wrong: {} },
      energy: 100, money: 50, day: 1, time: 9 * 60,
      zone: 'dom', pos: null, visited: {},
      home: {
        wall: WALL_COLORS[0], wallPattern: 'stripes', floorType: 'planks', floorColor: FLOOR_COLORS[0],
        extWall: EXT_WALLS[0], extRoof: EXT_ROOFS[0], quilt: '#4a86d8',
        placed: [{ id: 'dywan_pasy', x: 6, y: 5 }, { id: 'fotel', x: 5, y: 4 }, { id: 'monstera', x: 12, y: 8 }],
        inventory: {}
      },
      fiszki: { day: 0, got: {} },
      quests: { day: 0, list: [], bonus: false },
      subj: {}, quizDay: {}, talked: {}, hipek: {}, petDay: 0, mailDay: 0, coffeeDay: 0,
      dream: { lp: 0, fragments: [], journal: [], unlockedMods: [], activeMods: {}, visited: [], challenges: {}, techniques: { realityCheck: 0, mild: 0, wbtb: 0, visualization: 0, control: 0 } },
      today: { answered: 0, correct: 0, xp: 0, money: 0, fiszki: 0 },
      totals: { answered: 0, correct: 0, fiszki: 0, quizWins: 0, moneyEarned: 0, blocks: 0 }
    };
  }
  loadLocal() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return deepMerge(this.newState(), JSON.parse(raw));
    } catch (e) { return null; }
  }
  save(cloud = false) {
    if (!this.state || !this.state.created) return;
    const s = this.state;
    if (this.zone && !this.zone.interior) s.pos = { x: this.player.x, y: this.player.y };
    if (this.zone && this.zone.interior) s.pos = null;
    if (this.zone && this.zone.subject) {
      // z domu-przedmiotu zapisujemy wyjście przed drzwiami (wnętrza nie są dzielnicami)
      const oz = this.zones[this.zone.outer], b = oz && oz.buildings.find(x => x.subject === this.zone.subject);
      s.zone = this.zone.outer; s.pos = b ? { x: b.doorCol * 16 + 8, y: (b.doorRow + 1) * 16 + 10 } : null;
    }
    if (this.zone && this.zone.halina) {
      // z domu Pani Haliny zapisujemy miejsce przed jej drzwiami
      const b = this.halinaDoor();
      s.zone = 'osiedle'; s.pos = b ? { x: b.doorCol * 16 + 8, y: (b.doorRow + 1) * 16 + 10 } : null;
    }
    s.savedAt = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
    if (cloud && window.saveToCloud) window.saveToCloud({ stats: s.stats, charClass: s.player.charClass, save: s });
  }
  // wywoływane przez moduł chmury (Firebase) — obsługuje też stary format {stats, charClass}
  applySavedData(data) {
    if (!data) return;
    if (data.save && data.save.v) {
      if ((data.save.savedAt || 0) <= (this.state.savedAt || 0)) return;
      this.state = deepMerge(this.newState(), data.save);
      if (this.state.created) { this.closeModal(true); this.startWorld(); }
    } else if (data.stats) {
      this.state.stats = Object.assign(this.state.stats, data.stats);
      if (data.charClass) this.state.player.charClass = data.charClass;
    }
    this.updateHUD();
  }

  startWorld() {
    const s = this.state;
    if (s.quests.day !== s.day) this.generateQuests();
    const z = s.zone && (ZONES[s.zone] || s.zone === 'dom') ? s.zone : 'dom';
    this.setZone(z);
    if (s.pos && z !== 'dom') { this.player.x = s.pos.x; this.player.y = s.pos.y; }
    else { this.player.x = 7 * 16 + 8; this.player.y = 7 * 16; }
    this.unstick();
    this.transition = { phase: 'in', t: 0 };
    this.updateHUD();
  }

  /* ---------------- ekran i wejście ---------------- */
  resize() {
    const r = this.canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.max(320, Math.round(r.width * dpr));
    this.canvas.height = Math.max(200, Math.round(r.height * dpr));
    this.ctx.imageSmoothingEnabled = false;
  }
  get scale() {
    // na wąskich ekranach (telefon) pokazujemy mniej kafelków, żeby postać nie była mikroskopijna
    const cssW = this.canvas.getBoundingClientRect().width || this.canvas.width;
    const tilesW = clamp(cssW / 38, 12, 26);
    const base = Math.min(this.canvas.width / (tilesW * 16), this.canvas.height / (15 * 16));
    return Math.max(1, Math.round(base * this.zoomMul * 2) / 2);
  }
  setZoom(m) {
    this.zoomMul = clamp(m, 0.6, 1.8);
    try { localStorage.setItem('ad_zoom2', String(this.zoomMul)); } catch (e) {}
  }
  camera(s) {
    const Z = this.zone;
    const vw = this.canvas.width / s, vh = this.canvas.height / s;
    const W = Z.w * 16, H = Z.h * 16;
    let x = W <= vw ? (W - vw) / 2 : clamp(this.player.x - vw / 2, 0, W - vw);
    let y = H <= vh ? (H - vh) / 2 : clamp(this.player.y - 10 - vh / 2, 0, H - vh);
    return { x: Math.round(x * s) / s, y: Math.round(y * s) / s, vw, vh };
  }
  screenToWorld(ev) {
    const r = this.canvas.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * (this.canvas.width / r.width);
    const sy = (ev.clientY - r.top) * (this.canvas.height / r.height);
    const s = this.scale, cam = this.camera(s);
    return { x: sx / s + cam.x, y: sy / s + cam.y };
  }

  bindInput() {
    window.addEventListener('keydown', e => {
      audio.init();
      const typing = ['INPUT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
      if (typing) { if (e.code === 'Escape') document.activeElement.blur(); return; }
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      if (this.dialog) { this.dialogKey(e); return; }
      if (this.modalOpen) { if (e.code === 'Escape' || (e.code === 'Enter' && document.getElementById('fz-ok'))) this.closeModal(); return; }
      if (this.deco.active) { if (e.code === 'Escape') this.toggleDeco(false); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') this.interact();
      if (e.code === 'KeyM') this.showMap();
      if (e.code === 'KeyJ') this.showJournal();
      if (e.code === 'KeyK') this.openDreamModulation();
      if (e.code === 'Equal' || e.code === 'NumpadAdd') this.setZoom(this.zoomMul + 0.15);
      if (e.code === 'Minus' || e.code === 'NumpadSubtract') this.setZoom(this.zoomMul - 0.15);
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.save(); });
    window.addEventListener('beforeunload', () => this.save());

    this.canvas.addEventListener('mousedown', e => {
      audio.init();
      if (this.dialog) { this.dialogAdvance(); return; }
      if (this.modalOpen || this.transition || this.scene !== 'world') return;
      const w = this.screenToWorld(e);
      if (this.deco.active) { this.decoClick(w, e.button === 2); return; }
      this.clickTarget = { x: w.x, y: w.y + 4 };
      this.pendingInteract = this.interactionAtPoint(w.x, w.y);
    });
    this.canvas.addEventListener('contextmenu', e => { if (this.deco.active) e.preventDefault(); });
    this.canvas.addEventListener('mousemove', e => {
      if (!this.deco.active) return;
      const w = this.screenToWorld(e);
      this.deco.hover = { tx: Math.floor(w.x / 16), ty: Math.floor(w.y / 16) };
    });
    this.canvas.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      this.setZoom(this.zoomMul + (e.deltaY < 0 ? 0.15 : -0.15));
    }, { passive: false });

    document.querySelectorAll('.tbtn').forEach(b => {
      const k = b.dataset.k;
      const on = ev => { ev.preventDefault(); audio.init(); this.keys[k] = true; };
      const off = ev => { ev.preventDefault(); this.keys[k] = false; };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    });
    const act = document.getElementById('touch-act');
    act.addEventListener('pointerdown', e => { e.preventDefault(); audio.init(); if (this.dialog) this.dialogAdvance(); else if (!this.modalOpen) this.interact(); });

    const on = (id, fn) => document.getElementById(id).addEventListener('click', () => { audio.init(); audio.click(); fn(); });
    on('t-map', () => this.showMap());
    on('t-journal', () => this.showJournal());
    on('t-badges', () => this.showBadges());
    on('t-dream', () => this.openDreamModulation());
    on('t-save', () => this.showSaveMenu());
    on('t-deco', () => this.toggleDeco());
    on('t-zoom-in', () => this.setZoom(this.zoomMul + 0.15));
    on('t-zoom-out', () => this.setZoom(this.zoomMul - 0.15));
    on('t-music', () => { audio.setMusic(!audio.musicOn); this.updateHUD(); });
    document.getElementById('dialogue').addEventListener('click', e => { if (!e.target.closest('.dlg-opt')) this.dialogAdvance(); });
  }

  /* ---------------- dzielnice ---------------- */
  setZone(id) {
    const prev = this.zone;
    if (id === 'dom') {
      this.zone = buildHomeZone(this.state.home);
      this.zone.ground = bakeRoom(this.state.home);
    } else if (id === 'halina') {
      this.zone = buildHalinaZone();
      this.zone.ground = bakeRoom(HALINA_ROOM);
      this._halinaTension = 0;
    } else if (id.startsWith('in:')) {
      this.zone = buildSubjectZone(id.slice(3));
      this.zone.lights = subjectLights(this.zone, this);
      this.zone.ground = bakeSubjectRoom(this.zone);
    } else {
      if (!this.zones[id]) this.zones[id] = buildZone(id);
      this.zone = this.zones[id];
      if (!this.zone.ground) this.zone.ground = bakeGround(this.zone);
    }
    // w pamięci trzymamy teren tylko bieżącej i poprzedniej dzielnicy
    Object.values(this.zones).forEach(z => { if (z !== this.zone && z !== prev) { z.ground = null; z.lightShape = null; z.glowShape = null; } });
    const Z = this.zone;
    this.prepareBuildings(Z);
    this.spawnNpcs(Z);
    this.spawnFiszki(Z);
    this.initParticles(Z);
    this.state.zone = id;
    audio.setSong(Z.def.song);
    document.getElementById('t-deco').style.display = Z.interior && !Z.subject && !Z.halina ? '' : 'none';
    if ((!Z.interior || Z.subject || Z.halina) && this.deco.active) this.toggleDeco(false);
    this.updateHUD();
  }
  prepareBuildings(Z) {
    (Z.buildings || []).forEach(b => {
      if (b.kind === 'home') { b.wall = this.state.home.extWall; b.roof = this.state.home.extRoof; }
      const level = b.loc ? this.unlockedLevel(b.loc) : 1;
      const spr = buildingSprite(b, level);
      b.spr = spr;
      b.X = b.x * 16 + (b.w * 16) / 2 - spr.ax;
      b.Y = (b.y + b.h) * 16 - spr.ay;
      b.win = spr.windows.map(w => ({ x: b.X + 1 + w.x, y: b.Y + 1 + w.y, w: w.w, h: w.h, round: w.round }));
      if (b.subject) this.tintSubjectWindows(b);
      b.signW = spr.signRect ? { x: b.X + 1 + spr.signRect.x, y: b.Y + 1 + spr.signRect.y, w: spr.signRect.w, h: spr.signRect.h, big: spr.signRect.big } : null;
      b.chim = spr.chimney ? { x: b.X + 1 + spr.chimney.x, y: b.Y + 1 + spr.chimney.y } : null;
    });
    Z.lightShape = null; Z.glowShape = null;
  }
  refreshBuilding(locId) {
    Object.values(this.zones).forEach(Z => { if ((Z.buildings || []).some(b => b.loc === locId)) this.prepareBuildings(Z); });
  }
  goZone(id, x, y, dir, opts = {}) {
    if (this.transition) return;
    this.keys = {};
    this.clickTarget = null;
    this.transition = {
      phase: 'out', t: 0, speed: opts.slow ? 1.2 : 3.2,
      then: () => {
        const changed = this.state.zone !== id;
        this.setZone(id);
        this.player.x = x; this.player.y = y; this.player.dir = dir || this.player.dir;
        this.unstick();
        if (changed && !this.zone.interior && !opts.quiet) this.onEnterZone(id);
        if (opts.after) opts.after();
      }
    };
  }
  onEnterZone(id) {
    const s = this.state, def = ZONES[id];
    this.showBanner(def.icon + ' ' + def.name, def.motto);
    audio.zone();
    const first = !s.visited[id];
    s.visited[id] = true;
    if (first && (def.topics.length || def.isle || def.busOnly)) setTimeout(() => this.toast(`Nowa dzielnica! ${def.desc} (Ten opis wisi też na tablicy informacyjnej.)`, 12000), 1600);
    this.questEvent('visit', id);
    this.checkBadges();
    this.save();
  }
  checkEdges() {
    const Z = this.zone, p = this.player;
    let dir = null;
    if (p.x < 3) dir = 'W'; else if (p.x > Z.w * 16 - 3) dir = 'E'; else if (p.y < 5) dir = 'N'; else if (p.y > Z.h * 16 - 2) dir = 'S';
    if (!dir) return;
    if (Z.interior) { if (dir === 'S') { if (Z.subject) this.exitSubjectHouse(); else if (Z.halina) this.exitHalina(); else this.exitHome(); } return; }
    const nb = Z.neighbors[dir];
    if (!nb) return;
    let nx = p.x, ny = p.y;
    if (dir === 'W') nx = ZW * 16 - 8;
    if (dir === 'E') nx = 8;
    if (dir === 'N') ny = ZH * 16 - 6;
    if (dir === 'S') ny = 12;
    this.goZone(nb, nx, ny, { N: 'up', S: 'down', W: 'left', E: 'right' }[dir]);
  }
  exitHome() {
    const b = this.zones.osiedle ? this.zones.osiedle.buildings.find(x => x.kind === 'home') : null;
    const doorCol = b ? b.doorCol : 6, row = b ? b.doorRow + 1 : 9;
    audio.door();
    this.goZone('osiedle', doorCol * 16 + 8, row * 16 + 10, 'down');
  }
  exitHalina() {
    const b = this.halinaDoor();
    audio.door();
    this.goZone('osiedle', b ? b.doorCol * 16 + 8 : 35 * 16 + 8, b ? (b.doorRow + 1) * 16 + 10 : 7 * 16 + 10, 'down');
  }

  /* ---------------- kolizje ---------------- */
  tileSolid(tx, ty) {
    const Z = this.zone;
    if (tx < 0 || ty < 0 || tx >= Z.w || ty >= Z.h) {
      const cx = clamp(tx, 0, Z.w - 1), cy = clamp(ty, 0, Z.h - 1);
      const dir = tx < 0 ? 'W' : tx >= Z.w ? 'E' : ty < 0 ? 'N' : 'S';
      if (Z.interior) return !(dir === 'S' && (Z.doorCols || HOME.doorCols).includes(cx));
      return !(Z.exits[dir] && !Z.solid[cy * Z.w + cx]);
    }
    return Z.solid[ty * Z.w + tx] === 1;
  }
  blockedAt(px, py) {
    const x0 = Math.floor((px - 4) / 16), x1 = Math.floor((px + 3) / 16);
    const y0 = Math.floor((py - 3) / 16), y1 = Math.floor((py + 1) / 16);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.tileSolid(tx, ty)) return true;
    return false;
  }
  unstick() {
    const p = this.player;
    if (!this.blockedAt(p.x, p.y)) return;
    const Z = this.zone;
    const c0 = Math.floor(p.x / 16), r0 = Math.floor(p.y / 16);
    for (let rad = 1; rad < 12; rad++) for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      if (Math.max(Math.abs(dr), Math.abs(dc)) !== rad) continue;
      const c = c0 + dc, r = r0 + dr;
      if (c < 0 || r < 0 || c >= Z.w || r >= Z.h) continue;
      const x = c * 16 + 8, y = r * 16 + 10;
      if (!this.blockedAt(x, y)) { p.x = x; p.y = y; return; }
    }
  }

  /* ---------------- NPC ---------------- */
  spawnNpcs(Z) {
    this.npcs = (Z.npcs || []).map((n, i) => {
      const def = NPCS[n.id];
      const o = { id: n.id, def, x: n.x * 16 + 8, y: n.y * 16 + 12, hx: n.x * 16 + 8, hy: n.y * 16 + 12, dir: 'down', moving: false, anim: 0, frame: 0, wait: 1 + (i % 4), tx: null, ty: null, phase: i * 0.7 };
      if (def.runner) { o.path = this.runnerPath(); o.pi = 0; }
      return o;
    });
  }
  runnerPath() {
    // środek toru biegowego na Błoniach (płaska dekoracja 'trackoval' 15x12 kafelków od (2,14))
    const cx = (2 + 7.5) * 16, cy = (14 + 6) * 16, rx = 15 * 8 - 10, ry = 12 * 8 - 10;
    const pts = [];
    for (let k = 0; k < 28; k++) { const a = (k / 28) * Math.PI * 2; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry + 4]); }
    return pts;
  }
  npcVisible(n) { return !n.def.night || this.isNight(); }
  npcWalkable(n, px, py) {
    const tx = Math.floor(px / 16), ty = Math.floor(py / 16);
    const Z = this.zone;
    if (tx < 1 || ty < 1 || tx >= Z.w - 1 || ty >= Z.h - 1) return false;
    const t = Z.terrain ? Z.terrain[ty * Z.w + tx] : 'floor';
    if (n.def.water) return t === 'water';
    if (n.def.kind === 'ghost') return true;
    return !Z.solid[ty * Z.w + tx];
  }
  updateNpcs(dt) {
    const p = this.player;
    this.npcs.forEach(n => {
      n.anim += dt;
      if (n.talkT > 0) { n.talkT -= dt; n.moving = false; return; }
      if (n.path) {
        const [tx, ty] = n.path[n.pi];
        const dx = tx - n.x, dy = ty - n.y, d = Math.hypot(dx, dy);
        if (d < 2) n.pi = (n.pi + 1) % n.path.length;
        else { const sp = 46; n.x += dx / d * sp * dt; n.y += dy / d * sp * dt; n.moving = true; n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
        return;
      }
      if (!n.def.wander) {
        n.moving = false;
        if (Math.hypot(p.x - n.x, p.y - n.y) < 40 && n.def.kind === 'human') n.dir = Math.abs(p.x - n.x) > Math.abs(p.y - n.y) ? (p.x > n.x ? 'right' : 'left') : (p.y > n.y ? 'down' : 'up');
        return;
      }
      if (n.wait > 0) { n.wait -= dt; n.moving = false; return; }
      if (n.tx == null) {
        const R2 = n.def.wander * 16;
        for (let k = 0; k < 6; k++) {
          const tx = n.hx + (Math.random() * 2 - 1) * R2, ty = n.hy + (Math.random() * 2 - 1) * R2;
          if (this.npcWalkable(n, tx, ty)) { n.tx = tx; n.ty = ty; break; }
        }
        if (n.tx == null) { n.wait = 1 + Math.random() * 2; return; }
      }
      const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
      if (d < 2) { n.tx = null; n.wait = 1.5 + Math.random() * 3.5; n.moving = false; return; }
      const sp = n.def.kind === 'human' ? 26 : n.def.kind === 'crab' ? 18 : 22;
      const nx = n.x + dx / d * sp * dt, ny = n.y + dy / d * sp * dt;
      if (!this.npcWalkable(n, nx, ny)) { n.tx = null; n.wait = 1 + Math.random() * 2; n.moving = false; return; }
      n.x = nx; n.y = ny; n.moving = true;
      n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    });
  }

  /* ---------------- fiszki ---------------- */
  spawnFiszki(Z) {
    this.fiszki = [];
    if (Z.interior) return;
    const st = this.state.fiszki;
    if (st.day !== this.state.day) { st.day = this.state.day; st.got = {}; }
    const got = st.got[Z.id] || [];
    const rnd = mulberry(hashStr('fiszki|' + this.state.day + '|' + Z.id));
    const cands = [];
    for (let y = 2; y < Z.h - 2; y++) for (let x = 2; x < Z.w - 2; x++) {
      const i = y * Z.w + x;
      if (Z.solid[i] || Z.reserved[i] || Z.terrain[i] === 'water') continue;
      cands.push([x, y]);
    }
    for (let k = 0; k < 2 && cands.length; k++) {
      const [x, y] = cands.splice(Math.floor(rnd() * cands.length), 1)[0];
      if (!got.includes(k)) this.fiszki.push({ k, x: x * 16 + 8, y: y * 16 + 10, ph: rnd() * 6 });
    }
  }

  /* ---------------- czas ---------------- */
  isNight() { const t = this.state.time; return t >= 20 * 60 || t < 6 * 60; }
  darkness() {
    const t = this.state.time;
    let d = 0;
    if (t < 7 * 60) d = lerp(0.35, 0, clamp((t - 6 * 60) / 60, 0, 1));
    else if (t < 17.5 * 60) d = 0;
    else if (t < 19.5 * 60) d = lerp(0, 0.15, (t - 17.5 * 60) / 120);
    else if (t < 21 * 60) d = lerp(0.15, 0.62, (t - 19.5 * 60) / 90);
    else d = 0.64;
    if (this.zone && this.zone.def.ambient) d = Math.min(0.78, d + this.zone.def.ambient);
    if (this.zone && this.zone.subject) return clamp(Math.max(d * 0.8, 0.56), 0, 0.74);
    if (this.zone && this.zone.interior) d *= 0.55;
    return d;
  }
  warmth() {
    const t = this.state.time;
    if (t < 17 * 60 || t > 21 * 60) return 0;
    return Math.sin(clamp((t - 17 * 60) / (4 * 60), 0, 1) * Math.PI) * 0.26;
  }
  timeText() {
    const t = Math.floor(this.state.time / 10) * 10;
    const h = Math.floor(t / 60) % 24, m = t % 60;
    return `${h}:${String(m).padStart(2, '0')}`;
  }
  paused() { return this.modalOpen || !!this.dialog || !!this.transition || this.scene !== 'world' || this.deco.active || !this.state.created || !!this.cutscene; }

  /* ---------------- pętla ---------------- */
  update(dt) {
    const s = this.state;
    if (this.transition) this.updateTransition(dt);
    this.floaters = this.floaters.filter(f => (f.t += dt) < 1.6);
    if (this.scene !== 'world' || !this.zone) return;
    this.updateParticles(dt);
    this.updateNpcs(dt);
    // zegar nie staje w domkach, kawiarni ani na zajęciach; omdlenie o 2:00 czeka, aż zamkniesz okno
    if (this.paused()) { this.player.moving = false; if (this.clockInBuildings()) this.advanceClock(dt, true); return; }
    if (!this.advanceClock(dt, false)) return;

    this.updatePlayer(dt);
    this.checkFiszki();
    this.checkEdges();
    this.updatePrompt();
    this.saveT += dt;
    if (this.saveT > 20) { this.saveT = 0; this.save(); }
    this.cloudT += dt;
    if (this.cloudT > 90) { this.cloudT = 0; this.save(true); }
    this.hudT = (this.hudT || 0) + dt;
    if (this.hudT > 0.5) { this.hudT = 0; this.updateHUD(); }
  }
  clockInBuildings() { return !this.transition && this.state.created && !this.cutscene && !(this.modalOpts && this.modalOpts.noClock); }
  advanceClock(dt, paused) {
    const s = this.state;
    if (this.dreamSession()) return true;
    const prevHour = Math.floor(s.time / 60);
    s.time = Math.min(PASS_OUT, s.time + dt * MIN_PER_SEC);
    if (Math.floor(s.time / 60) !== prevHour) this.onHour(Math.floor(s.time / 60));
    if (s.time >= PASS_OUT && !paused) { this.passOut(); return false; }
    return true;
  }
  onHour(h) {
    if (h === 25) { this.unlockBadge('nocny'); }
    if (h === 24) this.toast('Północ. Mózg zaczyna negocjować z Tobą warunki snu. 🌙');
    if (h === 22 && !this.zone.interior) this.toast('Robi się późno. O 2:00 padniesz ze zmęczenia — lepiej wróć do domu i się wyśpij.');
    audio.nightFactor = h >= 21 || h < 6 ? 0.6 : 1;
  }
  updatePlayer(dt) {
    const p = this.player, k = this.keys;
    let dx = 0, dy = 0;
    if (k.ArrowUp || k.KeyW) dy -= 1;
    if (k.ArrowDown || k.KeyS) dy += 1;
    if (k.ArrowLeft || k.KeyA) dx -= 1;
    if (k.ArrowRight || k.KeyD) dx += 1;
    if (dx || dy) { this.clickTarget = null; this.pendingInteract = null; }
    else if (this.clickTarget) {
      const vx = this.clickTarget.x - p.x, vy = this.clickTarget.y - p.y, d = Math.hypot(vx, vy);
      if (this.pendingInteract && this.inReach(this.pendingInteract)) {
        const it = this.pendingInteract; this.pendingInteract = null; this.clickTarget = null;
        this.faceTowards(it); this.trigger(it); return;
      }
      if (d < 2.5) { this.clickTarget = null; if (this.pendingInteract) { const it = this.pendingInteract; this.pendingInteract = null; if (this.inReach(it, 30)) { this.faceTowards(it); this.trigger(it); } } }
      else { dx = vx / d; dy = vy / d; }
    }
    if (dx && dy && !this.clickTarget) { dx *= 0.7071; dy *= 0.7071; }
    const moving = dx !== 0 || dy !== 0;
    p.moving = moving;
    if (!moving) { p.frame = 0; return; }
    if (Math.abs(dx) > Math.abs(dy) + 0.01) p.dir = dx > 0 ? 'right' : 'left'; else p.dir = dy > 0 ? 'down' : 'up';
    const sp = 88 * (k.ShiftLeft || k.ShiftRight ? 1.45 : 1) * dt;
    const nx = p.x + dx * sp, ny = p.y + dy * sp;
    let movedX = false, movedY = false;
    if (!this.blockedAt(nx, p.y)) { p.x = nx; movedX = true; }
    if (!this.blockedAt(p.x, ny)) { p.y = ny; movedY = true; }
    if (!movedX && !movedY && this.clickTarget) { this.clickTarget = null; }
    p.anim += dt * 9;
    p.frame = [1, 0, 2, 0][Math.floor(p.anim) % 4];
    this.stepT += dt;
    if (this.stepT > 0.32) { this.stepT = 0; audio.step(); }
    // wejście przez drzwi: wystarczy wejść w próg idąc w górę
    const tx = Math.floor(p.x / 16), ty = Math.floor((p.y - 2) / 16);
    for (const b of (this.zone.buildings || [])) {
      if (tx === b.doorCol && ty === b.doorRow && p.dir === 'up') { this.enterDoor(b); break; }
    }
  }
  checkFiszki() {
    const p = this.player;
    for (const f of this.fiszki) {
      if (Math.hypot(f.x - p.x, f.y - p.y) < 11) { this.collectFiszka(f); break; }
    }
  }

  updateTransition(dt) {
    const tr = this.transition;
    tr.t = Math.min(1, tr.t + dt * (tr.speed || 3.2));
    if (tr.phase === 'out' && tr.t >= 1) {
      const then = tr.then;
      this.transition = { phase: 'in', t: 0, speed: tr.speed };
      if (then) then();
    } else if (tr.phase === 'in' && tr.t >= 1) {
      this.transition = null;
    }
  }

  /* ---------------- interakcje ---------------- */
  probePoint() {
    const p = this.player;
    const o = { up: [0, -14], down: [0, 10], left: [-13, -4], right: [13, -4] }[p.dir];
    return { x: p.x + o[0], y: p.y - 4 + o[1] };
  }
  findInteraction() {
    const p = this.player, Z = this.zone, pr = this.probePoint();
    let best = null, bestD = 1e9;
    const consider = (d, it) => { if (d < bestD) { bestD = d; best = it; } };
    this.npcs.forEach(n => {
      if (!this.npcVisible(n)) return;
      const d = Math.min(Math.hypot(n.x - pr.x, n.y - 6 - pr.y), Math.hypot(n.x - p.x, n.y - p.y) + 4);
      if (d < (n.def.kind === 'seahorse' ? 26 : 17)) consider(d, { type: 'npc', n });
    });
    (Z.buildings || []).forEach(b => {
      const dx = b.doorCol * 16 + 8, dy = (b.doorRow + 1) * 16 + 2;
      const d = Math.hypot(dx - p.x, dy - p.y);
      if (d < 18 && (p.dir === 'up' || d < 9)) consider(d - 3, { type: 'door', b });
    });
    (Z.interacts || []).forEach(it => {
      const x0 = it.x * 16, y0 = it.y * 16, x1 = x0 + it.w * 16, y1 = y0 + it.h * 16;
      const cx = clamp(pr.x, x0, x1), cy = clamp(pr.y, y0, y1);
      const d = Math.hypot(cx - pr.x, cy - pr.y);
      if (d < 9) consider(d + 1, { type: 'spot', it });
    });
    return best;
  }
  interactionAtPoint(wx, wy) {
    const Z = this.zone;
    for (const n of this.npcs) if (this.npcVisible(n) && Math.abs(n.x - wx) < 9 && wy > n.y - 26 && wy < n.y + 3) return { type: 'npc', n };
    for (const b of (Z.buildings || [])) {
      if (wx >= b.x * 16 && wx < (b.x + b.w) * 16 && wy >= b.Y && wy < (b.y + b.h) * 16) return { type: 'door', b };
    }
    for (const it of (Z.interacts || [])) if (wx >= it.x * 16 && wx < (it.x + it.w) * 16 && wy >= it.y * 16 - 12 && wy < (it.y + it.h) * 16) return { type: 'spot', it };
    return null;
  }
  targetPoint(it) {
    if (it.type === 'npc') return { x: it.n.x, y: it.n.y };
    if (it.type === 'door') return { x: it.b.doorCol * 16 + 8, y: (it.b.doorRow + 1) * 16 + 4 };
    return { x: (it.it.x + it.it.w / 2) * 16, y: (it.it.y + it.it.h) * 16 };
  }
  inReach(it, r = 20) {
    const t = this.targetPoint(it), p = this.player;
    const rr = it.type === 'npc' && it.n.def.kind === 'seahorse' ? 30 : r;
    return Math.hypot(t.x - p.x, t.y - p.y) < rr;
  }
  faceTowards(it) {
    const t = this.targetPoint(it), p = this.player;
    const dx = t.x - p.x, dy = t.y - 6 - p.y;

  /* ---------------- cząsteczki ---------------- */
  initParticles(Z) {
    this.particles = [];

    const n = { butterflies: 8, leaves: 14, fog: 10, petals: 12, sparkle: 0, none: 0 }[kind] || 0;
    for (let i = 0; i < n; i++) this.particles.push(this.newParticle(kind, true));

  newParticle(kind, anywhere) {
    const Z = this.zone, W = Z.w * 16, H = Z.h * 16;
    const col = pick(Math.random, ['#fff6a8', '#ffffff', '#ffb0d8', '#a8d8ff', '#ffd27a']);
    return { kind, x: Math.random() * W, y: anywhere ? Math.random() * H : -10, vx: 0, vy: 0, t: Math.random() * 100, col, r: 20 + Math.random() * 30 };
  }
  updateParticles(dt) {
    const Z = this.zone, W = Z.w * 16, H = Z.h * 16;
    this.particles.forEach(q => {
      q.t += dt;
      if (q.kind === 'butterflies') { q.x += Math.cos(q.t * 0.7 + q.r) * 14 * dt; q.y += Math.sin(q.t * 1.3 + q.r) * 10 * dt; }

      else if (q.kind === 'fog') { q.x += 5 * dt; if (q.x > W + 60) q.x = -60; }
      else if (q.kind === 'smoke') { q.y -= 9 * dt; q.x += 3 * dt; q.life -= dt; }
      if (q.x < -60) q.x = W + 50; if (q.x > W + 60) q.x = -50;
      if (q.y < -60) q.y = H + 50; if (q.y > H + 60) q.y = -50;
    });
    this.particles = this.particles.filter(q => q.kind !== 'smoke' || q.life > 0);

    if (this.smokeT > 0.7) {
      this.smokeT = 0;
      (Z.buildings || []).forEach(b => { if (b.chim) this.particles.push({ kind: 'smoke', x: b.chim.x + Math.random() * 2, y: b.chim.y, t: 0, life: 2.6, r: 2 }); });
    }
  }

  /* ---------------- RENDER ---------------- */
  render() {
    const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#120c07';
    ctx.fillRect(0, 0, W, H);
    if (!this.zone) return;
    if (this.scene === 'interior') { this.renderInterior(); this.drawFade(); return; }

    const Z = this.zone, s = this.scale, cam = this.camera(s);
    const t = (performance.now() - this.time0) / 1000;
    ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
    ctx.filter = this.dreamWorldFilter(t);
    const vx0 = Math.max(0, Math.floor(cam.x)), vy0 = Math.max(0, Math.floor(cam.y));

    if (Z.interior) { ctx.fillStyle = '#2a1a10'; ctx.fillRect(-8, -8, Z.w * 16 + 16, Z.h * 16 + 16); }
    ctx.drawImage(Z.ground, vx0, vy0, vx1 - vx0, vy1 - vy0, vx0, vy0, vx1 - vx0, vy1 - vy0);
    if (!Z.interior) this.drawWater(Z, vx0, vy0, vx1, vy1, t);

    else if (Z.interior && !Z.subject) this.drawRoomFlat(Z);

    // obiekty i postaci sortowane po głębokości
    const list = [];
    const inView = (x, y, w, h) => x + w > cam.x - 8 && x < cam.x + cam.vw + 8 && y + h > cam.y - 8 && y < cam.y + cam.vh + 8;
    Z.objects.forEach(o => {
      if (o.type === 'building') {

      }

    });
    this.npcs.forEach(n => {

      list.push({ y: n.y, d: () => this.drawNpc(n, t) });
    });
    this.fiszki.forEach(f => { if (inView(f.x - 8, f.y - 20, 16, 24)) list.push({ y: f.y, d: () => this.drawFiszka(f, t) }); });
    if (this.busAnim && this.busAnim.zone === Z.id) list.push({ y: this.busAnim.y, d: () => this.drawBus(t) });
    list.push({ y: this.dreamSession() && this.dreamSession().flying ? Infinity : this.player.y + 0.5, d: () => this.drawPlayer(t) });

    }

    // monstery szepczą PONAD ciemnością
    this.drawHalina(ctx, W, H, s, cam, t);
    this.drawLabels(s, cam, t);
    this.drawDreamEffects(ctx, W, H, t);
    this.drawFade();
  }

  drawWater(Z, x0, y0, x1, y1, t) {
    const ctx = this.ctx;
    const tx0 = Math.floor(x0 / 16), ty0 = Math.floor(y0 / 16), tx1 = Math.ceil(x1 / 16), ty1 = Math.ceil(y1 / 16);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';

  drawNpc(n, t) {

  playerLook() {

  drawFiszka(f, t) {
    const ctx = this.ctx;

    ctx.fillStyle = '#d9534f'; ctx.fillRect(x, y, 10, 2);

  drawParticles(t) {

  }
  // okna i poświata (w układzie świata)
  drawNightWorld(Z, dark, t) {
    const ctx = this.ctx;
    const a = clamp(dark * 1.4, 0, 1);
    ctx.save();
    (Z.buildings || []).forEach(b => {
      if (b.style === 'ruin') return;
      (b.win || []).forEach((w, i) => {
        if (w.dark) return;
        if (!w.col && ((i * 7 + b.x) % 5) === 0 && this.state.time > 23 * 60) return;
        ctx.fillStyle = w.col ? rgbaOf(w.col, 0.9 * a) : `rgba(255,214,120,${0.85 * a})`;
        if (w.round) { ctx.beginPath(); ctx.arc(w.x + 4, w.y + 4, 3.5, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(w.x, w.y, w.w, w.h);

  bakeLightShapes(Z) {

    const lights = (Z.lights || []).slice();
    (Z.buildings || []).forEach(b => {
      if (b.style !== 'ruin') (b.win || []).forEach(w => { if (!w.dark) lights.push({ x: w.x + w.w / 2, y: w.y + w.h, r: w.col ? 34 : 26, col: w.col || '#ffd07a', s: w.col ? 0.9 : 0.7 }); });
      if (b.spr && b.spr.clock) lights.push({ x: b.X + 1 + b.spr.clock.x, y: b.Y + 1 + b.spr.clock.y, r: 44, col: '#fff0a0', s: 0.8 });

    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, dw, dh);
    g.fillStyle = Z.interior ? 'rgba(30,18,10,1)' : 'rgba(12,16,44,1)';
    g.fillRect(0, 0, dw, dh);
    g.globalCompositeOperation = 'destination-out';
    const k = s / 4;
    g.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
    g.drawImage(Z.lightShape, 0, 0, Z.w * 16, Z.h * 16);
    const p = this.player;
    const pg = g.createRadialGradient(p.x, p.y - 10, 0, p.x, p.y - 10, 46);
    pg.addColorStop(0, 'rgba(0,0,0,0.55)'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = pg; g.fillRect(p.x - 50, p.y - 60, 100, 100);
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = dark;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.dark, 0, 0, W, H);
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
  }
  drawLabels(s, cam, t) {
    const ctx = this.ctx, Z = this.zone, p = this.player;
    const toS = (x, y) => [(x - cam.x) * s, (y - cam.y) * s];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // szyldy budynków
    (Z.buildings || []).forEach(b => {
      if (!b.signW || !b.sign) return;
      const [x, y] = toS(b.signW.x + b.signW.w / 2, b.signW.y + b.signW.h / 2 + 0.5);
      if (x < -200 || x > this.canvas.width + 200 || y < -50 || y > this.canvas.height + 50) return;
      let fs = Math.max(8, Math.round(s * (b.signW.big ? 9 : 4.6)));
      ctx.font = `700 ${fs}px ${WORLD_FONT}`;
      const maxW = b.signW.w * s - 6;
      while (ctx.measureText(b.sign).width > maxW && fs > 7) { fs--; ctx.font = `700 ${fs}px ${WORLD_FONT}`; }
      if (b.style === 'classic') {
        ctx.fillStyle = 'rgba(58,38,22,0.85)';
        ctx.fillText(b.sign, x, y);
      } else {
        ctx.fillStyle = b.signW.big ? '#27477f' : '#3a2616';
        ctx.fillText(b.sign, x, y);
      }
    });
    if (Z.roomLabels) this.drawRoomLabels(s, cam);
    // imiona NPC w pobliżu + znaczniki
    const fs = Math.max(10, Math.round(s * 3.4));
    ctx.font = `600 ${fs}px ${WORLD_FONT}`;
    const questTargets = new Set(this.state.quests.list.filter(q => !q.done && (q.type === 'talk' || q.type === 'quiz')).map(q => q.target));
    this.npcs.forEach(n => {
      if (!this.npcVisible(n)) return;
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      const hTop = n.def.kind === 'human' ? (n.def.small ? 20 : 25) : 16;
      // zaokrąglone: biegnący Trener Cronbach miał rozmyty (ułamkowe piksele) i drgający podpis
      const [x, y] = toS(n.x, n.y - hTop - 4).map(Math.round);
      if (n.def.label) {
        ctx.font = `700 ${Math.round(s * 4)}px ${WORLD_FONT}`;
        ctx.fillStyle = '#2a1a10'; ctx.fillText(n.def.label, x + 1, y + 1 + s * 4);
        ctx.fillStyle = '#fff'; ctx.fillText(n.def.label, x, y + s * 4);
        ctx.font = `600 ${fs}px ${WORLD_FONT}`;
      }
      const isTarget = this.activeIt && this.activeIt.type === 'npc' && this.activeIt.n === n;
      if (d < 44 || isTarget) {
        const w = ctx.measureText(n.def.name).width + 12;
        ctx.fillStyle = 'rgba(46,28,16,0.85)';
        ctx.fillRect(x - w / 2, y - fs * 0.75 - (n.def.label ? fs : 0), w, fs * 1.5);
        ctx.fillStyle = '#fdf6e3';
        ctx.fillText(n.def.name, x, y - (n.def.label ? fs : 0));
      }
      let mark = null;
      if (questTargets.has(n.id)) mark = '!';
      else if (!this.state.talked[n.id] && n.def.kind === 'human') mark = '…';
      if (mark) {
        const bob = Math.sin(t * 4) * s;
        const my = y - (d < 44 || isTarget ? fs * 1.6 : 0) - s * 2 + bob;
        ctx.fillStyle = mark === '!' ? '#f2b92c' : 'rgba(253,246,227,0.95)';
        ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = Math.max(2, s * 0.8);
        ctx.font = `${pxSize(s * (mark === '!' ? 7 : 5))}px ${PIXEL_FONT}`;
        ctx.strokeText(mark, x, my); ctx.fillText(mark, x, my);
        ctx.font = `600 ${fs}px ${WORLD_FONT}`;
      }
    });
    // latające teksty (+XP, +🟡)
    this.floaters.forEach(f => {
      const [x, y] = toS(f.x, f.y - f.t * 14);
      ctx.globalAlpha = clamp(1.6 - f.t, 0, 1);
      ctx.font = `${pxSize(s * 4.2)}px ${PIXEL_FONT}`;
      ctx.lineWidth = Math.max(2, s * 0.9); ctx.strokeStyle = '#2a1a10';
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.color || '#ffd66b';
      ctx.fillText(f.text, x, y);
      ctx.globalAlpha = 1;
    });
  }
  drawFade() {
    const tr = this.transition;
    if (!tr) return;
    const a = tr.phase === 'out' ? tr.t : 1 - tr.t;
    if (a <= 0) return;
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(10,6,3,${clamp(a, 0, 1)})`;
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }
  floater(text, color) { this.floaters.push({ text, x: this.player.x, y: this.player.y - 30, t: 0, color }); }
}

Object.assign(Game.prototype, {
  gf(f, m) { return this.state.player.form === 'm' ? m : f; },

  /* ---------------- HUD i komunikaty ---------------- */
  updateHUD() {
    const s = this.state;
    const $ = id => document.getElementById(id);
    $('hud-name').textContent = s.player.name || 'Nowa osoba';
    $('hud-rank').textContent = s.stats.rankTitle + (s.player.charClass ? ' · ' + s.player.charClass.name : '');
    $('hud-day').textContent = `${DAY_NAMES[(s.day - 1) % 7]} · dzień ${s.day}`;
    $('hud-time').textContent = this.timeText();
    const zn = this.zone ? (this.zone.subject ? `${this.zone.def.icon} ${this.zone.def.name} · ${this.zone.def.motto}` : this.zone.interior ? '🏠 Twój dom · Osiedle Bezpiecznej Bazy' : `${this.zone.def.icon} ${this.zone.def.name}`) : TOWN_NAME;
    $('hud-zone').textContent = zn;
    $('hud-money').textContent = s.money;
    $('hud-energy').style.width = clamp(s.energy, 0, 100) + '%';
    $('hud-level').textContent = 'Lv ' + s.stats.level;
    $('hud-xp').style.width = (s.stats.xp % 100) + '%';
    $('hud-streak').textContent = 'x' + s.stats.multiplier.toFixed(1);
    const nb = ALL_BADGES.filter(b => s.stats.badges[b.id]).length;
    $('t-badge-count').textContent = `${nb}/${ALL_BADGES.length}`;
    $('t-music').textContent = audio.musicOn ? '🎵' : '🔇';
    const pc = $('hud-portrait');
    if (this._portraitKey !== lookKey(this.playerLook())) {
      this._portraitKey = lookKey(this.playerLook());
      const g = pc.getContext('2d'); g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, 24, 24); g.fillStyle = '#8fc3e8'; g.fillRect(0, 0, 24, 24);
      const spr = characterSprite(this.playerLook(), 'down', 0, false);
      g.drawImage(spr.c, 0, 0, 20, 18, 2, 4, 20, 18);
    }
  },
  toast(msg, ms = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => { t.style.opacity = '0'; }, ms);
  },
  showBanner(name, motto) {
    const el = document.getElementById('zone-banner');
    el.querySelector('.zb-name').textContent = name;
    el.querySelector('.zb-motto').textContent = motto || '';
    el.classList.add('show');
    clearTimeout(this._bannerT);
    this._bannerT = setTimeout(() => el.classList.remove('show'), 3400);
  },

  /* ---------------- okna modalne ---------------- */
  openModal(html, opts = {}) {
    const m = document.getElementById('modal');
    m.innerHTML = html;
    m.hidden = false;
    this.modalOpen = true;
    this.modalOpts = opts;
    this.keys = {};
    document.getElementById('prompt').style.display = 'none';
    m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { audio.click(); this.closeModal(); }));
    return m;
  },
  closeModal(force) {
    const opts = this.modalOpts || {};
    if (!force && opts.locked) return;
    const m = document.getElementById('modal');
    m.hidden = true; m.innerHTML = '';
    this.modalOpen = false;
    this.modalOpts = null;
    clearInterval(this._previewT);
    if (opts.onClose) opts.onClose();
    this.updateHUD();
  },
  panel(title, body, foot = '', cls = '', closable = true) {
    return `<div class="panel ${cls}">
      <div class="panel-head"><h2>${title}</h2>${closable ? '<button class="x-btn" data-close title="Zamknij (Esc)">✕</button>' : ''}</div>
      <div class="panel-body">${body}</div>
      ${foot ? `<div class="panel-foot">${foot}</div>` : ''}
    </div>`;
  },

  /* ---------------- dialogi ---------------- */
  showDialogue(d) {
    this.keys = {};
    clearInterval(this._typeT);
    this.dialog = Object.assign({ page: 0, shown: 0, full: false, sel: 0 }, d);
    const el = document.getElementById('dialogue');
    el.hidden = false;
    document.getElementById('prompt').style.display = 'none';
    document.getElementById('dlg-name').textContent = d.name || '';
    const face = document.getElementById('dlg-face');
    if (d.npc) drawPortrait(face, d.npc);
    else this.emojiPortrait(face, d.emoji || '📜');
    this.typePage();
  },
  emojiPortrait(canvas, emoji) {
    const g = canvas.getContext('2d');
    g.clearRect(0, 0, 32, 32);
    g.fillStyle = '#f0dca6'; g.fillRect(0, 0, 32, 32);
    g.font = '22px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, 16, 18);
  },
  typePage() {
    const dl = this.dialog;
    const txtEl = document.getElementById('dlg-text');
    const optEl = document.getElementById('dlg-options');
    const nextEl = document.getElementById('dlg-next');
    optEl.innerHTML = '';
    nextEl.style.visibility = 'hidden';
    const text = dl.pages[dl.page] || '';
    dl.shown = 0; dl.full = false;
    txtEl.textContent = '';
    clearInterval(this._typeT);
    this._typeT = setInterval(() => {
      if (!this.dialog) return clearInterval(this._typeT);
      dl.shown += 2;
      this.setDlgText(txtEl, text.slice(0, dl.shown), dl.shaky);
      if (dl.shown % 6 === 0) audio.blip(dl.pitch || 1);
      if (dl.shown >= text.length) this.finishPage();
    }, 18);
  },
  finishPage() {
    const dl = this.dialog;
    if (!dl) return;
    clearInterval(this._typeT);
    this.setDlgText(document.getElementById('dlg-text'), dl.pages[dl.page] || '', dl.shaky);
    dl.full = true;
    const last = dl.page >= dl.pages.length - 1;
    const optEl = document.getElementById('dlg-options');
    if (last && dl.options && dl.options.length) {
      optEl.innerHTML = dl.options.map((o, i) => `<button class="dlg-opt ${i === dl.sel ? 'sel' : ''}" data-i="${i}" ${o.disabled ? 'disabled style="opacity:.55"' : ''}><span class="kbd">${i + 1}</span>${esc(o.label)}</button>`).join('');
      optEl.querySelectorAll('.dlg-opt').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); this.chooseOption(+b.dataset.i); }));
      document.getElementById('dlg-next').style.visibility = 'hidden';
    } else {
      document.getElementById('dlg-next').style.visibility = 'visible';
    }
  },
  chooseOption(i) {
    const dl = this.dialog;
    if (!dl || !dl.options || !dl.options[i] || dl.options[i].disabled) return;
    audio.click();
    const fn = dl.options[i].fn;
    this.closeDialog(true);
    if (fn) fn();
  },
  dialogAdvance() {
    const dl = this.dialog;
    if (!dl) return;
    if (!dl.full) { this.finishPage(); return; }
    if (dl.page < dl.pages.length - 1) { dl.page++; this.typePage(); return; }
    if (dl.options && dl.options.length) return;
    this.closeDialog();
  },
  dialogKey(e) {
    const dl = this.dialog;
    const hasOpts = dl.full && dl.page >= dl.pages.length - 1 && dl.options && dl.options.length;
    if (hasOpts) {
      const n = dl.options.length;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { dl.sel = (dl.sel + 1) % n; this.finishPage(); return; }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { dl.sel = (dl.sel + n - 1) % n; this.finishPage(); return; }
      const d = parseInt(e.key, 10);
      if (d >= 1 && d <= n) { this.chooseOption(d - 1); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') { this.chooseOption(dl.sel); return; }
      if (e.code === 'Escape') { this.closeDialog(); return; }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') this.dialogAdvance();
    if (e.code === 'Escape') this.closeDialog();
  },
  closeDialog(silent) {
    const dl = this.dialog;
    clearInterval(this._typeT);
    document.getElementById('dialogue').hidden = true;
    this.dialog = null;
    this.keys = {};
    if (dl && dl.onClose && !silent) dl.onClose();
  },
  say(name, text, emoji, shaky = 0) { this.showDialogue({ name, emoji: emoji || '📜', pages: Array.isArray(text) ? text : [text], shaky }); },
  // tekst dymka; przy shaky > 0 każda litera drży (Dom Pani Haliny)
  setDlgText(el, txt, shaky) { if (shaky) el.innerHTML = shakyHTML(txt, shaky); else el.textContent = txt; },

  /* ---------------- rozmowy ---------------- */
  talkTo(n) {
    const def = n.def, s = this.state, p = this.player;
    n.talkT = 5;
    if (def.kind === 'human') n.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[p.dir];
    const first = !s.talked[n.id];
    s.talked[n.id] = (s.talked[n.id] || 0) + 1;
    this.questEvent('talk', n.id);
    if (def.kind === 'dog') audio.bark();
    if (def.kind === 'sheep') audio.baa();
    if (def.master) return this.masterDialog(n, first);
    if (def.special === 'cafe') return this.openCafe();
    if (def.special === 'pies') return this.dogDialog(n);
    if (def.special === 'hipek') return this.hipekDialog(n);
    if (n.id === 'halina') return this.halinaTalk(n);
    if (n.id === 'duch') this.unlockBadge('duch');
    const line = def.lines[(s.talked[n.id] - 1) % def.lines.length];
    this.showDialogue({ name: def.name, npc: def, pages: [line], pitch: def.kind === 'human' ? (def.small ? 1.5 : 1) : 1.8 });
  },
  masterDialog(n, first) {
    const def = n.def, s = this.state, loc = def.master, L = LOCATIONS[loc];
    const lvl = this.unlockedLevel(loc), max = this.maxLevelFor(loc), rem = this.remainingFor(loc);
    const done = this.questionsFor(loc).filter(q => s.stats.answeredQuestions[q.id]).length;
    const total = this.questionsFor(loc).length;
    const quizDone = s.quizDay[n.id] === s.day;
    const b = (this.zone.buildings || []).find(x => x.loc === loc);
    const pages = [first ? def.greet : def.lines[(s.talked[n.id] - 2 + def.lines.length) % def.lines.length]];
    pages.push(`${L.icon} ${L.name}: poziom ${lvl}/${max}, zaliczone ${done}/${total} zagadnień.`);
    const options = [];
    if (rem > 0) options.push({ label: `📚 Wejdź na zajęcia (poziom ${lvl}, pytań: ${rem})`, fn: () => b && this.enterBuilding(b) });
    else options.push({ label: '🏅 Wszystkie zajęcia zaliczone!', disabled: true });
    options.push(quizDone ? { label: '⚡ Szybki quiz — już dziś był (wróć jutro)', disabled: true } : { label: '⚡ Szybki quiz (3 pytania, raz dziennie)', fn: () => this.startQuiz(n) });
    options.push({ label: '📖 Czego tu się uczy?', fn: () => this.showSyllabus(loc) });
    if (def.special === 'sim') options.push({ label: '🧠 Symulacja pacjenta (AI)', fn: () => this.showClinicalSimulationModal() });
    options.push({ label: '👋 Na razie!', fn: null });
    this.showDialogue({ name: def.name, npc: def, pages, options });
  },
  dogDialog(n) {
    const s = this.state;
    const dogLines = [
      'Hau! (Pies merda ogonem. Przy budzie wisi mały, błyszczący dzwonek.)',
      'Hau hau! (Pies Pawłowa wpatruje się w dzwonek z głębokim wyczekiwaniem. Bodziec bezwarunkowy jeszcze nie nadszedł.)',
      'Wrrr-hau! (Pies zastanawia się, czy kiedykolwiek dostanie nagrodę bez tego przeklętego dzwonka.)',

    ];
    this.showDialogue({
      name: 'Pies Pawłowa', npc: n.def, pages: [dogLines[(s.talked.pies || 0) % dogLines.length]],
      options: [
        { label: '🔔 Zadzwoń dzwonkiem', fn: () => {
          audio.bell(); setTimeout(() => audio.bark(), 500); this.unlockBadge('pawlow');
          const bellReactions = [
            'Dzyń! …Pies zaczyna się ślinić, choć jedzenia nie ma. Dzwonek (bodziec warunkowy) wywołuje ślinienie (reakcję warunkową). Klasyka!',

            'Dzyń! …Pies spojrzał na ciebie, spojrzał na miskę i machnął ogonem. Warunkowanie utrwalone w 100%!',
            'Dzyń! …Pies wydaje ciche „hau!”. Spodziewał się steku, dostał dźwięk o częstotliwości 800 Hz. Taki los psa badawczego.'
          ];
          this.say('Pies Pawłowa', pick(Math.random, bellReactions), '🔔');
        } },
        { label: '🐾 Pogłaszcz', fn: () => {
          if (s.petDay !== s.day) {
            s.petDay = s.day; this.addEnergy(5);
            const petReactions = [
              'Hau hau! (Kontakt z psem obniża poziom kortyzolu i podnosi oksytocynę. +5 ⚡)',
              'Hau! (Pies kładzie łeb na twojej nodze. Styl przywiązania: absolutnie bezpieczny. +5 ⚡)',
              'Auuu! (Pies nastawia brzuch do drapania. Pozytywne wzmocnienie w czystej postaci! +5 ⚡)'
            ];
            this.say('Pies Pawłowa', pick(Math.random, petReactions), '🐶');
          } else {
            this.say('Pies Pawłowa', pick(Math.random, [
              'Hau! (Pies jest już dziś wygłaskany. Jutro znowu!)',
              'Hau hau... (Pies zwinął się w kłębek. Wszedł w fazę odpoczynku po stymulacji.)'
            ]), '🐶');
          }
        } },
        { label: '👋 Na razie', fn: null }
      ]
    });
  },
  hipekDialog(n) {
    const s = this.state, lines = n.def.lines;
    const i = Object.keys(s.hipek).length < lines.length ? lines.findIndex((_, k) => !s.hipek[k]) : (s.talked.hipek - 1) % lines.length;
    s.hipek[i] = true;
    if (Object.keys(s.hipek).length >= lines.length) this.unlockBadge('hipek');
    this.showDialogue({ name: 'Hipek', npc: n.def, pages: [lines[i]], pitch: 1.6 });
  },
  showSyllabus(loc) {
    const s = this.state, L = LOCATIONS[loc];
    const lvl = this.unlockedLevel(loc);
    const qs = this.questionsFor(loc);
    const rows = qs.map((q, i) => {
      const level = Math.floor(i / LEVEL_STEP) + 1;
      const ok = s.stats.answeredQuestions[q.id];
      const locked = level > lvl;
      return `<div class="row small" style="padding:3px 0;border-bottom:1px dashed var(--parch-300)">
        <span class="tag ${ok ? 'green' : locked ? '' : 'gold'}">${ok ? '✓' : locked ? '🔒' : '•'} poz. ${level}</span>
        <span class="grow" style="${locked ? 'opacity:.55' : ''}">${esc(q.topic)}</span></div>`;
    }).join('');
    this.openModal(this.panel(`${L.icon} ${esc(L.name)} — program zajęć`, `<p class="muted small mb">Zagadnienia odblokowują się piętrami: 10 poprawnych odpowiedzi = nowe piętro budynku.</p>${rows}`, '<button class="btn" data-close>Zamknij</button>', 'narrow'));
  },

  /* ---------------- miejsca interaktywne ---------------- */
  useSpot(it) {
    const s = this.state;
    const k = it.kind;
    if (this.useIsleSpot(it)) return;
    if (this.useHalinaSpot(it)) return;
    if (k === 'board') return this.showJournal('quests', true);
    if (k === 'sign') return this.say('Tabliczka', it.text, '🪧');
    if (k === 'plaque') {
      const qs = this.questionsFor(it.loc);
      const q = qs[Math.floor(Math.random() * qs.length)];
      return this.say('Tabliczka na pomniku', `„${q.topic}” — ${q.hint}`, '🗿');
    }
    if (k === 'tomb') {
      const q = QUESTIONS_DB.find(x => x.id === it.qid);
      return this.say('Nagrobek', [`✝ Tu spoczywa: ${q.topic}.`, `Epitafium: ${q.hint}`, 'Całą historię poznasz w Archiwum Szarlatanerii.'], '🪦');
    }
    if (k === 'mailbox') return this.openMail();
    if (k === 'icecream') return this.showDialogue({

      options: [{ label: '🍦 Kup loda (3 🟡, +15 ⚡)', disabled: s.money < 3, fn: () => { this.addMoney(-3); this.addEnergy(15); audio.coffee(); this.say('Lodziarz', 'Smacznego! (Mała Ida patrzy na Ciebie z zazdrością. Klasyczne id.)', '🍦'); } }, { label: 'Nie, dziękuję (odroczona gratyfikacja!)', fn: null }]
    });
    if (k === 'wardrobe') return this.showCreator(false);
    if (k === 'desk') return this.showJournal();
    if (k === 'shelf') return this.showBadges();
    if (k === 'bed') return this.showDialogue({
      name: 'Łóżko', emoji: '🛏️', pages: [`Jest ${this.timeText()}. Co chcesz zrobić? Możesz zakończyć dzień zwykłym snem albo zwiedzić senną wersję wybranej dzielnicy. Po przebudzeniu zacznie się nowy dzień.`],

    if (k === 'fireplace') {
