<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Akademia Diagnosty — Freudowice Zdrój</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Vollkorn:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-900: #2e1c10;
    --wood-800: #3f2615;
    --wood-700: #56341c;
    --wood-600: #6e4423;
    --wood-500: #8c5a2f;
    --wood-400: #b07a45;
    --parch-50: #fdf6e3;
    --parch-100: #f8ebc8;
    --parch-200: #f0dca6;
    --parch-300: #e2c47f;
    --ink: #3a2616;
    --ink-soft: #6b4f36;
    --green: #4f8f35;
    --green-dark: #356b22;
    --blue: #3a74b8;
    --red: #c2453b;
    --gold: #e8a82a;
    --gold-light: #ffd66b;
    --pink: #d9678f;
    --purple: #7b55b8;
    --font-pixel: 'Tiny5', 'Lucida Console', 'Courier New', monospace;   /* głos gry: nagłówki, przyciski, HUD, napisy w świecie */
    --font-body: 'Vollkorn', Georgia, 'Times New Roman', serif;   /* głos książki: pytania, dialogi, wyjaśnienia */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-synthesis-weight: none; }
  html, body { height: 100%; }
  body {
    background: #1b120b;
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  input, textarea { user-select: text; -webkit-user-select: text; }
  button { font-family: inherit; }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- HUD (górna belka) ---------- */
  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 12px;
    background: linear-gradient(#5a3820, #432915);
    border-bottom: 3px solid var(--wood-900);
    box-shadow: inset 0 -2px 0 #6f4a2b, 0 3px 10px rgba(0,0,0,0.5);
    color: var(--parch-100);
    font-family: var(--font-pixel);
    z-index: 5;
    flex-wrap: wrap;
  }
  .hud-left, .hud-right, .hud-center { display: flex; align-items: center; gap: 10px; }
  .hud-left { min-width: 180px; }
  #hud-portrait {
    width: 40px; height: 40px;
    image-rendering: pixelated;
    background: #8fc3e8;
    border: 2px solid var(--wood-900);
    border-radius: 6px;
    box-shadow: 0 0 0 2px var(--wood-400);
  }
  #hud-name { font-size: 16px; font-weight: 700; line-height: 1.05; }
  #hud-rank { font-size: 12px; color: var(--gold-light); }
  .hud-center { flex-direction: column; gap: 0; align-items: center; }
  #hud-clock {
    background: var(--parch-100);
    color: var(--ink);
    border: 2px solid var(--wood-900);
    border-radius: 8px;
    padding: 1px 12px;
    font-size: 16px;
    display: flex; gap: 10px; align-items: center;
    box-shadow: inset 0 -2px 0 var(--parch-300);
  }
  #hud-time { font-weight: 700; min-width: 46px; text-align: right; }
  #hud-zone { font-size: 12px; color: var(--parch-200); margin-top: 2px; letter-spacing: 0.5px; }
  .stat {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,220,160,0.18);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 15px;
  }
  .coin {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff1a8, #f2b92c 55%, #b9791a);
    border: 1px solid #6b4212;
    display: inline-block;
  }
  .bar { width: 76px; height: 10px; background: #1d120a; border: 1px solid #0d0804; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #d9534f, #f0ad4e 40%, #6cc04a); transition: width .3s; }
  .bar.xp i { background: linear-gradient(90deg, #4f9be0, #8fd3ff); width: 0; }
  .streak { background: var(--gold); color: var(--wood-900); border-radius: 5px; padding: 0 6px; font-weight: 700; }

  /* ---------- scena ---------- */
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #120c07; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: pointer; filter: saturate(1.22) contrast(1.04); }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,220,160,0.08) 0%, rgba(0,0,0,0) 60%, rgba(20,10,4,0.22) 100%);
    box-shadow: inset 0 0 50px rgba(20,10,4,0.28); }
  #prompt, .zb-name, .hint-keys { text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .btn, .tool { transition: transform .12s ease, filter .12s ease, box-shadow .12s ease; }
  .btn:hover, .tool:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn:active, .tool:active { transform: translateY(1px); filter: brightness(0.95); }

  #zone-banner {
    position: absolute; left: 50%; top: 18px; transform: translate(-50%, -10px);
    text-align: center; pointer-events: none; opacity: 0;
    transition: opacity .6s, transform .6s;
    background: var(--parch-100);
    border: 3px solid var(--wood-700);
    border-radius: 10px;
    padding: 8px 26px 9px;
    box-shadow: 0 4px 0 var(--wood-900), 0 10px 26px rgba(0,0,0,0.45);
    max-width: 92%;
    z-index: 8;
  }
  #zone-banner.show { opacity: 1; transform: translate(-50%, 0); }
  .zb-name { font-family: var(--font-pixel); font-size: 26px; font-weight: 700; color: var(--wood-700); line-height: 1.1; }
  .zb-motto { font-size: 13px; color: var(--ink-soft); font-style: italic; margin-top: 2px; }

  #toast {
    position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: rgba(46,28,16,0.94);
    color: var(--parch-100);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 7px 16px;
    font-family: var(--font-pixel);
    font-size: 15px;
    pointer-events: none;
    opacity: 0; transition: opacity .25s;
    max-width: 90%; text-align: center;
    z-index: 30;
  }
  #prompt {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--parch-100);
    color: var(--ink);
    border: 2px solid var(--wood-700);
    border-radius: 18px;
    padding: 5px 16px;
    font-family: var(--font-pixel);
    font-size: 15px;
    display: none;
    pointer-events: none;
    box-shadow: 0 3px 0 var(--wood-900);
    z-index: 9;
    white-space: nowrap;
  }
  #prompt kbd, .kbd {
    background: var(--wood-700); color: var(--parch-100);
    border-radius: 4px; padding: 0 5px; font-family: var(--font-pixel); font-size: 13px;
  }

  /* ---------- okno dialogowe (jak w Stardew) ---------- */
  #dialogue {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(860px, 96%);
    display: flex; gap: 12px;
    background: var(--parch-100);
    border: 4px solid var(--wood-600);
    border-radius: 10px;
    box-shadow: 0 0 0 3px var(--wood-900), 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 2px var(--parch-300);
    padding: 12px;
    z-index: 20;
    cursor: pointer;
  }
  #dialogue[hidden] { display: none; }
  .dlg-portrait {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .dlg-portrait canvas {
    width: 96px; height: 96px; image-rendering: pixelated;
    border: 3px solid var(--wood-600); border-radius: 6px;
    background: #9fd0ee;
  }
  .dlg-name {
    font-family: var(--font-pixel); font-weight: 700; font-size: 14px;
    background: var(--wood-600); color: var(--parch-100);
    padding: 1px 8px; border-radius: 5px; max-width: 120px; text-align: center; line-height: 1.2;
  }
  .dlg-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dlg-text { font-size: 17px; line-height: 1.45; color: var(--ink); min-height: 72px; font-weight: 600; }
  .dlg-options { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .dlg-opt {
    text-align: left; background: var(--parch-50); border: 2px solid var(--parch-300);
    border-radius: 6px; padding: 5px 10px; font-size: 15px; font-weight: 700; color: var(--ink);
    cursor: pointer;
  }
  .dlg-opt:hover, .dlg-opt.sel { border-color: var(--wood-500); background: #fff; }
  .dlg-opt .kbd { margin-right: 6px; }
  .dlg-next { align-self: flex-end; font-family: var(--font-pixel); color: var(--wood-500); animation: bob 0.9s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

  /* ---------- dolna belka ---------- */
  #bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 5px 10px;
    background: linear-gradient(#4a2e19, #3a2313);
    border-top: 3px solid var(--wood-900);
    box-shadow: inset 0 2px 0 #6f4a2b;
    flex-wrap: wrap;
    z-index: 5;
  }
  .bar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tool {
    display: flex; align-items: center; gap: 5px;
    background: var(--parch-100); color: var(--ink);
    border: 2px solid var(--wood-900);
    border-radius: 7px;
    padding: 3px 9px;
    font-family: var(--font-pixel); font-size: 14px; font-weight: 600;
    box-shadow: inset 0 -3px 0 var(--parch-300);
    cursor: pointer;
  }
  .tool:hover { background: #fff8e2; transform: translateY(-1px); }
  .tool:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 var(--parch-300); }
  .tool .kbd { font-size: 11px; }
  .tool.on { background: var(--gold-light); }
  .hint-keys { color: var(--parch-200); font-size: 12px; font-family: var(--font-pixel); opacity: .85; }

  /* ---------- sterowanie dotykowe ---------- */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
    .hint-keys { display: none; }
    #prompt { bottom: auto; top: 10px; font-size: 13px; white-space: normal; max-width: 92%; text-align: center; }
    #prompt kbd { display: none; }
    #toast { bottom: auto; top: 52px; }
  }
  .dpad {
    position: absolute; left: 14px; bottom: 14px; z-index: 12;
    display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 4px;
  }
  .tbtn {
    background: rgba(248,235,200,0.82); border: 2px solid var(--wood-700); border-radius: 12px;
    font-size: 20px; color: var(--wood-800); display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .tbtn:active { background: var(--gold-light); }
  .tact {
    position: absolute; right: 18px; bottom: 26px; z-index: 12;
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(79,143,53,0.9); border: 3px solid var(--wood-900); color: #fff;
    font-family: var(--font-pixel); font-size: 15px; font-weight: 700;
  }

  /* ---------- modale ---------- */
  #modal {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(24,14,6,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  #modal[hidden] { display: none; }
  .panel {
    background: var(--parch-100);
    border: 4px solid var(--wood-600);
    border-radius: 12px;
    box-shadow: 0 0 0 3px var(--wood-900), 0 18px 50px rgba(0,0,0,0.6), inset 0 0 0 2px var(--parch-300);
    width: min(820px, 100%);
    max-height: 100%;
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: pop .16s ease-out;
  }
  .panel.narrow { width: min(560px, 100%); }
  .panel.wide { width: min(1040px, 100%); }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(#7a4c27, #633c1d);
    color: var(--parch-50);
    padding: 7px 12px;
    border-bottom: 3px solid var(--wood-900);
  }
  .panel-head h2 { font-family: var(--font-pixel); font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .panel-body { padding: 14px 16px; overflow-y: auto; font-size: 15px; line-height: 1.5; }
  .panel-foot {
    display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    padding: 9px 14px;
    background: var(--parch-200);
    border-top: 2px solid var(--parch-300);
  }
  .x-btn {
    background: var(--red); color: #fff; border: 2px solid var(--wood-900); border-radius: 6px;
    width: 30px; height: 28px; font-weight: 800; cursor: pointer; font-size: 14px;
  }

  .btn {
    background: var(--parch-50); color: var(--ink);
    border: 2px solid var(--wood-600); border-radius: 7px;
    padding: 6px 14px; font-family: var(--font-pixel); font-size: 15px; font-weight: 600;
    cursor: pointer; box-shadow: 0 3px 0 var(--wood-700);
  }
  .btn:hover { background: #fff; transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-700); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-green { background: var(--green); color: #fff; border-color: var(--green-dark); box-shadow: 0 3px 0 #22461a; }
  .btn-green:hover { background: #5ea540; }
  .btn-gold { background: var(--gold); color: var(--wood-900); border-color: #9a6a12; box-shadow: 0 3px 0 #7a520d; }
  .btn-gold:hover { background: #f5bb44; }
  .btn-blue { background: var(--blue); color: #fff; border-color: #274f80; box-shadow: 0 3px 0 #1d3b61; }
  .btn-purple { background: var(--purple); color: #fff; border-color: #50357c; box-shadow: 0 3px 0 #3b275c; }
  .btn-sm { padding: 3px 9px; font-size: 13px; }

  .muted { color: var(--ink-soft); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  .center { text-align: center; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .grow { flex: 1; }
  .mt { margin-top: 10px; }
  .mb { margin-bottom: 10px; }
  .pix { font-family: var(--font-pixel); }
  .big-emoji { font-size: 44px; line-height: 1.1; }
  .tag {
    display: inline-block; font-family: var(--font-pixel); font-size: 12px; font-weight: 600;
    padding: 1px 8px; border-radius: 10px; background: var(--parch-300); color: var(--wood-800);
  }
  .tag.green { background: #cfe8b8; color: #2c5a18; }
  .tag.gold { background: var(--gold-light); color: #6b4a0c; }
  .tag.purple { background: #e2d4f5; color: #4b2f7a; }
  .tag.red { background: #f5cdc8; color: #7c231b; }

  .card {
    background: var(--parch-50);
    border: 2px solid var(--parch-300);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .card.hl { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-light); }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--wood-500); background: #fff; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .q-topic { font-family: var(--font-pixel); color: var(--wood-500); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-size: 13px; }
  .q-text {
    font-size: 17px; font-weight: 800; color: var(--ink);
    background: var(--parch-50); border-left: 5px solid var(--wood-500);
    border-radius: 6px; padding: 10px 12px; margin: 6px 0 10px;
  }
  .answer-box {
    width: 100%; min-height: 84px; resize: vertical;
    background: #fffdf5; color: var(--ink);
    border: 2px solid var(--parch-300); border-radius: 8px;
    padding: 9px 11px; font-family: var(--font-body); font-size: 15px;
  }
  .answer-box:focus { outline: none; border-color: var(--wood-500); box-shadow: 0 0 0 3px rgba(176,122,69,0.25); }
  .fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .fb.ok { background: #e3f3d4; border: 2px solid #8cc26a; color: #24461a; }
  .fb.bad { background: #fbe1dc; border: 2px solid #e0968c; color: #6b1f17; }
  .fb.ai { background: #eee5fa; border: 2px solid #b79be0; color: #3c2566; }
  .dots span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 3px; background: var(--parch-300); border: 1px solid var(--wood-600); }
  .dots span.done { background: var(--green); }
  .dots span.now { background: var(--gold); }

  .quiz-opt {
    display: block; width: 100%; text-align: left;
    background: var(--parch-50); border: 2px solid var(--parch-300); border-radius: 8px;
    padding: 9px 12px; margin-bottom: 7px; font-family: var(--font-body); font-size: 14px; color: var(--ink);
    cursor: pointer; line-height: 1.4;
  }
  .quiz-opt:hover { border-color: var(--wood-500); background: #fff; }
  .quiz-opt.right { background: #dff0cf; border-color: #6fae4a; }
  .quiz-opt.wrong { background: #f8d9d3; border-color: #d0776b; }
  .quiz-opt:disabled { cursor: default; }

  .prog { height: 10px; background: var(--parch-300); border-radius: 5px; overflow: hidden; border: 1px solid var(--wood-600); }
  .prog i { display: block; height: 100%; background: linear-gradient(90deg, #6cc04a, #9ad86f); }

  /* mapa miasta */
  .town-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .district {
    position: relative; border-radius: 10px; padding: 10px; min-height: 128px;
    border: 3px solid var(--wood-700); color: #fff; cursor: default;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.65);
    display: flex; flex-direction: column; gap: 4px; overflow: hidden;
  }
  .district .d-icon { font-size: 26px; line-height: 1; }
  .district .d-name { font-family: var(--font-pixel); font-weight: 700; font-size: 16px; line-height: 1.1; }
  .district .d-sub { font-size: 12px; opacity: .95; line-height: 1.3; }
  .district.fog { filter: grayscale(.85) brightness(.55); }
  .district.here { box-shadow: 0 0 0 3px var(--gold-light), 0 0 18px var(--gold); }
  .district .you { position: absolute; right: 8px; top: 6px; font-family: var(--font-pixel); background: var(--gold); color: var(--wood-900); border-radius: 5px; padding: 0 6px; font-size: 12px; text-shadow: none; }
  .district .prog { margin-top: auto; border-color: rgba(0,0,0,.4); }

  /* kreator postaci */
  .creator { display: grid; grid-template-columns: 250px 1fr; gap: 14px; }
  @media (max-width: 700px) { .creator { grid-template-columns: 1fr; } }
  .preview-box {
    background: linear-gradient(#a9d8f2, #d7eefb 60%, #9ccf6a 60%, #86bf55);
    border: 3px solid var(--wood-600); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px;
  }
  .preview-box canvas { width: 192px; height: 288px; image-rendering: pixelated; }
  .opt-label { font-family: var(--font-pixel); font-weight: 700; font-size: 14px; color: var(--wood-700); margin: 8px 0 4px; }
  .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
  .sw {
    width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--wood-700); cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
  }
  .sw.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .chip {
    background: var(--parch-50); border: 2px solid var(--parch-300); border-radius: 7px;
    padding: 3px 10px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink);
  }
  .chip.sel { border-color: var(--wood-500); background: var(--gold-light); }
  .text-in {
    background: #fffdf5; border: 2px solid var(--parch-300); border-radius: 7px; padding: 6px 10px;
    font-size: 16px; font-family: var(--font-body); color: var(--ink); width: 100%;
  }
  .text-in:focus { outline: none; border-color: var(--wood-500); }

  /* sklep i ekwipunek */
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .item-card { display: flex; gap: 10px; align-items: flex-start; }
  .item-card img, .item-icon { width: 56px; height: 56px; image-rendering: pixelated; background: var(--parch-200); border-radius: 8px; border: 2px solid var(--parch-300); flex: 0 0 auto; object-fit: contain; }
  .item-name { font-family: var(--font-pixel); font-weight: 700; font-size: 15px; line-height: 1.15; }

  /* panel urządzania domu */
  #deco-panel {
    position: absolute; left: 10px; top: 10px; bottom: 10px; width: 290px; z-index: 15;

  .deco-body { flex: 1; overflow-y: auto; padding: 8px; }
  .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .inv-slot {
    background: var(--parch-50); border: 2px solid var(--parch-300); border-radius: 8px; padding: 4px;

  }
  .inv-slot.sel { border-color: var(--gold); background: var(--gold-light); }
  .inv-slot img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; }
  .inv-slot .cnt { position: absolute; right: 4px; top: 2px; font-family: var(--font-pixel); background: var(--wood-600); color: #fff; border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .deco-foot { padding: 8px; border-top: 2px solid var(--parch-300); background: var(--parch-200); font-size: 12px; }

  .letter {
    background: repeating-linear-gradient(#fffdf5, #fffdf5 27px, #e9dcc0 28px);

  /* ---------- Archipelag: mini-gry w domach-przedmiotach ---------- */
  .mg { --c: #ffd07a; }
  .mg-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .mg-q { font-size: 18px; font-weight: 700; margin: 8px 0 12px; line-height: 1.4; }
  .mg-opts { display: grid; gap: 8px; }

  .mg-opt:hover:not(:disabled) { background: #fff; transform: translateX(3px); border-color: var(--c); }

  .mg-opt.bad { background: #fbe1dc; border-color: #e0968c; }

  .mg-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mg-card { min-height: 86px; padding: 8px; border-radius: 10px; border: 2px solid #8a6a4a; background: #fffaf0; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; line-height: 1.3; transition: transform .15s, background .2s; }
  .mg-card.back { background: repeating-linear-gradient(45deg, var(--c) 0 7px, #3a2a40 7px 14px); color: transparent; }
  .mg-card.back span { visibility: hidden; }

  .mg-chip:hover:not(:disabled) { border-color: var(--c); }
  .mg-chip.sel { border-color: var(--ink); background: #fff3c4; box-shadow: 0 0 0 3px var(--c); }
  .mg-chip.placed { background: #e3f3d4; border-color: #8cc26a; cursor: default; font-size: 13px; }
  .mg-bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .mg-bin { border: 2px dashed #b89868; border-radius: 10px; padding: 8px; min-height: 90px; background: #fffaf0; cursor: pointer; }

  .mg-shake { animation: mgshake .32s; }
  @keyframes mgshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  /* Dom Pani Haliny: drżące litery (shakyHTML) — siła w --a (0–4 px), tempo w --sp */
  .shaky .shk-w { white-space: nowrap; }

  @keyframes shaky {
    0%, 100% { transform: translate(0, 0) rotate(0); }

    66% { transform: translate(calc(var(--a) * .8px), calc(var(--a) * -.7px)) rotate(calc(var(--a) * 1.5deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .shaky .shk-l { animation: shakycol 2s ease-in-out infinite; } }
  @keyframes shakycol { 50% { color: #8a2a3c; } }
  .mg-timer { height: 8px; background: #e8d8b8; border-radius: 4px; overflow: hidden; }

  .mg-lamp.on.you { background: radial-gradient(circle at 40% 35%, #ffffff, #9ae0ff 58%, #2a6a9a); box-shadow: 0 0 40px 12px #9ae0ff, 0 0 110px 36px rgba(150, 220, 255, .35); }
  .mg-hold { display: block; margin: 8px auto; padding: 14px 28px; font-size: 18px; touch-action: none; user-select: none; }

  .mg-table { border-collapse: collapse; margin: 6px auto; font-size: 14px; }
  .mg-table td, .mg-table th { border: 1px solid #d8c8a0; padding: 3px 10px; text-align: center; }
  .mg-canvas { display: block; margin: 6px auto 10px; border-radius: 8px; max-width: 100%; image-rendering: pixelated; }
  .mg-bars { display: flex; gap: 16px; justify-content: center; align-items: flex-end; height: 140px; margin: 8px 0; }
  .mg-barcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 64px; height: 100%; }
  .mg-bar { width: 38px; background: linear-gradient(#fff, var(--c)); border: 2px solid #3a2616; border-radius: 4px 4px 0 0; }
  .mg-barval { font-size: 12px; margin-bottom: 3px; }
  .mg-barlab { font-weight: 700; margin-top: 3px; }
  .mg-roomrow { margin-bottom: 6px; align-items: center; }
  .mg-ri { font-size: 22px; }
  .center { text-align: center; }
  @media (max-width: 640px) { .mg-cards { grid-template-columns: repeat(3, 1fr); } .mg-card { min-height: 74px; font-size: 13px; } }
  /* ---------- część 2: autobus Ψ i test rozpiętości pamięci ---------- */
  .bus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .bus-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 2px solid #3a2616; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.7); cursor: pointer; font: inherit; text-align: left; transition: transform .1s; }
  .bus-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 0 #3a2616; }
  .bus-btn.new { outline: 3px solid #f2c94c; }
  .bus-ic { font-size: 24px; line-height: 1; }
  .bus-btn b { font-family: var(--font-pixel); font-weight: 400; font-size: 16px; line-height: 1.15; }
  .mg-digit { width: 140px; height: 140px; margin: 12px auto; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 400 72px var(--font-pixel); color: #6a5a4a; background: #1f1a2e; box-shadow: inset 0 0 18px #000; transition: color .1s, box-shadow .1s; }
  .mg-digit.on { color: #fff; box-shadow: 0 0 30px 8px var(--c), inset 0 0 18px #000; }
  .mg-input { font: 400 24px var(--font-pixel); letter-spacing: 4px; padding: 8px 12px; width: 220px; border: 2px solid #c8a878; border-radius: 8px; text-align: center; }
  /* część 3: Stroop, wysokość dźwięku */
  .mg-stroop { width: min(360px, 100%); height: 120px; margin: 10px auto; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 400 48px var(--font-pixel); color: #d8c8a8; background: #1f1a2e; box-shadow: inset 0 0 18px #000; }
  .mg-sbtn i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.45); }
  .mg-ear { display: flex; align-items: center; justify-content: center; font-size: 44px; transition: box-shadow .15s; }
  .mg-ear.on { box-shadow: inset 0 0 20px #000, 0 0 30px 8px var(--c); }
</style>

<body>

<script>
/* =====================================================================
   AKADEMIA DIAGNOSTY — FREUDOWICE ZDRÓJ
   Edukacyjna gra w klimacie Stardew Valley. Miasteczko = pałac pamięci:
   każda dzielnica to inny obszar wiedzy, z własnym wyglądem i melodią.
   ===================================================================== */

/* ---------- drobne narzędzia ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(rnd, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function hexToRgb(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
// amt > 0 rozjaśnia, amt < 0 przyciemnia
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const f = v => amt >= 0 ? v + (255 - v) * amt : v * (1 + amt);
  return rgbToHex(f(r), f(g), f(b));
}
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

/* =====================================================================
   DŹWIĘK: efekty + muzyczka dzielnic (każda ma własny motyw)
   ===================================================================== */
const SONGS = {

  osiedle: { bpm: 84, root: 55, scale: [0, 2, 4, 5, 7, 9, 11], wave: 'triangle', mel: [4, null, 2, 4, 5, null, 4, 2, 0, null, 1, 2, 4, null, null, null, 4, null, 5, 7, 9, null, 7, 5, 4, 2, 4, 5, 2, null, null, null], bass: [0, 0, 3, 3, 0, 0, 4, 4] },
  plaza:   { bpm: 112, root: 65, scale: [0, 2, 4, 5, 7, 9, 11], wave: 'square', mel: [0, null, 4, 7, 9, null, 7, 4, 5, null, 4, 2, 4, null, null, null, 7, null, 9, 7, 4, null, 2, 4, 5, 4, 2, 0, 2, null, null, null], bass: [0, 4, 3, 4, 0, 4, 4, 0], soft: 0.55 },
  port:    { bpm: 92, root: 62, scale: [0, 2, 4, 5, 7, 9, 10], wave: 'triangle', mel: [0, null, null, 4, 3, null, 2, null, 0, null, 6, null, 4, null, null, null, 2, null, 4, 5, 4, null, 2, 0, 1, null, 0, null, null, null, null, null], bass: [0, 0, 6, 6, 3, 3, 4, 4] },
  bulwar:  { bpm: 88, root: 57, scale: [0, 2, 3, 5, 7, 8, 10], wave: 'sine', mel: [4, null, 2, 4, 6, null, 4, null, 2, 1, 2, null, 0, null, null, null, 4, 6, 7, 6, 4, null, 2, null, 3, 2, 1, null, 2, null, null, null], bass: [0, 0, 5, 5, 3, 3, 4, 4], swing: true },
  wyparte: { bpm: 60, root: 52, scale: [0, 1, 3, 5, 7, 8, 10], wave: 'sine', mel: [0, null, null, null, 1, null, null, null, 0, null, null, 5, null, null, null, null, 4, null, null, null, 3, null, 1, null, 0, null, null, null, null, null, null, null], bass: [0, 0, 0, 0, 5, 5, 1, 1], soft: 0.8 },
  wzgorze: { bpm: 96, root: 62, scale: [0, 2, 4, 5, 7, 9, 11], wave: 'triangle', mel: [0, 1, 2, null, 4, null, 2, 1, 0, null, 4, null, 5, null, null, null, 7, null, 5, 4, 2, null, 4, 5, 4, 2, 1, null, 0, null, null, null], bass: [0, 0, 4, 4, 3, 3, 0, 0] },

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.musicOn = true;
    this.song = null;
    this.beat = 0;
    this.nextTime = 0;
    this.timer = null;
    this.nightFactor = 1;
    try { this.musicOn = localStorage.getItem('ad_music') !== 'off'; } catch (e) {}
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicOn ? 1 : 0;
      this.musicGain.connect(this.master);
      this.nextTime = this.ctx.currentTime + 0.1;
      this.timer = setInterval(() => this.tick(), 70);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(freq, dur, { type = 'triangle', vol = 0.08, at = 0, slide = null, dest = null } = {}) {
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + at;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(dest || this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  step() { this.tone(90 + Math.random() * 25, 0.05, { type: 'sine', vol: 0.025, slide: 45 }); }
  success() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.26, { vol: 0.08, at: i * 0.06 })); }
  error() { this.tone(160, 0.28, { type: 'sawtooth', vol: 0.06, slide: 70 }); }
  levelUp() { [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => this.tone(f, 0.3, { type: 'square', vol: 0.05, at: i * 0.07 })); }
  coffee() { this.tone(320, 0.2, { type: 'sine', vol: 0.08, slide: 800 }); this.tone(900, 0.1, { type: 'sine', vol: 0.03, at: 0.18 }); }
  pickup() { [880, 1174.66, 1567.98].forEach((f, i) => this.tone(f, 0.14, { type: 'triangle', vol: 0.06, at: i * 0.05 })); }
  coin() { this.tone(1318.5, 0.08, { type: 'square', vol: 0.04 }); this.tone(1760, 0.18, { type: 'square', vol: 0.04, at: 0.07 }); }
  door() { this.tone(110, 0.22, { type: 'sine', vol: 0.12, slide: 60 }); this.tone(420, 0.12, { type: 'triangle', vol: 0.02, at: 0.05, slide: 300 }); }
  blip(pitch = 1) { this.tone(520 * pitch + Math.random() * 40, 0.035, { type: 'square', vol: 0.018 }); }
  click() { this.tone(700, 0.04, { type: 'triangle', vol: 0.04 }); }
  zone() { this.tone(659.25, 0.25, { vol: 0.05 }); this.tone(987.77, 0.35, { vol: 0.05, at: 0.12 }); }
  sleep() { [784, 659.25, 523.25, 392].forEach((f, i) => this.tone(f, 0.45, { type: 'sine', vol: 0.07, at: i * 0.22 })); }
  bark() { this.tone(300, 0.08, { type: 'sawtooth', vol: 0.05, slide: 180 }); this.tone(320, 0.08, { type: 'sawtooth', vol: 0.05, at: 0.12, slide: 190 }); }
  bell() { this.tone(1567.98, 0.8, { type: 'sine', vol: 0.07 }); this.tone(3135.96, 0.5, { type: 'sine', vol: 0.02 }); }
  baa() { this.tone(420, 0.35, { type: 'sawtooth', vol: 0.03, slide: 380 }); }

  setSong(key) {
    if (this.song === key) return;
    this.song = key;
    this.beat = 0;
  }
  setMusic(on) {
    this.musicOn = on;
    try { localStorage.setItem('ad_music', on ? 'on' : 'off'); } catch (e) {}
    if (this.musicGain) this.musicGain.gain.setTargetAtTime(on ? 1 : 0, this.ctx.currentTime, 0.2);
  }
  tick() {
    if (!this.ctx || !this.song || !this.musicOn || this.ctx.state !== 'running') {
      if (this.ctx) this.nextTime = Math.max(this.nextTime, this.ctx.currentTime + 0.05);
      return;
    }
    const s = SONGS[this.song];
    if (!s) return;
    const spb = 60 / s.bpm / 2;
    const noteF = deg => {
      const oct = Math.floor(deg / s.scale.length);
      const idx = ((deg % s.scale.length) + s.scale.length) % s.scale.length;
      const midi = s.root + s.scale[idx] + oct * 12;
      return 440 * Math.pow(2, (midi - 69) / 12);
    };
    const base = 0.022 * (s.soft || 1) * this.nightFactor;
    while (this.nextTime < this.ctx.currentTime + 0.3) {
      const i = this.beat % s.mel.length;
      const deg = s.mel[i];
      let at = this.nextTime - this.ctx.currentTime;
      if (s.swing && i % 2 === 1) at += spb * 0.25;
      if (deg !== null && deg !== undefined) {
        this.tone(noteF(deg) * 2, spb * 1.8, { type: s.wave, vol: base, at: Math.max(0, at), dest: this.musicGain });
        if (s.echo) this.tone(noteF(deg) * 2, spb * 1.6, { type: 'sine', vol: base * 0.35, at: Math.max(0, at) + spb * 1.5, dest: this.musicGain });
      }
      if (i % 4 === 0) {
        const b = s.bass[Math.floor(i / 4) % s.bass.length];
        this.tone(noteF(b) / 2, spb * 3.6, { type: 'sine', vol: base * 1.25, at: Math.max(0, at), dest: this.musicGain });
      }
      this.nextTime += spb;
      this.beat++;
    }
  }
}

/* =====================================================================
   OCENA ODPOWIEDZI (parser lokalny, gdy Superwizor AI jest niedostępny)
   Poprawka: dawniej "nie wiem" zaliczało ~27% pytań, bo krótkie słowa
   pasowały jako fragmenty dłuższych (np. "nie" w "otoczenie").
   ===================================================================== */
function normalizeText(str) {
  if (!str) return "";
  const polishMap = {
    'ą': 'a', 'ć': 'c', 'ę': 'e', 'ł': 'l', 'ń': 'n', 'ó': 'o', 'ś': 's', 'ź': 'z', 'ż': 'z',
    'Ą': 'a', 'Ć': 'c', 'Ę': 'e', 'Ł': 'l', 'Ń': 'n', 'Ó': 'o', 'Ś': 's', 'Ź': 'z', 'Ż': 'z'
  };
  const clean = str.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, m => polishMap[m] || m);
  return clean.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

const STOPWORDS = new Set(('nie sie jest to co ze na do po za ale czy jak tak bo dla przez oraz lub albo jego jej ich ten ta te tym tego tej ktory ktora ktore ktorych sa byc moze moge tylko tez juz jeszcze bardzo wiem nic mnie mi ja ty on ona oni my wy jest sa bylo byl byla takze wiec gdy kiedy gdzie tam tu tutaj ktos cos jakis jakies ktos ma maja mam od np itp itd czyli aby zeby by go je im nim niej nich ze sobie siebie swoj swoje swojej wszystko wszystkie kazdy kazda duzo malo pytanie odpowiedz odpowiedzi znam wiedziec trudne').split(' '));

function levenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const m = [];
  for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      m[i][j] = b.charAt(i - 1) === a.charAt(j - 1)
        ? m[i - 1][j - 1]
        : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);
    }
  }
  return m[b.length][a.length];
}

function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}

// Typowe polskie końcówki fleksyjne — "sumie"/"suma", "stalej"/"stala" to to samo słowo.
const PL_ENDING = /^(a|e|i|o|u|y|ie|ej|em|om|ach|ami|ow|ym|ych|ymi|ego|emu|ia|iu|ii|ia|am|mi|owie|ow)?$/;

// Jedno słowo odpowiedzi vs jedno słowo-klucz (klucze bywają rdzeniami: "ekstremaln").
function matchesKeyword(token, kw, noNeg) {
  if (token === kw) return true;
  if (token.length < 3 || kw.length < 3) return false;
  if (kw.length >= 4 && token.startsWith(kw)) return true;          // rdzeń z listy kluczy
  if (token.length >= 6 && kw.startsWith(token)) return true;       // wpisany sam rdzeń
  if (kw.length >= 7 && token.includes(kw)) return true;            // złożenia
  const minLen = Math.min(token.length, kw.length);
  const cp = commonPrefix(token, kw);
  if (minLen >= 5 && cp >= Math.max(5, minLen - 3)) return true;    // odmiana
  if (minLen >= 4 && cp >= 3 && PL_ENDING.test(token.slice(cp)) && PL_ENDING.test(kw.slice(cp))) return true;
  if (kw.length >= 4 && Math.abs(token.length - kw.length) <= 2) {  // literówki
    if (levenshteinDistance(token, kw) <= (kw.length > 7 ? 2 : 1)) return true;
  }
  // przeczenie sklejone z przymiotnikiem: "niespecjalistyczny"
  if (!noNeg && token.startsWith('nie') && token.length > 7 && kw.length >= 6) return matchesKeyword(token.slice(3), kw, true);
  return false;
}

// questionText (opcjonalnie): słowa przepisane z treści pytania nie zaliczają grupy,
// chyba że cała grupa i tak składa się ze słów obecnych w pytaniu.
function verifyAnswer(userInput, expectedGroups, questionText) {
  const normalizedInput = normalizeText(userInput);
  const allWords = normalizedInput.split(" ").filter(Boolean);
  const contentWords = allWords.filter(w => w.length > 1 && !STOPWORDS.has(w));
  const qWords = new Set(normalizeText(questionText || '').split(' ').filter(w => w.length > 2 && !STOPWORDS.has(w)));
  const padded = ' ' + normalizedInput + ' ';
  // Odpowiedź w większości przepisana z pytania? Wtedy te słowa nie liczą się jako wiedza.
  const copiedShare = contentWords.length ? contentWords.filter(w => qWords.has(w)).length / contentWords.length : 0;
  const looksCopied = copiedShare >= 0.5;

  let satisfiedGroups = 0;
  for (const group of expectedGroups) {
    let groupMatched = false;
    const groupInQuestion = qWords.size > 0 && group.every(k => {
      const nk = normalizeText(k);
      return nk.split(' ').some(part => [...qWords].some(qw => matchesKeyword(qw, part)));
    });
    const words = (groupInQuestion || !looksCopied) ? contentWords : contentWords.filter(w => !qWords.has(w));
    for (const keyword of group) {
      const nk = normalizeText(keyword);
      if (!nk) continue;
      if (!nk.includes(' ') && (nk.length < 3 || STOPWORDS.has(nk))) {
        // krótkie klucze (liczby, skróty) i słowa-funkcyjne: tylko dosłownie
        if (allWords.includes(nk)) { groupMatched = true; break; }
        continue;
      }
      if (nk.includes(' ')) {
        // fraza: dosłownie w odpowiedzi albo wszystkie jej znaczące słowa
        if (padded.includes(' ' + nk)) { groupMatched = true; break; }
        const content = nk.split(' ').filter(w => w.length >= 4 && !STOPWORDS.has(w));
        if (content.length && content.every(cw => words.some(w => matchesKeyword(w, cw)))) { groupMatched = true; break; }
      } else if (words.some(w => matchesKeyword(w, nk))) {
        groupMatched = true; break;
      }
    }
    if (groupMatched) satisfiedGroups++;
  }

  const threshold = expectedGroups.length <= 2 ? expectedGroups.length : Math.ceil(expectedGroups.length * 0.65);
  return { isCorrect: satisfiedGroups >= threshold, matchedCount: satisfiedGroups, totalRequired: threshold };
}

/* =====================================================================
   GRAFIKA PIXEL-ART (rysowana kodem, skalowana "nearest neighbor")
   ===================================================================== */
const OUT = '#2a1a10';
const EYE = '#24160e';

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}
function R(g, x, y, w, h, c) { if (w <= 0 || h <= 0) return; g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function P(g, x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -Math.floor(r); dy <= Math.floor(r); dy++) {
    const dx = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) + 0.3);
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function ell(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  for (let dy = -Math.floor(ry); dy <= Math.floor(ry); dy++) {
    const t = dy / ry;
    const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - t * t)) + 0.3);
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function line(g, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  g.fillStyle = c;
  for (let i = 0; i < 400; i++) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// Obrys 1px wokół nieprzezroczystych pikseli — spójny, "stardewowy" styl.
function outline(c, col = OUT, alpha = 255) {
  const g = c.getContext('2d');
  const w = c.width, h = c.height;
  const src = g.getImageData(0, 0, w, h);
  const out = g.createImageData(w, h);
  out.data.set(src.data);
  const [r, gg, b] = hexToRgb(col);
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (A(x, y) > 40) continue;
    if (A(x - 1, y) > 120 || A(x + 1, y) > 120 || A(x, y - 1) > 120 || A(x, y + 1) > 120) {
      const i = (y * w + x) * 4;
      out.data[i] = r; out.data[i + 1] = gg; out.data[i + 2] = b; out.data[i + 3] = alpha;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
function shadowUnder(c, cx, cy, rx, ry, a = 0.28) {
  const g = c.getContext('2d');
  g.save();
  g.globalCompositeOperation = 'destination-over';
  ell(g, cx, cy, rx, ry, `rgba(20,12,6,${a})`);
  g.restore();
}
// Sprite: rysunek + obrys + (opcjonalny) cień. Kotwica = środek podstawy.
function makeSprite(w, h, draw, { ol = true, shadow = null, ax = null, ay = null } = {}) {
  const [c, g] = mkCanvas(w + 2, h + 2);
  g.save(); g.translate(1, 1); draw(g); g.restore();
  if (ol) outline(c);
  if (shadow) shadowUnder(c, shadow[0] + 1, shadow[1] + 1, shadow[2], shadow[3], shadow[4] || 0.28);
  return { c, ax: (ax == null ? w / 2 : ax) + 1, ay: (ay == null ? h : ay) + 1 };
}

const SPR = new Map();
function cached(key, fn) {
  if (!SPR.has(key)) SPR.set(key, fn());
  return SPR.get(key);
}

/* ============================ POSTACIE ============================ */
function drawCharacter(g, look, dir, frame, blink) {
  const small = !!look.small;
  const ox = 2, oy = small ? 8 : 4;
  const L = small ? { tT: 10, tB: 13, lT: 14, lB: 15, shoe: 16 } : { tT: 10, tB: 15, lT: 16, lB: 19, shoe: 20 };
  const S = look.skin || SKIN_TONES[1], Sd = shade(S, -0.16), Sl = shade(S, 0.14);
  const H = look.hairC || '#2a1a10', Hd = shade(H, -0.28), Hl = shade(H, 0.25);
  const T = look.top || '#4a86d8', Td = shade(T, -0.24), Tl = shade(T, 0.16);
  const B = look.bottom || '#1f2533', Bd = shade(B, -0.25);
  const SH = look.shoes || '#3a2616';
  const r = (x, y, w, h, c) => R(g, ox + x, oy + y, w, h, c);
  const p = (x, y, c) => P(g, ox + x, oy + y, c);
  const style = look.hair || 'krotkie';
  const side = dir === 'left' || dir === 'right';

  if (dir === 'right') { g.save(); g.translate(20, 0); g.scale(-1, 1); }

  const bob = frame ? -1 : 0;
  const legLen = L.lB - L.lT + 1;

  // --- długie włosy za plecami (widok z tyłu / profil) ---
  if (style === 'dlugie' && dir === 'up') r(3, 3 + bob, 10, 11, Hd);

  // --- nogi ---
  if (!side) {
    const lA = frame === 1 ? -1 : 0, rA = frame === 2 ? -1 : 0;
    r(5, L.lT, 3, legLen + lA, B); r(8, L.lT, 3, legLen + rA, B);
    r(7, L.lT + 1, 1, legLen - 1 + lA, Bd);
    r(5, L.shoe + lA, 3, 1, SH); r(8, L.shoe + rA, 3, 1, SH);
  } else {
    if (frame === 0) {
      r(6, L.lT, 4, legLen, B); r(8, L.lT + 1, 1, legLen - 1, Bd);
      r(5, L.shoe, 5, 1, SH);
    } else {
      const f = frame === 1 ? 1 : -1;
      r(6 - f * 2, L.lT, 3, legLen, B); r(7 + f * 1, L.lT, 3, legLen, Bd);
      r(5 - f * 2, L.shoe, 4, 1, SH); r(7 + f * 1, L.shoe, 3, 1, shade(SH, -0.2));
    }
  }

  // --- tułów ---
  const tH = L.tB - L.tT + 1;
  if (!side) {
    r(4, L.tT + bob, 8, tH, T);
    r(10, L.tT + 1 + bob, 2, tH - 1, Td);
    r(4, L.tT + bob, 8, 1, Tl);
    if (dir === 'down') { r(7, L.tT + bob, 2, 1, Sd); }
  } else {
    r(5, L.tT + bob, 6, tH, T);
    r(9, L.tT + 1 + bob, 2, tH - 1, Td);
    r(5, L.tT + bob, 6, 1, Tl);
  }
  if (look.coat) {
    const C = '#eef2f4', Cd = '#c9d3da';
    if (!side) {
      r(3, L.tT + bob, 10, tH + 2, C); r(11, L.tT + 1 + bob, 2, tH + 1, Cd);
      if (dir === 'down') { r(7, L.tT + bob, 2, tH, T); r(6, L.tT + bob, 1, 3, Cd); r(9, L.tT + bob, 1, 3, Cd); }
      else r(7, L.tT + 2 + bob, 1, tH, Cd);
    } else {
      r(4, L.tT + bob, 8, tH + 2, C); r(10, L.tT + 1 + bob, 2, tH + 1, Cd);
    }
  }
  if (look.apron) {
    if (dir === 'down') { r(5, L.tT + 2 + bob, 6, tH, '#7a4a2a'); r(5, L.tT + 2 + bob, 6, 1, '#9a6a3f'); }
    else if (side) r(4, L.tT + 2 + bob, 3, tH, '#7a4a2a');
  }

  // --- ręce ---
  const armC = look.coat ? '#dfe6ea' : Td;
  if (!side) {
    const a = frame === 1 ? 1 : frame === 2 ? -1 : 0;
    r(2, L.tT + 1 + bob + a, 2, tH - 2, armC); r(2, L.tT + tH - 1 + bob + a, 2, 1, S);
    r(12, L.tT + 1 + bob - a, 2, tH - 2, armC); r(12, L.tT + tH - 1 + bob - a, 2, 1, S);
  } else {
    const a = frame === 1 ? -1 : frame === 2 ? 1 : 0;
    r(7 + a, L.tT + 1 + bob, 2, tH - 2, armC); r(7 + a, L.tT + tH - 1 + bob, 2, 1, S);
  }

  // --- głowa ---
  const hy = bob;
  r(3, 2 + hy, 10, 7, S); r(4, 1 + hy, 8, 1, S); r(4, 9 + hy, 8, 1, S);
  if (dir !== 'up') {
    r(4, 9 + hy, 8, 1, Sd);
    if (dir === 'down') r(11, 3 + hy, 1, 6, Sd); else r(10, 3 + hy, 2, 6, Sd);
  }

  // twarz
  if (dir === 'down') {
    if (blink) { r(5, 6 + hy, 1, 1, EYE); r(10, 6 + hy, 1, 1, EYE); }
    else { r(5, 5 + hy, 1, 2, EYE); r(10, 5 + hy, 1, 2, EYE); }
    p(4, 7 + hy, 'rgba(235,120,120,0.55)'); p(11, 7 + hy, 'rgba(235,120,120,0.55)');
    r(7, 8 + hy, 2, 1, shade(S, -0.35));
  } else if (side) {
    if (blink) r(4, 6 + hy, 1, 1, EYE); else r(4, 5 + hy, 1, 2, EYE);
    p(2, 6 + hy, S); p(2, 7 + hy, Sd);
    p(4, 8 + hy, shade(S, -0.35));
    p(6, 7 + hy, 'rgba(235,120,120,0.5)');
    p(8, 5 + hy, Sd); p(8, 6 + hy, Sd);
  }

  // broda
  if (look.beard && dir !== 'up') {
    const Bc = look.beard;
    if (dir === 'down') { r(4, 7 + hy, 8, 3, Bc); r(5, 10 + hy, 6, 1, Bc); r(7, 8 + hy, 2, 1, shade(Bc, -0.4)); r(5, 7 + hy, 6, 1, shade(Bc, 0.15)); }
    else { r(3, 7 + hy, 6, 3, Bc); r(4, 10 + hy, 4, 1, Bc); }
  }

  // --- włosy ---
  const hair = () => {
    if (style === 'lyse') {
      if (dir === 'up') r(3, 1 + hy, 10, 8, S);
      p(5, 2 + hy, Sl); p(6, 2 + hy, Sl);
      if (look.hairC) {
        if (dir === 'down' || dir === 'up') { r(2, 4 + hy, 2, 4, H); r(12, 4 + hy, 2, 4, H); }
        else { r(8, 4 + hy, 4, 4, H); }
      }
      return;
    }
    if (dir === 'up') {
      if (style === 'krecone') { r(1, -1 + hy, 14, 10, H); r(2, -2 + hy, 12, 1, H); r(2, 9 + hy, 12, 1, H); }
      else { r(2, 1 + hy, 12, 8, H); r(3, 0 + hy, 10, 1, H); r(4, 9 + hy, 8, 1, Hd); }
      r(5, 1 + hy, 3, 1, Hl);
    } else if (side) {
      if (style === 'krecone') { r(2, -1 + hy, 12, 7, H); r(8, 5 + hy, 6, 4, H); r(3, -2 + hy, 10, 1, H); }
      else { r(3, 0 + hy, 10, 3, H); r(7, 2 + hy, 6, 5, H); r(12, 3 + hy, 1, 4, Hd); r(3, 2 + hy, 2, 2, H); }
      r(5, 0 + hy, 3, 1, Hl);
    } else {
      if (style === 'krecone') {
        r(1, -1 + hy, 14, 6, H); r(2, -2 + hy, 12, 1, H); r(1, 5 + hy, 2, 4, H); r(13, 5 + hy, 2, 4, H);
        for (let i = 0; i < 6; i++) p(2 + i * 2, (i % 2) + hy, Hl);
      } else {
        r(3, 0 + hy, 10, 3, H); r(2, 1 + hy, 2, 5, H); r(12, 1 + hy, 2, 5, H);
        r(4, 3 + hy, 8, 1, H);
        r(5, 0 + hy, 3, 1, Hl);
      }
    }

function drawPortrait(canvas, npc) {

        [-2, -1, 0, 1, 2].forEach(k => { const x = 96 + k * sig; const z = k; const y = Math.round(base - Math.exp(-z * z / 2) * (base - top)); R(g, x, y - 5, 1, 6, '#6b4526'); R(g, x + 1, y - 5, 4, 3, k === 0 ? '#d9534f' : '#f4f0e6'); });

function drawFlat(g, f, px, py, rnd) {
  const t = f.type;
  switch (t) {
    case 'flowers': {
      const cols = [['#f06a8a', '#ffd23f'], ['#ffffff', '#ffd23f'], ['#b87af0', '#fff4a0'], ['#ff8a4a', '#fff'], ['#6ab0ff', '#fff']];
      const [a, b] = cols[Math.floor(rnd() * cols.length)];
      for (let i = 0; i < 5; i++) {
        const x = px + 2 + Math.floor(rnd() * 11), y = py + 3 + Math.floor(rnd() * 10);
        P(g, x, y + 2, '#3f7a36'); P(g, x, y - 1, a); P(g, x - 1, y, a); P(g, x + 1, y, a); P(g, x, y + 1, a); P(g, x, y, b);
      }
      break;
    }
    case 'wildflowers':
      for (let i = 0; i < 4; i++) { const x = px + Math.floor(rnd() * 15), y = py + Math.floor(rnd() * 15); P(g, x, y, pick(rnd, ['#ffffff', '#ffd23f', '#f06a8a', '#b87af0', '#ff8a4a'])); P(g, x, y + 1, '#3f7a36'); }
      break;
    case 'crop':
      for (let i = 0; i < 2; i++) { const x = px + 4 + i * 7, y = py + 6 + (i % 2) * 3; R(g, x, y, 1, 3, '#3f8a36'); P(g, x - 1, y, '#5ea048'); P(g, x + 1, y + 1, '#5ea048'); P(g, x - 1, y - 1, '#7ac058'); if (rnd() > 0.5) { R(g, x - 1, y - 3, 3, 2, '#e05a3a'); } }
      break;
    case 'shell': {
      const x = px + 3 + Math.floor(rnd() * 9), y = py + 3 + Math.floor(rnd() * 9);
      if (rnd() > 0.6) { P(g, x, y, '#f2903a'); P(g, x - 1, y, '#f2903a'); P(g, x + 1, y, '#f2903a'); P(g, x, y - 1, '#f2903a'); P(g, x, y + 1, '#f2903a'); }
      else { R(g, x, y, 3, 2, '#fbe8e0'); P(g, x + 1, y, '#f0c0b8'); P(g, x, y + 1, '#d8a8a0'); }

    }
    case 'towel': {
      const c = pick(rnd, ['#e0525e', '#3a86d8', '#f2c94c', '#6fbf4a', '#b87af0']);
      R(g, px + 2, py + 1, 12, 15, c); for (let y = 3; y < 15; y += 4) R(g, px + 2, py + y, 12, 2, '#fff');
      break;
    }
    case 'sandbox':
      R(g, px, py, 32, 32, '#8a5a30'); R(g, px + 3, py + 3, 26, 26, '#f7e0a8'); R(g, px, py, 32, 2, '#b07a45');
      R(g, px + 8, py + 10, 5, 5, '#e0525e'); R(g, px + 9, py + 8, 3, 2, '#e0525e'); R(g, px + 18, py + 17, 6, 4, '#3a86d8'); P(g, px + 22, py + 16, '#6b4526');
      break;
    case 'sandcastle':
      R(g, px + 2, py + 7, 12, 8, '#e0c07a'); R(g, px + 2, py + 3, 3, 4, '#e0c07a'); R(g, px + 11, py + 3, 3, 4, '#e0c07a'); R(g, px + 6, py + 1, 4, 6, '#ecd08a');
      R(g, px + 7, py + 10, 2, 5, '#a88040'); P(g, px + 8, py - 2, '#e0525e'); R(g, px + 8, py - 2, 1, 3, '#6b4526');
      R(g, px + 2, py + 15, 12, 1, '#c8a060');
      break;
    case 'dunegrass':
      for (let i = 0; i < 3; i++) { const x = px + 2 + Math.floor(rnd() * 12), y = py + 5 + Math.floor(rnd() * 8); line(g, x, y, x - 2, y - 5, '#8aa860'); line(g, x, y, x + 1, y - 6, '#a8c070'); line(g, x, y, x + 3, y - 4, '#8aa860'); }

    case 'rock':

    case 'rubble':
      for (let i = 0; i < 4; i++) { const x = px + 2 + Math.floor(rnd() * 11), y = py + 3 + Math.floor(rnd() * 10); R(g, x, y, 2 + Math.floor(rnd() * 2), 2, pick(rnd, ['#7a7a80', '#8a7a6a', '#5a5a60'])); }

    case 'crack': {

      if (rnd() > 0.5) { P(g, px + 9, py + 9, '#6a8a3a'); P(g, px + 10, py + 8, '#7a9a4a'); }

    case 'weeds':
      for (let i = 0; i < 3; i++) { const x = px + 2 + Math.floor(rnd() * 12), y = py + 6 + Math.floor(rnd() * 8); line(g, x, y, x - 1, y - 4, '#9a9a4a'); line(g, x, y, x + 2, y - 3, '#7a8a3a'); }

    case 'mushroom': {
      const cols = ['#5ad8e0', '#b87af0', '#f07ac8'];
      for (let i = 0; i < 3; i++) { const x = px + 3 + Math.floor(rnd() * 10), y = py + 6 + Math.floor(rnd() * 8); const c = cols[Math.floor(rnd() * 3)]; R(g, x, y, 1, 3, '#e8e0d0'); R(g, x - 1, y - 1, 3, 1, c); P(g, x, y - 2, c); P(g, x, y - 1, '#ffffff'); f.glowCol = c; }
      break;
    }
    case 'fern':
      for (let i = 0; i < 2; i++) { const x = px + 4 + i * 6, y = py + 12; for (let k = 0; k < 6; k++) { P(g, x - k, y - k, '#2f7a4a'); P(g, x + k, y - k, '#3a8a55'); P(g, x, y - k, '#2a6a40'); } }
      break;
    case 'stump':
      ell(g, px + 8, py + 10, 6, 4, '#6b4526'); ell(g, px + 8, py + 8, 6, 3, '#b08a5a'); ell(g, px + 8, py + 8, 3, 1.5, '#8a6a40'); R(g, px + 2, py + 9, 12, 4, '#6b4526');
      break;
    case 'lily':
      ell(g, px + 8, py + 8, 4, 3, '#4f9a4a'); R(g, px + 8, py + 6, 3, 2, 'rgba(0,0,0,0)'); P(g, px + 8, py + 7, '#3a7a3a'); if (rnd() > 0.5) { P(g, px + 7, py + 6, '#f7b0c8'); P(g, px + 8, py + 5, '#fff0f4'); }
      break;
    case 'cone':
      R(g, px + 5, py + 12, 7, 2, '#e0602a'); R(g, px + 6, py + 5, 5, 7, '#f07a3a'); R(g, px + 7, py + 2, 3, 3, '#f07a3a'); R(g, px + 6, py + 8, 5, 2, '#fff');
      break;
    case 'trackoval': {
      const W2 = f.w * 16, H2 = f.h * 16, cx = px + W2 / 2, cy = py + H2 / 2;
      const rx = W2 / 2 - 2, ry = H2 / 2 - 2;
      ell(g, cx, cy, rx + 1, ry + 1, '#f4f0e6');
      ell(g, cx, cy, rx, ry, '#b8563f');
      ell(g, cx, cy, rx - 5, ry - 5, '#c8664a');
      ell(g, cx, cy, rx - 6, ry - 6, '#b8563f');
      ell(g, cx, cy, rx - 11, ry - 11, '#c8664a');
      ell(g, cx, cy, rx - 12, ry - 12, '#b8563f');

      for (let i = 0; i < 90; i++) { const a = rnd() * Math.PI * 2, rr = 0.2 + rnd() * 0.7; P(g, cx + Math.cos(a) * (rx - 17) * rr, cy + Math.sin(a) * (ry - 17) * rr, '#5aa83a'); }
      R(g, cx - 1, cy - ry, 2, 17, '#f4f0e6');

    }
    case 'bollard':
      R(g, px + 5, py + 4, 6, 10, '#3a3a40'); R(g, px + 4, py + 3, 8, 2, '#4a4a52'); R(g, px + 5, py + 4, 2, 10, '#5a5a62');

/* ============================ TEREN ============================ */
const DEFAULT_PAL = {
  grass: '#76b04a', grass2: '#66a03f', moss: '#3b7552', dead: '#8a8a68', field: '#6cb848',
  path: '#c9a26b', sand: '#f0d69a', wetsand: '#d9bb7c', soil: '#6b4a2e', track: '#b8563f',
  asphalt: '#5c5c62', concrete: '#a9a397', cobble: '#9aa0a8', brick: '#b8745a', plaza: '#c8c0b0',
  planks: '#b07a45', water: '#4aa3d8'
};
const TERRAIN = {
  grass: { walk: true, soft: true }, grass2: { walk: true, soft: true }, moss: { walk: true, soft: true },
  dead: { walk: true, soft: true }, field: { walk: true, soft: true },
  path: { walk: true, under: true }, sand: { walk: true, under: true }, wetsand: { walk: true, under: true },
  soil: { walk: true, under: true }, track: { walk: true, under: true },
  asphalt: { walk: true, hard: true }, concrete: { walk: true, hard: true }, cobble: { walk: true, hard: true },
  brick: { walk: true, hard: true }, plaza: { walk: true, hard: true },
  planks: { walk: true }, water: { walk: false }
};

function drawTile(g, t, px, py, pal, rnd, tx, ty) {
  const base = pal[t] || DEFAULT_PAL[t] || '#ff00ff';
  const dk = shade(base, -0.14), lt = shade(base, 0.12), dk2 = shade(base, -0.25);
  R(g, px, py, 16, 16, base);
  switch (t) {
    case 'grass': case 'grass2': case 'moss': case 'dead': case 'field': {
      if (t === 'field' && Math.floor(tx / 2) % 2) R(g, px, py, 16, 16, shade(base, 0.07));
      const blade = t === 'dead' ? '#6f6a4a' : dk;
      const n = 3 + Math.floor(rnd() * 3);
      for (let i = 0; i < n; i++) {
        const x = px + Math.floor(rnd() * 14), y = py + 2 + Math.floor(rnd() * 12);
        P(g, x, y, blade); P(g, x + 2, y, blade); P(g, x + 1, y + 1, blade);
      }
      if (rnd() < 0.35) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), lt);
      if (t === 'moss' && rnd() < 0.18) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), '#8af0e0');
      if (t === 'dead' && rnd() < 0.4) R(g, px + Math.floor(rnd() * 13), py + Math.floor(rnd() * 13), 2, 1, '#a89a6a');
      // drobne kolorowe kwiatki — tylko na soczystej trawie (szara trawa Wypartego Przedmieścia zostaje smutna)
      if (t === 'grass' || t === 'grass2' || t === 'field') {
        const [cr, cg, cb] = hexToRgb(base);
        if (cg - Math.max(cr, cb) > 40 && rnd() < 0.14) {
          const fx = px + 2 + Math.floor(rnd() * 12), fy = py + 2 + Math.floor(rnd() * 12);
          const petal = ['#ff8fb1', '#ffd84a', '#ffffff', '#9ad0ff', '#c79bff', '#ff9a5a'][Math.floor(rnd() * 6)];
          P(g, fx - 1, fy, petal); P(g, fx + 1, fy, petal); P(g, fx, fy - 1, petal); P(g, fx, fy + 1, petal);
          P(g, fx, fy, petal === '#ffd84a' ? '#e0762a' : '#fff3a0');
        }
      }
      break;
    }
    case 'path': case 'soil': case 'track': {
      for (let i = 0; i < 4; i++) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), dk);
      for (let i = 0; i < 2; i++) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), lt);
      if (t === 'path' && rnd() < 0.4) { const x = px + Math.floor(rnd() * 13), y = py + Math.floor(rnd() * 13); R(g, x, y, 2, 1, dk2); P(g, x, y - 1, lt); }
      if (t === 'soil') for (let y = 3; y < 16; y += 5) R(g, px, py + y, 16, 1, dk2);
      if (t === 'track' && ty % 3 === 0) R(g, px, py + 8, 16, 1, 'rgba(255,255,255,0.35)');
      break;
    }
    case 'sand': case 'wetsand': {
      for (let i = 0; i < 5; i++) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), rnd() > 0.5 ? dk : lt);
      if (t === 'sand' && rnd() < 0.2) { const y = py + 4 + Math.floor(rnd() * 8); R(g, px + 3, y, 6, 1, dk); }
      if (t === 'wetsand' && rnd() < 0.3) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), '#fff6dc');
      break;
    }
    case 'water': {
      R(g, px, py, 16, 16, base);
      if (rnd() < 0.5) { const x = px + Math.floor(rnd() * 11), y = py + Math.floor(rnd() * 14); R(g, x, y, 4, 1, lt); }
      if (rnd() < 0.25) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), dk);
      break;
    }
    case 'cobble': {
      const off = (ty % 2) * 4;
      for (let yy = 0; yy < 16; yy += 4) for (let xx = -8; xx < 16; xx += 8) {
        const sx = px + xx + ((yy / 4) % 2 ? 4 : 0) + off % 8;
        const c = rnd() < 0.3 ? lt : rnd() < 0.3 ? dk : base;
        const x0 = Math.max(px, sx), x1 = Math.min(px + 16, sx + 7);
        if (x1 > x0) { R(g, x0, py + yy, x1 - x0, 3, c); if (sx + 1 >= px && sx + 1 < px + 16) P(g, sx + 1, py + yy, shade(c, 0.18)); }
      }
      for (let yy = 3; yy < 16; yy += 4) R(g, px, py + yy, 16, 1, dk2);
      break;
    }
    case 'plaza': {
      R(g, px, py, 16, 1, dk); R(g, px, py, 1, 16, dk);
      if ((tx + ty) % 2) R(g, px + 1, py + 1, 15, 15, shade(base, 0.05));
      P(g, px + 2, py + 2, lt); if (rnd() < 0.3) P(g, px + Math.floor(rnd() * 14) + 1, py + Math.floor(rnd() * 14) + 1, dk);
      break;
    }
    case 'brick': {
      for (let yy = 0; yy < 16; yy += 4) {
        const shift = ((yy / 4) + ty) % 2 ? 4 : 0;
        for (let xx = -8; xx < 16; xx += 8) {
          const sx = px + xx + shift;
          const c = rnd() < 0.25 ? lt : rnd() < 0.25 ? dk : base;
          const x0 = Math.max(px, sx), x1 = Math.min(px + 16, sx + 7);
          if (x1 > x0) R(g, x0, py + yy, x1 - x0, 3, c);
        }
        R(g, px, py + yy + 3, 16, 1, shade(base, 0.2));
      }
      break;
    }
    case 'asphalt': {
      for (let i = 0; i < 7; i++) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), rnd() > 0.5 ? dk : lt);
      break;
    }
    case 'concrete': {
      if (tx % 3 === 0) R(g, px, py, 1, 16, dk); if (ty % 3 === 0) R(g, px, py, 16, 1, dk);
      for (let i = 0; i < 3; i++) P(g, px + Math.floor(rnd() * 16), py + Math.floor(rnd() * 16), dk);
      if (rnd() < 0.12) ell(g, px + 8, py + 8, 4, 2, 'rgba(60,50,40,0.18)');
      break;
    }
    case 'planks': {
      for (let xx = 0; xx < 16; xx += 4) {
        R(g, px + xx, py, 4, 16, (xx / 4 + tx) % 2 ? base : shade(base, 0.06));
        R(g, px + xx + 3, py, 1, 16, dk2);
        const j = ((tx * 7 + ty * 3 + xx) % 16);
        R(g, px + xx, py + j, 3, 1, dk);
      }
      P(g, px + 1, py + 2, '#5a3a1e'); P(g, px + 9, py + 2, '#5a3a1e');
      break;
    }
  }
}

function bakeGround(Z) {
  const W = Z.w * TILE, H = Z.h * TILE;
  const [c, g] = mkCanvas(W, H);
  const pal = Object.assign({}, DEFAULT_PAL, Z.pal || {});
  const T = (x, y) => (x < 0 || y < 0 || x >= Z.w || y >= Z.h) ? null : Z.terrain[y * Z.w + x];
  for (let y = 0; y < Z.h; y++) for (let x = 0; x < Z.w; x++) {
    drawTile(g, T(x, y), x * 16, y * 16, pal, mulberry(hashStr(Z.id + ':' + x + ',' + y)), x, y);
  }

  // łaty ciemniejszej trawy — organiczne plamy tylko na trawiastych kafelkach
  if (Z.patches && Z.patches.length) {
    const [pc, pg] = mkCanvas(W, H);
    Z.patches.forEach(p => { for (let k = 0; k < 4; k++) disc(pg, p.x * 16, p.y * 16, p.r * 16 * (1 - k * 0.18), 'rgba(20,50,10,0.05)'); });
    const [mc, mg] = mkCanvas(W, H);
    for (let y = 0; y < Z.h; y++) for (let x = 0; x < Z.w; x++) if (TERRAIN[T(x, y)] && TERRAIN[T(x, y)].soft) R(mg, x * 16, y * 16, 16, 16, '#000');

  // przejścia między nawierzchniami
  const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  for (let y = 0; y < Z.h; y++) for (let x = 0; x < Z.w; x++) {
    const t = T(x, y), tt = TERRAIN[t] || {};
    const rnd = mulberry(hashStr('e' + Z.id + x + ',' + y));
    const px = x * 16, py = y * 16;
    dirs.forEach(([dx, dy]) => {
      const n = T(x + dx, y + dy);
      if (!n || n === t) return;
      const nt = TERRAIN[n] || {};
      const strip = (depthFn, col, shadowCol) => {
        for (let i = 0; i < 16; i++) {
          const d = depthFn();
          if (dy === -1) { R(g, px + i, py, 1, d, col); if (shadowCol) P(g, px + i, py + d, shadowCol); }
          if (dy === 1) { R(g, px + i, py + 16 - d, 1, d, col); if (shadowCol) P(g, px + i, py + 15 - d, shadowCol); }
          if (dx === -1) { R(g, px, py + i, d, 1, col); if (shadowCol) P(g, px + d, py + i, shadowCol); }
          if (dx === 1) { R(g, px + 16 - d, py + i, d, 1, col); if (shadowCol) P(g, px + 15 - d, py + i, shadowCol); }
        }
      };
      if (tt.under && nt.soft) {
        strip(() => 1 + (rnd() < 0.55 ? 1 : 0) + (rnd() < 0.2 ? 1 : 0), pal[n], shade(pal[t], -0.18));
      } else if (t === 'water' && n !== 'planks') {
        strip(() => 2, shade(pal.water, 0.35), null);
        strip(() => 1, 'rgba(255,255,255,0.75)', null);
      } else if (n === 'water' && tt.soft) {
        strip(() => 2, '#8a6a42', null);
      } else if (n === 'water' && (t === 'concrete' || tt.hard)) {
        strip(() => 2, shade(pal[t], -0.35), null);
      } else if (tt.hard && !nt.hard && n !== 'planks') {
        strip(() => 1, shade(pal[t], -0.3), null);
      } else if (t === 'planks' && n !== 'planks') {
        strip(() => 1, '#5a3a1e', null);
      }
    });
  }

  // cienie pod pomostami
  for (let y = 0; y < Z.h; y++) for (let x = 0; x < Z.w; x++) {
    if (T(x, y) === 'planks' && T(x, y + 1) === 'water') { R(g, x * 16, y * 16 + 16, 16, 3, 'rgba(10,30,50,0.35)'); R(g, x * 16 + 1, y * 16 + 14, 2, 5, '#6b4526'); R(g, x * 16 + 13, y * 16 + 14, 2, 5, '#6b4526'); }
  }

  // żywopłoty
  (Z.hedges || []).forEach(h => {
    const px = h.x * 16, py = h.y * 16;
    const has = (dx, dy) => Z.hedgeSet.has((h.x + dx) + ',' + (h.y + dy));
    R(g, px + (has(-1, 0) ? 0 : 1), py + 2, 16 - (has(-1, 0) ? 0 : 1) - (has(1, 0) ? 0 : 1), 14, '#2f6a32');
    R(g, px + (has(-1, 0) ? 0 : 1), py + (has(0, -1) ? 0 : 2), 16 - (has(-1, 0) ? 0 : 1) - (has(1, 0) ? 0 : 1), 8, '#3f8a3e');
    const rnd = mulberry(hashStr('h' + px + py));
    for (let i = 0; i < 7; i++) P(g, px + 1 + Math.floor(rnd() * 14), py + 2 + Math.floor(rnd() * 11), rnd() > 0.5 ? '#5aa850' : '#255a28');
    if (!has(0, 1)) R(g, px + 1, py + 15, 14, 1, '#1f4a22');

  // dekoracje płaskie
  (Z.flats || []).forEach(f => {
    drawFlat(g, f, f.x * 16, f.y * 16, mulberry(hashStr('f' + f.type + f.x + ',' + f.y)));
  });

  // płoty
  (Z.fences || []).forEach(f => {
    const px = f.x * 16, py = f.y * 16;
    const key = (dx, dy) => Z.fenceSet.has((f.x + dx) + ',' + (f.y + dy));
    const st = f.style || 'wood';
    const post = st === 'iron' ? '#2a2a30' : st === 'barrier' ? '#e98a3a' : st === 'rope' ? '#8a5a30' : '#f4f0e6';
    const rail = st === 'iron' ? '#3a3a42' : st === 'barrier' ? '#f4f0e6' : st === 'rope' ? '#d8c8a0' : '#e4ddd0';
    const postD = shade(post, -0.3);
    const cx = px + 7;
    if (key(-1, 0)) { R(g, px, py + 6, 8, 2, rail); R(g, px, py + 11, 8, 2, rail); R(g, px, py + 8, 8, 1, shade(rail, -0.3)); }
    if (key(1, 0)) { R(g, px + 8, py + 6, 8, 2, rail); R(g, px + 8, py + 11, 8, 2, rail); R(g, px + 8, py + 8, 8, 1, shade(rail, -0.3)); }
    if (key(0, -1)) R(g, cx, py, 2, 8, rail);
    if (key(0, 1)) R(g, cx, py + 8, 2, 8, rail);
    R(g, cx - 1, py + 3, 4, 11, post); R(g, cx + 2, py + 4, 1, 10, postD); R(g, cx, py + 2, 2, 1, post);
    R(g, cx - 1, py + 14, 4, 1, 'rgba(0,0,0,0.3)');
    if (st === 'barrier') { R(g, cx - 1, py + 5, 4, 2, '#f4f0e6'); R(g, cx - 1, py + 9, 4, 2, '#f4f0e6'); }
    if (st === 'iron') { P(g, cx, py + 1, '#2a2a30'); P(g, cx + 1, py + 1, '#2a2a30'); }
  });
  return c;
}

/* ============================ BUDYNKI ============================ */
function wallFill(g, x, y, w, h, mat, C, rnd) {
  const base = C.wall, dk = shade(base, -0.14), lt = shade(base, 0.1);
  R(g, x, y, w, h, base);
  switch (mat) {
    case 'brick':
      for (let yy = 0; yy < h; yy += 4) {
        const sh = (yy / 4) % 2 ? 3 : 0;
        for (let xx = -6; xx < w; xx += 6) { const c = rnd() < 0.3 ? dk : rnd() < 0.2 ? lt : base; const x0 = Math.max(x, x + xx + sh), x1 = Math.min(x + w, x + xx + sh + 5); R(g, x0, y + yy, x1 - x0, 3, c); }
        R(g, x, y + yy + 3, w, 1, shade(base, 0.22));
      }
      break;
    case 'wood':
      for (let yy = 0; yy < h; yy += 4) { R(g, x, y + yy + 3, w, 1, dk); R(g, x, y + yy, w, 1, lt); }
      break;
    case 'stone':
      for (let yy = 0; yy < h; yy += 6) {
        const sh = (yy / 6) % 2 ? 5 : 0;
        R(g, x, y + yy + 5, w, 1, dk);
        for (let xx = sh; xx < w; xx += 10) R(g, x + xx, y + yy, 1, 5, dk);
      }
      break;
    case 'glass':
      R(g, x, y, w, h, '#a8d8d4');
      for (let xx = 0; xx < w; xx += 12) R(g, x + xx, y, 2, h, C.trim);
      for (let yy = 0; yy < h; yy += 10) R(g, x, y + yy, w, 1, C.trim);
      for (let xx = 4; xx < w; xx += 12) line(g, x + xx, y + h - 3, x + xx + 6, y + 3, 'rgba(255,255,255,0.45)');
      break;
    case 'stripes':
      for (let xx = 0; xx < w; xx += 6) R(g, x + xx, y, 3, h, '#ffffff');
      break;
    case 'metal':
      for (let xx = 0; xx < w; xx += 3) R(g, x + xx, y, 1, h, dk);
      break;
    case 'plaster':
    default:
      for (let i = 0; i < w * h / 40; i++) P(g, x + Math.floor(rnd() * w), y + Math.floor(rnd() * h), rnd() > 0.5 ? dk : lt);
  }
}

function windowAt(g, x, y, kind, C, lit) {
  const glassT = lit ? '#ffe9a8' : '#c4e6f5', glassB = lit ? '#f6c860' : '#8cc4e2';
  const fr = C.trim;

  if (kind === 'arched') {
    R(g, x - 1, y, 9, 14, fr); R(g, x, y + 2, 7, 11, glassB); R(g, x, y + 2, 7, 5, glassT); R(g, x + 1, y + 1, 5, 1, glassT); R(g, x + 3, y + 1, 1, 12, fr); R(g, x, y + 7, 7, 1, fr);
    R(g, x - 2, y + 14, 11, 1, shade(C.wall, -0.35));

// Sprite budynku; level > 1 dobudowuje piętra (postęp w nauce widać w mieście!)
function buildingSprite(b, level) {
  const key = 'bld|' + b.id + '|' + level + '|' + b.wall + '|' + b.roof;

          if (hitsSign(x, wyy, ww, 10)) continue;
          const kind = style === 'observatory' && f === 0 ? 'round' : winKind;

      default: return makeSprite(W, H, g => R(g, 0, 0, W, H, '#f0f'));
    }
  });
}
