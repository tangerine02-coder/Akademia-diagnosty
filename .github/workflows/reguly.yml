# Testy reguł bazy Akademii (firebase/firestore.rules) w emulatorze Firebase — Etap 7.
# Uruchamia się po każdej zmianie w folderze firebase/ i ręcznie (Actions → „Reguły bazy” → Run workflow).
# Nie potrzebuje projektu Firebase: emulator działa na projekcie testowym demo-akademia.
name: Reguły bazy (emulator)

on:
  push:
    paths:
      - 'firebase/**'
      - '.github/workflows/reguly.yml'
  workflow_dispatch:

jobs:
  reguly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testy reguł
        run: |
          set -o pipefail
          npm test 2>&1 | tee wynik.txt
      # skrót wyniku jako adnotacja — widać go w zakładce Actions i przez API (bez pobierania logów)
      - name: Skrót wyniku
        if: always()
        run: |
          { grep -E "^# (tests|pass|fail)|^not ok|✖" wynik.txt | head -40; echo '--- błędy ---'; grep -n -E -i "error|expected|actual|denied|firestore.rules|L[0-9]+:|java" wynik.txt | head -60; echo '--- koniec ---'; tail -25 wynik.txt; } > skrot.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' skrot.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Testy reguł — wynik::$msg"
